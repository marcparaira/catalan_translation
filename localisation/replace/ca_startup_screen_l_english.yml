 string_start_maghreb:0 "La caiguda del §Ycalifat almohade§! al segle XIII va fragmentar la §Ypenínsula Ibèrica§! i el §YMagrib§! en una multitud d'estats enfrontats. Aquell període de caos va ser l'oportunitat perfecta perquè els regnes cristians emprenguessin la seva «Reconquesta», que va acabar amb l'annexió de tots els estats musulmans de la Península, amb l'única excepció de l'emirat de §YGranada§!.\n\nEls §Ynassarites§! de §YGranada§! s'aferren al territori que els queda mentre §YCastella§! intenta una vegada i una altra posar fi al domini musulmà a §YAndalusia§!. Granada no pot fer front tota sola al poder militar castellà; si vol sobreviure, haurà de trobar amics realment poderosos. Per acabar-ho d'adobar, l'emirat pateix lluites internes. Ara mateix, l'amenaça més clara és el nebot de §Yl'emir Muhammad§!, §YYusuf§!, que aspira al tron i reuneix suports a gran velocitat per fer valer la seva pretensió.\n\nEls §Yzayyànides§! de §YTlemcen§! es troben en una situació especialment vulnerable. Encaixonada entre les potències més fortes de §YTunis§! i el §YMarroc§!, Tlemcen té problemes fins i tot per mantenir el control de la població més enllà de la mateixa ciutat.\n\nEl més poderós dels regnes magribins és el Soldanat del Marroc, governat per la dinastia §Ymarínida§!. Tot i que controlen una gran extensió de territori d'importància estratègica i econòmica, els governants marínides són poc més que titelles dels seus visirs §Ywattàssides§!. Molts membres de la família marínida no accepten la tutela wattàssida sobre el Marroc, mentre que els wattàssides cobegen el tron gairebé obertament. Absorbit per la desconfiança interna, el Marroc no va saber defensar la ciutat de §YCeuta§! d'un atac §Yportuguès§! el 1415, i des d'aleshores no l'ha pogut recuperar.\n\nEls §Yhàfsides§! de Tunis havien estat governadors al servei dels almohades. Quan el califat es va enfonsar, van continuar governant Tunis i fins i tot es van atribuir el títol de califa, tot i que el món musulmà en general fa poc cas d'aquesta pretensió agosarada. Dels tres grans regnes de la costa, Tunis és el que pateix menys lluites internes, i té força llibertat per fer incursions als estats veïns.\n\nA l'interior, les tribus berbers de §YMzab§!, §YDjerid§!, §YTouggourt§! i §YFezzan§! es disputen el domini del desert. Mzab segueix l'ibadisme, una branca minoritària de l'islam, i els seus governants descendeixen dels imams rustàmides, que al segle IX van governar bona part de l'interior del Magrib. Tot i que costa imaginar-los reunificant el Magrib, els nòmades de l'interior han influït decisivament en el destí del nord d'Àfrica moltes vegades al llarg de la història."
 string_start_mali:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\nAmb tot, els seus governants encara poden recuperar la grandesa perduda si administren amb cura els seus escassos recursos i tornen a imposar la seva autoritat sobre els veïns. Si ho aconsegueixen, fins i tot podran aprofitar les rutes marítimes de l'oest, cada cop més obertes, tal com ja va intentar fer en el passat el mansa §YKo Mamadi§!."
 string_start_songhai:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\nAixí doncs, s'obre una oportunitat per als poderosos §YSonghai§!, un poble guerrer disposat a ocupar la preeminència que creu merèixer entre els seus veïns i en el comerç de caravanes del Sàhara. Si aconsegueixen sotmetre els veïns, es convertiran en la nova potència hegemònica de la regió i podran posar la mirada en les riques costes del nord i del sud."
 string_start_jolof:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\n§YJolof§! és una confederació de regnes dividits, amb un senyor suprem que, des del centre del territori, s'imposa a tots; aquests regnes han format part, de manera laxa, de l'Imperi de §YMali§!. Com que controla el curs baix del riu Senegal, Jolof té un gran potencial, però la seva tasca principal serà unificar els regnes que el formen, ja que la dissolució de la confederació afebliria greument tots els seus membres."
 string_start_mossi:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\nEls §YMossi§!, senyors dels cavalls, ocupen des de fa més d'un segle els altiplans que dominen el colze del Níger, des d'on fan incursions contra els veïns; fins i tot han arribat a saquejar una ciutat tan rica com Tombuctú. Tanmateix, continuen dividits en diversos regnes amb interessos sovint enfrontats. Un governant capaç d'imposar-se com a senyor suprem de tots ells en podria multiplicar la força i potser convertir-los en una gran potència regional, tot i que primer hauran de superar els seus veïns de §YMali§! i §YSonghai§!."
 string_start_hausa:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\nA l'est, les set ciutats estat hausa s'han mantingut tradicionalment en equilibri, en una mena de cooperació competitiva. El seu potencial, però, és enorme, perquè controlen les rutes comercials orientals entre el desert, l'estepa i la selva. Si alguna d'elles aconseguís unificar un estat §YHausa§!, es convertiria en una gran aspirant al domini de la regió."
 string_start_oyo:0 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! havia estat la potència hegemònica de la regió: s'estenia des de l'oceà Atlàntic, per la conca del Níger, fins a les ciutats estat hausa, i la seva riquesa era ben coneguda al nord després del famós pelegrinatge del seu sobirà, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit aquell imperi tan poderós, i ara la seva supervivència està en joc.\n\nAl sud, el poble ioruba d'§YOyo§! ocupa una posició en la franja boscosa entre l'estepa i la selva, cosa que l'ha convertit en intermediari entre totes dues regions. Això també li ha permès dominar la guerra de cavalleria, que fa servir a fons contra els veïns i que l'ha convertit en una potència temible."
 string_start_ethiopia:0 "A la Banya d'Àfrica, l'antic Regne d'§YEtiòpia§!, sota el rei §Ysalomònida§! §YZara Yakob§!, viu una edat d'or d'expansió i de fortalesa interna. En molts aspectes, aquest imperi dinàmic domina tota la regió. Tanmateix, té al davant alguns reptes que cal afrontar. Tradicionalment, el centre del poder polític s'ha anat desplaçant per diversos indrets dels altiplans etíops, sense instal·lar-se en un lloc fix més d'un o dos regnats, i els senyors regionals han acumulat bona part del poder militar i econòmic. Una de les mesures que podria prendre un governant etíop seria potenciar les noves tropes §YKawa§! com a pacificadores del regne.\n\nAixò també seria útil per a l'expansió militar, ja que molts estats veuen amb por i menyspreu un imperi cristià tan bel·ligerant. El Soldanat d'§YAdal§! ha estat l'adversari tradicional dels reis salomònides i està disposat a convertir-se en l'Espasa de l'islam a la regió. Al sud, la principal potència de la costa somali és el Soldanat d'§YAjuuraan§!, que aspira a reunir tots els clans somalis en un sol estat i alhora controlar les rutes comercials entre el mar Roig i l'oceà Índic. A la vall del Nil, les darreres restes dels regnes cristians de Núbia lluiten per sobreviure contra els §Ymamelucs§! del nord i contra les federacions tribals musulmanes que s'han establert a la zona."
 string_start_adal:0 "A la Banya d'Àfrica, l'antic Regne d'§YEtiòpia§!, sota el rei §Ysalomònida§! §YZara Yakob§!, viu una edat d'or d'expansió i de fortalesa interna. En molts aspectes, aquest imperi dinàmic domina tota la regió. Tanmateix, molts estats veuen amb por i menyspreu l'expansió d'un imperi cristià tan bel·ligerant. El Soldanat d'§YAdal§! ha estat l'adversari tradicional dels reis salomònides i està disposat a convertir-se en l'Espasa de l'islam a la regió. Situat en una posició clau al mar Roig, si aconseguís derrotar els seus enemics etíops podria intentar controlar l'estret de Bab el-Mandeb i les seves riques rutes comercials, i potser fins i tot obtenir un punt de suport al Iemen.\n\nAl sud, la principal potència de la costa somali és el Soldanat d'§YAjuuraan§!, que aspira a reunir tots els clans somalis en un sol estat i alhora controlar les rutes comercials entre el mar Roig i l'oceà Índic. A la vall del Nil, les darreres restes dels regnes cristians de Núbia lluiten per sobreviure contra els §Ymamelucs§! del nord i contra les federacions tribals musulmanes que s'han establert a la zona."
 string_start_ajuuraan:0 "A la Banya d'Àfrica, l'antic Regne d'§YEtiòpia§!, sota el rei §Ysalomònida§! §YZara Yakob§!, viu una edat d'or d'expansió i de fortalesa interna. En molts aspectes, aquest imperi dinàmic domina tota la regió. Tanmateix, molts estats veuen amb por i menyspreu l'expansió d'un imperi cristià tan bel·ligerant. El Soldanat d'§YAdal§! ha estat l'adversari tradicional dels reis salomònides i està disposat a convertir-se en l'Espasa de l'islam a la regió. A la vall del Nil, les darreres restes dels regnes cristians de Núbia lluiten per sobreviure contra els §Ymamelucs§! del nord i contra les federacions tribals musulmanes que s'han establert a la zona.\n\nAl sud, la principal potència de la costa somali és el Soldanat d'§YAjuuraan§!, que aspira a reunir tots els clans somalis en un sol estat per consolidar la seva posició al continent. Alhora, la seva vocació comercial fa del golf d'Aden la zona natural d'expansió dels somalis, i potser els permetrà girar la mirada cap a l'est, cap a les riqueses de l'Índia, i fins i tot més enllà, cap a la terra d'on va arribar fa unes quantes dècades la flota del tresor de Zheng He."
 string_start_kilwa:0 "A la costa oriental d'Àfrica, coneguda arreu com la costa suahili perquè aquesta és la llengua franca de la regió, el Soldanat de §YKilwa§! viu una edat d'or, com demostra la seva opulenta capital als mercaders estrangers que hi arriben de tot l'oceà Índic i de les terres de l'interior. Kilwa ha prosperat des que la van fundar, fa segles, mercaders perses, i potser recuperar aquell vincle a través de les rutes comercials dels golfs d'Aden i d'Ormuz seria una inversió profitosa. També manté una rica connexió comercial amb l'Índia, que es podria reforçar en benefici dels mercaders de Kilwa i del seu soldà. I el futur és obert a noves exploracions: cap a l'est, d'on venen les espècies, i també cap al sud, on potser es podria obrir una interessant ruta comercial cap a l'oest."
 string_start_mutapa:0 "A l'interior de l'Àfrica Oriental, l'antiga gran potència de Zimbabwe fa dècades que decau. A la regió s'hi consoliden nous estats, el més important dels quals és el dels reis shona de §YMutapa§!, els §YMwenemutapa§!, és a dir, «els senyors de la terra». Aspiren a reunir sota el seu domini tots els territoris dels altiplans i de les valls fluvials, i a aprofitar la riquesa de les nombroses mines d'or de la regió per reconstruir tot el que havia estat dels reis de Zimbabwe. La seva ambició és clara: tornar a fer gran Zimbabwe."
 string_start_kongo:0 "A la conca del riu Congo hi ha diverses potències que aspiren a crear, per primer cop en la història, una autoritat central a la regió. La que està en millor posició per fer-ho és el Regne del §YCongo§!, que controla l'estuari del gran riu i que, gràcies a això, és ric, respectat i poderós entre els seus veïns. De tant en tant arriben vaixells des del golf de Guinea amb ganes de comerciar; qui sap si valdria la pena establir una nova connexió comercial amb aquella regió. A més, els cultes que han seguit el §YMani Kongo§! i els seus hereus han anat canviant al llarg del temps, amb déus diferents en moments diferents, de manera que aquesta pràctica també es podria seguir (o no) en els anys vinents."
 string_start_tatars:0 "L'§YHorda d'Or§! ha mort, i els seus successors §Ytàtars§! es disputen el cadàver mentre els seus enemics es fan forts al seu voltant. L'imperi de §YJochi§!, fill de §YGenguis Khan§!, abans tan gran, s'ha dividit en diversos kanats que lluiten per dominar l'estepa.\n\nEl successor més directe de l'Horda d'Or és la §YGran Horda§!. Des de les ciutats de Sarai i Astracan, el kan Küchük Muhammad proclama la seva hegemonia sobre l'estepa, però ningú no l'escolta. Les tribus que la integren continuen desfent-se del seu domini, i fins ara el kan no ha pogut aturar-les.\n\nUn kan que ni tan sols els veïns temen amb prou feines és un kan. El Gran Principat de §YMoscòvia§!, que abans no era més que un recaptador de tributs, s'ha expandit enormement sense un kan fort que el tingui a ratlla. Si el deixen créixer, segur que intentarà treure's de sobre definitivament el jou tàtar i conquerir les estepes per a si mateix. De la mateixa manera, §YLituània§! ha tret profit de l'enfonsament de l'Horda d'Or: ja ha arrabassat Rutènia al domini tàtar i probablement continuarà sent una amenaça per als nòmades.\n\n§YUlugh Muhammad§! de §YKazan§! s'ha proclamat dues vegades kan de l'Horda d'Or, però els seus regnats van ser breus. Amb el suport dels nobles búlgars locals, es va apoderar de la ciutat de Kazan i hi va fundar un nou kanat a l'estepa septentrional. Kazan és un centre comercial important, i el nou kanat té fàcil accés a filons propers de metalls tant preciosos com d'ús corrent. Com a més ric dels regnes tàtars, Kazan és alhora un estat prometedor i una presa per a invasors cobdiciosos.\n\nEl §YKanat de Crimea§! es va separar de la Gran Horda el 1441, després que els clans de Crimea invitessin §YHaci Giray§!, descendent de Genguis Khan, a governar-los. Giray va encapçalar els tàtars de Crimea en una lluita sagnant per la independència, de la qual va sortir victoriós i convertit en kan d'una nova horda. Els crimeans són grans traficants d'esclaus i han de disputar el control del comerç local a les colònies §Ygenoveses§!. També han despertat l'interès del soldà §Yotomà§!, que segueix de prop els afers del kanat.\n\nEls kanats §YNogai§! i §YUzbek§!, tot i haver aconseguit la independència i controlar vastes extensions de l'estepa, no tenen ni la riquesa ni la importància estratègica dels altres estats successors. L'oportunisme ha de ser la seva filosofia si volen reclamar alguna part del llegat de Genguis Khan, i, per sort, sembla que els seus veïns §Ytimúrides§! són a punt de l'enfonsament i la guerra civil. Un kan digne d'aquest nom podria aprofitar l'ocasió per apoderar-se de les ciutats de §YSamarcanda§! o §YBukharà§! mentre els timúrides estan distrets."
 string_start_romania:0 "Els principats de §YValàquia§! i §YMoldàvia§! estan encaixonats entre potències molt més grans que ells. Fins ara han sobreviscut jugant al perillós joc d'oferir vassallatge a la nació que, segons creuen, els pot protegir millor de les altres. Un voivoda que vulgui prosperar ha de vigilar amb cura l'equilibri de poder.\n\nFeia temps que els voivodes eren membres de l'Orde del Drac, un orde nobiliari i cavalleresc consagrat a defensar la cristiandat de l'avanç de l'§YImperi Otomà§!. No va sorprendre ningú que els principats responguessin a la crida de la §YCroada de Varna§!. Aquella gran coalició militar pretenia expulsar els turcs dels Balcans i restaurar el domini cristià. La croada, però, va ser un fracàs devastador que va deixar regnes destrossats i el futur de la regió en l'aire.\n\nImmediatament després de la croada, un incident diplomàtic va acabar amb el general §Yhongarès§! §YHunyadi§! empresonat per §YVlad II§! de Valàquia. Tot i que la situació es va resoldre sense més conflicte, les relacions s'han enrarit prou perquè, de moment, Valàquia no pugui comptar amb l'ajuda hongaresa.\n\nEl voivoda de Valàquia es va unir a la croada tot i que el seu fill §YVlad Dràcula§! era captiu dels otomans; no és estrany, doncs, que ara cregui que el seu fill ha mort a mans turques. Però, sense que el voivoda ho sàpiga, el soldà va perdonar la vida a Vlad, que, ple de rancor, viu a l'exili i trama la seva venjança contra turcs i valacs per igual.\n\nLa incertesa també s'ha apoderat de Moldàvia: l'antic monarca §YIlias I§! ha mort a l'exili a §YPolònia§! i ha deixat el seu fill §YRoman§! com a possible pretendent al tron. Roman ha obtingut el suport nominal de Polònia a canvi de prometre la fidelitat eterna de Moldàvia si arriba a ser voivoda. És només qüestió de temps que Roman intenti arrabassar el tron al seu oncle §YEsteve§!."
 string_start_irish_minors:0 "El [GetYear], §YIrlanda§! està dividida entre molts clans dispersos, després de l'enfonsament del domini directe §Yanglès§!. El control anglès es limita ara a una petita zona al voltant de Dublín, coneguda com el §YPale§!.\n\nJust més enllà del Pale hi ha els dominis de la noblesa d'Irlanda: els comtes de §YDesmond§!, d'§YOrmond§!, de l'§YUlster§! i de §YKildare§!. Aquests senyors havien governat en nom de la corona anglesa, però ara la seva fidelitat és, com a molt, nominal. Governen amb independència i sovint desafien la influència anglesa. Al llarg dels segles, la noblesa anglonormanda que s'hi va establir s'ha tornat tan irlandesa com la població que governa. §YOffaly§! i §YLeinster§! estan envoltats d'enemics potencials, però també d'oportunitats per a un governant agressiu.\n\nAl nord, els comtats de §YTyrone§!, de §YTyrconnell§! i de l'Ulster es troben en una posició precària, al camí de l'expansionisme tant anglès com §Yescocès§!. El clan §YO'Neill§! de Tyrone potser haurà d'empassar-se l'orgull i plantejar-se una aliança amb una d'aquestes potències si mai vol restaurar el llegat del seu llegendari avantpassat, el gran rei Niall dels Nou Ostatges.\n\n§YThomond§!, §YSligo§!, §YClanricarde§! i §YMunster§!, a l'oest i al sud, són relativament a recer de les ambicions de les potències regionals, almenys de moment. Aquests clans tenen una història llarga i il·lustre, i afirmen descendir d'herois irlandesos com Brian Boru i Carthach el Vell. Si saben aprofitar-la, tenen l'oportunitat d'expandir-se per tota Irlanda i convertir-se en potències per dret propi.\n\nUna Irlanda unida sota un gran rei sembla un somni llunyà, però una dinastia capaç d'imposar-se tant als seus rivals irlandesos com als invasors anglesos encara podria tornar a reclamar aquell títol."
 string_start_provence:0 "El [GetYear], §YProvença§! està governada per l'ambiciós Renat d'Anjou, que no només s'intitula duc d'Anjou i comte de Provença, sinó també rei de §YNàpols§! i de §YJerusalem§!, i reclama el tron d'§YAragó§! com a hereu de la seva mare, Violant d'Aragó. Els senyors de la cristiandat fan poc cas d'aquestes pretensions, però el bon rei Renat està decidit a recuperar el que creu que li pertany per naixement.\n\nProvença controla un domini dividit. Anjou és al cor del conflicte entre §YAnglaterra§! i §YFrança§!, que el cobegen totes dues, i és probable que pateixi les guerres que s'acosten. Les terres provençals de Renània es reparteixen entre el ducat de Bar, que Renat governa directament, i el ducat súbdit de §YLorena§!. Si decideix ficar-se en els afers dels prínceps renans, Provença s'arrisca a provocar la ira tant de l'emperador del Sacre Imperi com del poderós Ducat de §YBorgonya§!. El comtat de Provença pròpiament dit és a la costa nord de la Mediterrània, encaixonat entre França, §YSavoia§! i la ciutat §Ypapal§! d'Avinyó. Des d'aquí, l'ambiciós Renat podria envair Aragó, tot i que Itàlia podria ser un premi més temptador ara que el poder de l'Imperi en aquella regió s'afebleix.\n\nProvença manté bones relacions amb el seu veí més gran i poderós, França. Haurà de conciliar les seves necessitats defensives i els seus plans d'expansió amb el suport que França n'espera si la guerra dels Cent Anys torna a esclatar obertament.\n\nProvença és una nació de grans ambicions, però fins i tot evitar l'aniquilació pot ser tot un repte, perquè les nacions veïnes miren les seves terres amb cobdícia."
 string_start_brittany:0 "La situació de §YBretanya§! el [GetYear] és molt semblant a la dels segles anteriors. Atrapats entre §YAnglaterra§! i §YFrança§!, els seus ducs fa temps que han de lluitar per mantenir-ne la independència. França, sobretot, ha intentat repetidament annexionar Bretanya als seus dominis, tant per la via diplomàtica com per la militar.\n\nEl segon Tractat de Guérande, signat el 1381, va declarar formalment Bretanya neutral en la guerra dels Cent Anys. Sembla probable que aquest conflicte torni a desembocar en hostilitats, ja que Anglaterra no atén les exigències franceses de lliurar el §YMaine§!. Fins a quin punt els ducs de Bretanya respectaran la seva promesa de neutralitat està per veure: intervenir en la guerra podria aportar molts guanys, però també molts perills. És poc probable que Bretanya pugui plantar cara tota sola a cap de les potències en guerra, i per això potser li convindria cooperar amb la potència creixent de §YBorgonya§!.\n\nBretanya és una terra rica i fèrtil amb un gran potencial de desenvolupament. La capital, §YNantes§!, ha viscut grans obres de reconstrucció després d'una sagnant guerra de successió i avui és un dels principals ports de l'Atlàntic. El port de Brest, per la seva banda, seria una drassana naval ideal, perquè és un port natural arrecerat i té una situació estratègica per interceptar tant les flotes franceses com les angleses.\n\nBretanya haurà de triar bé els seus amics i enemics si vol sobreviure en l'era moderna. I si la política turbulenta d'Europa no li ofereix oportunitats, potser el seu destí és més enllà de les seves costes."
 string_start_scotland:0 "El [GetYear], §YEscòcia§! continua ferma: ha lluitat per la seva independència contra els §Yanglesos§! que pretenien ser-ne els senyors, i l'ha guanyada. Escòcia es va treure de sobre el jou anglès després que Robert Bruce derrotés els anglesos a Bannockburn el 1314, i des d'aleshores ha consolidat el seu domini sobre el nord de la Gran Bretanya.\n\nLa protecció d'Escòcia no prové només dels seus valents exèrcits, sinó també de la Vella Aliança amb §YFrança§!. Aquest acord obliga França a acudir en ajuda d'Escòcia si Anglaterra intenta sotmetre-la de nou. La guerra és una possibilitat sempre present, perquè els senyors de les marques de totes dues bandes de la frontera amenacen d'agreujar el conflicte amb escaramusses freqüents i amb la tendència a canviar de bàndol per oportunisme quan hi ha millors ocasions de saqueig.\n\nEscòcia ha trigat molts anys a incorporar les §YTerres Altes§! al regne. A l'edat mitjana es va annexionar l'antic regne autònom de Moray, terra de l'usurpador Macbeth, i les institucions feudals es van estendre al nord de l'illa. La integració de les Terres Altes va ser molt útil a Escòcia, que les va convertir en una base de reclutament en la guerra contra Eduard I Cames Llargues. Les Hèbrides van ser arrabassades a l'antic Regne de les Illes sota Alexandre III, i ni tan sols la intervenció del rei de §YNoruega§! va poder aturar l'ofensiva escocesa.\n\nEl rei Jaume II té plans per estendre encara més el domini escocès a les illes properes. Les §YÒrcades i les Shetland§! pertanyen a Noruega, que al seu torn està sotmesa ara a §YDinamarca§!. Enfrontar-se a tot el poder d'Escandinàvia seria difícil, però potser es presentarà una solució diplomàtica. Anglaterra i Escòcia es disputen l'§Yilla de Man§! des de fa segles. Ara mateix els anglesos tenen avantatge, però un governant oportunista podria aprofitar que estan ocupats lluitant contra França per apoderar-se'n.\n\nLa casa §YStuart§! fa menys d'un segle que governa Escòcia, però ho ha fet bé. Si Escòcia aconsegueix capgirar la situació davant d'Anglaterra, algun dia els Stuart podrien regnar sobre totes les illes Britàniques."
 string_start_great_ming:2 "El Gran Imperi §YMing§! deu els seus orígens a l'enfonsament de la dinastia §YYuan§! de §YMongòlia§! i al període de rebel·lions i lluites que va sacsejar la Xina a mitjan segle XIV. D'aquella època de caos, els Ming en van sortir com la principal potència de la Xina: van eliminar els seus rivals han i van fer retrocedir els descendents de §YKublai Khan§! fins a la Gran Muralla. Després de vuitanta anys de govern, els Ming s'han consolidat com la potència preeminent de l'Àsia Oriental.\n\nTot i que l'imperi Ming continua prosperant, la seva presència internacional ha minvat des que es van acabar els viatges de Zheng He, i han sorgit nous regnes que li plantegen reptes inèdits. Al nord, dividit, els nòmades han començat a unir-se sota el lideratge del senyor de la guerra §Yoirat§! §YEsen§!, que aspira a convertir-se en el nou gran kan de tots els mongols. La diplomàcia Ming almenys ha impedit un moviment semblant entre les tribus §Yjurchen§! del nord-est, on la política imperial ha fomentat les lluites entre els nòmades. Tot i que és poc probable que els jurchen, dividits i distrets, siguin una amenaça a curt termini, els oirats d'Esen podrien ser un enemic realment formidable.\n\nLes relacions dels Ming amb el sud són una mica millors. §YDai Viet§! es va alliberar del domini Ming fa només dues dècades i continua desconfiant del seu veí xinès del nord. Altres potències de la regió tenen una opinió més favorable dels Ming, però les muntanyes i les selves fan que l'imperi no rebi gaire més que tributs simbòlics dels regnes del sud.\n\nLes relacions més sòlides dels Ming són amb la dinastia §YJoseon§! de §YCorea§!. Tant els Ming com la dinastia Joseon van sorgir de les cendres del Gran Yuan, i gràcies a la seva adhesió comuna a la filosofia confuciana totes dues han mantingut des d'aleshores uns vincles estrets.\n\nNo tots els problemes dels Ming venen de fora: el §YMandat del Cel§! és inconstant, i si l'autoritat de l'emperador vacil·la massa, hi ha qui podria decidir donar l'esquena als Ming del tot. La Xina hauria de caure molt avall per arribar a una situació tan desesperada: al segle XV, el Gran Imperi Ming és de lluny el regne més poderós d'Àsia, i molt possiblement de tot el món!"
 string_start_mongolia:2 "L'§YImperi Mongol§! de §YGenguis Khan§! ha desaparegut, i els seus estats successors han quedat reduïts a barallar-se entre ells als marges de la civilització. La dinastia §YYuan§!, abans tan poderosa, el domini de §YKublai Khan§!, ha estat expulsada completament de la §YXina§! i s'ha hagut de retirar a l'estepa, humiliada. Tot i que §YMongòlia§! encara reclama el títol imperial dels Yuan, el §YMandat del Cel§! ha passat als §YMing§!, que es van fer amb el poder enmig d'un alçament massiu contra el domini mongol.\n\nAvui el kan mongol no pot afirmar ni tan sols que governa l'estepa, ni tampoc que governa amb independència. Bona part de Mongòlia ha caigut sota la influència d'un nou poder mongol: la §YConfederació Oirat§!, encapçalada per §YEsen Taishi§!. Esen té grans ambicions: es nega a pagar tribut als Ming i està disposat a enfrontar-se als seus immensos exèrcits per obtenir el domini. Si Esen no fos un comandant militar tan brillant, és poc probable que els mongols occidentals acceptessin una actitud tan desafiant.\n\nEl §Ykan Unebolad§! dels mongols §YKorchin§! s'ha fet amb un domini respectable a la Mongòlia Oriental. Ell també té la gran ambició de reunificar els mongols, tot i que els seus exèrcits i les seves capacitats estan més a l'altura dels jurchen dividits de l'est que no pas de les forces consolidades dels oirats.\n\nEl §YKanat de Mogolistan§! és el més estable dels estats successors mongols, tot i que el llistó no és gaire alt. Els §Ytxagataïdes§! conserven el control de les terres al nord de les muntanyes del §YTian Shan§!, així com de l'§YEmirat de Yarkand§!, a la conca del Tarim.\n\nMolts mongols han adoptat la fe §Yvajrayana§!, la branca §Ytibetana§! del budisme. Durant els darrers segles, aquesta fe ha conviscut pacíficament amb la creença tradicional mongola en §YTengri§!, i fins i tot va gaudir del favor imperial durant una època sota els Yuan. Els mongols han de pensar bé les seves relacions amb el §YTibet§! i decidir com tracten la qüestió religiosa.\n\nTots els kans somien a unir els mongols i restaurar el gran Imperi Mongol de Genguis Khan. Fins ara, tots els qui ho han intentat només han tingut un èxit efímer. Però encara hi ha temps perquè un nou kan es posi a l'altura del repte..."
 string_start_philippines:0 "El [GetYear], les illes Filipines acullen diverses petites ciutats estat marineres. Les illes sempre han estat prou lluny per conservar la seva autonomia fins i tot davant de potències hegemòniques com l'antic imperi de Srivijaya o els soldanats musulmans de §YBrunei§! i §YMalaca§!.\n\nAixí, l'arxipèlag ha esdevingut un microcosmos de regnes indianitzats, sinòfils i islamitzats, cadascun amb el seu caràcter i la seva història.\n\nAl nord, a l'illa de Luzon, les ciutats estat de §YPangasinan§! i §YTondo§! prosperen gràcies al comerç amb l'§YImperi Xinès§!. La seva condició de tributaris els permet obtenir productes xinesos per revendre'ls a les altres illes. Amb aquesta finalitat, la petita ciutat estat islàmica de §YMaynila§! ha establert una estreta cooperació amb Tondo: aquesta fa de port de cara als xinesos, mentre que Maynila és el centre de distribució dels productes xinesos cap a les altres illes.\n\nMés al sud, a l'arxipèlag de les Visayas, diversos assentaments hindús competeixen pel control de les rutes comercials. El regne insular de §YCebu§! és potser l'estat més antic de la regió. Els governants de Cebu reivindiquen el llegat d'un príncep de l'Imperi §YChola§! de l'Índia. Molts dels altres estats s'han integrat a la federació de §YMadyas§!, una organització laxa en què els membres s'alternen per exercir el lideratge sobre els altres.\n\nTot i que l'antic rajanat hindú de §YButuan§! ha tingut tradicionalment l'hegemonia a l'extrem sud, darrerament ha hagut de fer front a la competència creixent dels estats d'orientació musulmana de §YMaguindanao§! i §YSulu§!. Sulu pràcticament ha entrat a l'òrbita del soldanat musulmà de Brunei, mentre que a Maguindanao la família reial adopta cada cop més les tradicions islàmiques en detriment de la seva religió animista tradicional.\n\nHi ha qui diria que la divisió d'aquest ric arxipèlag cap al [GetYear] el fa vulnerable. Només el temps dirà si el microcosmos filipí pot sobreviure a l'arribada de noves fes, nous pobles i noves armes."
 string_start_ashikaga:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars. Tanmateix, el [GetYear] el xogunat ja no és el que era. Els darrers anys s'han succeït ràpidament diversos xoguns §YAshikaga§!, víctimes d'accidents i assassinats. En més d'una ocasió, els assaltants han demostrat que Kyoto no és un lloc segur, ni tan sols per a qui té la missió de mantenir la pau a tot el regne.\n\nDes de la mort de Yoshimitsu, el darrer xogun Ashikaga fort, els clans més poderosos del regne han arribat a rivalitzar en poder amb el xogunat. Els senyors que encapçalen aquests clans es coneixen com a daimyo i tenen un poder gairebé absolut sobre els seus dominis. Alguns, com els §YHosokawa§!, els §YHatakeyama§! i els §YShiba§!, estan estretament lligats al xogunat i han monopolitzat el càrrec de kanrei, el lloctinent formal del xogun. D'altres, com els §YYamana§!, els §YAkamatsu§!, els §YIsshiki§! i els §YKyogoku§!, exerceixen la seva influència simplement gràcies a la seva pròpia riquesa i poder.\n\nAshikaga §YYoshimasa§!, l'infant que encapçala la casa Ashikaga i futur xogun, podria intentar frenar aquesta evolució nomenant servidors de confiança per a càrrecs importants i interessant-se activament pels conflictes locals del regne. Està per veure, però, si podrà salvar el xogunat, perquè altres clans no han perdut ni un moment a l'hora d'aprofitar la feblesa dels predecessors de Yoshimasa.\n\nEl poder creixent dels daimyo forts encara amenaça de fer irrellevant el xogunat; sobretot la rivalitat entre els Hosokawa i els Yamana podria esquinçar el regne, ja que entre tots dos clans controlen un terç de l'imperi.\n\n"
 string_start_hatakeyama:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars. Tanmateix, el [GetYear] el xogunat ja no és el que era. Els darrers anys s'han succeït ràpidament diversos xoguns §YAshikaga§!, víctimes d'accidents i assassinats. En més d'una ocasió, els assaltants han demostrat que Kyoto no és un lloc segur, ni tan sols per a qui té la missió de mantenir la pau a tot el regne.\n\nDes de la mort de Yoshimitsu, el darrer xogun Ashikaga fort, els clans més poderosos del regne han arribat a rivalitzar en poder amb el xogunat. Els senyors que encapçalen aquests clans es coneixen com a daimyo i tenen un poder gairebé absolut sobre els seus dominis. Alguns, com els §YHosokawa§!, els §YHatakeyama§! i els §YShiba§!, estan estretament lligats al xogunat i han monopolitzat el càrrec de kanrei, el lloctinent formal del xogun. D'altres, com els §YYamana§!, els §YAkamatsu§!, els §YIsshiki§! i els §YKyogoku§!, exerceixen la seva influència simplement gràcies a la seva pròpia riquesa i poder.\n\nCap al [GetYear], els §YHatakeyama§! són una de les forces dominants del Japó central. Com a branca secundària dels Ashikaga, han pogut influir molt en el govern de Kyoto durant un llarg període de xoguns febles, una influència que han aprofitat per construir-se una sòlida base de poder en províncies riques. El principal rival dels Hatakeyama ha estat sovint el clan Hosokawa, amb el seu gran domini occidental i uns vincles igual d'estrets amb els Ashikaga.\n\n"
 string_start_shiba:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars. Tanmateix, el [GetYear] el xogunat ja no és el que era. Els darrers anys s'han succeït ràpidament diversos xoguns §YAshikaga§!, víctimes d'accidents i assassinats. En més d'una ocasió, els assaltants han demostrat que Kyoto no és un lloc segur, ni tan sols per a qui té la missió de mantenir la pau a tot el regne.\n\nCom els §YHosokawa§! i els §YHatakeyama§!, el clan §YShiba§! té vincles estrets amb els Ashikaga i ha aprofitat aquesta influència per afavorir les seves pròpies ambicions durant aquest període de xoguns febles. A diferència dels altres clans, però, ha vist com el seu poder minvava al llarg del darrer segle. Ara el seu domini està escampat sobretot per la meitat oriental del Japó, i alguns dels seus magistrats locals, com els §YOda§! i els §YAsakura§!, cada cop actuen menys com a vassalls i més com a daimyo independents.\n\n"
 string_start_central_japan:1 "A prop del centre de poder de Kyoto, els clans del centre del §YJapó§! estan tradicionalment molt vinculats al xogunat i a la cort imperial. L'autoritat del mateix xogun encara és forta en aquesta zona, i molts clans, com els §YIsshiki§! o els §YToki§!, participen activament tant en l'administració com en les cerimònies de Kyoto.\n\nTanmateix, fins i tot aquí, al cor mateix de les estructures de poder del xogunat, hi ha homes fets a si mateixos que han començat a treure els seus clans de l'anonimat i a donar-los una influència real. Presentant-se com a magistrats locals de temples poderosos o dels daimyo, clans com els §YOda§!, els §YTsutsui§! i els §YTokugawa§! han començat a bastir dominis petits però poderosos a les seves comarques.\n\nEl poder creixent dels clans §YHosokawa§! i §YYamana§!, que entre tots dos controlen un terç del Japó, amenaça de fer irrellevant el xogunat. L'ascens ràpid dels Yamana ha provocat una rivalitat intensa que podria fer que qualsevol conflicte degenerés en una guerra civil oberta. En una guerra així, és molt improbable que cap clan d'aquesta part central del país pogués evitar veure-s'hi arrossegat.\n\n"
 string_start_northern_japan:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars.\n\nTohoku, al nord del Japó, és una de les zones més remotes del regne. Fa segles que la governa el clan §YShiba§!, tot i que la seu de Kamakura, al sud, també hi exerceix una certa influència. Clans locals com els §YDate§!, els §YNanbu§! i els §YAndo§! miren d'augmentar la seva influència consolidant els seus dominis i intentant negociar directament amb el xogunat, sense passar pels Shiba ni per la seu de Kamakura.\n\nAmb el conflicte que es cou al centre i a l'oest del Japó, i amb l'afebliment de la seu de Kamakura, al Kanto, més al sud, els clans del nord són cada cop més independents del poder central."
 string_start_eastern_japan:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars.\n\nEls xoguns §YAshikaga§! han posat el Japó oriental en mans d'un membre de la seva pròpia família, el kubo de Kamakura. Tanmateix, el kubo de Kamakura sovint ha intentat actuar al marge dels xoguns de Kyoto i ha fet servir el càrrec per construir-se una base de poder personal a l'est del Japó.\n\nCom a més influents dels daimyo orientals, els §YUesugi§! han intentat sovint limitar les ambicions del kubo de Kamakura, al·legant que feien costat al xogun Ashikaga contra el seu parent de l'est. Aquests conflictes han deixat clar que molts senyors de l'est, i en especial els Uesugi, hauran de confiar en les seves pròpies forces per defensar els seus interessos.\n\nA finals del [GetYear], l'est està tranquil, però la situació és volàtil. Els Uesugi continuen sent la facció més forta de la regió, però aquesta força només es basa en la seva pròpia capacitat de defensar-se. Clans de samurais honorables com els §YSatake§!, els §YUtsunomiya§! i els §YChiba§! sempre han conservat un ampli grau d'autonomia en aquesta regió, i no es quedarien de braços plegats si els Uesugi intentessin augmentar encara més la seva influència."
 string_start_western_japan:0 "Nominalment, l'Imperi del §YJapó§! el governa des de Kyoto l'emperador Go-Hanazono, el darrer d'un llinatge imperial de 2000 anys. A la pràctica, però, el govern del país ha quedat en mans del xogun, en principi el lloctinent de l'emperador en els afers militars. El [GetYear], però, el xogunat ja no és el que era. El 1441, el clan §YAkamatsu§! va assassinar l'impopular xogun Yoshinori, cosa que va obrir un procés d'enfortiment dels senyors locals.\n\nEl clan §YHosokawa§! va ser un dels clans fundadors de l'actual xogunat i continua sent una de les famílies més poderoses del Japó. Controla més territori que cap altre clan i té una gran influència a la cort.\n\nDes de l'assassinat de Yoshinori, els §YYamana§! han absorbit la major part dels territoris que abans tenien els Akamatsu. El seu ascens els ha convertit ràpidament en una força a tenir en compte a l'oest del Japó, que desafia el predomini dels Hosokawa.\n\nLa pèrdua de control del poder central també ha provocat un augment notable de la pirateria i el contraban: molts petits senyors fan els ulls grossos o fins i tot fomenten les incursions en aigües estrangeres. D'altres, com els §YOuchi§! i els venerables Hosokawa, prefereixen treure profit del comerç exterior, estrictament regulat, amb aquells països.\n\nCap al [GetYear] es cou un conflicte entre els Yamana i els Hosokawa. De moment, un enfrontament obert sembla llunyà, però el seu gran poder i els seus interessos contraposats fan que fins i tot un incident menor pugui desembocar en un gran conflicte. Un conflicte així podria ser just el que necessiten els clans més petits de la regió, com els §YAmago§!, els §YKono§!, els §YOtomo§!, els §YShoni§!, els §YKikuchi§!, els §YIto§! i els §YShimazu§!, per millorar la seva posició. Molts d'aquests clans tenen una història antiga i honorable i conserven els seus dominis des del període Kamakura."
 string_start_majapahit:0 "El Regne de §YMajapahit§! ha estat tradicionalment el més gran de l'illa de Java. El rei §YHayam Wuruk§!, que hi va regnar del 1350 al 1389, va deixar el país en el seu apogeu: tenia un §Ymandala§! d'uns noranta tributaris repartits per tot l'arxipèlag indonesi i una cort esplendorosa, retratada en la gran obra del §YNagarakretagama§!, i havia impulsat la construcció de grans temples hindús per tota l'illa.\n\nTanmateix, després de la mort del rei, el poder de §YMajapahit§! va començar a declinar. El país va perdre el control dels seus antics tributaris i va esclatar una guerra civil. Llavors va arribar a la regió la flota del tresor de Zheng He, que va afavorir els soldans musulmans de §YMalaca§! com a principals protegits de la Xina a la zona; això va soscavar la posició de §YMajapahit§! i va obrir la porta a la influència musulmana sobre un poble fins aleshores hindú.\n\nAra el país és en una cruïlla. Serà capaç de capgirar la decadència i tornar a ser la principal potència de l'arxipèlag?"
 string_start_palembang:0 "§YPalembang§! es va fundar a l'illa de Sumatra com a capital del Regne de §YSrivijaya§!, la principal potència de l'estret de Malaca entre els segles VII i XII. La seva supremacia naval va configurar la regió durant aquell període: el seu poder provenia de connectar les rutes marítimes de l'Índia i de la Xina, i va estendre el seu §Ymandala§! mitjançant una àmplia xarxa de tributaris, alhora que promovia el budisme com a religió principal de l'arxipèlag indonesi. Tanmateix, finalment va caure davant el poder combinat de dos dels seus tributaris, els regnes de §YSinghasari§! i de §YMajapahit§!, de l'illa de Java.\n\nDesprés de la caiguda de §YSrivijaya§!, §YPalembang§! ha continuat mirant cap al mar, tot i que en els darrers anys es va convertir en un cau de pirates que la mateixa flota de Zheng He va haver de combatre. Tanmateix, potser una aliança amb el poble orang laut, juntament amb el desenvolupament dels vaixells drac, li permetria recuperar la posició preeminent que havia tingut a l'estret de Malaca."
 string_start_tondo:0 "§YTondo§! és la principal ciutat estat tagal del delta del riu Pasig, a l'illa de Luzon. Juntament amb la ciutat estat veïna de §YMaynila§!, ha establert un monopoli del comerç amb la Xina després dels viatges de la flota del tresor, i fa d'intermediària dels productes xinesos amb tot l'arxipèlag filipí. La seva posició dominant l'ha enriquida, i està molt ben situada per iniciar, potser, la unificació de Luzon i les illes veïnes per primera vegada en la seva història."
 string_start_dai_viet:0 "Durant el segle passat, §YDai Viet§! va perdre bona part del seu antic poder. Després d'un llarg conflicte amb la potència meridional de §YChampa§!, la dinastia §YTran§! va demanar ajuda a l'§Yemperador Ming§!, però li va sortir el tret per la culata: els xinesos aviat es van apoderar de tot el país. Tanmateix, el 1418 va esclatar un alçament encapçalat per §YLe Loi§!, un guerrer d'origen humil que, després d'expulsar del país les tropes §YMing§!, es convertiria en el nou governant i fundaria una nova dinastia. \n\nMalgrat tot, el govern del país continua sent molt feble, perquè hi ha lluites entre les faccions de la cort i de la noblesa, i calen més reformes. També cal tenir en compte els §Ychams§! del sud, i potser l'§Yemperador de la Xina§! voldrà restablir la seva hegemonia sobre §YDai Viet§!."
 string_start_khmer:0 "Els §Ykhmers§! són una potència en decadència, i les grans ciutats i temples com §YAngkor Wat§! són el record de la seva glòria passada. Durant el segle passat, l'Imperi §YKhmer§! es va desintegrar a causa de les incursions dels estats tais i d'altres països veïns, mentre que el seu desenvolupat sistema agrícola gairebé es va enfonsar perquè les temporades de mal temps es van fer molt més freqüents que abans. Així doncs, els seus governants han de superar una situació precària: han de reconstruir el país i recuperar la riquesa perduda, i alhora ocupar-se dels seus poderosos veïns quan se'n presenti l'ocasió."
 string_start_ayutthaya:0 "El Regne d'§YAyutthaya§! ha crescut durant les darreres dècades fins a convertir-se en el centre del sistema de §Ymandala§! més important entre les ciutats estat tais. Fa pocs anys, el rei §YBorommaracha II§! va aconseguir nomenar el seu hereu, §YRamesuan§!, governant del Regne de §YSukhothai§!, al nord, cosa que ha millorat molt la seva posició a la conca del riu Chao Phraya. Des d'allà, §YAyutthaya§! té una posició excel·lent per estendre el seu control sobre §YIndoxina§!, tot i que primer haurà de superar els seus veïns."
 string_start_pegu:0 "La ciutat estat mon de §YPegu§! es va convertir en el centre d'un §Ymandala§! en les dècades posteriors a la caiguda de l'Imperi de §YPagan§!. El seu poder creixent aviat va topar amb el regne birmà d'§YAva§!, i a la part final del segle XIV va esclatar la guerra dels Quaranta Anys. Des d'aleshores s'ha viscut un període més pacífic, però les causes del conflicte encara hi són. Controlar la conca del riu Irrawaddy, amb les seves riqueses i les ciutats estat que l'envolten, seria una fita clau per enfortir encara més els mon en la seva lluita contra els birmans. I qui sap si dominar les rutes comercials tant cap a l'oest com cap a l'est podria ser un camí profitós per als seus governants."
 string_start_aztecs:0 "Des de principis del segle XIV, la vall de §YMèxic§! i les regions veïnes han viscut sota el domini dels governants §Ytepaneques§! d'§YAzcapotzalco§!. El seu regnat, però, s'ha esvaït. Una amarga disputa pel tron entre els germans rivals Tayatzin i Maxtla els va deixar en una posició vulnerable, i el 1428 els va enderrocar l'aliança naixent de les ciutats estat de §YMèxic-Tenochtitlan§!, §YTlacopan§! i §YTexcoco§!. Ara que ha consolidat el seu poder, aquesta Triple Aliança §Yasteca§!, encapçalada per §YMoctezuma Ilhuicamina§!, vol expandir-se més enllà dels seus territoris, sobretot cap a les riques ciutats §Ymixteques§! del sud (com ara §YCoixtlahuaca§!).\n\nA l'est dels asteques, les ciutats estat aliades de §YTlaxcala§! estan decidides a mantenir la seva independència davant l'agressivitat asteca. Els asteques estan disposats a acceptar-ho: els captius tlaxcaltecs presos en guerra per ser oferts en sacrifici valen molt més per a l'imperi que no pas uns súbdits tlaxcaltecs. Mentrestant, al sud, el poble nahua de §YTeotitlan§! juga al perillós joc d'intentar preservar la seva independència mitjançant l'amistat amb l'imperi, i no pas amb la guerra.\n\nA l'oest, als altiplans de §YMichoacán§!, les ciutats del llac de Pátzcuaro es van unificar entre el 1300 i el 1350 sota el govern de §YTariácuri de Tzintzuntzan§!. A partir d'aquesta base, els successors §Ypurépecha§! de Tariácuri s'han estès encara més i han creat un estat poderós capaç de rivalitzar amb els asteques. Tant els purépecha com els asteques vigilen amb recel els §Ymatlatzinca§! de la vall de §YToluca§!: tot i que serien una bona adquisició per a qualsevol dels dos imperis, potser són més valuosos com a estat tampó, i una agressió en aquella direcció podria arrossegar les dues potències a una guerra que no volen.\n\nPerò Toluca no és l'única preocupació dels governants purépecha. A l'oest i al nord del seu regne, una munió de petits estats com §YColima§!, §YTonala§! i §YXalisco§! vigilen rics jaciments de salnitre que els purépecha voldrien controlar. Per separat, és poc probable que puguin resistir l'expansió purépecha, però si s'ajudessin entre ells podrien ser-hi un obstacle formidable.\n\nFinalment, a l'extrem nord de la regió, els diversos pobles que els asteques anomenen col·lectivament §Ychichimeces§! són una font perenne de problemes per als estats més sedentaris del sud. Els més poderosos són probablement els de la confederació §Yguamare§!, però molt més coneguts per als pobles mesoamericans són els §Yotomís§!, que sovint viuen establerts entre ells o serveixen com a mercenaris en guerres incomptables."
 strong_start_mayans:0 "Els esplendors de l'edat d'or maia del primer mil·lenni s'han esvaït i han deixat pas a una època de conflictes aferrissats i aliances precàries. La glòria de §YChichén Itzá§! s'ha apagat, i els darrers governants §Yitzàs§! s'han vist obligats a fugir a les selves de l'extrem meridional del §YYucatán§! per fundar-hi noves ciutats. En el seu lloc, només un darrer imperi §Ymaia§! mantenia unit el Yucatán: la §YLliga de Mayapán§!. El 1441, però, els governants §Yxiu§! d'§YUxmal§! es van alliberar de la Lliga i van massacrar tota la família regnant dels §YCocom§! de Mayapán, llevat d'un sol supervivent. Aquest, de tornada al Yucatán, va reunir els seus aliats i va fundar una nova capital a §YSotuta§!, mentre que els xiu traslladaven la seva a Maní. Amb aquesta rivalitat enverinada, els darrers lligams que mantenien unit el Yucatán s'han trencat, i altres entitats polítiques, com §YChactemal§! i §YCan Pech§!, han començat a seguir el seu propi camí, tot rebutjant la influència de les grans dinasties de l'antic Yucatán.\n\nMés al sud, a les muntanyes de §YGuatemala§!, poca cosa queda de les grans ciutats que hi van florir antigament. Només hi resten dues potències de pes. La principal és §YQumarkaj§!, capital del poble §Ykiche§!, que al llarg de generacions de governants ha unificat bona part de les terres altes. El poder dels kiche es basa sobretot en l'aliança amb els seus poderosos vassalls, els §Ykaqchikel§!. Mentre es mantinguin units seran forts, però si mai els esdeveniments els separessin, i encara més si es giressin l'un contra l'altre, el poder kiche minvaria molt. A prop d'allà, el poble §Ych'orti§!, hereu de l'antigament gran ciutat de §YCopán§!, es manté en gran part al marge de la política dels seus veïns, mentre que a les valls muntanyoses de §YChiapas§! una munió de pobles maies locals, com els §Ytzotzil§!, viuen gairebé ignorats pels regnes més poderosos que els envolten. Al nord de Chiapas, a la costa del golf de Mèxic, els darrers descendents del poble §Yolmeca§!, els §Yyokot'an§!, també romanen a les seves terres, tot i que mantenen un comerç actiu amb els veïns.\n\nTanmateix, no tots els pobles maies viuen a les regions que envolten el Yucatán. Molt al nord, més enllà de les terres dels pobles nahues, el poble §Yhuasteca§! va abandonar el país maia fa milers d'anys, empès cap al nord per la pressió de l'Imperi Olmeca, aleshores naixent i avui oblidat. Ara habiten les selves de l'extrem nord-oriental de Mesoamèrica, més enllà dels grans imperis del Mèxic central. Per a ells, els seus germans maies no són més que un somni oblidat; els preocupen molt més les potències expansionistes que els envolten i els amenacen constantment."
 string_start_iroquois:0 "Units sota la Gran Llei de la Pau per Hiawatha i el Gran Pacificador, els pobles de la confederació haudenosaunee s'han convertit ràpidament en una de les principals potències del nord-est de l'Amèrica del Nord. Mentre els oneida, els onondaga i els cayuga atenen les necessitats de la confederació, els seneca, a l'oest, miren cap als Grans Llacs, uns rics territoris de caça a punt per a l'expansió.\nMentrestant, a l'est, els mohawk observen els poblats de la vall del Sant Llorenç i es demanen quan arribarà el moment de fer seves aquelles terres fèrtils i dividides.\n\nSi els §Yiroquesos§! volen dur a terme les seves ambicions, necessitaran armes noves i nous socis comercials, però ara per ara ningú a les Amèriques no posseeix el que necessiten..."
 string_start_huron:0 "Formada en temps immemorials per l'aliança de quatre tribus que vivien al sud del llac que porta el seu nom, la confederació wendat, o §Yhuró§!, és una lliga poderosa que domina el comerç de bona part de la regió dels Grans Llacs inferiors. Els pobles algonquins de l'oest i del nord estan massa dispersos per representar una amenaça seriosa, i l'únic perill real per a la prosperitat hurona és el poder creixent de la Lliga §YIroquesa§!, a l'est, que sens dubte intentarà arrabassar el comerç de mans dels hurons."
 string_start_anishinaabe:0 "Durant generacions, els avantpassats del poble anishinaabe han viatjat cap a l'oest, lluny de la costa de les Amèriques, amb l'esperança de fugir dels estrangers que, segons els seus profetes, algun dia arribaran per mar.\nFinalment, en arribar al cinquè lloc d'aturada del seu èxode, allà on es troben el llac Superior i el llac Huron, s'han dividit en tres grans nacions —els bodewadmi (o §Ypotawatomi§!), els odaawaa (o §Yottawa§!) i els §Yojibwe§!— i s'han escampat per les terres del voltant.\nEncara units per lligams de cultura i de tradició, s'enfronten a l'amenaça del poder creixent dels pobles iroquesos de l'est, els §Yhurons§! i els §Yiroquesos§!, que potser algun dia s'expandiran cap a ells..."
 string_start_edge_of_the_plains:0 "Pocs s'aventuren allà on comença el mar daurat. Aquesta extensió sense arbres, on els rius són escassos i els grans ramats de bisons corren més que el caçador més ràpid, és un obstacle formidable per a unes nacions que només tenen travois arrossegats per gossos per transportar les seves pertinences.\n Potser, si es trobessin i es domestiquessin bèsties més grans, les planes podrien esdevenir una terra acollidora; però on es podrien trobar aquestes bèsties? Fins que no arribin, els pobles de la vora de la plana resten atrapats entre boscos hostils, muntanyes amenaçadores i deserts implacables, convençuts que sobreviure serà una lluita constant."
 string_start_plain_dwellers:0 "Hi va haver un temps en què un poble poderós conreava les valls fluvials de les planes. Hi va haver un temps en què aixecava pobles de tova que brillaven sota el sol.\nPerò el seu temps s'acaba, i al seu pas només en queden les restes. Així són els chahiksichaiks (o §Ypawnee§!) i els kitkit'ish (o §Ywichita§!). De moment viuen tranquils: les planes són un obstacle temible que pocs gosen travessar, i això els deixa fora de l'abast de molts dels seus rivals.\nPerò amb la pressió creixent que arriba de l'est i de l'oest i que empeny cap a les planes les tribus que viuen a la vora, el temps de pau dels pawnee i dels wichita podria acabar aviat..."
 string_start_osage:0 "Un camí llarg i feixuc, motivat per la creixent agressivitat §Yiroquesa§!, ha portat el poble niukonska, o §Yosage§!, juntament amb els seus parents dhegiha (els quapaw, els kaw, els omaha i els ponca), des de les terres orientals del riu Ohio fins als monts Ozark i el Missouri. Aquests guerrers poderosos han trobat una relativa seguretat a la seva nova llar, però a mesura que més i més tribus es desplacen cap a l'oest per por del poder iroquès, aquesta seguretat aviat podria ser cosa del passat."
 string_start_cherokee:0 "A les valls muntanyoses dels Apalatxes, els aniyunwiya, o §Ycherokees§!, s'han establert on abans hi havia les ciutats dels constructors de túmuls. Lliures per fi del domini tirànic de la casta sacerdotal dels ani-kutani, els cherokees, parents llunyans dels pobles iroquesos del nord, volen ara estendre el seu poder sobre les regions del voltant.\nAl sud, el cacicat de Coosa i el seu poble §Ycreek§! encara tenen una influència considerable i són el principal obstacle per a l'ascens del poder cherokee. Al nord, els §Yshawnee§! i els seus parents algonquins són molt més febles i, si no s'alien entre ells, haurien de representar una amenaça molt menor."
 string_start_creek:0 "Centrat en la ciutat de Coosa, el gran cacicat de Coosa és un dels darrers grans estats dels constructors de túmuls de l'Amèrica del Nord. Tot i que el seu poder continua sent considerable, ha vist la decadència dels seus veïns. El seu poble, que aviat s'anomenarà mvskoke (o §Ycreek§!), vigila les amenaces que sorgeixen, tant a les terres del voltant com des del mar, a l'est.\nLa pitjor d'aquestes amenaces és sens dubte la dels §Ycherokees§! del nord, que s'han apropiat de moltes ciutats antigament esplendoroses dels constructors de túmuls i que parlen una llengua estranya.\nNo desitgen res més que estendre el seu domini a les valls meridionals del cacicat de Coosa, i cal aturar-los costi el que costi."
 string_start_kharabakh:0 "Arran de les invasions seljúcides, mongoles i turcmanes del Caucas, el Regne d'§YArmènia§! va ser destruït i sotmès a l'ocupació estrangera. Els melikats de §YKarabakh§! són els darrers successors directes d'Armènia i mantenen una presència autònoma sota el lideratge de la casa §Y[Root.Monarch.Dynasty.GetName]§!.\n\nCom a súbdits dels §YQara Qoyunlu§!, els armenis no són independents. Tot i així, gaudeixen d'un cert grau de llibertat religiosa i política, per bé que lluny del que va ser el regne armeni en èpoques anteriors."
 string_start_chikasaw_choctaw:0 "De les ruïnes de les ciutats dels constructors de túmuls del baix Mississipí han sorgit dues tribus poderoses. Els chickasha (o §Ychickasaw§!) i els chatah (o §Ychoctaw§!), que fan remuntar el seu llinatge a terres molt llunyanes de l'oest, mantenen tots dos una forta unitat tribal i, tot i que s'han de vigilar mútuament, tenen poques amenaces més.\nPerò al sud i a l'est s'estén el mar, i cap chickasaw ni cap choctaw no sap què hi ha més enllà.\nPodria arribar algun dia, de l'altra banda de les onades, una amenaça més gran que cap de les que han conegut fins ara?"
 string_start_denmark:0 "Des del tractat de Kalmar de 1397, les corones nòrdiques de §YNoruega§!, §YSuècia§! i §YDinamarca§! han de recaure en un sol monarca. Des dels seus inicis, aquesta §YUnió de Kalmar§! l'han dirigida els danesos, la més forta i rica de les potències nòrdiques, propera al continent i amb l'ambició de controlar i dominar la regió de la mar Bàltica.\n\nTanmateix, la monarquia danesa té molts enemics, sobretot entre les ciutats de la §YLliga Hanseàtica§!, una aliança de ciutats lliures que controla el comerç bàltic i que ara se sent amenaçada per Dinamarca. Aquesta rivalitat ha culminat fa poc en una sèrie de guerres que han acabat amb la pèrdua de §YSlesvig§! i, després, amb la deposició del rei danès Eric, que ara no és més que un cap de pirates a l'illa de §YGotland§!.\n\nDinamarca acaba d'elegir un nou rei de la família bavaresa dels §YWittelsbach§!. Cristòfol no té cap vincle amb la noblesa danesa ni amb la sueca, però sembla que té grans plans per als tres regnes nòrdics: s'ha proclamat el primer arxirei del Nord.\n\nEl temps dirà quin serà el llegat de Cristòfol. La corona danesa ha empenyorat molts dels seus béns a les famílies més poderoses del regne, i ni els nobles suecs ni els noruecs no semblen apreciar gaire el seu nou rei alemany. Els noruecs encara són partidaris de l'Eric deposat, mentre que la noblesa sueca s'ha unit fa poc al voltant del seu regent, Karl Knutsson."
 string_start_cusco:1 "El 1444, els quítxues de §YCusco§! són a punt de viure un ascens extraordinari. Durant les recents §Yguerres contra els chankes§!, un dels prínceps, §YInca Yupanki§!, va decidir quedar-se a la capital mentre la major part de l'aristocràcia i del govern fugia davant l'avanç de les forces chankes. El príncep va sortir victoriós i va adoptar el nom de «§YPachacuti§!», que vol dir «el que sacseja la terra». Després de renovar la ciutat de Cusco, aviat començaria una expansió imperial que posaria les bases del §YTawantinsuyu§!.\n\nEls inques no serien els primers a forjar un imperi a partir del mosaic andí, ja que aquelles altures les havien dominades els poderosos regnes wari i tiwanaku. El principal objectiu de la primera expansió inca seria la conca del Titicaca, on tenen la seva base els seus enemics de §YColla§!, la conquesta dels quals eliminaria un rival poderós de la zona i deixaria via lliure a noves conquestes."
 string_start_sweden:0 "El Regne de §YSuècia§! va entrar de bon grat a la Unió de Kalmar amb §YNoruega§! i §YDinamarca§! el 1397, amb el desig de limitar la influència dels mercaders alemanys de la Lliga Hanseàtica. Tanmateix, la unió ha estat en molts aspectes una decepció per als nobles suecs. L'autoritat s'ha concentrat a la llunyana Dinamarca, i els nombrosos conflictes amb §YLübeck§! i les ciutats hanseàtiques han sortit molt cars. Molts estan cansats que els diners que tant els ha costat guanyar es malgastin en aventures daneses al nord d'Alemanya, unes guerres que, a més, pertorben el comerç i dificulten l'exportació del ferro suec.\n\nLes tensions van arribar al punt màxim a la dècada de 1430, quan la revolta popular d'Engelbrekt va expulsar per la força els funcionaris danesos del país. Aquest alçament, juntament amb les guerres fallides contra la Lliga Hanseàtica, va dur a la deposició del rei de la Unió, §YEric§!, que ha fugit a l'illa de §YGotland§!, on porta una vida de pirata local en lloc de la de rei del Nord.\n\nEl nou rei elegit per danesos, suecs i noruecs és un estranger sense cap base de poder al país, §YCristòfol de Baviera§!, però el poder real del regne de Suècia és en mans del gran justicier del regne, Karl Knutsson Bonde, i de la noblesa sueca.\n\nEl temps dirà si la Unió de Kalmar es pot recompondre o si Suècia seguirà el seu propi camí. El que és clar és que el control de la mar Bàltica i dels seus nombrosos estuaris i ports serà imprescindible per al regne suec. Les rutes marítimes són el que manté unit l'extens regne de Suècia, de Kalmar a Viborg, i també el camí pel qual l'abundant ferro i coure suecs arriben al continent.\n\nPerquè Suècia assoleixi aquest domini sobre el Bàltic, un Dominium Maris Baltici, no només haurà de vèncer els mercaders alemanys, sinó que també s'haurà d'implicar en la política del §YSacre Imperi Romanogermànic§!. I encara haurà de superar els ordes §YTeutònic§! i §YLivonià§!, i d'altres que també volen controlar el comerç bàltic. Els principats §Yrussos§!, els §Ypolonesos§! i els §Ylituans§! són tots rivals naturals a llarg termini en aquesta lluita, per no parlar del regne danès, amb el qual Suècia està unida ara com ara..."
 string_start_norway:0 "Des del 1397, la Corona de §YNoruega§! forma part de la Unió de Kalmar juntament amb §YDinamarca§! i §YSuècia§!. Tot i que formalment governa el país un Consell d'Estat noruec, la creixent centralització imposada pels monarques danesos s'hi fa sentir i atorga cada vegada més privilegis a la noblesa danesa.\n\nAra bé, els terratinents nobles i els mercaders noruecs també han prosperat amb aquest sistema, ja que actuaven de fet com a intermediaris entre la Corona i el poble; així, el país l'han governat els nobles privilegiats i no pas la cort reial. Tanmateix, potser aquest sistema no és el més favorable per al país, perquè els conflictes lligats a la Corona danesa poden anar en augment, com ha demostrat la recent deposició del rei Eric de Pomerània, ara exiliat a l'illa de §YGotland§!.\n\nPodrien sorgir ocasions de decidir el destí de Noruega, i ja hi ha veus que demanen atendre §Yla crida dels nostres avantpassats§! i fomentar l'§Yhabilitat marinera natural§! dels noruecs."
 string_start_gotland:0 "§YGotland§! és una illa situada al bell mig de la mar Bàltica que va prosperar gràcies al port de Visby, un gran centre comercial de la regió. Les seves lleis mercantils van servir de model a la majoria de ports i vaixells del Bàltic, i les seves famoses muralles van protegir la ciutat dels enemics.\n\nTanmateix, el 1361 la va conquerir §YDinamarca§!, i també la van saquejar els Germans de les Vitualles, uns famosos pirates bàltics, i l'§YOrde Teutònic§!. El 1411, el rei §YEric de Pomerània§!, sobirà de la Unió de Kalmar, va començar a fortificar el castell de Visborg, a l'illa, on finalment es va establir després de ser deposat el 1439.\n\nAquesta situació planteja reptes al rei §YEric§!, però també oportunitats. El nou §Yarxirei de Dinamarca§!, §YCristòfol III§!, vol reconquerir l'illa de Gotland per millorar la seva posició dins la Unió, sempre difícil, alhora que el rei §YEric§! també vol prendre-li l'antiga corona. Tanmateix, se li podria obrir un nou camí: reforçar la seva §Yarmada§! i tornar a centrar el país en les activitats comercials, o fins i tot en d'altres de més dubtoses, seguint l'exemple dels Germans de les Vitualles, ja que alguns han començat a anomenar-lo §YEric el Pirata§!."
 string_start_poland:0 "Quan Ladislau III va caure a la batalla de Varna, §YPolònia§! i §YHongria§! es van quedar sense rei d'un sol cop. Sense ningú al capdavant, ara correspon als nobles del regne designar un nou sobirà. El successor més natural, §YCasimir Jagelló§!, va ser proclamat gran duc de §YLituània§! quatre anys abans. Coronar-lo, però, exigiria arribar a un acord acceptable alhora per a Casimir i per als nobles lituans i polonesos.\n\nDes del 1392, els dos estats han estat units per una sèrie d'acords que volien integrar el Gran Ducat de Lituània i el Regne de Polònia perquè fessin front comú contra els seus enemics: els cavallers dels ordes §YTeutònic§! i §YLivonià§!, els tàtars de l'§YHorda d'Or§! i del Kanat de §YCrimea§!, i els principats §Yrussos§!, encapçalats per §YMoscòvia§! al nord-est. Aquesta cooperació ha permès que tots dos països prosperessin malgrat els seus nombrosos enemics, però integrar la noblesa de dos estats tan diferents no ha estat fàcil. Tant entre la noblesa polonesa com entre la lituana hi ha alguns nobles, els magnats, que controlen dominis immensos i tenen una gran influència política. Aquestes famílies són en certa manera la columna vertebral financera i política dels seus estats, però també són un poder que fins i tot un rei s'ho pensaria dues vegades abans de contrariar.\n\nTot i que bona part de les seves terres estan poc poblades, no hi ha gaire dubte que Polònia i Lituània podrien figurar entre els estats més poderosos d'Europa si tiren endavant la seva integració. Els seus enemics, però, són temibles. A l'extrem sud, l'Imperi §YOtomà§! sembla que ja és a les portes d'Hongria, a punt d'expandir-se riu Danubi amunt. Al nord, l'Orde Teutònic, fortament militaritzat, considera els dos estats el seu principal enemic. Després de la guerra civil lituana es va arribar a un acord precari amb els cavallers, pel qual totes les parts reconeixien tant les fronteres existents com el rei polonès-lituà. Tanmateix, potser el més perillós de tots és el Gran Ducat de Moscòvia, a l'extrem nord-est. Els moscovites estan creant ràpidament un estat fort i expansiu que disputa a Lituània la sobirania sobre els pobles rutens i russos que habiten la major part del Gran Ducat..."
 string_start_teutonic_order:1 "Cridat pel duc Conrad de Masòvia el 1225, l'§YOrde Teutònic§! va conquerir la terra dels antics prussians i els va convertir al cristianisme, mentre que, amb el pas dels segles, les terres prussianes es van anar germanitzant. El 1410, l'§YOrde Teutònic§! va patir una derrota decisiva davant un exèrcit conjunt polonès i lituà a la batalla de Grunwald, que va marcar l'inici de la seva decadència com a entitat política independent. Després es van signar tres tractats amargs —la Primera Pau de Thorn, el Tractat de Melno i la Pau de Brzesc Kujawski—, que van marcar el començament de la seva subordinació a §YPolònia§!.\n\nAquesta situació s'ha agreujat recentment amb la fundació de la §YConfederació Prussiana§! per part de la noblesa i la burgesia de tot el país. La Confederació desafia el poder del Hochmeister, però §YPolònia§! i §YLituània§! també la podrien fer servir per assestar el cop de gràcia al país.\n\nEl governant del país podria trobar nous camins, però sortir d'aquesta situació i revifar l'antic esperit croat requerirà determinació i habilitat. Tot i així, en les dècades vinents es podrien aprofitar altres oportunitats ben diferents, qui sap..."
 string_start_livonian_order:1 "L'Orde dels Germans Livonians de l'Espasa es va fundar a Riga el 1202 amb l'objectiu de cristianitzar Livònia. Malgrat els primers èxits, els Germans de l'Espasa van patir una greu derrota davant els lituans el 1236. Els membres supervivents es van incorporar més tard a l'§YOrde Teutònic§!, que, per mitjà de la seva branca de l'§YOrde Livonià§!, va mantenir l'autoritat sobre aquestes terres de manera semblant.\n\nTanmateix, el seu destí ha anat lligat al dels seus germans d'armes, i les derrotes de Grunwald, el 1410, i de Swieta, el 1435, davant §YPolònia§! i §YLituània§! també han afeblit l'§YOrde Livonià§!. Després d'aquestes desfetes, l'arquebisbe de Riga, els bisbes de Curlàndia, Dorpat, Ösel-Wiek i Reval, representants de l'§YOrde Livonià§! i dels seus vassalls i diputats dels consells municipals de Riga, Reval i Dorpat van formar una nova Confederació Livoniana. El seu objectiu era millorar el govern del país i fer-lo més defensable davant les amenaces estrangeres.\n\nAquesta situació ha portat el Landmeister de l'§YOrde Livonià§! a prendre decisions crucials per al futur de l'orde i per a la manera com es governarà en les dècades vinents."
 string_start_riga:0 "Situada en una posició comercialment avantatjosa, §YRiga§! va gaudir d'una gran riquesa i prosperitat entre els segles XIII i XV, quan formava part de la coneguda §YLliga Hanseàtica§!. Malgrat la seva mida, la ciutat va sobreviure durant molts segles i va acabar esdevenint un centre manufacturer i mercantil per a qualsevol potència que exercís influència sobre el territori del voltant.\n\nAmb els anys, els seus arquebisbes s'han enriquit i s'han guanyat el respecte general, i tenen bona part del poder en la política interna de la Confederació Livoniana, fundada el 1435 com a reacció a la derrota de l'§YOrde Livonià§! a la batalla de Swieta. Aquesta posició obre grans perspectives a l'arquebisbat i a la mateixa ciutat, si aconsegueixen mantenir-se independents de les altres potències estrangeres que miren d'immiscir-se en els seus afers."
 string_start_france:2 "La guerra dels Cent Anys, que ha esquinçat §YFrança§! durant més d'un segle, es troba ara aturada per una treva després d'una sèrie de victòries franceses decisives. Amb el suport de Joana d'Arc, martiritzada després a mans dels §Yanglesos§!, i el de la rica família d'§YAnjou§!, §YCarles VII§! ha recuperat París i bona part de les terres franceses. A més, els ducs de §YBorgonya§! van reconèixer Carles com a rei legítim al tractat d'Arràs, el 1435.\n\nTanmateix, la treva amb Anglaterra és fràgil. Els anglesos encara no han renunciat a les seves pretensions al tron francès, i una de les principals exigències del nou tractat, la cessió de §YMaine§! a França, encara no s'ha fet efectiva mesos després.\n\nTot i que ara els borgonyons donen un suport passiu a la causa francesa en el conflicte amb Anglaterra, continuen sent motiu de preocupació per a la Corona francesa. Han estès els seus dominis molt més enllà de les fronteres de França, cap als Països Baixos i el §YSacre Imperi Romanogermànic§!. Es diu que el duc, que és també un dels homes més rics d'Europa, somia un futur regne que aplegui tots els seus dominis.\n\nEl 1444, el Regne de França viu un moment d'inestabilitat i de canvi, i la sobirania francesa està a mercè dels capricis dels seus súbdits deslleials. Al nord tenim els anglesos, que volen afegir la corona francesa a la seva col·lecció, i a l'est, la rebel casa de Borgonya, que gosaria reclamar el tron per a si mateixa. Abans que els francesos puguin ni tan sols pensar a expandir el seu imperi, primer han d'assegurar-se la lleialtat dels súbdits, integrar-los en un estat centralitzat i treure de les seves fronteres els maleïts anglesos i els regnes pretendents de Borgonya. França té la llibertat d'emprendre viatges d'exploració, de dur a terme una política exterior activa a Alemanya i als Països Baixos o fins i tot d'atacar les riques ciutats del nord d'Itàlia, on la influència imperial fa segles que minva."
 string_start_austria:0 "El 1438, la dinastia dels §YHabsburg§! havia assolit algunes de les posicions més influents de l'Europa central. Albert el Magnànim va aconseguir reclamar no només el ducat d'§YÀustria§!, sinó també els regnes d'§YHongria§! i de §YBohèmia§!, a més del prestigiós títol de «rei electe d'Alemanya», reservat a qui estava a punt de ser proclamat §Yemperador§! del §YSacre Imperi Romanogermànic§!. Però la desgràcia es va acarnissar amb ell: Albert va morir de disenteria el 1439, durant la campanya contra els turcs, i només va deixar com a successor el seu fill encara no nascut, Ladislau el Pòstum.\n\nAl petit Ladislau li costaria molt reclamar la seva herència, i després d'una breu guerra civil va perdre el tron d'Hongria a mans del rei §Ypolonès§! Ladislau. El Regne de Bohèmia, en canvi, encara està dividit sobre la qüestió. Dècades de guerres civils religioses han deixat el país assolat, i algunes zones encara són dominades per poderosos nobles hussites, heretges a ulls de la fe catòlica.\nNomés a Àustria, la terra originària dels Habsburg, Ladislau ha estat acceptat, tot i que ara hi governa com a regent el seu oncle §YFrederic§!.\n\nAmb la catàstrofe de Varna, el tron hongarès torna a estar vacant, i els partidaris dels Habsburg confien a recuperar-lo per a Ladislau. Els grups poderosos que ja van deposar una vegada el rei infant no semblen disposats a acceptar-lo una segona vegada. Ben bé podrien deixar-se guiar pel seu dinàmic regent hongarès, Joan Hunyadi.\n\nEl somni d'un emperador Habsburg no es va perdre amb Albert. Després de la seva mort, Frederic, el regent austríac, va ser elegit per dirigir el Sacre Imperi Romanogermànic. Com a primer de la seva família a seure al tron imperial, Frederic deixarà un llegat als futurs Habsburg. Si opten per seguir la seva prudent política de matrimonis diplomàtics i de planificació pacient de les herències, els Habsburg podrien arribar a construir una posició de poder sense parió entre les famílies reials d'Europa. Les responsabilitats del govern imperial ja són per si mateixes un gran obstacle. Un emperador ha de mantenir la pau dins l'imperi, combatre heretgies com la dels hussites i, costi el que costi, protegir la cristiandat dels exèrcits dels §Yotomans§!, que no paren d'avançar i davant els quals els Habsburg ja han perdut un rei."
 string_start_castile:0 "Forjada en les batalles de la Reconquesta, la Corona de §YCastella§! no és en realitat un sol regne, sinó la unió dels regnes de Castella, Lleó, Toledo, Galícia, Múrcia, Jaén, Còrdova i Sevilla sota la branca castellana de la dinastia §YTrastàmara§!. El que queda de la presència mora a la península Ibèrica es limita ara al regne meridional de §YGranada§!, encara un ric soldanat musulmà en molts aspectes, però també minat per les lluites internes i les freqüents escaramusses fronteres amb incursors cristians. Envoltat per tots costats de castells castellans, sembla que només és qüestió de temps que la Reconquesta arribi a la seva conclusió lògica i que el regne sigui annexionat.\n\nDe moment, però, Castella té els seus propis problemes. Els nobles castellans i les Corts locals dels diversos regnes que la formen encara tenen molt de poder, i molts reis de la casa de Trastàmara s'han trobat a mercè dels estaments dels seus regnes. En el passat, hi ha hagut faccions que, actuant només en interès propi, no han dubtat a donar suport a pretendents estrangers de §YPortugal§! i d'§YAragó§!.\n\nSi un governant fort aconsegueix unir el regne i completar la Reconquesta, Castella tindrà a les mans una força militar temible, amb una llarga tradició de lluita per l'expansió de la fe cristiana. Tot i que Castella no té la tradició marinera del veí Portugal, té el mateix accés a l'oceà Atlàntic i a les noves rutes comercials que s'obren cap a l'oest i el sud-est."
 string_start_aragon:0 "La Corona d'§YAragó§! va esdevenir una gran potència a partir d'uns orígens humils com a simple comtat pirinenc. Després d'independitzar-se del Regne de §YNavarra§!, avui molt reduït, Aragó es va unir al comtat de §YBarcelona§!. Els seus monarques van participar amb entusiasme en la Reconquesta, la campanya de conquesta contra els estats musulmans de la §Ypenínsula Ibèrica§!, que va permetre a Aragó estendre's cap al sud fins als seus límits actuals i incorporar el Regne de §YValència§! a la Corona composta.\n\nEls destins d'Aragó i de Navarra tornen a estar lligats: el rei de Navarra és també l'hereu del tron aragonès. Si el §Yrei Joan§! aconsegueix sobreviure al seu germà gran, §YAlfons V§!, i alhora preservar la independència de Navarra, les dues nacions quedaran unides en unió personal sota un sol monarca.\n\nPel que fa a les unions dinàstiques, el Regne de §YNàpols§!, al sud d'Itàlia, també depèn de la Corona d'Aragó. Aragó governa §YSicília§! directament, però Nàpols encara no s'ha integrat del tot a la Corona des que el rei Alfons va conquerir el regne el 1442. L'antic rei de Nàpols, §YRenat d'Anjou§!, ha fugit a la §YProvença§!, des d'on continua defensant les seves pretensions no només sobre Nàpols, sinó també sobre el mateix Aragó i sobre §YJerusalem§!.\n\nLa relació d'Aragó amb la seva poderosa veïna, §YCastella§!, és difícil de definir. Tot i que totes dues comparteixen dinastia, la casa de §YTrastàmara§!, enfrontada per disputes internes, rarament està en pau amb si mateixa. De vegades sembla que la pau és possible i que les dues corones es podrien unir en una de sola; d'altres, sembla que els regnes estan destinats a lluitar eternament com a rivals acèrrims.\n\nMés enllà de les qüestions dinàstiques, Aragó és una nació profundament interessada a dominar el comerç de la Mediterrània. El §YConsolat de Mar§! aspira a regular i administrar tot el comerç de la regió, mentre que els mercaders catalans i valencians competeixen amb els de §YGènova§! i de la §YToscana§! pel control dels beneficis. Aragó també té posada la mirada en l'esquiu comerç de la §Yseda§!. A Europa se'n produeix a València i a Itàlia, però la seda oriental continua sent la més preuada; els seus secrets estan molt ben guardats, però ara semblen a l'abast."
 string_start_brandenburg:0 "La història recent de la Marca de §YBrandenburg§! ha estat ben trista. Amb sòls pobres, aiguamolls i boscos salvatges, Brandenburg no és pas la terra més rica del §YSacre Imperi Romanogermànic§!, i sota el domini dels §YWittelsbach§! i dels §YLuxemburg§! la regió es va tractar com una font d'ingressos ràpids. Amb l'ascens de la dinastia §YHohenzollern§!, les coses han començat a canviar a poc a poc. Frederic I va passar tot el seu regnat afeblint la influència dels estaments de Brandenburg i combatent la impunitat generalitzada, i va enviar els seus exèrcits contra els castells dels nombrosos barons lladres que durant molt de temps havien campat lliurement per la regió.\n\nEn molts sentits, §YFrederic II§!, «el de Ferro», ha demostrat ser digne fill del seu pare: ha reprès la política destinada a esclafar el poder dels potentats locals i dels burgesos cobdiciosos. També ha començat a tantejar l'§YOrde Teutònic§! per recuperar §YNeumark§!, una terra que originàriament formava part de Brandenburg, però que els seus predecessors havien empenyorat.\n\nLa dificultat d'imposar el poder de l'estat queda ben palesa als regnes de la Unió de Kalmar, §YDinamarca§!, §YSuècia§! i §YNoruega§!, on fa poc un rei que perseguia objectius semblants va ser deposat i substituït per un Wittelsbach bavarès. Si Brandenburg ha d'esdevenir un estat durador, també ha de mantenir-se unit i evitar disputes com les dels hereus dels §YWettin§! a l'electorat de §YSaxònia§!, al sud.\n\nEls regnes veïns de §YPolònia§! i §YBohèmia§! estan tots dos sense sobirà el 1444: el primer, com a conseqüència directa de la fallida croada de Varna contra els otomans, i el segon, perquè la noblesa bohèmia va rebutjar l'hereu dels Habsburg, Ladislau el Pòstum. Tot i que les terres bohèmies encara no s'han refet de les guerres hussites de les darreres dècades, els heretges hussites continuen tenint un gran pes en la política bohèmia, cosa que fa del regne un motiu de preocupació per a tots els seus veïns, inclòs Brandenburg."
 string_start_burgundy:1 "La branca de §YBorgonya§! de la dinastia §YValois§! no només governa el ducat de §YBorgonya§!, de iure una possessió francesa, sinó també una part considerable dels §YPaïsos Baixos§!, el §YVermandois§! i el comtat de §YNevers§!. En poc temps han creat un domini que s'estén per algunes de les zones més riques de §YFrança§! i del §YSacre Imperi Romanogermànic§!. Tot plegat, els ducs de Borgonya disposen d'una riquesa enorme. §YFelip III§!, el Bo, ha fet servir aquests recursos per estendre encara més la influència de la seva família, i ha anat adquirint títol rere títol al llarg del Mosa i del Rin per intentar unir els seus dominis.\n\nMentre França passava l'últim segle esquinçada per la llarga disputa entre pretendents §Yanglesos§! i francesos al tron francès, Borgonya s'ha convertit en el centre cultural i econòmic de l'Europa occidental. Enlloc com a Borgonya no són tan vius els ideals cavallerescos de la baixa edat mitjana, amb grans torneigs, festins fastuosos i, és clar, el mateix Orde del Toisó d'Or, un orde de cavalleria creat pel duc que aspira a recrear la cavalleria de les llegendes artúriques o dels mites grecs. La cort borgonyona també marca la moda i l'art, i s'hi gasten fortunes en seda, pintures i meravellosos manuscrits il·luminats.\n\nEl ducat de Borgonya ja rivalitza amb molts regnes en influència, ingressos i fins i tot poder militar. Fent servir anglesos i francesos els uns contra els altres, els ducs han estat pràcticament independents durant molt de temps. De iure, però, continuen sent alhora vassalls de França i del Sacre Imperi Romanogermànic. Ara que la guerra dels Cent Anys sembla que s'acosta al final, el futur del ducat és incert. Si continua el seu ascens fulgurant, Borgonya podria ser l'embrió d'un nou regne: un estat fort al cor de l'Europa occidental. Però en aquest breu temps els ducs també s'han guanyat molts enemics. Si Felip i els seus successors juguen bé les seves cartes, potser els espera una corona, però per aconseguir-la hauran de córrer riscos que ben bé podrien costar-los-ho tot i reduir el seu gloriós domini a una nota a peu de pàgina en els annals de la història."
 string_start_england:0 "Des del 1337, el conflicte sobre qui és el rei legítim de §YFrança§! fa més de cent anys que assola França i §YAnglaterra§!. Els anglesos conserven el control de §YNormandia§! i de la §YGuiena§!, mentre que §YCarles VII§!, a París, té el suport de la major part de la noblesa regional francesa.\n\nAmb el tractat de Tours, signat al maig, les famílies §YLancaster§!, anglesa, i §YValois§!, francesa, sembla que han bescanviat territori per pau. Entre les seves clàusules hi ha el lliurament del comtat de §YMaine§!, un punt que mai no es va consultar amb el Parlament anglès i que probablement indignarà nobles i plebeus per igual a l'altra banda del canal. La por a la reacció popular ha fet que fins ara aquest lliurament s'hagi endarrerit durant mesos, i a la cort francesa cada cop es posa més en dubte la paraula dels negociadors anglesos.\n\nAnglaterra mateixa es troba en una situació precària. Rei des que tenia nou mesos, §YEnric VI§! ja és gran i ha assumit la corona i el govern efectiu del regne. Tanmateix, fins i tot d'adult, Enric no sembla gaire disposat a governar, i n'hi ha que diuen que viu preocupantment desconnectat de la realitat. En lloc seu, nobles intrigants del regne han passat a dominar el govern d'Enric, s'han fet amb el poder i es posicionen de cara a una futura successió. Aquestes disputes podrien minar greument l'estabilitat interna del regne, sobretot si es reprenen les hostilitats a França.\n\nAmb els anglesos ocupats en afers continentals i interns, el domini sobre §YIrlanda§! s'ha reduït a una estreta franja costanera coneguda com «el Pale», i tant els senyors gaèlics com els hibernonormands actuen amb total independència de la Corona anglesa. A l'illa ja gairebé no queden tropes angleses, per a satisfacció dels irlandesos. Tanmateix, si els afers de Londres i de París s'acaben resolent, els senyors irlandesos probablement passaran a ser una prioritat molt més gran."
 string_start_ottomans:0 "El [GetYear], els §Yotomans§! són una potència regional que està consolidant el seu control sobre Anatòlia i els Balcans. A l'est, el domini otomà s'ha restablert després de la invasió §Ytimúrida§!, però diversos beilicats continuen sent independents. Aquests beis maniobren per fer-se un lloc entre el poder creixent dels otomans, d'una banda, i el Soldanat §YMameluc§! d'Egipte i Síria, encara l'estat més poderós de l'Orient Mitjà, de l'altra.\n\nA Europa, els otomans han derrotat els croats a la batalla de Varna, on va morir Ladislau, rei §Ypolonès§! i §Yhongarès§!. §YBizanci§! ha quedat exposat i §YHongria§! s'ha vist obligada a posar-se a la defensiva, però amb la fortalesa de §YBelgrad§! encara és un baluard sòlid contra l'expansió otomana. Els prínceps menors que hi ha entremig només poden sobreviure enfrontant les grans potències entre elles. Més al sud, §YSkanderbeg§! encapçala la revolta d'§YAlbània§! contra els otomans, amb el suport de §YVenècia§!, que encara domina els mars.\n\nEl [GetYear], el domini de la dinastia otomana encara no és un estat centralitzat. L'autoritat del soldà només s'imposa a través del seu petit cos de servidors, reclutats entre els esclaus capturats a la guerra i mitjançant el «devshirme», la lleva periòdica de joves cristians del camp balcànic. Són els famosos §Ygenísers§!, que amb el temps esdevindran un poderós exèrcit permanent. Els otomans han arribat al poder amb el suport militar de nombrosos senyors de les marques, encara molt autònoms a la frontera balcànica, mentre que l'administració és en mans de l'aristocràcia turca, versada en l'art de governar però en gran part independent de l'autoritat del soldà.\n\nTot això està a punt de canviar. Després de derrotar els exèrcits croats, el vell soldà Murat II torna ara a les seves terres de Manisa i deixa el govern en mans del jove §YMehmet II§!. Serà ell qui transformarà l'estat otomà en un imperi: conquerirà Constantinoble per fer-ne la capital imperial i establirà una administració centralitzada per posar fre als senyors de les marques i a les antigues famílies turques. Per al «Gran Turc» no hi pot haver cap compromís: la casa d'Osman ha de ser l'autoritat suprema del país. L'única pregunta és aquesta: cap on giraran primer els seus exèrcits?"
 string_start_portugal:0 "Amb la Reconquesta gairebé acabada i la península Ibèrica gairebé del tot en mans cristianes, el regne de §YPortugal§! ha girat la mirada cap a les costes d'Àfrica. Amb la conquesta de §YCeuta§! el 1415, el fundador de la dinastia d'§YAvís§!, Joan I, ja va fer les primeres incursions a la terra dels moros, una política que el seu nét, el jove §YAlfons V§!, continuarà tan bé com sàpiga. Tanmateix, serà gràcies a l'obra de l'oncle d'Alfons, l'infant Enric, conegut com Enric el Navegant, que Portugal deixarà la seva empremta en el món.\n\nSota la direcció d'Enric, Portugal ha fet grans avenços en la construcció naval i la navegació, i ha enviat expedicions molt més enllà del cap Bojador, al sud. A la recerca d'or, d'espècies i potser del llegendari regne del Preste Joan, els mariners portuguesos estan a punt d'emprendre viatges per tot el globus. Aspiren a arribar a nous continents a l'oest, i també a l'§YÍndia§!, a §YIndonèsia§! i fins i tot a la §YXina§! i al §YJapó§!, a l'est. De fet, potser algun dia els mariners portuguesos faran la volta al món.\n\nEl [GetYear], Alfons encara és menor d'edat, i el govern diari del regne està en mans d'un altre oncle, l'infant Pere, duc de Coimbra. La regència de Pere ha hagut de bregar amb la dificultat de controlar la poderosa noblesa portuguesa de la cort, però fins ara el duc ha sabut enfortir el poder reial a costa seva. A mesura que Alfons es faci gran, però, altres forces de la cort intentaran controlar-lo amb l'esperança de fer servir el jove rei per als seus propis designis.\n\nTot i que Castella ha tingut una sèrie de governants febles i de nobles poderosos, els castellans poden ser una amenaça seriosa per als portuguesos. Per això la casa reial d'Avís ha seguit una política d'enllaços matrimonials amb la família reial castellana, amb l'esperança d'assegurar una amistat duradora i potser reforçar futures pretensions portugueses al tron de Castella."
 string_start_hisn_kayfa:1 "La dinastia §Yaiúbida§!, que antany havia estat el flagell de la cristiandat i senyora de Síria, Egipte i Aràbia, avui no és més que una ombra del que va ser. La va fundar el §Y1174§! el poderós §YSaladí§!, que abans havia servit els §Yfatimites§!. Gràcies a la seva destresa i al seu geni, va ascendir ràpidament dins del califat fatimita, cosa que li va permetre començar a soscavar l'autoritat fatimita des de dins. Com a musulmà §Ysunnita§!, va retornar l'Egipte fatimita, fins aleshores §Yxiïta§!, a la branca sunnita i va transferir l'autoritat del califa als §Yabbàssides§!.\n\nA partir d'aquí va emprendre una campanya de consolidació que el va dur a conquerir vastes regions de l'Orient Mitjà. Un cop consolidat el Màixriq, Saladí es va girar cap als §Yestats croats§!, que ocupaven parts del §YLlevant§!. El §Y1187§!, Saladí va esclafar les forces croades a la §Ybatalla de Hattin§!, cosa que li va permetre prendre la Ciutat Santa de §YJerusalem§!. El regnat de Saladí es va considerar àmpliament una edat d'or; els seus successors, però, no van saber estar a l'altura del seu llegat.\n\nPocs decennis després de la mort de Saladí, la ràpida successió de governants incompetents i els conflictes interns van malmetre irreversiblement el soldanat. El §Y1250§!, els aiúbides van ser enderrocats pels seus propis generals §Ymamelucs§!, cosa que va posar fi de fet al domini aiúbida d'Egipte. Els §Ymongols§! van devastar el romanent sirià del soldanat el §Y1260§!, i els exèrcits mamelucs que els van rebutjar han mantingut el control de la regió i han expulsat les restes dels aiúbides al seu darrer bastió, §YHisn Kayfa§!.\n\nFerotgement independent, aquest petit estat ha aconseguit sobreviure entre gegants com els §Ytimúrides§! o els §YQara Qoyunlu§!. En començar el [GetYear], els prínceps aiúbides acaben de vèncer els seus rivals locals i antics vassalls, els artúquides, i han consolidat el seu domini sobre el seu petit principat a la vora del Tigris. Si volen retornar a la dinastia el poder i la glòria d'antany, els aiúbides tenen un camí molt llarg i difícil al davant."
 string_start_mamluks_history:0 "Antiga elit dels exèrcits aiúbides, el 1250 els §Ymamelucs§! van passar de ser esclaus al servei d'altri a senyors d'un regne situat al cor mateix del món islàmic. Des de la seva capital, el Caire, les cases mameluques controlen Egipte i Síria, i també el mateix califa abbàssida. Al nord, la influència mameluca es fa sentir des dels beilicats d'Anatòlia fins a les ribes del llac Van. Al sud, actuen com a protectors de les ciutats santes de la §YMeca§! i §YMedina§!, al §YHijaz§!, i també influeixen en la política del §YIemen§!. Fins i tot l'imperi cristià d'§YEtiòpia§! ha d'estar atent a la paraula del soldà mameluc, ja que el papa copte, que ordena tots els bisbes etíops, és sota la protecció mameluca.\n\nEls emirs mamelucs renoven les seves files comprant nous mamelucs, esclaus estrangers majoritàriament d'origen circassià. Aquests esclaus es formen com a soldats o administradors, i tots juren lleialtat al seu comprador, o «pare adoptiu». Al seu torn, els emirs posen la seva casa al servei dels soldans. Quan arriba l'hora de la successió, a la pràctica és la voluntat d'aquests homes poderosos la que determina quin emir serà el pròxim soldà. Aquest sistema garanteix que al soldanat no li faltin mai guerrers d'elit, mentre la ruta per importar més esclaus des de la mar Negra continuï oberta. Tanmateix, com a sistema de govern, més d'una vegada ha provocat conflictes perjudicials i un faccionalisme paralitzant.\n\nAra bé, el futur sembla prometedor per al Soldanat Mameluc, ja que la mort de Tamerlà ha eliminat la principal amenaça de la regió, i l'Imperi §YTimúrida§!, abans tan extens, ha quedat reduït a uns quants estats successors enfrontats entre si a §YPèrsia§! i a la §YTransoxiana§!. El buit que aquest imperi ha deixat a Anatòlia, al Caucas i a l'Iraq l'han omplert la federació §YQara Qoyunlu§!, a l'est, i el renascut Imperi §YOtomà§!, a l'oest. Tots dos semblen destinats a entrar en conflicte amb els mamelucs en un futur proper.\n\nLa riquesa del soldanat s'alimenta del comerç que travessa les seves terres egípcies i que salva la distància entre la Mediterrània i el mar Roig. Això exigeix molt a les flotes mameluques, que han de combatre els pirates cristians al nord i protegir els enormes i vulnerables vaixells que, carregats de teixits i espècies, ressegueixen la costa de l'Hijaz pel mar Roig.\n\nQuan el [GetYear] s'acosta al final, el Soldanat Mameluc continua sent l'estat més gran, més ric i més poderós de l'Orient Mitjà. Té molts enemics, però en tem pocs."
 string_start_muscovy:0 "A finals del [GetYear], §YRússia§! està dividida en diversos principats, que durant molt de temps han viscut a l'ombra de la tàrtara §YHorda d'Or§!. Els tàtars han estat sempre presents en la política russa: recapten tributs i impostos i fan i desfan prínceps als estats cristians. Tot i que el Gran Principat de Moscòvia no és el més antic d'aquests estats, recentment s'ha convertit en el més fort. Situada a l'Opolie, una terra relativament fèrtil, Moscòvia té una economia interna més sòlida que molts altres principats. I, encara més important, els seus prínceps han actuat sovint com a recaptadors per als kans de l'Horda d'Or, cosa que els ha permès estar relativament segurs i enriquir-se.\n\nDes de la derrota aclaparadora de l'Horda d'Or davant els exèrcits §Ytimúrides§!, el seu imperi s'ha fragmentat en diversos estats successors. El nucli de l'imperi, la §YGran Horda§!, continua sent una potència considerable per si mateixa, però està minada per lluites internes i no ha pogut imposar gaire el seu poder als russos.\n\nMoscòvia ha sabut aprofitar aquest buit de poder i ha estès ràpidament el seu control sobre els altres principats, tant amb astúcia com amb la força de les armes. Sovint, fins i tot, simplement comprant els prínceps més pobres i afegint-ne les terres als dominis moscovites.\n\nMoscou, però, no és l'únic estat poderós amb interessos a la regió russa: al nord, la República de §YNóvgorod§! ha colonitzat bona part de la costa del mar Blanc i s'ha assegurat unes vies fluvials valuoses i una font de pells, l'or tou del nord i de l'est.\n\nA l'oest, el Gran Ducat de §YLituània§! i el Regne de §YPolònia§! fan tot el que poden per assumir la direcció de totes les Rússies: imposen la seva autoritat sobre la major part de les terres rutenes i són un factor constant en la política dels estats russos lliures del nord. Els seus interessos s'oposen frontalment al poder creixent de Moscou, però les seves pretensions al llegat de la Rus són força dubtoses. Si se'ls pot vèncer, sembla que no hi ha límit al creixement del Gran Principat.\n\nI si el jou tàtar es pogués trencar d'una vegada per sempre, també hi ha la immensa extensió de §YSibèria§!, plena de riqueses incalculables, i de perills. Si es poden superar els nombrosos kanats, els indígenes i la mateixa natura, no hi ha límit a la riquesa que podria assolir un estat rus unificat."
 string_start_georgia:1 "El [GetYear], el Regne de §YGeòrgia§! es troba en una situació desesperada. El regne encara es manté dret després de les guerres contra els §Ytimúrides§! i els §YQara Qoyunlu§!, però està esgotat i esquinçat per conflictes interns.\n\nAmb l'esperança de reduir el poder disgregador dels nobles regionals, Alexandre I de Geòrgia va abdicar el 1442 i va fer els seus fills cogovernants de les diverses parts del regne. D'aquesta manera va assegurar la posició de la dinastia §YBagrationi§!, però a la pràctica aquesta decisió no va trigar gaire a accelerar la decadència del regne.\n\nMentre els §Yotomans§! esclafen els croats a Varna, §YGeòrgia§! és a punt d'ensorrar-se, i només un lideratge fort li permetria sortir de la crisi."
 string_start_yemen:0 "«Aràbia Feliç», el regne del §YIemen§!, està esquinçat per una guerra civil. La vella dinastia §Yrasúlida§! encara regna a Taiz, però a la meitat oriental del regne els seus antics vassalls §Ytahirides§! han començat a forjar-se un estat propi.\n\nA les terres altes, de població majoritàriament xiïta, els poderosos imams §Yrassides§! són també una alternativa creïble per governar el Iemen, sempre que aconsegueixin resoldre les seves pròpies lluites successòries.\n\nAl nord, els §Ymamelucs§! estrenyen el control sobre els xarifats de la §YMeca§! i de §YMedina§!, al Hijaz. Quan tinguin aquests estats ben subjectes, bé podria ser que fossin els mamelucs qui posessin fi a les lluites intestines del Iemen. Anhelen fer-se amb els valuosos ports iemenites de Moca, Aden i Zabid, i no dubtarien a intervenir-hi."
 string_start_aq_qoyunlu:0 "Els §YAq Qoyunlu§!, o Xais Blancs, fan remuntar el seu llinatge a Bayandor Khan, cabdill d'una de les vint-i-quatre tribus oghuz i nét del mateix Oghuz Kagan, i tenen un gran llegat que honorar. Quan §YTamerlà§! va arrasar la regió fa unes quantes dècades, va concedir als Xais Blancs la fortalesa d'Amid, o Diyarbakir, i en va desplaçar els seus vells rivals, els §YQara Qoyunlu§!, o Xais Negres.\n\nDesprés de la mort de Tamerlà, el 1405, els Xais Blancs s'han forjat un domini a les muntanyes kurdes del voltant de Diyarbakir i han estès el seu poder des d'Erzurum, al nord, fins a Raqqa, a l'Alta Mesopotàmia, al sud. Ara mateix, diversos prínceps aq qoyunlu es disputen la supremacia sobre la federació, mentre que els Qara Qoyunlu, units sota Jahan Xah, han aconseguit apropiar-se de la major part del llegat de Tamerlà, de l'Iraq a l'Azerbaidjan.\n\nSi els Aq Qoyunlu no es tornen a unir sota un líder fort, aviat podrien acabar convertits en clients del creixent imperi dels Qara Qoyunlu, envaïts pel §YSoldanat Mameluc§! de Síria i Egipte o atacats pel ressorgent §YImperi Otomà§!.\n\nUnificar i engrandir els Aq Qoyunlu requerirà algú de gran ambició i gran talent; algú, potser, com el jove príncep §YUzun Hasan§!."
 string_start_qara_qoyunlu:0 "L'origen dels §YQara Qoyunlu§!, o Xais Negres, és força incert, tot i que la seva pròpia tradició els fa descendents dels grans kans oghuz del passat. Fa més d'un segle que els Xais Negres intenten forjar-se un imperi a l'Azerbaidjan i a l'Iraq. Com moltes altres potències de la zona, van ser aixafats pel senyor de la guerra centreasiàtic Tamerlà, que va escombrar la regió des de l'Iran fins a Anatòlia i va apartar tothom qui gosés oposar-s'hi.\n\nTamerlà ja és mort, i el seu fill, §YXah Rukh§!, s'ha passat la vida intentant mantenir unit l'imperi §Ytimúrida§! del seu pare. Això ha permès als Qara Qoyunlu tornar a alçar-se i, sota §YJahan Xah§!, un dels governants més grans de l'època, no només han recuperat Tabriz, sinó totes les terres que van de les fronteres de §YGeòrgia§! fins als aiguamolls del Xatt al-Arab, al sud de l'Iraq.\n\nA l'oest, els §YAq Qoyunlu§!, o Xais Blancs, són els rivals tradicionals dels Qara Qoyunlu i amb el temps podrien resultar un enemic digne. De moment, però, l'§YImperi Otomà§!, a Anatòlia, i els §Ymamelucs§!, a Egipte, són veïns més perillosos.\n\nA finals del [GetYear], l'Imperi Timúrida continua sent una amenaça constant a l'est, però diuen que l'envellit Xah Rukh ha emmalaltit i ha perdut el vigor. D'est a oest, els seus fills i néts es preparen per a una guerra de successió que sembla gairebé segura. De fet, la notícia de la malaltia ha bastat perquè Muhammad bin Baysonqor, a §YAjam§!, trenqués els lligams amb el seu avi.\n\nEn la seva set de glòria, el jove príncep sembla aliè a l'amenaça que representen Jahan Xah i els Xais Negres..."
 string_start_timurids:3 "[Root.Monarch.GetName] és el sobirà suprem de l'Imperi §Ytimúrida§! i fill del gran conqueridor Tamerlà.\nTanmateix, moltes coses han canviat des de la mort del Gran Emir, i el seu imperi, que en altre temps s'estenia d'§YAnatòlia§! a §YDelhi§!, ja no és el que era.\n\n§YXah Rukh§! ha aconseguit mantenir unida la major part de l'imperi de Tamerlà i ha patrocinat un pròsper centre de saber i de les arts a Herat, la perla del §YKhorasan§!, però el seu regnat s'acosta a la fi i l'envellit governant ha emmalaltit durant l'últim any. A les províncies perifèriques, fills i néts observen la cort d'Herat amb gran interès.\n\n§YAjam§!, sota §YMuhammad bin Baysonqor§!, ja és independent de ple dret. Al Khorasan, el seu germà §YBabur§! s'ha creat una petita base de poder, sens dubte amb l'únic objectiu de tenir un punt de suport en les lluites successòries que s'acosten. La §YTransoxiana§! i Samarcanda, l'antiga capital del mateix Tamerlà, han quedat en les hàbils mans d'§YUlugh Beg§!, fill del nostre governant i gran mecenes de les ciències i les arts, mentre que §YFars§! és en mans d'un príncep de la dinastia d'onze anys. Els governadors de les províncies només són una part dels problemes que es couen. La política interna de l'imperi està plena de lluites de poder entre els diferents prínceps i membres de la família timúrida. Entre les figures més influents hi ha l'esposa principal de Xah Rukh, §YGawhar Shad§!, que té un poder immens a la cort i que sens dubte el farà servir per posar al tron el seu nét preferit, Ala al-Dawla. Una altra figura a tenir en compte és §YMuhammad Juki§!, governador de Balkh, que s'ha guanyat un gran renom i que segurament aspirarà al títol d'emperador.\n\nMentrestant, la federació dels §YQara Qoyunlu§! s'ha apoderat de bona part de les regions occidentals de l'imperi original de Tamerlà i, al sud de l'Iraq, els mil·lenaristes §Ymushasha§! han conquerit el Khuzestan i n'han expulsat els administradors timúrides. Els §Yuzbeks§! assalten contínuament els nostres dominis de la Transoxiana, i els nostres governadors a l'Índia han estat expulsats de Delhi.\n\nTota aquesta tensió esclatarà mentre el tresor de la nació es ressent de les generoses concessions de soyurghal i el país viu un lent procés de persianització que l'allunya de les antigues lleis mongoles de la Yasa, que encara regeixen l'imperi. Ara que el [GetYear] s'acaba, el destí de l'imperi sembla incert. Si Xah Rukh es recupera, encara podria regnar uns quants anys, però la tensió es pot tallar amb un ganivet. Tots els fills i néts han esperat tota la vida el moment de la mort de l'emperador…"
 string_start_khorasan:0 "[Root.Monarch.GetName] governa §Y[Root.GetName]§! des d'Astarabad com a governador del sobirà §Ytimúrida§! §YXah Rukh§!. El nostre governant és nét de Xah Rukh i aspirant al gran Imperi Timúrida, que en altre temps s'estenia d'§YAnatòlia§! a §YDelhi§!.\n\nXah Rukh, però, és vell, i el ferm control que tenia sobre tots els afers de l'imperi ja forma part del passat.\n\nA §YAjam§!, el seu nét i germà del nostre governant, Muhammad bin Baysonqor, és independent a tots els efectes. A la §YTransoxiana§!, el seu oncle, Ulugh Beg, s'ha creat una sòlida base de poder.\nI, tot i que §YFars§! és governat pel príncep infant Abdallah bin Ibrahim, els seus drets són tan legítims com els dels seus cosins.\n\nMentrestant, la federació dels §YQara Qoyunlu§! s'ha apoderat de l'Iraq i de bona part de les regions occidentals de l'imperi original de Tamerlà i, al sud de l'Iraq, els mil·lenaristes §Ymushasha§! han conquerit el Khuzestan i n'han expulsat els administradors timúrides.\n\nAra que el [GetYear] s'acaba, el destí de l'imperi sembla incert. Si Xah Rukh es recupera, encara podria regnar uns quants anys, però la tensió es pot tallar amb un ganivet: tots els fills i néts han esperat tota la vida el moment de la mort de l'emperador…"
 string_start_transoxiana:0 "§Y[Root.Monarch.GetName]§! governa §Y[Root.GetName]§! des de Samarcanda, la gran capital del seu avi Tamerlà, el conqueridor que va construir un imperi des d'§YAnatòlia§! fins a §YDelhi§!. §YXah Rukh§!, el nostre sobirà i pare del nostre governant, [Root.Monarch.GetName], regeix l'imperi del seu pare des d'Herat, al sud, com a autoritat suprema sobre la Transoxiana i tots els altres dominis timúrides.\n\nEl regnat de Xah Rukh s'acosta a la fi, però, i l'envellit governant ha emmalaltit durant l'últim any. A les províncies, els seus fills i néts observen la cort d'Herat amb gran interès. §YAjam§!, sota Muhammad bin Baysonqor, ja és independent a tots els efectes. A Astarabad, al §YKhorasan§!, el seu germà Babur s'ha creat una petita base de poder, sens dubte amb l'únic objectiu de tenir un punt de suport en les lluites successòries que s'acosten.\n\nL'§YAfganistan§! és governat per un nét de menys rang, mentre que §YFars§! és en mans d'un príncep de la dinastia de dotze anys.\n\nMentrestant, al nord, els §Yuzbeks§! s'ho miren amb interès i esperen el dia que ens debiliti la inevitable lluita successòria. A l'oest, altres enemics de l'imperi, com els §YQara Qoyunlu§! i els mil·lenaristes §Ymushasha§!, han penetrat profundament en el que abans eren els dominis de Tamerlà.\n\nAra que el [GetYear] s'acaba, el destí de l'imperi sembla incert. Si Xah Rukh es recupera, encara podria regnar uns quants anys, però la tensió es pot tallar amb un ganivet: tots els fills i néts han esperat tota la vida el moment de la mort de l'emperador…"
 string_start_delhi:0 "Fundat per la dinastia turca dels §Ymamelucs§! el 1206, el Soldanat de §YDelhi§! va néixer com una potència regional de la plana indogangètica. Sota la dinastia §YTughlaq§! es va convertir en el més gran imperi indi que el món havia vist des dels Gupta, i s'estenia del §YSindh§! a §YBengala§! i del §YCaixmir§! fins a la §YCosta de Coromandel§!.\n\nL'imperi dels Tughlaq es va enfonsar tan de pressa com havia pujat. Tot i ser un estat musulmà que governa molts milions d'hindús, la seva caiguda no va ser obra de cap resistència popular hindú, sinó de generals musulmans ambiciosos. El 1347 es va perdre tot el sud de l'§YÍndia§! amb la revolta del general Ala-ud-Din Hasan Bahman Xah, que es va proclamar governant del nou §YSoldanat Bahmani§!.\n\nMés recentment, el soldanat va patir un cop catastròfic quan els governadors §Ysharqis§! de §YJaunpur§! es van independitzar, el 1394, i es van endur una gran extensió de la plana indogangètica, de manera que la influència del soldanat a penes va més enllà de les muralles de la ciutat. Mahmud Xah, soldà de Jaunpur, mira els seus veïns amb cobdícia: no només té posats els ulls en el tron de Delhi, sinó també en el veí Soldanat de Bengala i en el regne §Ygajapati§! d'§YOrissa§!. Les ambicions del soldà amenacen d'engolir tot el nord de l'Índia.\n\nL'últim clau del taüt dels Tughlaq va ser la brutal invasió §Ytimúrida§! del 1398. El temible senyor de la guerra no tenia cap intenció d'emprendre la conquesta de l'Índia: el que va fer va ser llançar els seus exèrcits a saquejar, cremar i massacrar tot el que trobaven al seu pas. Enmig del caos, la dinastia Tughlaq va ser finalment enderrocada pels governadors §Ysayyids§! de Delhi. Fins ara, els arribistes sayyids no han estat capaços de posar fi a la catàstrofe que viu el soldanat. En aquest període de ruïna, només els rajputs de §YJangladesh§! es mantenen realment lleials al soldà.\n\nI de la mateixa manera que els sayyids van passar de governadors a soldans, un altre governador poderós s'ha alçat a §YSirhind§!. Bahlul Lodi, un noble afganès, és un governant i un cabdill militar extremament hàbil. El control que té sobre el §YPanjab§! li dona un grau de poder perillós, que probablement aprofitarà per intentar apoderar-se de la mateixa Delhi. El soldà sayyid s'amaga al seu palau mentre Lodi aplega forces per preparar una rebel·lió.\n\nEl Soldanat de Delhi s'està ensorrant. Són molts els qui cobegen el tron, però sorgirà un nou conqueridor que restauri el soldanat o quedarà relegat a la història com a símbol d'una ambició condemnada al fracàs?"
 string_start_vijayanagar:0 "§YVijayanagar§!, la Ciutat de la Victòria, és un nom ben escaient per a la nació hindú més triomfant de l'Índia.\n\nVijayanagara va sorgir de l'imperi §Yhoysala§! en descomposició, quan aquest ja no podia resistir les invasions repetides del Soldanat de §YDelhi§!, musulmà. Decidida a fer retrocedir els invasors, l'ascendent dinastia §YSangama§! va reunir un exèrcit i va unir bona part del sud de l'Índia contra l'enemic comú.\n\nTot i que el Soldanat de Delhi va ser expulsat del sud fa un segle, Vijayanagar encara no ha acabat la seva lluita contra els conqueridors islàmics. El 1347, el §YSoldanat Bahmani§! es va independitzar de Delhi i des d'aleshores s'ha convertit en una potència per dret propi. La rivalitat i les guerres entre els bahmanis i Vijayanagar no han estat decisives fins ara: hi ha hagut territoris que han canviat de mans i tributs exigits i refusats, però cap dels dos regnes no cedeix en la seva determinació de frustrar els plans de l'altre.\n\nA banda del seu rival del nord, Vijayanagar està envoltat de nacions molt més febles. Els sangames s'han aliat amb el regne §Yreddy§! d'§YAndhra§!, a qui s'han compromès a protegir de les incursions dels bahmanis i d'§YOrissa§!. Tot i ser nominalment súbdits de Vijayanagar, els petits regnes §Ymalabars§! i el raja de §YMysore§! es governen en gran manera pel seu compte. Pot arribar el dia que el raja els exigeixi més. La recent conquesta dels regnes §Ytàmils§! per part de l'imperi no ha anat del tot bé: les relacions amb les influents guildes mercantils tàmils són dolentes i caldrà arreglar-les abans que l'imperi emprengui noves conquestes a la zona. Sobre §YJaffna§!, al nord de §YLanka§!, s'exerceix un vassallatge més directe: la petita nació tàmil gaudeix de la protecció de Vijayanagar davant dels budistes dels regnes de §YKotte§! i de §YKandy§!.\n\nL'imperi de Vijayanagar reparteix terres entre els seus generals més lleials i destacats per mitjà d'un sistema anomenat §Ynayankara§!. Els nayaks, governadors provincials, administren les terres que se'ls concedeixen i tenen la responsabilitat de reclutar exèrcits per al maharaja. Tot i que fins ara els nayaks han estat eficaços, el raja s'ha de guardar dels generals massa ambiciosos que puguin cobejar el tron per a si mateixos."
 string_start_bengal:0 "El Soldanat de §YBengala§! va conquerir la independència davant la dinastia §YTughluq§! de §YDelhi§! després d'una llarga lluita de diplomàcia, setges i guerres que va durar del 1354 al 1359. Durant l'últim segle, Bengala s'ha consolidat com un soldanat unificat i poderós.\n\nEl soldà Nasir-ud-Din Mahmud, un administrador capaç i un home compromès amb la pau i l'estabilitat, ha restaurat la dinastia original del soldanat, els §YIlyas Shahi§!. Fins ara ha impulsat el desenvolupament de les ciutats de Bengala i la construcció de noves mesquites magnífiques.\n\nLes amenaces estrangeres més urgents per a Bengala són el regne §Ygajapati§! d'§YOrissa§! i la dinastia §Ysharqi§! de §YJaunpur§!. Els gajapatis compten amb la lleialtat de les tribus garjats, que tradicionalment juren fidelitat a la potència que controla les principals ciutats costaneres. Si Bengala aconsegueix derrotar el regne d'Orissa, potser es deixarien convèncer per oferir aquesta mateixa lleialtat al soldà. Igual que Bengala, el Soldanat de Jaunpur es va alliberar del jou de Delhi, tot i que només fa des del 1393 que gaudeix de la independència. Jaunpur controla una gran extensió del Doab, les grans terres fluvials del Ganges. Bengala i Jaunpur es van enfrontar no fa gaire, el 1420. Tot i que el conflicte es va acabar de cop per la intervenció d'emissaris timúrides i Ming, entre les dues nacions encara hi ha molts greuges pendents i potser serà inevitable que hi hagi més guerres.\n\nLes relacions amb els soldans budistes d'§YArakan§! han oscil·lat moltíssim: un any són súbdits lleials de Bengala, un altre són aliats ambivalents i un altre són una amenaça pirata. És probable que les relacions futures amb Arakan també depenguin de les circumstàncies.\n\nBengala és una potència regional prometedora, amb un gran potencial d'expansió. El tigre de Bengala encara podria esdevenir el sobirà de tota l'Índia."
 string_start_bahmanis:0 "El saqueig de §YDelhi§! del 1398 va ser un esdeveniment cabdal per al subcontinent, però a §YBidar§! no va tenir l'impacte que va tenir en altres llocs. Els soldans §Ybahmanis§! s'havien independitzat del nord cinquanta anys abans i ja havien construït un nou estat a l'altiplà sec del Dècan. Rics en recursos econòmics, entre els quals les llegendàries mines de diamants de Golconda, els soldans són ara més rics que la majoria de reis. La seva cort, amb el seu llegendari tron de Turquesa, és famosa més enllà del subcontinent, i aquesta fama ajuda molt a atreure els cobdiciosos i els talentosos de tot el món musulmà.\n\nEl Soldanat Bahmani, però, també és un estat amb problemes. Haver tallat els lligams amb el nord vol dir que no té accés directe a l'oest. Alhora, el regne té una minoria musulmana molt més petita que la majoria de soldanats del nord, i amb l'aïllament fins i tot els nobles més persianitzats han començat a adoptar la cultura i la llengua locals. Els nouvinguts i els nobles indigenitzats sovint acaben enfrontats, i la nova capital de Bidar s'ha construït en part per fugir de les intrigues de l'antiga, Gulbarga.\n\nNo gaire lluny de la frontera sud del regne hi ha la Ciutat de la Victòria, §YVijayanagar§!. La ciutat és la seu dels rajas sangames i, amb els seus 400 000 habitants, és un lloc molt diferent de l'endreçada ciutat fortificada de Bidar. És la capital d'un imperi que s'estén per tot el sud de l'Índia i que fa poc ha conquerit gairebé tot el país tàmil, a l'extrem sud. Vijayanagar és un rival formidable per al poder bahmani i no ha deixat d'avançar en la zona disputada entre els dos regnes. La presa dels ports bahmanis occidentals per part d'agents de l'Imperi de Vijayanagara és un cop directe al cor de la via vital del soldanat per a la immigració i les importacions.\n\nA l'est, Kapilendra, fundador de la dinastia gajapati d'§YOrissa§!, ha convertit sobtadament el seu regne en una potència militar. Atacant alhora els interessos de §YJaunpur§!, de §YBengala§!, de Vijayanagar i dels bahmanis, el nou rei s'ha fet en poc temps un nom com a conqueridor. Si decidís girar la mirada cap al sud, cap a §YAndhra§! i §YTelingana§!, les seves accions podrien trencar del tot l'atzucac."
 string_start_tag_south_india:0 "Separat del nord de l'Índia per les muntanyes Vindhya i pels turons i les selves de Gondwana i dels Garjats, el sud de l'Índia és en molts sentits una macroregió a part, que sovint s'anomena simplement «el Dècan» o «el Sud». Es va alliberar de les urpes del Soldanat de §YDelhi§! molt abans del saqueig §Ytimúrida§! de Delhi del 1398.\n\nA §YOrissa§!, Kapilendra Gajapati, «Senyor dels Elefants», ha convertit el seu regne regional en una gran potència. Gràcies a la lleialtat dels regnes selvàtics dels Garjats i dels devots de Jagannath, ha reunit un gran exèrcit que rendeix especialment bé a les selves i els turons de l'est de l'Índia. En poc temps, Kapilendra ha obtingut tot un seguit de grans victòries, cadascuna en aparença més improbable que l'anterior. Després d'haver derrotat Jaunpur, Bengala, els bahmanis i Vijayanagar en diversos conflictes regionals, ara té els ulls cobdiciosos posats en Telingana i la costa d'Andhra. Amb divuit fills legítims, Kapilendra haurà d'actuar amb prudència perquè totes les seves grans conquestes no es perdin quan mori.\n\nA l'altiplà central del Dècan, el §YSoldanat Bahmani§! fa gairebé cent anys que s'ha alliberat de la sobirania de Delhi. Els soldans són rics més enllà dels somnis més agosarats de la gent de les seves antigues pàtries a l'Iran, la Transoxiana i Aràbia, però també són els amos d'un estat allunyat de l'aristocràcia musulmana arrelada al nord de l'Índia. Aïllat del nord, l'estat ha passat a dependre de la immigració procedent de l'oest musulmà i de l'adquisició de cavalls de guerra estrangers d'ultramar. Per això, la recent pèrdua de la costa occidental és una catàstrofe per al soldanat, que ha fet passos per expandir-se cap a la costa oriental, ficant-se en la política interna dels velames de §YTelingana§! i dels reddys d'§YAndhra§!.\n\nA poca distància de la capital bahmani, §YBidar§!, hi ha §YVijayanagar§!, la «Ciutat de la Victòria» i capital del seu principal adversari. Des de la seva base a prop del riu Tungabhadra, els rajas sangames han construït una plaça militar a l'altiplà sec del Dècan que després els va servir per conquerir tot el país tàmil, al sud. Les terres tàmils són increïblement riques i probablement podrien finançar durant dècades el creixent Imperi de Vijayanagara, però integrar-les no ha estat fàcil. Les riques guildes mercantils tàmils conserven molt de poder i són, a més, una base excel·lent per als usurpadors.\n\nAl sud també hi ha diversos estats més petits, que observen amb inquietud la lluita titànica entre Vijayanagar, els bahmanis i el pujant regne d'Orissa. Esperen el seu moment i vetllen perquè les espècies continuïn fluint. Per a estats comercials com §YKochin§!, §YCalicut§!, §YCannanore§! i §YVenad§!, o per als regnes singalesos, aquest ha estat el seu mitjà de vida durant segles. D'altres, com els cabdills de §YMysore§! o els últims §YPandya§! de Tirunelveli, només poden confiar que les seves aptituds marcials els permetin aprofitar l'oportunitat quan es presenti, perquè res no és etern, i potser fins i tot les grans ciutats d'antany podrien caure..."
 string_start_tag_north_india:1 "El nord de l'Índia trontolla arran de l'enfonsament del Soldanat de §YDelhi§! i de la recent invasió §Ytimúrida§!. Els nous soldans §Ysayyids§! de Delhi controlen un imperi que, després d'haver abastat tota la regió, ara és a penes una ombra de la seva antiga glòria. Els soldans de §YBengala§! i de §YJaunpur§!, dinasties fundades per antics generals de la derrotada dinastia §YTughluq§!, han proclamat la independència, mentre que els governadors §YLodi§! de §YSirhind§! planegen apoderar-se del tron de Delhi. Aquestes potències emergents tindran un paper clau en la història de la regió, tot i que no són les úniques nacions dignes d'esment.\n\nLa dinastia §YSamma§! del §YSindh§! fa generacions que governa des de §YThatta§!, després d'haver suportat segles de submissió al Soldanat de Delhi. Al seu nord, la tribu balutxi dels §YLanga§! ha aprofitat l'oportunitat que oferia el caos de l'enfonsament de Delhi per conquerir §YMultan§!. Aquestes nacions viuen un període de relativa pau, però només Al·là sap quant durarà.\n\nDinasties de tota l'Índia fan remuntar amb orgull el seu llinatge a §YRajputana§!, el cor inconquerible dels §Yrajputs§!. §YMewar§! és, nominalment, el més gran i poderós dels regnes rajputs, però ara mateix viu una crisi: la dinastia §YRathore§!, descontenta amb l'antic repartiment del poder, s'ha alçat en rebel·lió per governar un §YMarwar§! independent. Aquests fets els segueixen de prop els grans rivals de Mewar, els soldans §Ykhaljis§! de §YMalwa§!. Senyors de diversos regnes gonds i vindhyans, els soldans sempre estan disposats a engrandir la seva cort amb nous súbdits.\n\nCasa dels ports més pròspers de l'Índia, el mercantil Soldanat de §YGujarat§! recull els fruits econòmics de ser un centre comercial de primer ordre mundial. El que li falta, però, és una força militar considerable que dissuadeixi els seus envejosos veïns rajputs, bahmanis i de Vijayanagar. Amb aquesta finalitat, el soldà Muhammad Xah II vol conquerir els prínceps hindús veïns i construir un regne capaç de resistir qualsevol invasor potencial. Treure profit del comerç també ha de ser una prioritat per a Gujarat, perquè l'or pot ser tan eficaç com la possessió de terres a l'hora d'aixecar un exèrcit.\n\nEl §YNepal§! pateix la desunió: cada generació hi neixen nous regnes petits, a mesura que els fills dels reis hereten o es forgen els seus propis dominis. Els reis §YMalla§! de Katmandú, el pujant regne de §YGorkha§! i les tribus del §YLimbuwan§! cobegen el control de la vall de Katmandú. El Nepal també s'ha d'enfrontar a la qüestió religiosa, ara que els monjos tibetans hi comencen a establir-se i a difondre la fe budista. El somni d'un Nepal unificat continua viu, tot i que encara no hi ha cap candidat clar per fer-lo realitat.\n\nEl regne §YAhom§! és en plena expansió a §YAssam§!. Fundat al segle XIII com un mong xan, s'ha convertit en un gresol cultural amb un sofisticat mètode de govern basat en el sistema paik de treball i administració.\n\nMentre continua el cicle inacabable d'ascens i caiguda d'imperis, l'única cosa segura del futur és que la guerra arriba a l'Índia."
 string_start_tag_north_west_africa:1 "A l'§YÀfrica Occidental i el golf de Guinea§!, el gran Imperi de §YMali§! va ser antigament la potència hegemònica de la regió: s'estenia de l'oceà Atlàntic a les ciutats estat hausa, passant per la conca del riu Níger, i la seva riquesa era ben coneguda al nord des del famós pelegrinatge del seu governant, §YMansa Musa§!, a la Meca. Tanmateix, els conflictes interns han afeblit i dividit l'imperi, abans tan poderós, i ara la seva supervivència està en joc. Això obre una oportunitat per al poderós §YSonghai§!, un poble guerrer disposat a ocupar la preeminència que creu que li correspon entre els seus veïns i en el comerç caravaner del Sàhara. Ara bé, altres potències més petites però igualment ambicioses també estan disposades a moure fitxa, com ara el §YJolof§!, els §YMossi§!, els §YHausa§! o l'§YOyo§!."
 string_start_tag_central_africa:0 "A la conca del riu Congo hi ha diverses potències que aspiren a crear-hi una autoritat central per primer cop a la història. La més ben situada per aconseguir-ho és el regne del §YCongo§!, que controla l'estuari del gran riu, cosa que el fa ric, respectat i poderós entre els seus veïns. A la regió dels Grans Llacs la situació és semblant: continua dividida, però té un gran potencial si algun dia un dels cabdills tribals aconsegueix unificar aquelles terres."
 string_start_tag_east_africa:0 "A la costa oriental d'Àfrica, coneguda arreu com la costa suahili perquè el suahili és la llengua franca de la regió, el Soldanat de §YKilwa§! viu una edat d'or, com demostra la seva rica capital als mercaders estrangers que hi arriben de tot l'oceà Índic i de les terres de l'interior. Terra endins, en canvi, l'antiga gran potència del Gran Zimbabwe fa dècades que decau. A la regió s'estan consolidant nous estats, el més important dels quals és el dels reis xona de §YMutapa§!, és a dir, «els Senyors de la Terra», que aspiren a reunificar i reconstruir totes les terres que havien estat dels reis del Gran Zimbabwe i a retornar-li la grandesa."
 string_start_tag_horn_of_africa:1 "A la Banya d'Àfrica, l'antic regne d'§YEtiòpia§!, sota el rei §Ysalomònida§! §YZara Yakob§!, viu una edat d'or d'expansió i de fortalesa interna. En molts aspectes, aquest imperi dinàmic domina tota la regió. Tanmateix, molts estats veuen l'expansió d'aquest imperi cristià militant amb por i menyspreu. El Soldanat d'§YAdal§! ha estat l'adversari tradicional dels reis salomònides i està disposat a convertir-se en l'Espasa de l'Islam a la regió. Al sud, la principal potència de la costa somali és el Soldanat d'§YAjuuraan§!, que aspira a reunir tots els clans somalis en un sol estat i a prendre el control de les rutes comercials entre el mar Roig i l'oceà Índic. Nil avall, les últimes restes dels regnes cristians de Núbia lluiten per sobreviure contra els §Ymamelucs§!, al nord, i contra les federacions tribals musulmanes locals que s'han establert a la zona."
 string_start_tag_far_east:0 "El [GetYear] es gesta un conflicte a la frontera entre els §YMing§! i els §YOirat§!. §YEsen Choros§!, cabdill dels §Yoirats§!, ha unificat una àmplia regió. Mentre els xinesos l'observen amb preocupació, ell aixeca un exèrcit a les estepes.\n\nA l'est, §YCorea§! prospera sota el govern del ja força vell rei §YSejong§!, i al §YJapó§! l'autoritat del xogunat ha començat a erosionar-se a poc a poc arran de l'assassinat del xogun Ashikaga Yoshinori."
 string_start_tag_south_east_asia:0 "El segle XV va ser una època de turbulències a Indoxina i Indonèsia, on van sorgir moltes dinasties noves mentre d'altres s'apagaven. Des que els §YMing§! van tornar a una política exterior més passiva als anys 1430, §YMalaca§! ha dominat el comerç marítim, en competència amb §YPasai§!, a Sumatra, §YBrunei§!, a Borneo (Kalimantan), i §YMajapahit§!, a Java.\n\nAl nord i al centre d'Indoxina, §YDai Viet§!, §YAyutthaya§! i §YLan Xang§! competeixen amb els vells regnes de §YChampa§! i dels §Ykhmers§!.\nLa ciutat estat birmana de §YTaungu§!, que aviat esdevindria l'imperi més agressiu de la regió, era encara el [GetYear] un petit estat dependent d'§YAva§!."
 string_start_tag_middle_east:1 "A mesura que les fronteres de l'Imperi §YTimúrida§! es repleguen, diversos magnats regionals i cabdills tribals hi veuen l'oportunitat de forjar-se estats propis.\nA Anatòlia i a Síria aquest buit ja l'han omplert els §Yotomans§! i els §Ymamelucs§!, les antigues potències regionals de la zona.\n\nEn aquesta situació política incerta, creix la tensió entre les antigues cultures sedentàries de la regió i les nombroses tribus turques que dominen la seva vida militar i política. Molts membres de les tribus turcmanes han començat a decantar-se per sectes mil·lenaristes com la Safawiya, una evolució que bé podria transformar del tot el futur de la regió."
 string_start_tag_central_asia:0 "Aliens a l'amenaça que arriba de les estepes, els prínceps de Samarcanda esquincen l'imperi de Tamerlà en el seu afany d'assegurar-se terres i poder. Al seu nord, els xibànides han anat unint les tribus kazakhs i §Yuzbeks§!, i ara es preparen per envair la §YTransoxiana§! i quedar-se Samarcanda."
 string_start_tag_india:0 "En el període que va del saqueig de §YDelhi§! per §YTamerlà§!, el 1398, a l'hegemonia final dels §Ymogols§! al nord, a l'Índia van sorgir diversos regnes regionals forts i diversos.\nEl sud de l'Índia està atrapat en el conflicte entre el Soldanat §YBahmani§!, l'estat §Ygajapati§! d'§YOrissa§! i l'Imperi de §YVijayanagara§!. Al nord, l'últim dels soldans sayyids de Delhi intenta desesperadament aferrar-se al tron, mentre un magnat local anomenat §YBahlul Lodi§! marxa sobre la capital. Mentrestant, els antics governadors de Delhi a §YJaunpur§!, §YGujarat§!, §YMalwa§! i §YBengala§! lluiten entre ells i amb altres dinasties locals per les restes de l'imperi de Delhi."
 string_start_tag_europe:0 "El [GetYear], Europa és a les portes de l'§YEra dels Descobriments§!, però encara no s'ha refet del xoc del fracàs de la croada de Varna ni de l'amenaça de l'§YImperi Otomà§! a l'est.\n\nEl Tractat de Tours ha deixat l'Europa Occidental amb una treva precària, que sembla que es podria trencar en qualsevol moment per l'ambició dels reis de §YFrança§! i d'§YAnglaterra§! o del duc de §YBorgonya§!.\n\nAl nord, la Unió de Kalmar es manté, tot i la deposició del seu rei pomerà a mans de la Lliga Hanseàtica i dels nobles dissidents §Ysuecs§! i §Ydanesos§!.\n\nEls estats §Yrussos§! tot just comencen a sentir-se alliberats del jou tàtar, mentre l'§YHorda d'Or§! continua fragmentant-se des de la seva aclaparadora derrota a mans de Tamerlà.\n\nAra que s'acosta el Renaixement ple, §YItàlia§! i §YAlemanya§! continuen trasbalsades per la fricció constant entre l'§Yemperador§! i els nombrosos prínceps autònoms.\n\nEl continent sencer és a les portes de grans canvis, i us correspondrà a vosaltres guiar el poble §Y[Root.GetAdjective]§! i el seu govern ([Root.GovernmentName]) al llarg d'aquest període."
 string_start_tag_asia:0 "Àsia és un continent immens i, el [GetYear], l'habiten pobles molt diversos.\n\nA l'oest, els §Yotomans§! són en ascens mentre els §Ytimúrides§! s'esfondren, cosa que deixa lloc a tot un seguit d'estats nous i prometedors i d'aspirants a imperi, des de l'Azerbaidjan fins a l'Àsia Central i l'Índia.\n\nA l'Extrem Orient, els §YMing§!, una dinastia encara jove per als estàndards xinesos, consoliden el seu domini sobre l'Imperi de la Xina i els seus tributaris del Sud-est Asiàtic, alhora que intenten contenir els nòmades del nord.\n\nL'arxipèlag del §YJapó§! està ple de conflictes, ja que una successió de xoguns cada cop més febles ha deixat el país a mercè de daimyos sorgits del no-res, homes forts locals de clans més petits."
 string_start_tag_africa:1 "Àfrica és un continent divers, amb pobles i llengües fortament marcats per una geografia de deserts, selves, rius i muntanyes. Això crea una situació política fragmentada, però no vol dir que els pobles africans no estiguin en contacte entre ells i amb estrangers d'altres continents. A l'oest, l'Imperi de §YMali§! s'està desintegrant, cosa que permetria al §YSonghai§! o a altres potències de la regió convertir-se en la nova potència hegemònica. A l'est, §YEtiòpia§! viu una edat d'or, però els seus veïns musulmans podrien voler destruir aquest regne copte, mentre que potències com §YAjuuraan§! i §YKilwa§!, a les costes somali i suahili, podrien centrar-se a controlar les rutes comercials de l'oceà Índic. A l'interior, els reis de §YMutapa§! aspiren a recrear la grandesa del Gran Zimbabwe, mentre que a la conca del riu Congo el regne que en porta el nom, el §YCongo§!, és el més ben situat per convertir-se en la potència més gran de la zona."
 string_start_tag_oceania:0 "En moltes parts del món, el [GetYear] és un any crucial. A Europa, les ones expansives de Varna estan canviant el panorama polític. A Àsia, els §YMing§! consoliden el seu domini, i els nombrosos estats de l'Índia miren de guanyar avantatge després que Tamerlà abandonés el subcontinent. A Amèrica, els imperis §Yasteca§! i §Yinca§! han començat a formar-se.\n\nD'Oceania, en canvi, en sabem ben poca cosa. Us correspondrà a vosaltres fer que la regió tingui pes davant la resta del món, i molt probablement ho haureu de fer amb l'espasa a la mà."
 string_start_tag_central_america:1 "Els darrers anys han vist l'ascens de la Triple Aliança §Yasteca§! a la vall de Mèxic, mentre que l'imperi §Ypurépecha§! també ha començat a estendre els seus dominis cap a l'oest. Més a l'est, la península del Yucatán acull les restes fragmentades de l'imperi maia i de la Lliga de Mayapán, que s'ha ensorrat fa poc."
 string_start_tag_north_america:0 "Les darreres restes de l'antiga civilització del Mississipí s'estan esvaint i deixen enrere estats romanents que esdevindran els §Ycreek§!, els §Ychickasaw§! i els §Ychoctaw§!.\nAl nord, profetes i líders itinerants propugnen la unitat entre els §Yiroquesos§! i els §Yhurons§!, i formen poderoses confederacions que marcaran el curs de la història."
 string_start_tag_south_america:0 "Després de l'enfonsament dels imperis wari i tiwanaku, el món andí s'ha fragmentat en diversos regnes regionals. El [GetYear], el jove príncep Yupanki Pachacútec acaba de salvar el regne dels seus avantpassats de l'extinció total a mans dels veïns chankes i, en lloc d'això, ha estat ell qui s'ha annexionat el regne d'aquests. Ara mateix, pocs s'imaginarien que aquest jove príncep convertiria el seu petit regne en el més gran imperi de la història del continent."
 string_start_tag_rnw:0 "§Y[Root.GetName]§! és un dels països que poblen el Nou Món, una regió tan vasta com inexplorada. El que el futur reserva al nostre poble és incert i depèn de les nostres ambicions."
 string_start_tag_generic:0 "Hi ha qui diria que, com a [Root.GovernmentName], §Y[Root.GetName]§! és un país amb un passat insignificant. Tot i que és evident que això té més d'enveja que de veritat, el nostre passat no és tan important com el futur gloriós que espera el nostre poble."
 string_start_religion_mechanic_title:0 "Religió [Root.GetCaDe] [Root.GetName]: [Root.Religion.GetName]"
 string_start_religion_mechanic_title_plural:0 "Religió [Root.GetCaDe] [Root.GetName]: [Root.Religion.GetName]"
 string_start_age_of_reformation:0 "El segle XVI és una època de grans canvis en el teixit polític del món. La rebel·lió contra la mateixa Església §Ycatòlica§! per part de diversos §Yreformadors§! i dels seus seguidors acabarà tenint un impacte profund en la vida política d'Europa. De moment, però, són estadistes dinàmics els qui remodelen el món al seu gust.\n\nA l'Europa Occidental, §YFrança§!, §YEspanya§! i §YÀustria§! estan en conflicte constant per §YItàlia§! i els §YPaïsos Baixos§!. Espanya té especial afany per les empreses europees, esperonada per la caiguda sobtada dels imperis §Yasteca§! i §Yinca§! i per l'enorme allau de riquesa que li ha reportat.\n\nLa Unió de Kalmar, que havia estat l'aliança definitòria del nord d'Europa, s'ha esmicolat per obra dels nobles §Ysuecs§!, que volen construir un imperi propi en lloc de servir en un de governat des de Copenhaguen.\n\nAl Pròxim Orient, els §Yotomans§! estan a punt d'emprendre una expansió més gran que mai en tota la seva història. §YPèrsia§!, unificada fa poc per la dinastia §Ysafàvida§!, s'expandeix en la direcció contrària, camí d'un enfrontament directe.\n\nA Kabul, l'últim príncep §Ytimúrida§!, Babur, aplega les seves forces per a un darrer intent de salvar un imperi per a la seva dinastia. Destinat a un èxit que superarà els seus somnis més agosarats, és a punt de fundar un imperi que governarà una quarta part de la població mundial.\n\nAra bé, el món del [GetYear] continua sent, en gran part, un món de regions aïllades. Tot això està a punt de canviar, i no només pel projecte imperial espanyol a Amèrica.\n§YPortugal§! estén sense parar la seva influència a l'oceà Índic, a Indonèsia i fins i tot a l'Àsia Oriental. Aviat, els estats enfrontats del §YJapó§! del període Sengoku seran a només un viatge en vaixell de Lisboa, o fins i tot de l'Havana."
 string_start_age_of_absolutism:0 "Fins i tot anys després dels fets, pocs s'adonen encara que el conflicte que va començar amb una finestra de Praga el 1618 devastarà el continent europeu durant trenta anys i definirà el segle XVII.\n\nA l'est, la §YConfederació de Polònia i Lituània§! perd terreny davant de §YRússia§!, i l'§YImperi Otomà§! té ben subjecte el regne d'§YHongria§!. Tot i que cap de les fronteres de l'imperi no està en pau, ni al Magrib, ni a l'Iraq, ni a Egipte, ni als Balcans, el soldanat encara no ha assolit la seva màxima extensió.\n\n§YEspanya§! sembla regnar sense rival, tant al Nou Món com a l'Europa cristiana, però el regne està a punt de ser desafiat en totes dues regions.\n\nMés a l'est, Akbar el Gran acaba de deixar al seu fill Jahangir un Imperi §YMogol§! pròsper i expansionista, que amb el temps arribarà a abastar gairebé tot el subcontinent indi.\n\nA l'Àsia Oriental, els jurchens §Ymanxús§! s'han unit i amenacen un Imperi §YMing§! desestabilitzat per les lluites internes i els desastres naturals.\nEl §YJapó§! sembla haver entrat en un període de pau, ara que el xogunat §YTokugawa§! consolida el seu domini sobre els últims daimyos de l'arxipèlag amb aspiracions d'independència.\n\nÉs una era d'imperis i d'un poder central que creix ràpidament, una era de guerra i de conquesta."
 string_start_age_of_revolutions:0 "A l'alba de l'§YEra de les Revolucions§!, els grans imperis colonials semblen més estables que mai. Tanmateix, la llavor de la destrucció ja està sembrada, i els pobles d'Amèrica han començat a anhelar la independència.\n\nL'Imperi §YQing§!, nascut el segle passat, ha reforçat el seu domini sobre l'Àsia Oriental i ha estès les fronteres de la Xina més enllà d'on mai havia arribat la influència dels Ming.\n\nA l'Índia, l'Imperi §YMogol§! ha assolit la seva màxima extensió, però per aconseguir-ho Aurangzeb ha sobreexplotat greument els seus recursos, alhora que ha concedit als administradors influents més autonomia de la que el sistema imperial pot gestionar fàcilment.\n\nA Europa, l'era de l'absolutisme ha deixat el continent dominat per estats forts, àvids i militaristes.\nEn menys d'un segle, alguns d'aquests regnes esmerçaran grans recursos a destrossar-se els uns als altres, i els més febles, com §YSuècia§! o §YPolònia§!, quedaran pel camí.\n\nAmb el temps, però, una amenaça molt més gran es revelarà des de dins. Quan les masses oprimides abracin els ideals revolucionaris, cap monarca, per il·lustrat que sigui, no estarà segur."
 string_orthodox_icons:0 "\n£DLC_tr L'autoritat patriarcal també es pot augmentar §Yconsagrant metropolitans§! als vostres estats.\n\n£DLC_tr Els països ortodoxos poden fer servir l'autoritat patriarcal per encarregar §Yicones§! religioses que donen bonificacions durant 20 anys.\n\n"
 string_catholic_tordesillas:0 "\n\n£DLC_ed Quan comenci la colonització del Nou Món, el papat concedirà §Yregions colonials§! als països afavorits, amb penalitzacions per als altres catòlics que hi entrin sense dret.\n\n"
 string_church_power_info:0 "\n\n£DLC_cs Els països protestants acumulen §Ypoder de l'Església§! amb el temps. Es pot fer servir per activar fins a 3 §Yaspectes de la fe§!, que adapten la seva §YEsglésia d'Estat§! a les seves necessitats.\n"
 string_church_power_hussite_info:0 "\n\n£DLC_emp Els països hussites acumulen §Ypoder de l'Església§! amb el temps. Es pot fer servir per activar fins a 3 §Yaspectes de la fe§!, que adapten la seva §YEsglésia d'Estat§! a les seves necessitats.\n"
 string_fervor_info:0 "\n\n£DLC_won Els països reformats acumulen §Yfervor§! cada mes. El fervor es pot fer servir per centrar el país reformat en la §Yguerra§!, el §Ycomerç§! o l'§Yestabilitat§!.\n"
 string_blessings_info:0 "\n\n£DLC_rom Els països coptes poden activar §Ybenediccions§! conquerint els §Yllocs sants§! de la seva fe. El nombre de llocs sota control copte determina el nombre de benediccions de tots els països coptes del món.\n"
 string_rituals_info:0 "\n\n£DLC_rom Els països zoroastrians poden activar §Yrituals§! conquerint els §Yllocs sants§! de la seva fe. El nombre de llocs sota control zoroastrià determina el nombre de rituals de tots els països zoroastrians del món.\n"
 string_karma_info:1 "\n\n£DLC_cs Els països §Ybudistes§! tenen un valor de §Ykarma§! que dona bonificacions diferents segons si és alt, baix o equilibrat. El karma augmenta amb les opcions dels esdeveniments, respectant les aliances militars, retornant nuclis, convertint províncies, quan us declaren la guerra o alliberant nacions. El karma disminueix amb les opcions dels esdeveniments, declarant guerres i conquerint territori.\n"
 string_harmonization_info:1 "\n\n£DLC_moh Els països confucians acumulen §Yharmonia§!, que dona penalitzacions si és massa baixa i bonificacions si és alta.\n\nEls països confucians també poden §Yharmonitzar§! la seva fe amb altres fes, cosa que elimina totes les penalitzacions de les províncies que les professen. Harmonitzar una fe dura 50 anys i consumeix 3.25 d'harmonia per any.\n"
 string_isolationism_info:0 "\n\n£DLC_moh Tots els països xintoistes tenen un nivell d'§Yaïllacionisme§!, que va de §YPortes obertes§! a §YPortes tancades§!. Cada nivell d'aïllacionisme dona bonificacions diferents, i el vostre nivell canvia segons les opcions que trieu en els §Yincidents§! d'abast nacional que anireu trobant a mesura que el país avanci al llarg de les eres.\n"
 string_deities_info:0 "\n\n£DLC_won L'hinduisme és una religió politeista, i els governants hindús poden triar una §Ydeïtat personal§!. Aquesta deïtat dona bonificacions diferents a tot el país.\n"
 string_cults_info:0 "\n\n£DLC_rom Els governants fetitxistes poden triar un §Yculte§!, amb bonificacions i esdeveniments propis. Es poden desbloquejar cultes nous interactuant amb països d'altres religions o amb altres països fetitxistes que hagin adoptat cultes que vosaltres no teniu."
 string_stories_info:0 "\n\n£DLC_rom Els governants fetitxistes poden triar un §Yculte§!, amb bonificacions pròpies. Es poden desbloquejar cultes nous amb les missions disponibles per als països que comencen amb la fe alcheringa."
 string_syncretism_info:0 "\n\n£DLC_cos Els països tengristes poden adoptar una segona fe, §Ysincrètica§!. Aquesta fe es tracta com si fos la vostra a gairebé tots els efectes, i les seves províncies no us donen cap penalització. Totes les fes sincrètiques donen, a més, bonificacions i esdeveniments propis a tot el país. Els països tengristes que no adopten cap fe sincrètica gaudeixen, en canvi, d'una bonificació alternativa i tenen accés a altres decisions i esdeveniments.\n"
 string_authority_info:0 "\n\n£DLC_ed Els països de religió inti tenen un valor d'§Yautoritat religiosa§!. Augmenta amb les opcions dels esdeveniments, reduint l'§Yautonomia§! local i engrandint el vostre imperi. L'autoritat inti disminueix quan les vostres províncies guanyen autonomia.\n\nObtindreu bonificacions segons el vostre nivell d'autoritat, i també la podeu fer servir per promulgar §Yreformes religioses§!. Cada reforma dona una nova bonificació permanent i provoca una revolta a gran escala contra el vostre govern.\n\nUn cop fetes totes les reformes, si teniu frontera amb un país que tingui la institució del §Yfeudalisme§!, podreu §Yreformar la religió§! i obtenir tecnologia i institucions del vostre veí, tot conservant les bonificacions de les reformes fetes.\n"
 string_doom_info:0 "\n\n£DLC_ed Com a país nàhuatl, sempre podeu declarar la guerra durant una §Yregència§!.\nEls països nàhuatls tenen un valor de §Yperdició§! que augmenta un punt per província i any. Quan el comptador de perdició arriba a 100, anuncia la nostra §Yfi del món§!, que farà que tots els súbdits s'independitzin i serà la fi del vostre governant i de la dinastia regnant.\nPer evitar la fi del món, els països nàhuatls poden declarar §Yguerres florides§!, amb l'objectiu de capturar gent per sacrificar-la.\nEls estats nàhuatls també poden §Ysacrificar§! els §Ygovernants§! i els §Yhereus§! dels estats súbdits per aplacar els déus i alentir el compte enrere cap a la fi del món.\n\nQuan un país nàhuatl té §Y5 estats vassalls§!, pot promulgar una §Yreforma religiosa§!, que li dona una bonificació permanent a canvi que tots els vassalls declarin la independència.\nUn cop fetes totes les reformes, els estats nàhuatls poden §Yreformar la religió§! i obtenir §Ytecnologia§! i §Yinstitucions§! d'un país veí més avançat. Això elimina per sempre l'amenaça de la perdició, tot conservant les bonificacions de totes les reformes religioses.\n"
 string_mayan_info:0 "\n\n£DLC_ed Els països de fe maia poden promulgar §Yreformes religioses§! quan arriben a 20 províncies. Això els dona una bonificació permanent poderosa, però també allibera moltes de les províncies que controlen.\nUn cop fetes totes les reformes, els països de fe maia poden §Yreformar la religió§! mateixa i obtenir §Ytecnologia§! i §Yinstitucions§! d'un estat veí més avançat, tot conservant les bonificacions de les reformes fetes.\n"
 string_ancestor_info:0 "\n\n£DLC_lev Els països totemistes tenen governants amb una sola §Ypersonalitat de governant§!. Tanmateix, quan el governant mor, la seva personalitat queda a disposició del país com a §Yavantpassat§!, que més endavant es pot triar per obtenir una bonificació permanent a canvi de poder diplomàtic. Es poden triar fins a §Y10§! avantpassats."
 string_jewish_aspects_info:0 "\n\n£DLC_ori Els països jueus acumulen §Ypoder de la fe§! amb el temps. Es pot fer servir per activar fins a 3 §Yaspectes de la Torà§!, que es divideixen en tres categories. Cada categoria reforça un aspecte important de l'estat i desbloqueja poderoses habilitats actives i passives.\n"
