 string_start_religion_intro_text:0 "La vostra religió (§Y[Root.Religion.GetName]§!) dona els modificadors següents:\n[Root.Religion.GetCountryModifiers]"
 string_start_religion_zoroastrian:1 "[Root.start_religion_intro][Root.start_coptic_zoroastrian_blessings]\n\nEl zoroastrisme és una religió molt minoritària que es troba a la província de Yazd, a l'Iran. No comparteix §Ygrup religiós§! amb cap altra §Yreligió§! del joc."
 string_start_religion_mayan:0 "[Root.start_religion_intro][Root.start_mayan_mechanics]\nLes províncies maies es troben sobretot al voltant de la península del Yucatán, i la fe maia comparteix §Ygrup religiós§! amb la religió veïna §Ynàhuatl§!."
 string_start_religion_nahuatl:0 "[Root.start_religion_intro][Root.start_nahuatl_doom]\nLes províncies nàhuatls es troben sobretot al voltant de la vall de Mèxic, i la fe nàhuatl comparteix §Ygrup religiós§! amb la religió veïna §Ymaia§!."
 string_start_religion_inti:0 "[Root.start_religion_intro][Root.start_inti_authority]\nLes províncies de religió inti es troben sobretot als Andes, i la fe inti comparteix §Ygrup religiós§! amb l'§Yanimisme§! de les terres veïnes."
 string_start_religion_tengri:0 "[Root.start_religion_intro][Root.start_tengri_syncretism]\nEl tengrisme és originari de Mongòlia, i les províncies tengristes es troben sobretot al nord d'Àsia."
 string_start_religion_fetishist:1 "[Root.start_religion_intro][Root.start_fetishist_alcheringa_cults]\nEl fetitxisme és originari d'Àfrica, i totes les províncies fetitxistes es troben al continent africà."
 string_start_religion_hindu:0 "[Root.start_religion_intro][Root.start_hindu_deities]\nL'hinduisme és originari de l'Índia, i la majoria de províncies hindús es troben al subcontinent indi."
 string_start_religion_sikh:0 "[Root.start_religion_intro]\n\nEn les dates d'inici històriques més primerenques no hi ha cap província sikh, ja que la religió neix i s'estén al tombant del segle XV.\nLa fe sikh pertany al grup religiós §Ydhàrmic§!, juntament amb l'§Yhinduisme§!."
 string_start_religion_shinto:0 "[Root.start_religion_intro][Root.start_shinto_isolationism]\nEl xintoisme és originari del Japó i pertany al grup religiós §Yoriental§!, juntament amb el §Ytheravada§!, el §Ymahayana§!, el §Yvajrayana§! i el §Yconfucianisme§!."
 string_start_religion_confucianism:0 "[Root.start_religion_intro][Root.start_confucian_harmonization]\nEl confucianisme pertany al grup religiós §Yoriental§!, juntament amb el §Ytheravada§!, el §Ymahayana§!, el §Yvajrayana§! i el §Yxintoisme§!."
 string_start_religion_buddhist_theravada:0 "[Root.start_religion_intro][Root.start_buddhist_karma]\nEl theravada pertany al grup religiós §Yoriental§!, juntament amb les altres dues fes budistes, el §Ymahayana§! i el §Yvajrayana§!, i també el §Yconfucianisme§! i el §Yxintoisme§!."
 string_start_religion_buddhist_mahayana:0 "[Root.start_religion_intro][Root.start_buddhist_karma]\nEl mahayana pertany al grup religiós §Yoriental§!, juntament amb les altres dues fes budistes, el §Ytheravada§! i el §Yvajrayana§!, i també el §Yconfucianisme§! i el §Yxintoisme§!."
 string_start_religion_buddhist_vajrayana:0 "[Root.start_religion_intro][Root.start_buddhist_karma]\nEl vajrayana pertany al grup religiós §Yoriental§!, juntament amb les altres dues fes budistes, el §Ytheravada§! i el §Ymahayana§!, i també el §Yconfucianisme§! i el §Yxintoisme§!."
 string_start_religion_coptic:1 "[Root.start_religion_intro][Root.start_coptic_zoroastrian_blessings]\nLa fe copta pertany al grup religiós §Ycristià§!, juntament amb les fes §Yortodoxa§!, §Ycatòlica§!, §Yprotestant§! i §Yreformada§!."
 string_start_religion_reformed:0 "[Root.start_religion_intro]\n\nLa religió reformada s'estén des dels §Ycentres de la Reforma§!, que apareixen quan el §Ydesig de reforma§! catòlic és prou alt.[Root.start_reformed_fervor]"
 string_start_religion_protestant:1 "[Root.start_religion_intro]\n\nLa fe protestant s'estén des dels §Ycentres de la Reforma§!, que apareixen quan el §Ydesig de reforma§! catòlic és prou alt.[Root.start_protestant_hussite_church_power]"
 string_start_religion_orthodox:0 "[Root.start_religion_intro]\n\nEls països ortodoxos poden acumular §Yautoritat patriarcal§! amb el temps per reforçar el poder de l'Església dins del país.\n\nL'autoritat patriarcal augmenta amb les opcions dels esdeveniments i amb altres interaccions.\n[Root.start_religion_orthodox_dlc_check]"
 string_start_religion_muslim_sunni:1 "[Root.start_religion_intro]\n\nEls governants sunnites tenen un valor de §Ypietat§! que mesura quin tipus de pietat promouen a la seva societat.\n\nLa pietat va del §Ymisticisme§! al §Ylegalisme§!, amb bonificacions diferents a cada extrem. La vostra societat avança cap al legalisme amb les opcions dels esdeveniments, declarant la guerra a infidels i heretges i convertint províncies. Avanceu cap al misticisme declarant la guerra a altres sunnites i amb les opcions dels esdeveniments i altres interaccions.\n\nLes altres religions del grup §Ymusulmà§! són la §Yxiïta§! i la §Yibadita§!. La sunnita és, de molt, la religió més estesa del grup.\n\n[Root.start_religion_muslim_dlc_check]"
 string_start_religion_muslim_shiite:1 "[Root.start_religion_intro]\n\nEls governants xiïtes tenen un valor de §Ypietat§! que mesura la seva política respecte a l'ortodòxia islàmica.\n\nLa pietat va del §Ymisticisme§! al §Ylegalisme§!, amb bonificacions diferents a cada extrem. La vostra societat avança cap al legalisme amb les opcions dels esdeveniments, declarant la guerra a infidels i heretges i convertint províncies. Avanceu cap al misticisme declarant la guerra a altres xiïtes i amb les opcions dels esdeveniments i altres interaccions.\n\nLes altres religions del grup §Ymusulmà§! són la §Ysunnita§! i la §Yibadita§!. Hi ha províncies xiïtes a l'Iran i a les zones meridionals d'Aràbia.\n\n[Root.start_religion_muslim_dlc_check]"
 string_start_religion_muslim_ibadi:1 "[Root.start_religion_intro]\n\nEls governants ibadites tenen un valor de §Ypietat§! que mesura la seva política envers l'ortodòxia islàmica.\n\nLa pietat va del §Ymisticisme§! al §Ylegalisme§!, amb bonificacions diferents a cada extrem. La vostra societat s'acosta al legalisme amb les decisions que preneu en els esdeveniments, declarant la guerra a infidels i heretges i convertint províncies. S'acosta al misticisme si declareu la guerra a altres ibadites i amb les decisions en esdeveniments i altres interaccions.\n\nLes altres religions del grup §Ymusulmà§! són la §Yxiïta§! i la §Ysunnita§!. Només hi ha províncies ibadites al desert del Magrib i a Oman.\n\n[Root.start_religion_muslim_dlc_check]"
 string_start_religion_catholic:0 "[Root.start_religion_intro]\n\nEls països catòlics poden interactuar amb el §Ypapat§! fent servir la §Yinfluència papal§! que acumulen amb el temps.\nLa §Yinfluència§! es pot fer servir per esdevenir el §Ycontrolador papal§! o per obtenir favors del papat.\n[Root.start_religion_catholic_tordesillas]En les dates d'inici més primerenques, la major part del món cristià és catòlica, però amb el temps el §Ydesig de reforma§! anirà creixent a causa de les accions col·lectives de tots els governants catòlics. Quan el §Ydesig de reforma§! sigui prou alt, començarà la Reforma, i les fes §Yprotestant§! i §Yreformada§! s'escamparan ràpidament des dels §Ycentres de la Reforma§!.\n\n[Root.start_anglicanism_description]"
 string_start_religion_norse:0 "[Root.start_religion_intro]\n\nLa vostra fe ([Root.Religion.GetName]) pertany al grup de fe §Y[Root.Religion.GetGroupName]§!. Els governants nòrdics poden triar una divinitat protectora, amb bonificacions diferents, que els ajudi durant el seu regnat."
 string_start_religion_hussite:0 "[Root.start_religion_intro]\n\nEl 1444, la fe hussita només es troba en unes quantes províncies del centre de §YBohèmia§!.[Root.start_protestant_hussite_church_power]"
 string_start_religion_totemism:0 "[Root.start_religion_intro][Root.start_totemism_ancestor]\nEl totemisme és la fe indígena dominant a l'§YAmèrica del Nord§!."
 string_start_religion_dreamtime:0 "[Root.start_religion_intro][Root.start_fetishist_alcheringa_cults]\nL'Alcheringa és originària d'Austràlia, i totes les províncies que la professen són a Austràlia."
 string_start_religion_jewish:0 "[Root.start_religion_intro][Root.start_judaism_aspects]\nEl 1444, el judaisme és una de les religions més antigues i és la religió de la majoria de minories d'Europa. Els únics llocs on els jueus són majoria són les províncies de Semien, a la §YBanya d'Àfrica§!. No comparteix §Ygrup religiós§! amb cap altra §Yreligió§! del joc."
 string_start_religion_fallback:0 "[Root.start_religion_intro]\n\nLa vostra fe ([Root.Religion.GetName]) pertany al grup de fe [Root.Religion.GetGroupName]. Aquesta religió i el seu grup no tenen cap mecànica especial."
 string_start_culture_government_title:0 "[Root.GovernmentName] de cultura [Root.Culture.GetName]"
 string_start_culture_government_title_plural:0 "[Root.GovernmentName] de cultura [Root.Culture.GetName]"
 string_start_consorts:0 "£DLC_rom Els monarques també tenen §Yconsorts§!, que es poden obtenir mitjançant §Ymatrimonis reials§!, amb esdeveniments o quan es crea un hereu. Fins que l'hereu no arribi a la majoria d'edat, governarà el consort en lloc d'un consell de regència.\n\n"
 string_startup_estates_explanation:0 "El vostre govern es complementa amb els §Yestaments§! del regne. Varien d'un país a un altre, però representen grups d'interès poderosos dins del país que us poden oferir grans beneficis si són §Ylleials§! i §Yinfluents§!. Tanmateix, un estament també pot ser un gran obstacle si és deslleial o massa influent. La seva influència i la seva lleialtat es poden augmentar amb les decisions que preneu en els esdeveniments i cedint-los una part més gran de les vostres §Yterres de la Corona§!.\n\n"
 string_startup_estates_explanation_cossacks:0 "El vostre govern es complementa amb els §Yestaments§! del regne. Varien d'un país a un altre, però representen grups d'interès poderosos dins del país que us poden oferir grans beneficis si són §Ylleials§! i §Yinfluents§!. Tanmateix, un estament també pot ser un gran obstacle si és deslleial o massa influent. La seva influència i la seva lleialtat es poden augmentar amb les decisions que preneu en els esdeveniments i cedint-los una part més gran de les vostres §Yterres de la Corona§!.\n\n£DLC_cos [Root.GetCaElCap] [Root.GetName] té accés a l'estament dels §Ycosacs§!. Els cosacs poden millorar les nostres unitats de cavalleria, però si arriben a §Y100 d'influència§! se separaran de la nostra nació i formaran un estat independent. Si passa, podem triar jugar amb aquesta nació escindida.\n\n"
 string_start_devotion:0 "£DLC_cs Les teocràcies tenen un valor de §Ydevoció§! que mesura la fidelitat de l'estat als seus ideals i que comporta penalitzacions o bonificacions segons el seu fervor religiós.\n\n"
 string_start_russian_mechanics:0 "£DLC_tr [Root.GetCaElCap] [Root.GetName] té el tipus de §Ygovern rus§!, que dona accés a tres interaccions de govern:\n- §YReformar el Sudébnik§!: redueix l'autonomia de les províncies pròpies.\n- §YDonar suport a l'Opritxnina§!: redueix el progrés de les faccions rebels.\n- §YEquipar els strelsí§!: recluta regiments especials §Ystrelsí§! a la capital.\nEl suport per dur a terme aquestes accions s'acumula amb el temps segons les habilitats del governant, i es pot consultar a la vista de govern.\n\n"
 string_start_iqta:0 "£DLC_coc Com a país amb govern d'§Yiqta§!, podeu fer servir tres interaccions de govern diferents, conegudes com a §Ypolítiques fiscals§!:\n- §YArrendament eficient d'impostos:§! augmenta els vostres §Yingressos fiscals§! i obté un augment puntual d'§Yimpostos§! de tots els països súbdits.\n- §YAdquisició de terres:§! redueix el cost de convertir províncies en §Ynuclis§! i obté un augment puntual d'§Yefectius§! de tots els vostres països súbdits.\n- §YFiscalitat indulgent:§! redueix el §Ydesig d'independència§! dels països súbdits i augmenta la vostra §Yreputació diplomàtica.§!\nEs pot activar una política fiscal cada 20 anys, i només n'hi pot haver una d'activa alhora.\n\n"
 string_start_mamluks:0 "£DLC_coc Com a país amb el tipus de §Ygovern mameluc§!, teniu accés a tres interaccions de govern:\n- §YPromoure la cultura del governant§!: redueix un 5% tots els costos de poder.\n- §YVendre esclaus de la cultura del governant§!: dona ingressos segons les vostres províncies de la cultura del governant.\n- §YReclutar entre la cultura del governant§!: augmenta els efectius segons les vostres províncies de la cultura del governant.\nEl suport per dur a terme aquestes accions s'acumula amb el temps segons les habilitats del governant, i la potència de les habilitats depèn de quina part del vostre país és de la §Ycultura§! del governant.\n\n£DLC_coc En cada successió triareu entre diversos candidats a soldà. Els candidats es distingeixen per la cultura del vostre país que els dona suport. L'elit mameluca governant desconfia de qualsevol candidat amb massa suport, de manera que, com més població vostra sigui de la mateixa cultura que el nou governant, més baixa serà la seva §Ylegitimitat§! inicial.\n\n"
 string_start_feudal_theocracy:1 "£DLC_coc Com a §Yteocràcia feudal§!, teniu accés a tres §Yinteraccions de govern§! que es poden dur a terme cada 5 anys gastant §Ypunts de monarca§!:\n- §YConfiscar els béns del clergat§!: redueix el cost de construcció d'edificis.\n- §YInvitar minories de l'estranger§!: augmenta el desenvolupament i en redueix el cost a l'àrea de la capital.\n- §YAutoritzar la guerra santa§!: dona reclamacions sobre les províncies veïnes d'infidels i heretges hostils o no alineats.\n\n"
 string_start_tribal_federation:0 "£DLC_coc Com a país amb el tipus de govern de §Yfederació tribal§!, podeu acumular §Ylleialtat tribal§! amb esdeveniments, guanyant batalles i §Yhumiliant§! enemics. Aquest valor accelera la recuperació d'§Yefectius§! i redueix l'§Yagitació§! a tot el país.\n\n£DLC_coc La lleialtat tribal també es pot gastar en una de tres §Yinteraccions de govern§!:\n- §YAllistar un general§!: recluta un general experimentat.\n- §YEntrenar l'equitació§!: augmenta la capacitat de combat de la cavalleria.\n- §YReclutar de les tribus§!: augmenta els efectius.\nQualsevol d'aquestes interaccions redueix 30 punts la lleialtat tribal a canvi d'una bonificació que depèn de la interacció triada.\n\n"
 string_start_harem:0 "£DLC_rom Com a país amb el tipus de §Ygovern otomà§!, teniu accés a un §Yharem§!. Això vol dir que els vostres §Yhereus§! no es generen de la manera habitual, sinó que, quan el governant fa §Y30§! anys, podeu triar entre diversos candidats.\nTanmateix, si el governant mor abans de designar un successor, us quedarà un §Yhereu mediocre§!, l'única habilitat del qual és trair els seus germans.\n\n"
 string_start_pashas:0 "£DLC_coc El vostre §Ygovern otomà§! us permet assignar estats a §Ypaixàs§!. Un paixà redueix molt el §Ycost de manteniment de l'estat§! i la probabilitat de §Yrevolta§!, però augmenta el cost de les §Yconstruccions§! a l'àrea.\n\n£DLC_coc El vostre tipus de govern també us permet reclutar §Ygenísers§! a les províncies d'§Yinfidels§!. És un tipus especial d'unitat que rep menys dany de §Yxoc§! i de §Yfoc§!, però que costa més de mantenir i requereix més §Ypoder militar§! per reclutar-la.\n\n"
 string_start_trade_league:0 "£DLC_mn El govern [Root.GetCaDe] [Root.GetName] permet construir §Yfactories§!, que augmenten el vostre §Ypoder comercial§! al §Ynode comercial§! on són. El govern també perd tradició republicana per cada província d'estat més enllà de les 20 primeres.\n\n£DLC_mn Podeu convidar països petits a la vostra §Ylliga comercial§! i oferir-los protecció a canvi de poder comercial.\nLa lliga comercial es pot reforçar encara més alliberant una ciutat comercial del vostre propi territori.\n\n"
 string_start_parliaments:0 "£DLC_cs El govern [Root.GetCaDe] [Root.GetName] recorre al §Yparlament§! per a les decisions importants. Això permet al §Ygovernant§! buscar el suport de les províncies amb §Yescó al parlament§! a l'hora de fixar polítiques.\n\n"
 string_start_prussian_government:2 "El govern [Root.GetCaDe] [Root.GetName] és una §Ymonarquia prussiana§!. Això vol dir que tots els governants tindran garantida una §Yhabilitat militar§! de com a mínim §Y3§!.\n\n[Root.startup_government_prussian_dlc]"
 string_start_prussian_government_dlc:0 "£DLC_rom Les monarquies prussianes també tenen un nivell de §Ymilitarització§!, que augmenta amb l'§Yestabilitat§! negativa, la §Ytradició militar§! positiva i la §Ylegitimitat§! positiva, i que dona tot un ventall de bonificacions útils. La militarització disminueix segons quantes províncies posseïu, de manera que un país més petit la pot mantenir més alta.\n\n"
 string_start_elective_monarchy:0 "£DLC_rp [Root.GetCaElCap] [Root.GetName] és una §Ymonarquia electiva§!. Això vol dir que altres països poden §Ydonar suport a hereus§! de la seva dinastia perquè esdevinguin els nostres hereus designats. El tron d'una monarquia electiva no es pot reclamar, de manera que és impossible que caiguem en una §Yunió personal§! sota un altre país.\n\n"
 string_start_elective_monarchy_not_yet:0 "£DLC_rp [Root.GetCaElCap] [Root.GetName] pot esdevenir una §Ymonarquia electiva§!. Això vol dir que altres països poden §Ydonar suport a hereus§! de la seva dinastia perquè esdevinguin els nostres hereus designats. El tron d'una monarquia electiva no es pot reclamar, de manera que és impossible que caiguem en una §Yunió personal§! sota un altre país.\n\n"
 string_start_horde:0 "£DLC_cos Som una horda. La nostra estabilitat interna es mesura amb un valor d'§Yunitat de l'horda§!, que disminueix amb el temps però augmenta saquejant províncies enemigues i fent la guerra. Com més gran és l'horda, més de pressa disminueix la unitat de l'horda.\n\n"
 string_start_native_council_opm:0 "£DLC_cop Un §Yconsell indígena§! governa [Root.GetCaEl] [Root.GetName]. Això vol dir que podem §Ymigrar§! d'una província a una altra amb el temps per buscar una llar millor per a la nostra tribu. També tenim accés als §Yavenços indígenes§!, que ens permeten fer avançar la nostra societat de diverses maneres abans de l'arribada dels europeus. Un cop completats tots els avenços indígenes, podem §Yreformar la nostra societat§! si fem frontera amb un país més avançat. Llavors n'adoptarem la §Ytecnologia§! i les §Yinstitucions§!.\n\n"
 string_start_native_council:0 "£DLC_cop Un §Yconsell indígena§! governa [Root.GetCaEl] [Root.GetName]. Això vol dir que tenim accés als §Yavenços indígenes§!, que ens permeten fer avançar la nostra societat de diverses maneres abans de l'arribada dels europeus. Un cop completats tots els avenços indígenes, podem §Yreformar la nostra societat§! si fem frontera amb un país més avançat. Llavors n'adoptarem la §Ytecnologia§! i les §Yinstitucions§!.\n\n"
 string_start_siberian_native_council_opm:0 "£DLC_cop Un §Yconsell indígena siberià§! governa [Root.GetCaEl] [Root.GetName]. Això vol dir que podem §Ymigrar§! d'una província a una altra amb el temps per buscar una llar millor per a la nostra tribu.\n\n"
 string_start_meritocracy:0 "£DLC_moh [Root.GetCaElCap] [Root.GetName] és un §YImperi Celestial§!. Això vol dir que, en lloc de legitimitat, el nostre país té un valor de §Ymeritocràcia§! que mostra la competència de la nostra administració. Una meritocràcia alta redueix considerablement el §Ycost dels consellers§! i ens fa més resistents a l'§Yespionatge§!.\n\n"
 string_start_shogunate:0 "[Root.GetCaElCap] [Root.GetName] és un §Yxogunat§!. Un xogunat pot tenir tants §Yvassalls daimyo§! com vulgui, i aquests vassalls poden fer-se la guerra entre ells.\n\nPerdrem el govern de xogunat si algun daimyo ens arrabassa la capital imperial, §YKyoto§!.\n\n"
 string_start_shogunate_moh:0 "£DLC_moh [Root.GetCaElCap] [Root.GetName] és un §Yxogunat§!. Un xogunat pot tenir tants §Yvassalls daimyo§! com vulgui, i aquests vassalls poden fer-se la guerra entre ells.\nEl xogunat pot dur a terme diverses §Yinteraccions amb súbdits§! especials sobre els súbdits daimyo i també té accés a §Y3 interaccions de govern§! que afecten alhora tot el conjunt de súbdits daimyo.\n\nPerdrem el govern de xogunat si algun daimyo ens arrabassa la capital imperial, §YKyoto§!.\n\n"
 string_manchu_culture:1 "£DLC_moh [Root.GetCaElCap] [Root.GetName] és un país jurchen. Això vol dir que podeu aixecar §Ybanderes§! a les províncies d'estat de cultura jurchen a canvi d'augmentar la §Ycorrupció§!.\n\nLes banderes no consumeixen §Yefectius§!, però sí que necessiten §Yducats§! per §Yreforçar-se§!.\n\n"
 string_muslim_school:0 "£DLC_coc Tots els països musulmans pertanyen a una §Yescola§! que dona bonificacions diferents. Les escoles també tenen una opinió les unes de les altres, que canvia al llarg de la partida i que afecta les relacions entre els països que les segueixen.\nEls països que segueixen una escola poden convidar erudits d'altres escoles per combinar-ne les bonificacions durant 20 anys.\n\nL'escola [Root.GetReligiousSchool] dona el modificador següent:\n[Root.GetReligiousSchoolCountryModifiers]\n\n"
 string_government_culture_explanation:1 "[Root.startup_government_explanation][Root.startup_estates_explanation][Root.start_dharma_gov_reforms][Root.start_cossacks_steppe_nomads][Root.startup_culture_explanation]"
 string_start_government_monarchy_regency:0 "El vostre estat ([Root.GovernmentName]) és una §Ymonarquia§!.\n[Root.startup_government_heirs]\n[Root.startup_consorts_explanation][Root.startup_government_tribal][Root.startup_government_shogunate][Root.startup_government_horde][Root.startup_government_meritocracy][Root.startup_government_factions][Root.startup_russian_government_interactions][Root.startup_ottoman_government_harem][Root.startup_government_parliaments][Root.startup_government_prussian][Root.startup_mamluk_government][Root.startup_tribal_federation_government][Root.startup_iqta_government][Root.startup_government_elective]"
 string_start_government_monarchy:0 "El vostre estat ([Root.GovernmentName]) és una §Ymonarquia§!.\n[Root.startup_government_heirs]\n[Root.startup_government_tribal][Root.startup_consorts_explanation][Root.startup_government_shogunate][Root.startup_government_horde][Root.startup_government_meritocracy][Root.startup_government_factions][Root.startup_russian_government_interactions][Root.startup_ottoman_government_harem][Root.startup_government_parliaments][Root.startup_government_prussian][Root.startup_mamluk_government][Root.startup_tribal_federation_government][Root.startup_feudal_theocracy_government][Root.startup_iqta_government][Root.startup_ottoman_government_pashas][Root.startup_government_elective]"
 string_start_government_republic:0 "Les §Yrepúbliques§! elegeixen el seu §Ygovernant§! entre 3 candidats per a un mandat de durada determinada (normalment, 4 anys). Si continueu reelegint el mateix governant, les seves §Yhabilitats de monarca§! augmentaran amb el temps, però la vostra §Ytradició republicana§! se'n ressentirà.\n\nSi la tradició republicana baixa massa, l'estat correrà el risc de caure en una §Ydictadura§!.\n\n[Root.startup_government_tribal][Root.startup_government_trade_league][Root.startup_government_factions][Root.startup_russian_government_interactions][Root.startup_government_parliaments]"
 string_start_government_papacy:1 "El vostre estat ([Root.GovernmentName]) és una §Yteocràcia§!. Els papes governen de per vida i s'elegeixen entre els §Ycardenals§! de la Cúria. Segons qui doni suport al candidat elegit, un país es pot considerar el §Ycontrolador papal§! i tenir accés a certes accions i bonificacions. Les probabilitats que els mateixos Estats Pontificis esdevinguin controladors papals depenen del nombre total de cardenals del món, mentre que els altres països han d'invertir §Yinfluència papal§! per augmentar les seves probabilitats.\n\n[Root.startup_devotion_explanation]"
 string_start_government_theocracy:1 "El vostre estat ([Root.GovernmentName]) és una §Yteocràcia§!. En les teocràcies, l'§Yhereu§! s'elegeix entre un grup de fins a sis candidats i, un cop arriba la successió, governa de per vida. Segons els orígens del candidat elegit, rebreu esdeveniments diferents quan accedeixi al poder.\n\n[Root.startup_devotion_explanation]"
 string_start_government_native_councils:0 "[Root.GetCaElCap] [Root.GetName] és una §Ytribu indígena§!. Les tribus les governa de per vida qui ocupa el càrrec de §Y[Root.Monarch.GetTitle]§!. Quan mor qui ocupa el càrrec de [Root.Monarch.GetTitle], se n'hi nomena un altre sense cap efecte negatiu.\n\n[Root.startup_government_native_council][Root.startup_government_siberian_native_council]"
 string_start_government_native_councils_plural:0 "[Root.GetName]: som una §Ytribu indígena§!. Les tribus les governa de per vida qui ocupa el càrrec de §Y[Root.Monarch.GetTitle]§!. Quan mor qui ocupa el càrrec de [Root.Monarch.GetTitle], se n'hi nomena un altre sense cap efecte negatiu.\n\n[Root.startup_government_native_council][Root.startup_government_siberian_native_council]"
 string_start_factions:0 "El govern [Root.GetCaDe] [Root.GetName] el controlen 3 §Yfaccions§! diferents, i obtindreu bonificacions diferents segons quina sigui al poder.\n\n"
 string_tribal_reform:0 "El nostre estat ([Root.GovernmentName]) té una forma de govern §Ytribal§!. Això vol dir que patirem §Yrebel·lions§! freqüents[Root.startup_government_tribal_institution_penalty] i que no podrem canviar a un govern no tribal si abans no §Yreformem el govern§!.\n\n"
 string_start_government_heirs:1 "Això vol dir que el governant ocupa el tron de per vida i que el [Root.Monarch.GetHerHis] relleu depèn de tenir un §Yhereu§! designat.\nEls hereus s'obtenen amb el temps o amb les decisions en esdeveniments. Si el monarca mor abans que l'hereu sigui major d'edat, un §Yconsell de regència§! pot assumir el govern, cosa que impedeix declarar guerres.\n"
 string_start_government_horde_heirs:0 "Això vol dir que el governant ocupa el tron de per vida i que el [Root.Monarch.GetHerHis] relleu depèn de tenir un §Yhereu§! designat.\nEls hereus s'obtenen amb el temps o amb les decisions en esdeveniments.\n"
 string_tribal_institution_penalty:0 ", grans penalitzacions a l'§Yexpansió de les institucions§!"
 string_start_no_special_region_title:0 "Esteu jugant a [Root.capital_continent_title]:"
 string_start_europe:0 "Europa i el Sacre Imperi Romanogermànic"
 string_start_east_asia_title:0 "Àsia Oriental:"
 string_start_east_asia_moh_title:0 "Àsia Oriental, l'Imperi de la Xina i el Japó:"
 string_start_no_special_region_description:0 "En aquesta regió no hi ha cap mecànica d'abast regional. Teniu les mans lliures per omplir aquest buit d'autoritat amb les vostres pròpies accions."
 string_start_europe_description:2 "Europa acull el §YSacre Imperi Romanogermànic§!, un imperi gegantí però molt dividit que domina les terres §Yalemanyes§! i el §Ynord d'Itàlia§!. Quan mor un §Yemperador§!, els §Yelectors imperials§! n'escullen el successor per votació. Un membre pot esdevenir elector si l'emperador actual li concedeix un electorat o si hereta un elector.\n\nEls països del Sacre Imperi Romanogermànic poden tenir la seva pròpia diplomàcia i fins i tot els seus propis súbdits, però l'emperador té l'obligació de defensar-los de les forces externes i els pot exigir que retornin el §Yterritori il·legítim§! que tinguin dins de l'Imperi.\n\nTot i que ara mateix l'§Yautoritat§! de l'emperador és baixa, això pot canviar si l'emperador aconsegueix enfortir el seu domini mitjançant §Yreformes imperials§!.\n\n[Root.start_imperial_cities_description]El nord d'Itàlia també forma part, tècnicament, del Sacre Imperi Romanogermànic, però fa temps que la regió s'escapa del control imperial. Si en les pròximes dècades l'emperador no hi enforteix el seu domini, els estats italians es consideraran independents de l'Imperi.\n\n[Root.start_tributaries_descriptions]"
 string_imperial_cities_desc:1 "L'emperador pot concedir l'estatus de §Yciutat imperial lliure§! a les §Yrepúbliques§! de l'Imperi que no tinguin més d'una província. Aquests estats gaudiran de la protecció de l'emperador alhora que augmenten l'autoritat imperial i els ingressos fiscals.\nSi una ciutat lliure adquireix una segona província, perdrà l'estatus protegit.\n\n"
 string_start_africa_americas_description:0 "[Root.capital_continent_title] comença la partida relativament aïllada de la resta del món.\nAixò no durarà per sempre. Amb el temps arribaran colonitzadors europeus, i és possible que la seva tecnologia superior us aclapari si no us hi heu preparat prou."
 string_start_east_asia_description:0 "L'Àsia Oriental acull l'Imperi del §YJapó§!.\nLluny de ser un estat unit, l'illa del Japó està dividida en molts territoris controlats per senyors locals, els §Ydaimyo§!.\nA la pràctica, el poder sobre aquests daimyo no el té l'emperador, sinó el seu lloctinent, el §Yxogun§!.\n\nEls actuals detentors del títol de xogun són els §Y[Root.start_shogun_holders_through_the_years]§!, però són dèbils i febles. Si un altre daimyo aconsegueix fer-se amb la capital imperial, §YKyoto§!, el seu clan podrà apoderar-se del xogunat...\n\n[Root.start_eoc_tributaries_descriptions]"
 string_eoc_tributaries_desc:1 "[Root.start_tributaries_descriptions]\n£DLC_moh En molts sentits, l'Àsia Oriental està dominada per l'§YImperi de la Xina§!, un estat immens que aplega una part considerable de la població mundial.\n\nLa integritat de l'Imperi de la Xina depèn del §Ymandat§! que tingui l'emperador del moment. El mandat augmenta amb els estats §Ypròspers§! de l'Imperi, amb una §Yestabilitat§! alta i mantenint molts §Ytributaris§!.\nEl mandat disminueix per la §Ydevastació§!, la §Ycorrupció§!, els §Ypréstecs§!, la §Yfallida§! i per no posseir províncies clau.\n\nEls emperadors amb poc mandat rebran modificadors perjudicials i esdeveniments molt durs.\n\nEls estats estrangers que fan frontera amb l'Imperi de la Xina poden §Ydeclarar la guerra pel Mandat del Cel§! i apoderar-se del títol."
 string_start_steppes_rest_of_asia_description:0 "[Root.start_tributaries_descriptions]"
 string_tributaries_desc:0 "£DLC_moh Un §Yestat tributari§! és un tipus especial de súbdit, el més habitual a l'Àsia Oriental. Una relació tributària requereix que el §Ysobirà§! pertanyi al §Ygrup religiós oriental§! o tingui el tipus de §Ygovern d'horda§!.\n\nEl sobirà protegeix els seus tributaris dels atacs d'estats no tributaris a canvi de §Ypagaments de tribut§! regulars, però, a banda d'això, els estats tributaris tenen la seva pròpia §Ydiplomàcia independent§!. Poden fer les seves pròpies guerres, tant internament contra altres tributaris del mateix sobirà com externament contra potències de fora.\n\n"
 string_anglicanism_desc:0 "£DLC_rb Mentre la §YReforma§! s'acosta, tot està a punt per a l'ascens de l'§Yanglicanisme§!. Les nacions del grup cultural §Ybritànic§! poden abraçar la fe §Yanglicana§!, que permet un conjunt d'§Yaccions religioses§! úniques."
 string_dharma_government_reforms:1 "Tots els governs fan servir §Yreformes de govern§!. Aquestes reformes afegeixen progressivament bonificacions distintives a un govern al llarg de la partida. Les reformes es desbloquegen acumulant §Ypunts de progrés de reforma§!, que s'obtenen passivament a un ritme determinat pel nivell mitjà d'autonomia de les vostres províncies.\n\n"
 string_cossacks_steppe_nomads:0 "£DLC_cos [Root.GetCaElCap] [Root.GetName] té un govern de tipus §Y[Root.GovernmentName]§!, de manera que feu servir la §Yunitat de l'horda§! en lloc de la legitimitat. La unitat de l'horda s'obté §Yarrasant§! desenvolupament, §Ysaquejant§! províncies i mantenint alta la lleialtat de l'§Yestament de les tribus§!.\n\n"
 string_start_papal_state:0 "Els §YEstats Pontificis§! són el conjunt de terres sota el govern del bisbe de Roma, el mateix §Ypapa§!. Com a home de religió, Sa Santedat no pot dedicar totes les seves energies als afers seculars, i alguns territoris dels Estats Pontificis, com ara §YPerusa§! i §YUrbino§!, han aconseguit una autonomia sorprenent. Si el papat no fa res per frenar l'autonomia d'aquestes ciutats, podrien escapar del tot del control de Roma.\n\nTanmateix, Sa Santedat té al davant reptes molt més grans que els cabdills arribistes de les comunes italianes. Com a cap de la fe §Ycatòlica§!, el papa té la responsabilitat única de protegir la fe i escampar la Paraula de Déu molt més enllà de les fronteres terrenals dels Estats Pontificis. A l'est, a l'altra banda de l'Adriàtica, els §Yotomans§! amenacen els bastions cristians dels Balcans i, si ningú no els atura, podrien arribar fins al cor del mateix §YSacre Imperi Romanogermànic§!. Molt al nord, els venerables estats monàstics de l'§YOrde Teutònic§! i l'§YOrde Livonià§!, a qui l'Església va encomanar la tasca de fer de baluard de la cristiandat al Bàltic, són esquarterats per prínceps envejosos i, sense suport, podrien desaparèixer del tot. I el més inquietant de tot: comencen a córrer rumors foscos que parlen malament no només del papa, sinó de tota l'estructura de l'Església catòlica! Si ningú no hi posa fre, aquestes crides xiuxiuejades a una mena de §YReforma§! podrien ser desastroses per al papat.\n\nÉs clar que tota l'habilitat diplomàtica del papa no s'ha de fer servir només per reaccionar als esdeveniments. Amb tot el poder i el prestigi de l'Església al seu costat, Sa Santedat podria bastir una gran §YLliga Santa§! per fer front a l'amenaça otomana. Es poden convocar noves croades i, si tenen èxit, el cristianisme podrà ser restaurat per fi a Jerusalem. A mesura que els exploradors cartografien els racons desconeguts del globus, els missioners els poden seguir per escampar la fe fins a regions tan llunyanes com la §YXina§! i el §YJapó§!. Amb tot el prestigi i el poder que uns papes astuts poguessin arribar a reunir, fins i tot seria possible reunificar les esglésies catòlica i ortodoxa i §Yposar fi al cisma§!."
 string_start_LANTUS:0 "Les terres de la §YToscana§! són un terreny fèrtil per al pensament, ara que tota Itàlia és a les portes del Renaixement. Noves idees sobre la vida, sobre Déu i, sobretot, sobre el govern s'escampen per la península Itàlica i donen motius de reflexió a tots els governants de la regió. La família dels §YMèdici§! de §YFlorència§!, en particular, sembla preparada per assumir amb naturalitat els canvis en la filosofia i el govern, i val la pena no perdre-la de vista. Si seguissin totes les seves ambicions, podrien arribar a ser §Ypapes§!, o bé abandonar els darrers vestigis de govern republicà a Florència, convertir el país en una §Ymonarquia§! i esdevenir ells mateixos els senyors de tota la Toscana.\n\nAquestes ambicions no quedaran sense resposta. Al sud de la Toscana, els §YEstats Pontificis§! no toleraran cap ingerència en el seu govern, ja sigui per mitjà de la conquesta territorial o d'un intent de fer-se amb el control de la §YCúria§!. Al nord, els governants de §YMilà§! podrien intentar repetir les conquestes de §YGian Galeazzo Visconti§!, que a finals del segle XIV controlava terres tan al sud com §YSiena§! i §YPerusa§!. Encaixat entre veïns poderosos, un governant modern haurà de fer servir tota la seva astúcia per sobreviure a les maquinacions de papes i prínceps i sortir-ne vencedor."
 string_start_dutch_minors:0 "Els §YPaïsos Baixos§! són un conjunt fragmentat de territoris a la vora del §YSacre Imperi Romanogermànic§!, que fa poc han quedat parcialment unificats sota el domini creixent de §YFelip III§! el Bo, duc de §YBorgonya§!. Alguns dominis, com ara §YGueldre§! i §YUtrecht§!, es mantenen lliures del control borgonyó gràcies a la protecció del §YSacre Imperi Romanogermànic§!, mentre que els §Yfrisons§!, al nord, rebutgen tant la influència borgonyona com la imperial en nom de la seva pròpia «llibertat frisona».\n\nEls dominis sota govern borgonyó —§YFlandes§!, §YBrabant§! i §YHolanda§!— controlen les terres més riques dels Països Baixos, i els beneficis del seu comerç al §Ycanal de la Mànega§! van a parar als cofres de Borgonya. Els ducs de Borgonya han d'anar amb compte als Països Baixos, perquè si algun dels seus súbdits flamencs i holandesos es tornés hostil i decidís demanar en secret el suport d'un probable rival de Borgonya, com ara §YAnglaterra§! o §YFrança§!, podria obligar Borgonya a concedir-li la independència i, a partir d'aquí, forjar el seu propi camí, potser fins i tot fins a unificar els §YPaïsos Baixos§!.\n\nFins i tot units, els neerlandesos haurien d'afrontar molts reptes. Els Països Baixos són una terra pantanosa, cara de desenvolupar i on costa construir. Els països que abans celebraven l'enfonsament del poder borgonyó podrien convertir-se en nous rivals, temorosos i alhora cobejosos de la força i la riquesa creixents dels Països Baixos. Encerclats per França i el Sacre Imperi Romanogermànic, tindrien en l'expansió d'ultramar la via més fàcil, però un imperi colonial incipient s'enfrontaria molt probablement als nous reptes d'altres potències colonials, com §YPortugal§! i §YEspanya§!. De la lluita immediata amb Borgonya als conflictes futurs a les vores del món conegut, els dominis dels Països Baixos hauran de lluitar a cada pas del camí."
 string_start_venice:0 "La República de §YVenècia§! va néixer com un humil llogaret en una illa a la vora d'una llacuna, però a l'edat mitjana es va convertir en una de les grans potències de la Mediterrània. Les llargues disputes comercials amb l'§YImperi Bizantí§! van culminar en la Quarta Croada i el saqueig de Constantinoble del 1204, que va deixar l'Imperi malmès però va ampliar enormement l'§YStato da Màr§! venecià, els seus dominis marítims, com ara §YCreta§! i §YNegrepont§!.\n\nVenècia cultiva bones relacions amb molts països i fa servir la seva reputació i la seva riquesa per enlluernar les potències estrangeres, però, malgrat tots els seus esforços, encara té enemics poderosos que li planten cara. A l'altra banda de la península Itàlica, la República de §YGènova§! enveja el domini venecià del comerç mediterrani, i res no li agradaria més que veure com s'enfonsa el vast imperi marítim de Venècia per recollir-ne les restes. A la Mediterrània oriental, mentrestant, els §Yotomans§! s'expandeixen en totes direccions. Els territoris turcs ja fan frontera amb possessions venecianes en diverses regions, i segurament només és qüestió de temps que el soldà ordeni una invasió. Al nord, els Habsburg d'§YÀustria§!, senyors del §YSacre Imperi Romanogermànic§!, veuen les possessions venecianes de la Itàlia continental com un afront al poder imperial. Al sud, els §YEstats Pontificis§! anhelen recuperar els territoris que els venecians els van prendre no fa gaire, el 1440, i detesten l'autonomia del clergat venecià. La República ha de mantenir-se alerta i fer servir totes les eines diplomàtiques al seu abast per evitar que els seus rivals s'uneixin, no fos cas que el destí de Venècia acabés penjant d'un fil.\n\nLes autoritats també vetllen de prop per la seguretat interna de Venècia. Tot i que Venècia és una §Yrepública§!, el seu sistema de govern és molt peculiar, pensat tant per mantenir la plebs a ratlla com per impedir que cap família patrícia s'apoderi del govern, tal com ha passat en algunes comunes de terra ferma. Mitjançant un elaborat sistema de votacions secretes i escrutinis a càrrec de diferents cercles d'electors, el §Ygovern venecià§! fa molt per preservar les tradicions úniques de la república."
 string_start_title_hanseatic:0 "Les ciutats hanseàtiques"
 string_start_hanseatic:0 "Les ciutats de §YLübeck§!, §YBremen§! i §YHamburg§! són membres de la venerable §YLliga Hanseàtica§!, una confederació d'interessos comercials de la §Ymar Bàltica§!, poderosa en altre temps, que ha conegut èpoques millors. Tot i que aquestes ciutats hanseàtiques ja no gaudeixen de la majestat ni de la riquesa d'abans, encara disposen d'un poder mercantil considerable, i els seus tresors no són pas menyspreables.\n\nPerò, tot i que les ciutats hanseàtiques encara tenen força, els queda molta feina si volen restaurar l'antiga glòria de la Hansa. El 1429, §YDinamarca§! va imposar peatges per travessar l'Øresund, entre Sjælland i Escània, i aquests peatges de l'estret ofeguen les darreres restes del comerç hanseàtic d'entrada i sortida del Bàltic. Si el comerç ha de tornar a prosperar, els danesos han d'entendre l'error de la seva política comercial. Més a l'est, la ciutat de Visby, a l'illa de §YGotland§!, havia estat una ciutat hanseàtica formidable i rica, però un atac danès el 1361 i les diverses depredacions que van seguir a mans de danesos i pirates van arruïnar-ne la riquesa i l'autonomia. Recuperar Visby i conquerir Gotland seria un moment clau en la revitalització de la Lliga Hanseàtica.\n\nLes ciutats hanseàtiques tampoc no poden desentendre's dels afers alemanys. Les ciutats lliures de la Lliga deuen fidelitat a l'§Yemperador del Sacre Imperi Romanogermànic§! i gaudeixen de la «immediatesa imperial», que els permet tractar directament amb la cort imperial en lloc de passar per diversos òrgans regionals. Tot i que, de moment, el Sacre Imperi Romanogermànic garanteix la independència de les ciutats hanseàtiques, qualsevol intent de centralitzar l'Imperi podria esdevenir una amenaça greu per al futur de les ciutats i de la Lliga."
 string_start_title_korea:0 "Corea, el regne de Joseon"
 string_start_title_bavarians:0 "[Root.GetCaElCap] [Root.GetName] en una Baviera dividida"
 string_start_bavaria:0 "El [GetYear], el ducat de §YBaviera§! dels §YWittelsbach§! està dividit. Repartit al segle XIV entre els fills de Lluís IV i, de nou, entre els d'Esteve II, va acabar formant quatre subducats: §YMunic§!, §YLandshut§!, §YIngolstadt§! i §YStraubing§!. Tanmateix, la línia de Straubing es va extingir el 1425 i les seves possessions van passar a Munic. Els tres subducats restants, tot i estar units per llaços familiars, sempre buscaran l'ocasió de fer-se amb les terres dels seus parents.\n\n Al sud i a l'est, els Habsburg d'§YÀustria§! —emperadors del §YSacre Imperi Romanogermànic§!— volen imposar el seu domini sobre els seus veïns d'§YHongria§!, §YBohèmia§! i §YItàlia§!. Sovint han estat rivals de la família Wittelsbach, que va ocupar per darrer cop el tron del Sacre Imperi Romanogermànic el 1347, en uns temps gloriosos en què §YBrandenburg§!, §YHolanda§! i el §YTirol§! també eren possessions dels Wittelsbach. Ara que la marea sembla girar a favor dels Habsburg, hem de decidir si ho acceptem i ens deixem portar pel corrent, o si hi resistim i mirem de posar fi al domini dels Habsburg sobre l'Imperi.\n\nAl nord, el §YPalatinat§! electoral també el governa una branca de la família Wittelsbach, fruit d'una divisió familiar encara més antiga. Si aconseguim unir Baviera, hauríem de ser prou forts per enfrontar-nos-hi i, amb sort, quedar-nos el seu seient al col·legi electoral. Més enllà, §YDinamarca§! també la governa un rei Wittelsbach, §YCristòfol§!, l'§Yarxirei del Nord§!, un aliat potencial molt poderós. Tanmateix, el seu regnat està ple de dificultats, i donar-li suport també comporta riscos."
 string_start_milan:1 "El [GetYear], §YMilà§! surt d'una llarga sèrie de guerres per l'hegemonia sobre el nord d'Itàlia que van començar el 1423. L'ambiciós duc §YFilippo Maria Visconti§! va intentar estendre el poder milanès a costa de §YVenècia§!, §YFlorència§! i §YGènova§!, però, malgrat els èxits inicials, aquests intents van fracassar. Tot i que ara els combats s'han aturat, és poc probable que la pau duri: Venècia controla les possessions que legítimament pertanyen a Milà a §YBrescia§! i §YBèrgam§!. Els governants de tots els bàndols reuneixen les seves tropes per a una nova tanda de combats.\n\nEl ducat de Milà, un estat relativament jove, es va fundar el 1395. Des d'aleshores, els seus governants han lluitat de valent tant dins de l'estat com més enllà de les seves fronteres per imposar la seva autoritat. Tanmateix, les ciutats de la Llombardia només accepten el govern ducal a contracor i, si en tenen l'oportunitat, és probable que intentin prendre el poder i establir un govern republicà. D'altra banda, l'ambiciós i molt hàbil capità mercenari §YFrancesco Sforza§! s'ha fet un nom durant les darreres lluites. Ell també aprofitaria qualsevol escletxa per satisfer les seves pròpies ambicions. La inestabilitat afligirà Milà fins que aquestes tensions no es resolguin.\n\nFinalment, les potències expansionistes rivals de §YFrança§! i §YÀustria§! tenen l'ull posat en el ducat, i probablement el veuran com el premi si una de les dues s'imposa a l'altra. Milà haurà de triar bàndol amb cura, tot procurant no dependre'n tant que perdi el control del seu propi destí. En particular, Milà haurà de decidir si continua formant part del §YSacre Imperi Romanogermànic§!, que ha vist com el seu control d'Itàlia s'esvaïa a poc a poc, o si en busca la independència i segueix el seu propi camí. L'èxit de Milà dependrà d'un equilibri acurat en les seves relacions diplomàtiques, i d'obtenir en les seves guerres un resultat més favorable que en la primera meitat del segle."
 string_start_title_hungary:0 "L'interregne hongarès"
 string_start_hungary:2 "Fins al 10 de novembre de 1444, §YLadislau III Jagelló§! regnava sobre §YHongria§! i §YPolònia§!, i encapçalava els seus exèrcits contra els §Yotomans§! en la §Ycroada de Varna§!. Però, després de la derrota a la §Ybatalla de Varna§!, Ladislau ha mort, el tron d'Hongria és vacant i els otomans són en plena ascensió. Si Hongria vol fer front a la imminent conquesta otomana dels Balcans, haurà de reagrupar les seves forces de pressa.\n\nA l'interior, el comandant §YJoan Hunyadi§! ha reunit el que queda de les forces armades i les ha portat de tornada a Hongria. Home de gran renom i de molts talents, molts a Hongria el veuen com el successor natural de Ladislau. Tanmateix, els §YHabsburg§! d'§YÀustria§! estan decidits a fer valer la seva pròpia pretensió per mitjà de l'infant §YLadislau el Pòstum§!, que era l'hereu legítim abans que Ladislau ocupés el tron arran d'una guerra civil. Si arriba a la majoria d'edat, a Hongria li costarà mantenir la independència respecte d'Àustria.\n\nAl nord, la derrota de Varna ha deixat §YPolònia§! en un caos semblant al d'Hongria. Tot i així, continua sent una força formidable, i un rei hongarès faria bé de buscar-ne l'amistat més que no pas l'enemistat, almenys si el rei polonès esdevé governant de §YLituània§!. D'altra banda, §YBohèmia§!, un focus de l'heretgia §Yhussita§!, pot ser un objectiu d'expansió més atractiu, sobretot si s'aconsegueix l'aprovació de l'§Yemperador del Sacre Imperi Romanogermànic§!... i si es pot mantenir els otomans a ratlla prou temps."
 string_start_title_saxony:0 "L'Electorat de Saxònia"
 string_start_title_thuringia:0 "Turíngia sota l'Electorat de Saxònia"
 string_start_saxony:2 "El poder dels §YWettin§! de §YSaxònia§! ha crescut considerablement en els darrers anys, fins al punt que ara formen un dels estats més poderosos d'Alemanya. Primer, la línia masculina dels §YAscanis§! de §YSaxònia-Wittenberg§! es va extingir el 1423, i l'§Yemperador del Sacre Imperi Romanogermànic§! va concedir les seves terres —i el seu títol d'§Yelector§!— als Wettin. Després, el 1440, van adquirir §YTuríngia§!, quan va morir Frederic IV el Pacífic, cosí del príncep elector §YFrederic II§! de Saxònia. Tanmateix, aquesta expansió ràpida comporta nous reptes: gelós de l'èxit del príncep elector, el seu germà §YGuillem§! busca terres per a ell i els seus successors, i està decidit a dividir l'herència dels Wettin.\n\nLes amenaces al nou ascens de Saxònia també abunden en altres fronts. Al sud hi ha el regne de §YBohèmia§!, una nació poderosa i propensa a l'heretgia. En cas de guerra amb Bohèmia, a Saxònia li costarà resistir tota sola el seu poder. Pitjor encara, els §YHabsburg§! d'§YÀustria§! tenen la vista posada en el tron bohemi: si l'heretessin, les conseqüències per a l'equilibri de poder dins l'Imperi serien enormes...\n\nD'altra banda, al nord hi ha els §YHohenzollern§! de §YBrandenburg§!. Potència mitjana i ambiciosa, podrien ser tant uns aliats valuosos com uns rivals temibles. Saxònia podria fer causa comuna amb ells contra Bohèmia, però aquest camí podria irritar la poderosa §YPolònia§!. Potser seria més segur conquerir directament Brandenburg i sumar-ne així el poder al de Saxònia.\n\nSi totes aquestes amenaces es poden neutralitzar amb la diplomàcia o amb la força militar, s'obren possibilitats considerables per a Saxònia. A l'oest i al sud-oest hi ha els diversos principats, bisbats i ciutats lliures dels §Ybaixsaxons§!, els §Ywestfalians§! i els §Yfrancons§!, estats menors amb poca capacitat militar pròpia. Caurien fàcilment davant d'una Saxònia unida, capaç de dedicar tota la seva atenció a conquerir-los..."
 string_start_title_bohemia:0 "L'interregne bohemi"
 string_start_bohemia:0 "Bohèmia és una de les nacions més destacades del §YSacre Imperi Romanogermànic§!: el seu poder militar i la seva riquesa econòmica només són superats pels dels §YHabsburg§! d'§YÀustria§!, els actuals ocupants del tron imperial. Recentment, Bohèmia era governada des d'Àustria per §YAlbert II§!, la mort del qual, el 1440, va deixar vacant el tron de Bohèmia. La qüestió de la successió encara no s'ha resolt, i és probable que els austríacs facin valer les seves pretensions.\n\nA més de les incerteses sobre la successió, Bohèmia surt de diverses dècades de lluita entre els seus governants i els §Yhussites§!, que molts al món §Ycatòlic§! consideren heretges. Tot i que la facció hussita radical va ser derrotada, la facció moderada dels utraquistes, encapçalada per §YJordi de Podebrady§!, continua sent influent i segur que voldrà dir-hi la seva en la qüestió successòria, i en altres assumptes.\n\nA l'est hi ha més amenaces, però també aliats potencials: les poderoses nacions de §YPolònia§! i §YHongria§!. Totes dues s'han sumit en el caos arran de la mort de §YLadislau III Jagelló§! a mans de l'§YImperi Otomà§! a la §Ybatalla de Varna§!. Això les ha deixat sense líder, i Hongria sembla especialment vulnerable, però no se n'ha de subestimar la força. Un rei bohemi ambiciós podria aprofitar la situació en benefici propi i guanyar per a la corona aliats valuosos, o noves terres igualment valuoses.\n\nA §YAlemanya§!, molts dels §Yprínceps imperials§! veuen Bohèmia com un cos estrany —tot i la seva condició d'§Yelector§!— per les diferències culturals, i els preocupa viure sota la seva ombra, comparativament gran. Un rei expansionista podria buscar noves conquestes entre ells, però en caldrà el suport per a qualsevol nou intent d'esdevenir §Yemperador del Sacre Imperi Romanogermànic§!. Hi ha moltes decisions per prendre, i moltes amenaces i oportunitats entre les quals el regne de Bohèmia haurà de saber navegar..."
 string_screen_title_papacy:0 "[Root.GetName], [GetYear]"
 string_start_title_byzantium:1 "Els veritables hereus de l'§YImperi Romà§!"
 string_start_byzantium:2 "Ara que l'§YImperi Romà§! és un record llunyà, incomptables imperis han gosat reclamar el mantell de veritables successors de Roma, però els §Ybizantins§! continuen convençuts que només ells tenen un dret legítim a aquell antic imperi. El 1171, la rivalitat entre §YBizanci§! i §YVenècia§! va arribar al punt d'ebullició quan l'hostilitat entre totes dues nacions va esclatar en un conflicte violent. \n\nL'abril de 1204, guiats per l'esperit venjatiu dels venecians, els membres de la Quarta Croada van desobeir l'ordre del papa §YInnocenci III§! i van girar la seva violència contra l'§YImperi Bizantí§!, que els havia promès un pas segur. Els croats van saquejar dues vegades la ciutat de Constantinoble i van reduir l'antigament gloriosa ciutat a poca cosa més que cendres i runes, i l'Imperi a encara menys. Tot i que la casa dels §YPaleòleg§! va aconseguir restaurar bona part del que s'havia perdut, nombrosos estats successors, com el tema de l'§YEpir§! i §YNaxos§!, han aconseguit evitar la reintegració a l'Imperi. El caos provocat per la caiguda de l'Imperi §Ybizantí§! ha afavorit l'ascens dels turcs §Yotomans§!, que ara s'han instal·lat a la frontera §Ybizantina§! amb l'ambició d'apoderar-se de §YConstantinoble§!, la Ciutat del Desig del Món.\n\nEl 1444, l'Imperi es troba envoltat d'heretges i infidels per tots costats: molts dels seus antics súbdits ara s'agenollen davant del dux venecià que va precipitar la fi del seu imperi, i molts altres són fermament sota el control dels §Yotomans§!. Tant a Occident com a Orient, les potències creuen que l'era de §YBizanci§! s'ha acabat fa temps, però el §Ybasileu Joan VIII Paleòleg§! continua confiant que el Fènix de Porpra s'alçarà de nou i recuperarà no només §YBizanci§!, sinó el mateix §YImperi Romà§!!"
 string_start_title_naples:1 "La lluita napolitana"
 string_start_naples:3 "Després de les Vespres §YSicilianes§! del 1282, el rei §Ynapolità§! §YCarles§! d'§YAnjou§! va perdre el control de l'illa en favor de §YPere III§! d'§YAragó§!. Amb només els territoris de la Itàlia continental al seu nom, el regne de §YSicília§! es va perdre i el seu rei va adoptar un nou títol: el regne de §YNàpols§!. \n\n Quan la reina §YJoana I§! va morir sense fills, el regne napolità va caure en un estat de guerra civil constant, amb cosins de tota mena de pretensions i títols lluitant pel control del regne. §YAlfons V§! d'Aragó va resoldre aquesta disputa amb sang: va expulsar tots els altres pretendents i va unir la Corona d'§YAragó§! amb el regne de §YNàpols§!. \n\nEl 1444, el regne de Nàpols és presoner d'una situació molt delicada. Continua unit a la Corona d'Aragó, però la pretensió aragonesa al tron és feble i la qüestió de qui n'és el titular legítim continua sent objecte de disputa. Pels seus llaços de sang amb el regne de §YFrança§!, la crisi successòria napolitana s'ha convertit en un motiu de gran tensió entre Aragó i França. \n\nAl nord, els §YEstats Pontificis§! controlen §YRoma§! i bona part de la Itàlia central. Mentrestant, la península Itàlica està esmicolada en petits dominis com §YFlorència§! i ciutats estat com §YLucca§! i §YBolonya§!. Al sud, §YTunis§! continua sent una gran amenaça per a l'estabilitat econòmica del regne, ja que els seus pirates saquegen sovint les costes napolitanes i pertorben el comerç marítim italià. Tanmateix, la pregunta continua oberta: com aconseguirà Nàpols alliberar-se del jou de ferro del domini aragonès i reunificar les §YDues Sicílies§!?"
 string_start_title_genoa:1 "Els mercaders marítims de §YGènova§!"
 string_start_genoa:1 "La República de §YGènova§! va obtenir per primera vegada la independència del regne d'§YItàlia§! el 1005. Quan l'hostilitat entre venecians i grecs va desembocar en el saqueig de §YConstantinoble§!, Gènova va treure profit de la situació en una cursa contra la seva rival, §YVenècia§!, i es va expandir fins a les profunditats de la mar Negra i §YCrimea§!. \n\nPerò la prosperitat no va durar: la Pesta Negra va estendre la seva ombra sobre Europa, i Gènova es va veure obligada a pagar el tribut de la mort amb sang i sofriment. En un esforç per recuperar-se de la tragèdia de la Pesta Negra, Gènova va imitar el model venecià de govern republicà, en què el dux ostentava el títol més alt del govern i exercia la sobirania sobre tota la República. \n\nMentrestant, Gènova es veuria immersa en un conflicte interminable amb els venecians, amb qui es disputava el domini de l'arxipèlag grec i de la mar Negra. Quan els conflictes amb Venècia van començar a remetre, Gènova va emprendre una croada al costat de §YFrança§! contra els corsaris barbarescos de §YTunis§!. Tot i que el setge de §YMahdia§! no va reeixir, tots dos bàndols van negociar un tractat de pau que va reduir dràsticament el problema de la pirateria nord-africana. \n\nEl 1444, Gènova ja ha perdut diversos conflictes contra França i §YMilà§!, i fa temps que l'illa de §YSardenya§! ha passat a mans de la Corona d'§YAragó§!. Gènova es troba en una posició precària: a l'est, Venècia continua sent una competidora i la líder de la lliga comercial rival, i li disputa la influència a Anatòlia. Els otomans han deixat clar que volen consolidar el seu domini sobre Anatòlia i la mar Negra, i aprofiten qualsevol oportunitat per expulsar els genovesos de la regió. Mentrestant, altres repúbliques i ciutats estat italianes continuen lluitant pel predomini a Itàlia. Milà a l'est, i França i Aragó a l'oest, són la principal amenaça per a la supervivència de Gènova, i caldrà una mà delicada amb la ploma i amb l'espasa per moure's en aquesta complexa xarxa d'aliances i pretensions i conduir Gènova cap a un futur pròsper."
 string_start_tag_arabia:0 "§YAràbia§! és el bressol de la fe musulmana. Tot i estar dividida entre §Ysunnites§!, §Yxiïtes§! i §Yibadites§!, és innegable que Aràbia és el lloc escollit per Al·là.\n\nMalgrat la ràpida i eficaç expansió de l'islam des dels seus humils orígens, la mateixa Aràbia continua dividida en múltiples tribus. L'estret d'§YOrmuz§!, a la costa oriental, concentra tot el comerç que entra i surt de les riques terres de Pèrsia, de Mesopotàmia i de l'Índia. A la banda occidental de la península hi ha les ciutats santes de la §YMeca§! i §YMedina§!, i és on més es fa sentir la influència dels veïns §Ymamelucs§!. L'extrem sud, el §YIemen§!, és escenari d'una lluita entre les fes §Ysunnita§! i §Yxiïta§!, mentre que els deserts centrals estan dominats per diverses tribus §Ybeduïnes§!.\n\nAràbia està envoltada de potències com els §Ymamelucs§!, els §Yotomans§! i els §Ytimúrides§!, i qualsevol d'elles podria decidir apoderar-se'n i controlar així les ciutats santes de la §YMeca§! i §YMedina§!. Només una Aràbia unificada podrà plantar cara als grans imperis del món i recuperar el títol de califa, successor del Profeta i guia de tot l'islam."
 string_start_ajam:0 "Sorgida de les restes de l'§YImperi Timúrida§! i després d'haver-se alliberat del control dels principals hereus de Tamerlà, la nació d'Ajam es troba en una posició privilegiada al centre de §YPèrsia§!. En aquestes terres s'han format molts imperis, i molts altres les han fet servir com a rutes d'expansió per als seus propis imperis. Des dels antics conqueridors com Cir, Xerxes i Alexandre fins als més recents, com Genguis Khan i Tamerlà, la terra d'Ajam no és pas aliena als imperis poderosos.\n\nPer això, totes les nacions poderoses del voltant miren aquestes terres amb cobdícia. Els veïns §Ymamelucs§!, §Yotomans§! o §Ytimúrides§! podrien convertir-se fàcilment en una amenaça per a la supervivència d'Ajam si no se'ls fa front. Com a hereva de Tamerlà que és, Ajam té tant de dret com els altres a fundar un §YImperi Persa§! poderós i veritable."
 string_start_ardabil:0 "En aquestes terres s'han format molts imperis, i molts altres les han fet servir com a rutes d'expansió per als seus propis imperis. Des dels antics conqueridors com Cir, Xerxes i Alexandre fins als més recents, com Genguis Khan i Tamerlà, la terra d'Ardabil no és pas aliena als imperis poderosos. Però, a banda de les lluites entre imperis, se n'albira una altra a l'horitzó.\n\nTot i que tothom segueix Al·là, Ardabil es troba relativament aïllat en les seves creences §Yxiïtes§!, ja que la majoria dels seus veïns segueixen la fe §Ysunnita§!. L'§Yorde safàvida§! no només ha ofert guia religiosa a Ardabil dins de les creences xiïtes i sufís, sinó que també ha donat nom a la mateixa dinastia safàvida. Això, juntament amb els seus grups militants, els §Yqizilbaixos§!, garanteix la força del cor i del braç d'Ardabil.\n\nVeïns poderosos amenacen les seves fronteres, però, amb la guia adequada, la nació d'Ardabil pot convertir-se en una força temible i en el proper §YImperi Persa§!."
 string_start_theodoro:0 "Tot i que §YTeodoro§! potser va obtenir la sobirania a principis del segle XV, el seu origen es remunta al tema de Quersonès, que podria haver estat fundat ja el 840. Més tard passaria a mans de la família Gabràs, que s'havia establert com a governant del tema de Caldia després del 1081. Els Gabràs van passar a servir a la cort §Yseljúcida§! després del 1126, tot i que alguns van decidir servir l'§YImperi Bizantí§!. Molts d'ells van ocupar càrrecs elevats en els seus respectius llocs, com Giovanni de Gabra, enviat en missió diplomàtica a Europa en nom del soldà Kayqubad I de §YRum§!, o Miquel Gabràs, que va servir com a general de Manuel I de l'§YImperi Bizantí§! i va lluitar tant contra els hongaresos com contra els seljúcides.\n\nDesprés del saqueig de §YConstantinoble§! el 1204, una branca menor de la família va arribar a governar la regió de §YGòtia§!, on va regnar amb total autonomia respecte de les diverses corts §Ybizantines§!, sotmetent-se unes vegades a la §YRepública de Gènova§! i d'altres a l'§YHorda d'Or§!.\n\nEnvoltada de gegants com els §Yotomans§!, els §Ytàtars§! i les §Yrepúbliques mercantils italianes§!, aquesta petita nació haurà de jugar les seves cartes tan bé com pugui si vol arribar a ser l'hereva legítima de §YRoma§!, fer valer les seves pretensions a §YRússia§! o potser fundar un nou estat, independent tant de la influència russa com de la bizantina."
 string_start_oman_hormuz:1 "A l'extrem de la península Aràbiga hi ha §YOman§! i §YOrmuz§!, dos soldanats que es disputen el poder sobre les zones del voltant i el comerç d'ultramar.\nEl poble ibadita d'§YOman§! ha quedat atrapat a l'interior pel soldanat d'Ormuz. En els anys anteriors, la dinastia nabhànida havia patit la invasió de nombrosos conqueridors perses i s'havia vist obligada a controlar només l'interior d'§YOman§!. Trencar aquesta gàbia serà una tasca difícil per a §Y[OMA.Monarch.GetName]§!, però, amb una diplomàcia acurada, potser aconseguirà assegurar-ne la llibertat.\n\nEl poble d'§YOrmuz§!, en canvi, domina el golf Pèrsic i controla el comerç que flueix de l'Índia cap a Europa. Amb mercaders a tots els racons de l'oceà Índic, es troba en una posició que li permet estendre els seus interessos mercantils a altres indrets, com els ports de la Xina o del Sud-est Asiàtic. Tanmateix, la fragilitat de l'§YImperi Timúrida§! podria ser una oportunitat per arrabassar-li la costa persa."
