 MAPMODE_TERRAIN_DESC:0 "Mostra el terreny. És especialment important per decidir on voleu entrar en combat. Les ratlles indiquen províncies amb un controlador que no n'és el propietari."
 MAPMODE_POLITICAL_DESC:0 "Cada nació apareix amb el seu color específic. Les ratlles indiquen províncies amb un controlador que no n'és el propietari."
 MAPMODE_RELIGION_DESC:0 "Mostra els grups religiosos al mapa. Les ratlles indiquen províncies amb una religió diferent de la religió de l'estat."
 MAPMODE_EMPIRE_DESC:0 "Acoloreix les províncies que formen part del Sacre Imperi Romanogermànic.\nEl porpra correspon a l'emperador, el marró a un elector i el blau a una ciutat lliure. Les províncies verdes simplement formen part de l'Imperi.\nLes províncies amb ratlles grogues formen part de l'Imperi, però el seu propietari no.\nLes províncies amb ratlles taronges formen part de l'Imperi, però són súbdites d'un sobirà de fora de l'Imperi.\n"
 MAPMODE_TRADE_DESC:0 "Acoloreix les províncies segons el node comercial al qual pertanyen. Els escacats indiquen províncies que NO són dins l'abast comercial."
 MAPMODE_DIPLOMACY_DESC:0 "Acoloreix les províncies segons les relacions diplomàtiques del seu propietari amb el país seleccionat. Les ratlles indiquen si el país seleccionat hi té un nucli."
 MAPMODE_ECONOMY_DESC:0 "Acoloreix les províncies segons el desenvolupament."
 MAPMODE_MANPOWER_DESC:0 "Acoloreix les províncies segons la quantitat d'efectius. El vermell indica pocs efectius, el groc una quantitat mitjana i el verd molts efectius."
 MAPMODE_FORTLEVEL_DESC:2 "Acoloreix les províncies segons l'estat diplomàtic amb els propietaris dels forts. Les províncies verdes indiquen forts amics, les vermelles forts enemics i les porpres forts neutrals. Els forts de més nivell són d'un blau més fosc."
 MAPMODE_TECH_COST_DESC:0 "Acoloreix les províncies segons el nivell tecnològic. Les províncies verdes indiquen un nivell tecnològic més alt, i les taronges un nivell més baix que les grogues. Les províncies vermelles indiquen els nivells tecnològics més baixos."
 MAPMODE_TRADE_VALUE_DESC:0 "Acoloreix les províncies segons el valor del comerç. El blau indica províncies d'or, el vermell clar un valor comercial baix, el vermell fosc un valor una mica més alt, el groc un valor alt i el verd un valor molt alt."
 MAPMODE_SUPPLY_LIMIT_DESC:0 "Acoloreix les províncies segons el límit de subministrament. \nSi no hi ha cap exèrcit seleccionat, el vermell indica un límit de subministrament baix, el groc un límit mitjà i el verd un límit alt. \nAmb un exèrcit seleccionat, les províncies que no el poden mantenir són vermelles, i les que sí que poden, verdes. Una província que amb prou feines el pot mantenir és groga."
 MAPMODE_BUILDINGS_DESC:0 "Acoloreix les províncies segons quants edificis s'hi poden construir. El verd clar indica que s'hi poden construir més edificis, i el verd fosc, que se n'hi poden construir menys. Una província amb ratlles blaves té un edifici únic."
 MAPMODE_MISSIONARY_DESC:0 "Acoloreix les províncies segons si es poden convertir a la religió de l'estat. El verd indica una província amb una religió diferent de la de l'estat, el blau una província que s'està convertint i el gris una província que ja té la religió de l'estat."
 MAPMODE_REGION_DESC:0 "Acoloreix les províncies segons la regió a la qual pertanyen. Passant el ratolí per sobre de qualsevol província en veureu l'àrea, la regió i el continent."
 MAPMODE_AREAS_DESC:0 "Acoloreix les províncies segons l'àrea a la qual pertanyen. Passant el ratolí per sobre de qualsevol província en veureu l'àrea, la regió i el continent."
 MAPMODE_SUPER_REGION_DESC:0 "Acoloreix les províncies segons el subcontinent al qual pertanyen. Passant el ratolí per sobre de qualsevol província en veureu l'àrea, la regió, el subcontinent i el continent."
 MAPMODE_VICTORYCARDS_DESC:0 "Acoloreix les províncies segons la carta de victòria a la qual pertanyen (si n'hi ha). Passant el ratolí per sobre d'una província amb carta en veureu la puntuació."
 MAPMODE_CULTURE_DESC:0 "Acoloreix les províncies segons les diverses cultures i en mostra els noms."
 MAPMODE_OPINION_DESC:0 "Acoloreix les províncies segons l'opinió del seu propietari sobre el país seleccionat."
 MAPMODE_COALITION_DESC:1 "Acoloreix les províncies segons l'opinió del seu propietari sobre l'expansió agressiva del país seleccionat. Si la seva opinió sobre l'expansió agressiva del país seleccionat és inferior a -50 i la seva opinió general és inferior a 0, es poden unir a una coalició i la seva escala de color va de l'ambre al vermell. Si la seva opinió sobre l'expansió agressiva del país seleccionat és inferior a -50 però la seva opinió general és superior a 0, la seva escala de color va del verd a l'ambre. En cas contrari, la seva escala de color va del gris al verd. Si el país és vermell, forma part d'una coalició contra vosaltres."
 MAPMODE_TRUCE_DESC:1 "Acoloreix les províncies segons les treves entre el propietari i el país seleccionat. L'escala va del vermell fosc al groc. Si el país és gris, no hi ha treva. Les ratlles verdes indiquen que el país seleccionat té un casus belli contra ell."
 MAPMODE_UNREST_DESC:0 "Acoloreix les províncies segons l'agitació. El vermell indica províncies amb molta agitació, el groc agitació moderada i el verd poca o cap agitació. Les ratlles indiquen una província controlada per rebels."
 MAPMODE_COLONIAL_DESC:0 "Acoloreix les províncies segons l'abast colonial i la disponibilitat per colonitzar. El verd indica províncies no colonitzades que es poden colonitzar, el vermell províncies massa llunyanes per colonitzar-les i el blau províncies en procés de colonització; com més fosc és el blau, més avançada està. El gris indica províncies o ciutats ja colonitzades."
 MAPMODE_RIVALS_DESC:0 "Acoloreix les províncies dels països que heu designat com a rivals o que us han designat a vosaltres com a rival."
 MAPMODE_REBELTYPES_DESC:0 "Acoloreix les províncies segons el tipus de faccions rebels que hi ha al vostre país."
 MAPMODE_GOVERNMENT_DESC:0 "Acoloreix les províncies de manera que cada tipus de govern es mostri d'un color diferent."
 MAPMODE_OVERSEAS_DESC:0 "Acoloreix en vermell les províncies que compten com a d'ultramar, i en verd les que no."
 MAPMODE_PLAYERS_DESC:0 "Acoloreix les províncies segons els jugadors i mostra el nom de cada jugador sobre el país que juga."
 MAPMODE_CLIMATE_DESC:0 "Acoloreix les províncies segons el clima i hi representa les províncies àrides, àrtiques i tropicals."
 MAPMODE_WEATHER_DESC:0 "Acoloreix les províncies segons el temps que hi sol fer."
 MAPMODE_TRADE_GOODS_DESC:0 "Mostra quines mercaderies es produeixen a cada província."
 MAPMODE_FEDERATIONS_DESC:0 "Mostra les federacions que hi ha al món."
 MAPMODE_LOCAL_AUTONOMY_DESC:0 "Com més verda és la província, més a prop del 0% és l'autonomia local. Com més vermella és la província, més a prop del 100% és l'autonomia local."
 MAPMODE_ACCEPTEDCULTURES_DESC:0 "Acoloreix les províncies segons les cultures acceptades i en mostra els noms. La cultura principal és verd clar, les cultures acceptades verd fosc, les cultures del mateix grup que la vostra cultura principal són grogues i les cultures no acceptades són vermelles. Si esteu convertint una cultura no acceptada, es mostrarà taronja en lloc de vermella."
 MAPMODE_SIMPLE_TERRAIN_DESC:0 "Mostra el terreny. Cada color representa un tipus de terreny. Una frontera blava indica que els exèrcits que la travessin patiran una penalització per travessar-la. Les ratlles indiquen províncies amb un controlador que no n'és el propietari."
 MAPMODE_PATRIARCHS_DESC:2 "Mostra els estats on hi ha una organització local (com ara ordes sagrats). També mostra els metropolitans consagrats i els paixàs."
 MAPMODE_DEVASTATION_DESC:1 "Mostra el grau de devastació de les províncies. Com més vermell intens, més devastada és la província; el gris indica que no hi ha devastació."
 MAPMODE_DYNASTY:0 "Dinàstic"
 MAPMODE_DYNASTY_DESC:0 "Acoloreix les províncies segons les dinasties regnants i en mostra els noms."
 MAPMODE_TRADE_LEAGUES:0 "Lligues comercials"
 MAPMODE_TRADE_LEAGUES_DESC:0 "Acoloreix les províncies segons la lliga comercial a la qual pertanyen. Si lidereu una lliga comercial, també mostra quins països s'hi poden unir i si ho voldrien fer."
 MAPMODE_GREAT_POWERS:0 "Grans potències"
 MAPMODE_GREAT_POWERS_DESC:0 "Acoloreix les províncies segons l'estatus de gran potència que tenen actualment. Les grans potències apareixen amb els colors del seu país, mentre que la resta de països apareixen en gris. Els països que estan perdent l'estatus de gran potència apareixen ratllats."
 MAPMODE_LOOT:0 "Botí"
 MAPMODE_LOOT_DESC:0 "Acoloreix les províncies dels països amb què esteu en guerra segons quant botí hi queda."
 MAPMODE_STATES_TERRITORIES:0 "Estats i territoris"
 MAPMODE_STATES_TERRITORIES_DESC:0 "Acoloreix en verd les províncies que pertanyen a estats, i en groc les que pertanyen a territoris. L'estat de la capital és verd intens."
 MAPMODE_STATES_EDICTS:0 "Edictes estatals"
 MAPMODE_STATES_EDICTS_DESC:0 "Acoloreix les províncies segons l'edicte que tenen actualment."
