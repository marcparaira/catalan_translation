 CULTURE_DESC:0 "Les províncies produeixen menys i es revolten més fàcilment si la seva cultura és diferent de la de la nació. Les cultures es classifiquen automàticament com a acceptades o NO acceptades, segons quina part de la població representen. Normalment, la cultura més estesa és la cultura principal de la nació. Controlar províncies amb cultures del mateix grup cultural que la vostra cultura principal es penalitza menys que governar províncies d'una cultura completament aliena."
 PROVVIEW_CLAIM_CORE_DESC:0 "Els països següents consideren que aquesta província els pertany per dret, ja sigui perquè hi tenen una reclamació o perquè és una de les seves províncies nuclears."
