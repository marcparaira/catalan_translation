 CN_TAX_TOOLTIP1:0 "Aquesta opció determina l'impost base i els efectius de totes les províncies."
 CN_TAX_TOOLTIP2:0 "§YValors normals:§! totes les províncies tenen els seus valors històrics d'impostos i efectius.\n§YValors aleatoris:§! totes les províncies tenen valors aleatoris d'impostos i efectius.\n§YValors uniformes:§! totes les províncies tenen els mateixos valors d'impostos i efectius."
