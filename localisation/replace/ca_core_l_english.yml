 human_desc:0 "El governant §Y$ADJ$§! és un jugador humà."
 ai_capitalist_desc:0 "El governant §Y$ADJ$§! és un administrador. Intentarà millorar l'economia per tots els mitjans disponibles, però és menys procliu a la guerra, tret que afavoreixi els seus interessos comercials."
 ai_diplomat_desc:0 "El governant §Y$ADJ$§! és un diplomàtic. Buscarà amics poderosos i intentarà expandir-se per via diplomàtica, però és molt menys probable que entri en guerra, tret que sigui per recuperar territori perdut."
 ai_militarist_desc:0 "El governant §Y$ADJ$§! és un militarista. Intentarà expandir-se agressivament a costa dels veïns i és molt més probable que entri en guerra."
 ai_balanced_desc:0 "El governant §Y$ADJ$§! té una personalitat equilibrada. Intentarà trobar un equilibri entre la guerra, la diplomàcia i el comerç, i no es pot preveure que actuï de cap manera concreta."
 ai_colonialist_desc:0 "El governant §Y$ADJ$§! és un colonialista. Els seus interessos són l'expansió ultramarina i preferirà mantenir bones relacions amb els veïns propers."
