 attitude_unknown_desc:0 "§Y$COUNTRY$§! no coneix §Y$TARGET$§!."
 attitude_human_desc:0 "§Y$COUNTRY$§! és un jugador humà. La seva actitud envers §Y$TARGET$§! depèn completament d'ell."
 attitude_hostile_desc:1 "§Y$COUNTRY$§! veu §Y$TARGET$§! amb hostilitat oberta per la seva ambició de conquerir-ne algunes províncies o totes. La diplomàcia amb una nació hostil és gairebé sempre inútil."
 attitude_rivalry_desc:0 "§Y$COUNTRY$§! ha fet de §Y$TARGET$§! el seu rival i vol superar-lo en tot. Els països solen triar com a rivals nacions properes de força similar. La diplomàcia amb un país rival és gairebé sempre inútil."
 attitude_defensive_desc:1 "§Y$COUNTRY$§! considera §Y$TARGET$§! el seu aliat en una aliança defensiva. És poc probable que s'uneixi a cap guerra d'agressió que aquest iniciï."
 attitude_outraged_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! un conqueridor agressiu i vol posar-lo al seu lloc. Pot ser l'eix d'una coalició contra ell."
 attitude_friendly_desc:1 "§Y$COUNTRY$§! considera §Y$TARGET$§! un aliat natural contra altres nacions que l'amenacen. És probable que n'intenti aconseguir l'aliança."
 attitude_protective_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! part de la seva esfera d'influència i el voldrà protegir dels agressors garantint-ne la independència o fent-lo el seu vassall."
 attitude_overlord_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! la seva nació súbdita."
 attitude_loyal_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! el seu senyor sobirà."
 attitude_disloyal_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! un sobirà opressor. És poc probable que l'ajudi gaire en les guerres."
 attitude_rebellious_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! un tirà injust. És probable que li declari una guerra d'independència."
 attitude_domineering_desc:0 "§Y$COUNTRY$§! veu §Y$TARGET$§! com el seu futur súbdit i no dubtarà a declarar-li la guerra per sotmetre'l al vassallatge."
 attitude_threatened_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! una amenaça per a la seva independència. Intentarà aliar-s'hi per garantir la seva seguretat, però si no ho aconsegueix pot buscar aliats forts en altres llocs."
 attitude_neutral_desc:1 "§Y$COUNTRY$§! no té cap opinió concreta sobre §Y$TARGET$§!, ja sigui per la distància o per la manca d'interessos comuns. La diplomàcia amb una nació neutral és una mica més difícil."
 attitude_allied_desc:0 "§Y$COUNTRY$§! considera §Y$TARGET$§! un aliat valuós."
