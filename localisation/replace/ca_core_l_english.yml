 FE_BONUSES_DESC:0 "Cada nivell de §Ydificultat§! atorga bonificacions diferents a les nacions dels jugadors o de la IA per ajustar la dificultat general del joc. En Normal, cap nació no rep bonificacions. En Fàcil, la IA és més indulgent amb els jugadors, mentre que en Difícil és molt més agressiva."
 FE_BONUSES_SCORE:0 "En $NAME|Y$, hi ha una bonificació de puntuació de $SCORE$."
 FE_BONUSES_DESC2:0 "En la dificultat §Y$NAME$§!, totes les nacions de la IA obtenen les bonificacions següents:"
 FE_BONUSES_DESC3:0 "En la dificultat §Y$NAME$§!, totes les nacions dels jugadors i els seus súbdits obtenen les bonificacions següents:"
 FE_LUCK_DESC:0 "L'opció §YNacions afortunades§! atorga bonificacions especials de «sort» a algunes nacions de la IA."
 FE_LUCK_DESC2:0 "§YHistòriques:§! les bonificacions de sort s'atorguen a deu nacions que van tenir èxit històricament. Sol donar un món més històric.\n§YAleatòries:§! les bonificacions de sort s'atorguen a deu nacions triades a l'atzar (amb preferència per les potències més grans i avançades). Sol donar un món més aleatori.\n§YCap:§! cap nació no rep bonificacions de sort.\n\n"
 FE_LUCK_DESC3:0 "Les nacions amb §Ysort§! tenen monarques més capaços i reben les bonificacions següents:\n"
 FE_IRONMAN_DESC:0 "El §Ymode Ironman§! és per als jugadors que volen una partida més exigent, en què no puguin tornar a carregar quan les coses vagin malament per a la seva nació."
 FE_IRONMAN_DESC2:0 "Jugar en §Ymode Ironman§! té els efectes següents:\n- Limita a un el nombre de fitxers desats per partida.\n- Desament automàtic freqüent i obligatori.\n- No es poden fer servir trucs de la consola.\n- No es pot canviar de país."
 FE_HOTJOIN_DESC:1 "Activa o desactiva la possibilitat que altres jugadors s'uneixin a la partida després que comenci. Aquesta opció també es pot canviar durant la partida."
 FE_COOP_DESC:1 "Activa o desactiva la possibilitat que diversos jugadors gestionin el mateix país alhora. Aquesta opció també es pot canviar durant la partida."
