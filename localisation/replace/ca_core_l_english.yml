 AND_MONTHLY_THE_FOLLOWING:1 "I canvia $VAL|Y1$ cada mes a causa de:\n$DESC$"
 PIETY_DESCRIPTION:2 "La pietat representa el tipus de devoció religiosa que el vostre governant promou a la nació. Es mesura en una escala entre -100 (§Ymisticisme§!) i 100 (§Ylegalisme§!).\nDiverses accions que podeu emprendre afecten la pietat del vostre governant. Les opcions dels esdeveniments desplaçaran la vostra posició a l'escala, igual que declarar la guerra a infidels (augmenta) o a germans en la fe (disminueix)."
 PIETY_DESCRIPTION_ESTATES:1 "\nEl tipus de pietat del vostre governant influirà en la lleialtat dels vostres estaments."
 KARMA_DESC2:0 "El karma representa la virtut de les vostres accions passades als ulls de la fe budista, i puja o baixa segons la moralitat de les accions que emprengueu. Un governant amb un karma massa extrem es desentendrà del món. Un karma massa alt fa perdre la confiança del soldat comú, mentre que un karma massa baix us farà ineficaços en l'àmbit diplomàtic. Els països amb karma no paguen cap cost de poder diplomàtic per retornar nuclis ni per alliberar països i vassalls en els tractats de pau."
 KARMA_DESC:0 "El karma augmenta per:\n- §YRespectar les aliances§!\n- §YAlliberar vassalls§!\n- §YAlliberar nacions en els tractats de pau§!\n- §YRetornar nuclis§!\n- §YConvertir províncies§!\n\nEl karma disminueix per:\n- §YComençar guerres§!\n- §YPrendre províncies en els tractats de pau§!"
 PATRIARCH_DESCRIPTION:1 "L'autoritat patriarcal representa el grau d'influència que l'Església ortodoxa té sobre la nació. A les províncies ortodoxes, una autoritat patriarcal alta reduirà l'agitació local i augmentarà el nombre de reclutes que s'uneixen a l'exèrcit."
