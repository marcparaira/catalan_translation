 CN_MAP_TOOLTIP2:0 "§YConfiguració normal:§! el mapa es poblarà amb nacions històriques i les nacions personalitzades estan §Gactivades§!.\n§YConfiguració històrica:§! el mapa es poblarà amb nacions històriques i les nacions personalitzades estan §Rdesactivades§!.\n§YConfiguració aleatòria:§! el mapa es poblarà amb §Ynacions personalitzades creades pels jugadors i nacions generades aleatòriament§!.\n§YConfiguració personalitzada:§! el mapa es poblarà §Ynomés amb nacions personalitzades creades pels jugadors§!, i la resta de províncies quedaran sense colonitzar. Totes les nacions comencen amb un colon."
