l_english:
 LOADING_TIP_0:0 "Les repúbliques fan eleccions cada 4-8 anys."
 LOADING_TIP_1:0 "El desgast a l'hivern pot ser molt sever.\nPotser és millor replegar-se i planificar la campanya de primavera."
 LOADING_TIP_2:0 "Els consellers no només donen una bonificació de la seva especialitat.\nTambé augmenten el vostre poder administratiu, diplomàtic o militar."
 LOADING_TIP_3:0 "Perdre una guerra i unes quantes províncies no és motiu per rendir-se.\nLes podeu recuperar més endavant, en un moment de debilitat de l'enemic."
 LOADING_TIP_4:0 "No cal que prengueu totes les províncies de l'enemic en una sola guerra.\nHi haurà temps de sobres per a més guerres més endavant."
 LOADING_TIP_5:0 "Assegureu-vos sempre que els vostres exèrcits tenen un líder abans d'enfrontar-vos a l'enemic.\nEls exèrcits sense líder tenen més probabilitats de perdre i poden quedar desfets del tot."
 LOADING_TIP_6:0 "Quan no teniu cap unitat seleccionada, podeu fer clic dret\nen una província per obrir la diplomàcia amb aquella nació."
 LOADING_TIP_7:0 "Assegureu-vos de tenir una reclamació sobre una província enemiga.\nMés endavant serà més barat i ràpid convertir-la en nucli."
 LOADING_TIP_8:0 "Feu clic dret en una alerta per descartar-la, i Maj+clic dret\nper desactivar-la. Les podeu tornar a activar a l'esquema."
 LOADING_TIP_9:0 "Es desa l'última oferta de pau que heu enviat a la guerra actual.\nAixí, si l'enemic no l'accepta ara, la podeu tornar a enviar fàcilment."
 LOADING_TIP_10:0 "Tenir una reclamació redueix un 10% el cost i el temps\nde convertir la província en nucli."
 LOADING_TIP_11:0 "No establiu massa relacions diplomàtiques. Perdreu\npoder diplomàtic si supereu el vostre límit de relacions diplomàtiques."
 LOADING_TIP_12:0 "Els vaixells lleugers són la clau per assegurar les oportunitats comercials."
 LOADING_TIP_13:0 "Augmentar l'estabilitat costa poder administratiu.\nTingueu-ho en compte abans d'acceptar una pèrdua d'estabilitat per un esdeveniment."
 LOADING_TIP_14:0 "El primer grup d'idees es desbloqueja amb\nel nivell 5 de tecnologia administrativa."
 LOADING_TIP_15:0 "Valoreu els vostres punts de monarca. Són molt importants\nper a la tecnologia i les idees."
 LOADING_TIP_16:0 "L'esgotament bèl·lic es pot reduir gastant poder diplomàtic."
 LOADING_TIP_17:0 "Tenir massa líders us costarà poder militar cada mes."
 LOADING_TIP_18:0 "Compte amb la sobreextensió. Tenir massa\nprovíncies sense nucli pot ser perillós."
 LOADING_TIP_19:0 "El comerç que va als nodes finals de Venècia, Gènova\ni el canal de la Mànega no es pot desviar."
 LOADING_TIP_20:0 "Feu clic esquerre en una província per obrir-ne la vista.\nFeu clic dret en una província per obrir la diplomàcia amb el propietari."
 LOADING_TIP_21:0 "Els forts assetjats de les províncies costaneres es rendiran abans si hi ha un bloqueig naval."
 LOADING_TIP_22:0 "El vostre node comercial d'origen recaptarà ingressos comercials,\nfins i tot si no hi teniu cap mercader assignat."
 LOADING_TIP_23:0 "Controlar una bona part de la producció mundial d'una mercaderia atorga bonificacions úniques relacionades amb aquell producte."
 LOADING_TIP_24:0 "Les províncies dels països molt mercantils atorguen més poder comercial als nodes comercials per on passa el seu comerç."
 LOADING_TIP_25:0 "Podeu fer servir el llibre major per comparar el poder econòmic i militar del vostre país amb el d'altres."
 LOADING_TIP_26:1 "Quan alleugeriu un fort assetjat, els vostres exèrcits es consideren els defensors."
 LOADING_TIP_27:0 "Una estabilitat alta augmenta les possibilitats d'heretar els països amb què teniu una unió personal."
 LOADING_TIP_28:1 "No gasteu tot el poder administratiu mentre esteu en guerra.\nEn podeu necessitar per convertir en nucli les províncies que conquereu."
 LOADING_TIP_29:0 "Tots els modificadors de comerç es detallen i s'expliquen a la pantalla de comerç del vostre país."
 LOADING_TIP_30:0 "Els vostres vaixells patiran desgast a les províncies oceàniques\nfins que arribeu al nivell 22 de tecnologia diplomàtica."
 LOADING_TIP_31:0 "Trieu els grups d'idees amb cura!"
 LOADING_TIP_32:0 "Convertir províncies en nucli és més car si teniu esgotament bèl·lic."
 LOADING_TIP_33:0 "Com més autonomia tinguin les vostres províncies, menys impostos i efectius n'obtindreu."
 LOADING_TIP_34:0 "Enviar vaixells lleugers a protegir el comerç augmentarà la vostra tradició naval."
 LOADING_TIP_35:0 "La tradició naval augmenta la vostra capacitat de dirigir el comerç."
 LOADING_TIP_36:0 "Assignar un líder amb maniobra a una flota que protegeix el comerç n'augmentarà l'eficiència."
 LOADING_TIP_37:0 "Les vostres tropes poden patir més desgast durant l'hivern."
 LOADING_TIP_38:0 "El nombre de reforços mensuals depèn del control de manteniment de l'exèrcit."
 LOADING_TIP_39:0 "Els governants i els hereus que comanden un exèrcit poden morir en batalla.\nPenseu-vos-ho dues vegades abans d'assignar-los-hi!"
 LOADING_TIP_40:0 "Fins i tot una petita bonificació de setge pot escurçar molt un setge."
 LOADING_TIP_41:0 "Reduir el cost de reclutament d'una unitat també en redueix el cost de manteniment."
 LOADING_TIP_42:0 "El cost dels consellers augmenta amb el pas del temps."
 LOADING_TIP_43:0 "Podeu retirar el colon després d'establir una colònia. Reduirà el creixement de la colònia, però us permetrà colonitzar una altra província."
 LOADING_TIP_44:0 "Superar el límit de colònies augmentarà molt el manteniment colonial."
 LOADING_TIP_45:0 "No prengueu massa terra de cop.\nLa sobreextensió anuncia problemes!"
 LOADING_TIP_46:0 "La sobreextensió augmenta el cost d'augmentar l'estabilitat."
 LOADING_TIP_47:0 "Una unitat religiosa més baixa augmentarà l'agitació a les vostres províncies."
 LOADING_TIP_48:0 "Les colònies d'ultramar no sumen sobreextensió.\nPerò les ciutats conquerides sí!"
 LOADING_TIP_49:0 "Bloquejar els ports enemics no només en redueix els ingressos provincials, sinó també el poder comercial."
 LOADING_TIP_50:0 "Tant demanar préstecs com concedir-ne augmenta la inflació."
 LOADING_TIP_51:0 "Els mercenaris poden ser útils per estalviar efectius, si us els podeu permetre."
 LOADING_TIP_52:0 "Augmentar l'autonomia d'una província en reduirà l'agitació, però us aportarà menys impostos."
 LOADING_TIP_53:0 "Triar rivals perjudica les relacions amb ells, però us fa guanyar més prestigi en batalla i us permet reclamar més terres seves."
 LOADING_TIP_54:0 "Controlar províncies en nodes comercials importants és vital per aconseguir un imperi comercial mundial."
 LOADING_TIP_55:0 "Les coalicions poden ser una eina molt poderosa per fer front a un enemic superior."
 LOADING_TIP_56:0 "No us precipiteu: abans de declarar la guerra, assabenteu-vos de qui són els amics i els enemics del vostre adversari. Us poden ser útils per assolir els vostres objectius."
 LOADING_TIP_57:0 "Els exèrcits, les armades i els consellers s'encareixen amb el temps.\nAssegureu-vos que la vostra economia creix prou per poder-los mantenir."
 LOADING_TIP_58:0 "Construir edificis pot augmentar molt el valor de les vostres províncies."
 LOADING_TIP_59:0 "El valor de les mercaderies augmenta directament els ingressos de producció d'una província."
 LOADING_TIP_60:0 "Crear un nucli en una província és més barat si hi teniu una reclamació."
 LOADING_TIP_61:0 "Assegureu-vos de conquerir els vostres objectius de guerra: us ajudaran a guanyar puntuació de guerra més ràpidament."
 LOADING_TIP_62:0 "L'expansió agressiva afecta més els vostres veïns que els països llunyans."
 LOADING_TIP_63:0 "Vigileu la vostra expansió agressiva o podríeu convertir-vos en l'objectiu d'una coalició."
 LOADING_TIP_64:0 "La vassallització i l'annexió diplomàtica us poden ajudar a expandir el vostre regne sense inquietar els veïns."
 LOADING_TIP_65:0 "Si el joc us sembla massa difícil, proveu de rebaixar-ne la dificultat."
 LOADING_TIP_66:0 "Feu una guerra cara?\nNo tingueu por d'apujar els impostos de guerra o de demanar un préstec."
 LOADING_TIP_67:0 "Cada grup d'idees nacionals té associat un conjunt únic d'esdeveniments aleatoris. Alguns són útils i d'altres no."
 LOADING_TIP_68:0 "L'emperador del Sacre Imperi Romanogermànic pot nomenar nous electors si n'hi ha menys de set."
 LOADING_TIP_69:0 "No es pot assaltar un fort fins que no s'han obert bretxes a les seves muralles."
 LOADING_TIP_70:0 "Les galeres excel·leixen combatent als mars interiors.\nPer exemple, la Bàltica, la Mediterrània i la mar Negra."
 LOADING_TIP_71:1 "El desgast mata!\nAssignar un líder amb molta maniobra reduirà el desgast d'una unitat."
 LOADING_TIP_72:0 "Premeu F10 per desar una captura del mode de mapa que tingueu seleccionat."
 LOADING_TIP_73:0 "Reduir el manteniment naval redueix el poder comercial dels vaixells. Si teniu molts vaixells lleugers, perdreu ingressos en rebaixar-ne el manteniment."
 LOADING_TIP_74:0 "L'esgotament bèl·lic només disminueix lentament en temps de pau, i gens en temps de guerra."
 LOADING_TIP_75:0 "Vigileu les coalicions. Ensopegar amb una guerra contra la majoria dels vostres veïns pot ser perillós."
 LOADING_TIP_76:1 "No només podeu fabricar reclamacions sobre províncies adjacents, sinó també sobre totes les províncies que comparteixen una zona marítima amb algun dels vostres nuclis."
 LOADING_TIP_77:0 "Moltes accions habituals tenen dreceres de teclat.\nConsulteu els indicadors de funció per descobrir-les."
 LOADING_TIP_78:0 "Feu servir Control més una tecla numèrica per assignar una unitat seleccionada a un grup de control. Premeu només la tecla numèrica per seleccionar-la a l'instant."
 LOADING_TIP_79:1 "Els efectius es recuperen lentament. Penseu a contractar companyies de mercenaris per estalviar-ne."
 LOADING_TIP_80:0 "Premeu la tecla Inici per anar a la província capital."
 LOADING_TIP_81:0 "Els consellers hàbils són molt més cars que els menys hàbils. Assegureu-vos que us podeu permetre consellers de més nivell abans de contractar-los."
 LOADING_TIP_82:0 "No us fixeu només en els punts de foc i xoc quan compareu unitats militars. Tingueu en compte també els vostres modificadors de foc i xoc."
 LOADING_TIP_83:0 "Els forts de nivell alt són pràcticament inexpugnables sense artilleria. Assegureu-vos de portar-hi prou potència de foc."
 LOADING_TIP_84:0 "Moure un exèrcit a una província rebel pot reduir considerablement l'agitació local."
 LOADING_TIP_85:0 "Podeu fer servir la flota per impedir que l'enemic travessi un estret."
 LOADING_TIP_86:0 "Trobareu les captures de pantalla del joc aquí: ../Documents/Paradox Interactive/Europa Universalis IV/Screenshots"
 LOADING_TIP_87:0 "Premeu F11 per desar una captura de pantalla del joc."
 LOADING_TIP_88:0 "Manteniu premuda la tecla Maj mentre doneu ordres a una unitat per traçar-ne un camí personalitzat."
 LOADING_TIP_89:0 "Podeu esborrar partides desades des del joc fent clic al botó d'esborrar d'una partida."
 LOADING_TIP_90:0 "Les tecles Z i C serveixen per cancel·lar i confirmar les decisions d'esdeveniments i de diplomàcia."
 LOADING_TIP_91:0 "La tecla B obre la interfície per reequilibrar l'exèrcit."
 LOADING_TIP_92:0 "Amb la interfície de reequilibrar l'exèrcit oberta, les tecles Z i B serveixen per passar unitats d'un costat a l'altre."
 LOADING_TIP_94:0 "L'Imperi Otomà és la nació més forta del joc, i és la recomanada si sou principiants."
 LOADING_TIP_95:0 "Molt fàcil és adequat per als principiants que troben massa exigent el nivell Normal."
 LOADING_TIP_96:0 "En la dificultat Difícil, la IA és tan hàbil com pot i gairebé no fa trampes."
 LOADING_TIP_97:0 "En la dificultat Molt difícil, la IA és tan hàbil com pot i fa moltes trampes perquè fins i tot jugar amb grans nacions sigui un repte."
 LOADING_TIP_98:1 "Aprofiteu el terreny! Col·loqueu els exèrcits de manera que, si us ataquen,\nl'atacant hagi de travessar un riu o un terreny difícil."
 LOADING_TIP_99:0 "Un exèrcit que assetja una fortalesa en territori enemic compta com a atacant si l'ataquen, i pateix les penalitzacions del terreny."
 LOADING_TIP_100:0 "Aquest joc costa molt de dominar: no us estranyi seguir aprenent coses noves després de mil hores de joc."
 LOADING_TIP_101:0 "Podeu perdre una batalla (o més) i, tot i així, guanyar la guerra.\nSovint val la pena continuar lluitant després dels primers contratemps."
