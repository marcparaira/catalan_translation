 IS_NOT_FORMER_COLONIAL_NATION:0 "NO és una antiga nació colonial"
 IS_FORMER_COLONIAL_NATION:0 "És una antiga nació colonial"
 native_adm_ideas:0 "Idees administratives indígenes"
 native_dip_ideas:0 "Idees diplomàtiques indígenes"
 native_mil_ideas:0 "Idees militars indígenes"
 migrative_traditions:0 "Tradicions migratòries"
 migrative_traditions_desc:0 "La nostra tradició de traslladar els poblats quan la terra s'empobreix ens ha portat a millorar els mètodes de construcció. Si aprofitem aquests nous mètodes i els difonem, en podrem treure un gran benefici."
 clan_societies:0 "Societats de clans"
 clan_societies_desc:0 "Si cada clan de la nostra societat assumís un paper diferent en les cerimònies i en la vida quotidiana, podríem governar la nostra nació amb molta més eficiència."
 wampum_belts:0 "Cinturons de wampum"
 wampum_belts_desc:0 "Si fem servir imatges, cinturons de wampum i art per representar els nostres ritus i cerimònies sagrats, i els grans fets de la nostra història, podrem garantir la continuïtat i l'estabilitat de la nostra societat."
 law_of_peace:0 "Llei de la pau"
 law_of_peace_desc:0 "Si establim normes que regeixin la vida del nostre poble i que determinin com s'han de resoldre els conflictes entre els clans, aconseguirem una pau més duradora entre la nostra gent."
 tribal_constitution:0 "Constitució tribal"
 tribal_constitution_desc:0 "Si desenvolupem les funcions i els poders de les persones que governen la nostra nació, millorarem molt la nostra capacitat d'autogovern."
 travois:0 "Travois"
 travois_desc:0 "Si lliguem fustes a una plataforma arrossegada per un gos o per un animal més gros, ens serà molt més fàcil transportar càrregues pesants a grans distàncies, fins i tot per terrenys accidentats i irregulars."
 smoke_ceremonies:0 "Cerimònies del fum"
 smoke_ceremonies_desc:0 "L'ús cerimonial de pipes i tabac és un art antic del nostre poble. Si fem servir aquestes cerimònies del fum per segellar paus i pactes, podrem donar més autoritat als nostres acords i tractes."
 trade_diplomacy:0 "Diplomàcia comercial"
 trade_diplomacy_desc:0 "En el tracte amb altres pobles hem descobert una constant: el llenguatge dels regals i del comerç és universal. Si fem servir el comerç per fer-nos imprescindibles per als veïns, les nostres relacions en sortiran molt beneficiades."
 clan_migrations:0 "Migracions de clans"
 clan_migrations_desc:0 "Les regions del nostre voltant sovint són habitades per tribus desorganitzades i aïllades. Si fem que alguns clans del nostre poble s'estableixin en aquestes regions, podrem estendre la nostra influència fins a noves fronteres."
 talking_leaves:0 "Fulles parlants"
 talking_leaves_desc:0 "Si poguéssim idear una manera de deixar constància permanent dels nostres tractes amb símbols que representin sons, com fan altres pobles, milloraríem molt la nostra capacitat de comerciar i de fer diplomàcia."
 warrior_societies:0 "Societats guerreres"
 warrior_societies_desc:0 "La creació de prestigioses societats de guerrers encoratjarà els nostres joves a mostrar més valentia al camp de batalla."
 raid_warfare:0 "Guerra d'incursions"
 raid_warfare_desc:0 "Amb atacs ràpids i sigil·losos podem agafar els enemics desprevinguts i matar-ne molts abans que tinguin ocasió de girar-se contra nosaltres."
 tribal_adoptions:0 "Adopcions tribals"
 tribal_adoptions_desc:0 "Per augmentar el nostre nombre, hauríem de capturar presoners d'altres tribus sempre que puguem i després adoptar-los entre els nostres."
 trail_networks:0 "Xarxes de senders"
 trail_networks_desc:0 "Si estudiem la configuració del terreny, sabrem quins senders poden seguir amb seguretat les nostres tropes i quins han d'evitar, de manera que reduirem al mínim les pèrdues."
 flexible_warfare:0 "Guerra flexible"
 flexible_warfare_desc:0 "A mesura que descobrim noves tàctiques i armes entre els enemics i els altres pobles que trobem, ens hem de mantenir sempre flexibles per poder-les incorporar a les nostres estratègies."
 la_plata_nation_title:0 "Formar la nació rioplatenca"
 la_plata_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 haiti_nation_title:0 "Formar la nació haitiana"
 haiti_nation_desc:0 "No n'hi ha prou d'haver expulsat els bàrbars que han ensangonat la nostra terra. Hem d'assegurar per sempre la llibertat al país on vam néixer i treure al govern inhumà que ens va oprimir durant tant de temps qualsevol esperança de tornar-nos a esclavitzar. Al capdavall, hem de viure independents o morir."
 colombia_nation_title:0 "Formar la nació colombiana"
 colombia_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 chile_nation_title:0 "Formar la nació xilena"
 chile_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 canada_nation_title:0 "Formar la nació canadenca"
 canada_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 venezuela_nation_title:0 "Formar la nació veneçolana"
 venezuela_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 usa_nation_title:0 "Formar la nació nord-americana"
 usa_nation_desc:0 "Durant molt de temps aquestes orgulloses colònies han estat sotmeses a la cobdícia i l'opressió de les potències europees, però això s'ha acabat! L'onada de llibertat a les colònies ens ha donat l'oportunitat de formar una orgullosa federació d'estats independents lliures de tirania: els Estats Units d'Amèrica!"
 upca_nation_title:0 "Formar la nació centreamericana"
 upca_nation_desc:0 "El nostre poble ha suportat anys d'ingerències estrangeres, submissió i incursions, i té les terres dividides... Prou! Ha arribat l'hora d'alliberar i unir el nostre poble sota una sola bandera i escriure el nostre propi destí. Formarem una nació liberal enriquida pel comerç que passa entre els oceans Atlàntic i Pacífic."
 quebec_nation_title:0 "Formar la nació quebequesa"
 quebec_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 peru_nation_title:0 "Formar la nació peruana"
 peru_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 paraguay_nation_title:0 "Formar la nació paraguaiana"
 paraguay_nation_desc:0 "Ha arribat l'hora d'espolsar-nos les últimes restes del nostre passat colonial. Hem de formar una nació com cal i consolidar les nostres reclamacions sobre aquesta regió."
 mexico_nation_title:0 "Formar la nació mexicana"
 mexico_nation_desc:0 "Hem de deixar enrere les últimes restes de la nostra herència colonial i convertir-nos en un estat independent com cal. La nació mexicana serà la protectora de tota Mesoamèrica!"
 louisiana_nation_title:0 "Formar la nació louisianesa"
 louisiana_nation_desc:0 "La nostra gent ha hagut d'adoptar un dur estil de vida de frontera en aquestes grans terres salvatges. Ara som, simplement, un poble diferent dels europeus: una raça d'homes més aspra i més dura, més feréstega, que es casa amb els indis. Construïm sobre el comerç i el sòl d'aquestes riques terres fluvials, i meravellem el món amb la nostra fermesa."
 brazil_nation_title:0 "Formar la nació brasilera"
 brazil_nation_desc:0 "Els amos colonials que ens volien esclavitzar ja no hi són. És hora de formar un país propi i veritablement independent. D'avui endavant, la consigna del Brasil serà «Independència o mort!»"
 heretic_tolerance:0 "Tolerància amb els heretges"
 desc_heretic_tolerance:0 "Els creients heretges han pogut exigir grans concessions per mitjà de la força militar."
 visit_of_the_four_kings:0 "Visita dels quatre reis"
 random_event.EVTNAME20:0 "Els quatre reis"
 random_event.EVTDESC20:0 "Una delegació de les Cinc Nacions dels iroquesos ha fet el feixuc viatge per mar i ha arribat a [Root.Capital.GetCapitalName] amb la intenció de formar una aliança amb nosaltres, i sense voler-ho s'ha convertit en tota una sensació. La gent comuna els saluda i els aclama quan recorren els nostres carrers en carruatges reials, i els nobles es disputen el privilegi d'agasallar aquests «quatre reis» dels mohawks.\n\nTenen una presència imponent, són molt més alts que un home normal d'aquí i porten calces, armilles i mitges negres, i a sobre unes capes escarlates amb ribets d'or. Tenen la pell fosca, els ulls foscos i uns tatuatges fantàstics com no n'havíem vist mai. No parlen la nostra llengua, però després d'un intercanvi de regals han fet llegir un discurs en nom seu en què demanen millors relacions i ajuda contra els nostres enemics comuns, i ens expliquen les seves penúries, cosa que ha fet plorar alguns membres de la cort. N'han deixat ben bona impressió."
 random_event.EVTOPTA20:0 "Donar-los una cadena d'acer que representi el nostre vincle indestructible"
 random_event.EVTOPTB20:0 "Fer-los regals però sense prometre res"
 random_event.EVTOPTC20:0 "No donar-los res: aquests homes són salvatges, no reialesa"
 random_event.EVTNAME21:0 "La Bíblia traduïda"
 random_event.EVTDESC21:0 "Un sacerdot que viu a [Root.GetCapitalName] ha traduït la Bíblia a la nostra llengua i n'ha començat a distribuir còpies als pobles dels voltants [Root.GetCaDeProv] [Root.GetName]."
 random_event.EVTOPTA21:0 "Heretgia! Cremar el sacerdot i els seus llibres!"
 random_event.EVTOPTB21:0 "Bones notícies! Difondre aquestes bíblies arreu"
 random_event.EVTNAME22:0 "Establir una colònia penal [Root.GetCaAProv] [Root.GetName]"
 random_event.EVTDESC22:0 "La nostra colònia [Root.GetCaAProv] [Root.GetName] no progressa tan de pressa com voldríem. Tanmateix, un dels vostres consellers ha ideat un pla per accelerar-ne el creixement. Proposa que enviem lladres, deutors i altres criminals [Root.GetCaAProv] [Root.GetName] perquè paguin el seu deute amb la societat treballant per desenvolupar la colònia i, un cop complerta la pena, s'hi estableixin com a colons. Tot i que sobre el paper el pla pot semblar bo, és possible que esclati una rebel·lió per haver concentrat tots aquests individus perillosos en un sol lloc."
 random_event.EVTOPTA22:0 "Sembla bona idea, endavant"
 random_event.EVTOPTB22:0 "No ens podem refiar d'aquesta gent! Mantenir-los a la presó aquí"
 penal_colony:0 "Colònia penal"
 desc_penal_colony:0 "Per ajudar la colònia a créixer, s'hi han enviat lladres, deutors i altres criminals perquè paguin el seu deute amb la societat treballant per desenvolupar-la."
 random_event.EVTNAME23:0 "Grip!"
 random_event.EVTDESC23:1 "Corre el rumor que uns mariners han tornat d'un viatge malalts com gossos, i que els que no han mort a bord han escampat la malaltia per [Root.GetCapitalName]. Cal actuar abans que tot el país mori de tos i suors fredes."
 random_event.EVTOPTA23:0 "Posar el port en quarantena i deixar-los morir!"
 random_event.EVTOPTB23:0 "No és la primera grip que tenim al país, tant me fa!"
 influenza_spreads:0 "Tard o d'hora la grip s'estendrà a una província veïna..."
 quarantined_influenza:0 "Grip en quarantena"
 desc_quarantined_influenza:0 "La província ha quedat en quarantena per aturar la propagació de la grip, però la manca d'ajuda hi ha tingut efectes devastadors."
 influenza:0 "Grip"
 desc_influenza:0 "La grip ha devastat la província, però s'han fet esforços per alleujar-ne el patiment."
 random_event.EVTNAME24:0 "La grip s'estén"
 random_event.EVTDESC24:0 "La grip s'ha estès [Root.GetCaAProv] [Root.GetName]! Com hem de fer front a aquesta epidèmia creixent?"
 random_event.EVTOPTA24:0 "Posar la província en quarantena!"
 random_event.EVTOPTB24:0 "Ja passarà"
 random_event.EVTNAME25:0 "Fúria iconoclasta"
 random_event.EVTDESC25:0 "Durant la Reforma hi va haver brots de destrucció d'art religiós catòlic en diversos països europeus. L'exemple més conegut és el "Beeldenstorm" als Països Baixos, però hi va haver atacs semblants a Alemanya, Suïssa, Anglaterra, Escòcia, França i Livònia. La majoria d'atacs els van dur a terme turbes espontànies, però en alguns països el govern hi va tenir un paper capdavanter."
 random_event.EVTOPTA25:0 "Enviar guàrdies per aturar aquests vàndals!"
 random_event.EVTOPTB25:0 "No podem fer res més que aguantar la tempesta!"
 random_event.EVTOPTC25:0 "És hora de prendre la iniciativa i trencar el jou del papa!"
 stopped_iconoclastic_fury:0 "Fúria iconoclasta aturada"
 allowed_iconoclastic_fury:0 "Fúria iconoclasta permesa"
 iconoclastic_fury:0 "Fúria iconoclasta"
 desc_iconoclastic_fury:0 "Els brots de destrucció d'art religiós catòlic arreu del país han fet fugir molta gent de casa seva i han trastornat la producció i el comerç."
 colonial_nation.EVTNAME300:0 "Prohibir el comerç de pells"
 colonial_nation.EVTDESC300:0 "La gent [Root.GetCaDeProv] [Root.GetName] té massa tracte amb els indis. S'ha presentat una proposta per prohibir tot comerç privat amb els indis, que inclou la pena de mort per a qualsevol que sigui enxampat ensenyant un indi a disparar una arma de foc. Aquesta nova llei perjudicarà l'economia local tant dels indis com de la població local, però ens protegirà de les incursions armades dels indis."
 colonial_nation.EVTOPTA300:0 "Aprovar la llei"
 colonial_nation.EVTOPTB300:0 "No fer cas del problema"
 colonial_nation.EVTNAME301:0 "La collita de [GetYear]"
 colonial_nation.EVTDESC301:0 "La collita [Root.GetCaAProv] [Root.GetName] ha estat molt dolenta aquest any i la manca d'aliments ja es fa notar a tota la colònia. Els preus s'enfilen i alguns pronostiquen que pot arribar un hivern dur. Els indis dels voltants s'han assabentat de la nostra difícil situació i ens han ofert de bon grat part de les seves provisions. El que han portat no basta ni de lluny per passar l'hivern, però segur que hi ha més blat de moro allà d'on ha sortit el regal. Alguns proposen que enviem soldats als poblats indis i que els prenguem els aliments."
 colonial_nation.EVTOPTA301:0 "Prendre el que ens cal"
 colonial_nation.EVTOPTB301:0 "Ho resoldrem nosaltres sols"
 colonial_nation.EVTNAME302:0 "Lleis salarials per als constructors"
 colonial_nation.EVTDESC302:0 "Els preus de la construcció pugen perquè hi ha escassetat de mà d'obra qualificada, ja que els nous colons que arriben a la colònia en demanen molt els serveis. S'ha proposat fixar un salari màxim a tot el territori [Root.GetCaDe] [Root.GetName] per a tots els fusters, serradors, picapedrers i paletes. El preu es fixarà a un nivell just, i qualsevol que demani una paga més alta o que ofereixi pagar més per feines de construcció serà sancionat. Què votem?"
 colonial_nation.EVTOPTA302:0 "Votar a favor, és una idea sensata"
 colonial_nation.EVTOPTB302:0 "No cal regular això"
 colonial_nation.EVTNAME303:0 "Descobriment de ferro"
 colonial_nation.EVTDESC303:0 "Per sostenir-nos, [Root.Owner.GetCaEl] [Root.Owner.GetName] ha de buscar noves fonts d'ingressos i reduir la dependència de les importacions. Tanmateix, s'ha presentat una gran oportunitat: s'ha descobert mineral de ferro de pantà [Root.GetCaAProv] [Root.GetName]! Es proposa obligar el propietari a construir-hi un forn i una farga i començar-hi la producció immediatament. A canvi, se li garantirà una exempció fiscal de 10 anys per subvencionar el cost inicial."
 colonial_nation.EVTOPTA303:0 "Sembla una bona oportunitat"
 colonial_nation.EVTOPTB303:0 "No, gràcies"
 colonial_nation.EVTNAME304:0 "Indústria llanera local"
 colonial_nation.EVTDESC304:0 "Els beneficis minvants del comerç colonial i la dependència dels béns importats comencen a perjudicar [Root.Owner.GetCaEl] [Root.Owner.GetName]. Hem de buscar la independència econòmica respecte de les importacions, i amb aquesta finalitat s'ha presentat una nova proposta. Si prohibim l'exportació d'ovelles i ordenem que es produeixi més llana localment, ens assegurarem que els colons tinguin prou roba d'abric. Per això, caldria posar en marxa una manufactura tèxtil [Root.GetCaAProv] [Root.GetName]."
 colonial_nation.EVTOPTA304:0 "Sembla una bona oportunitat"
 colonial_nation.EVTOPTB304:0 "No, gràcies"
 colonial_nation.EVTNAME305:0 "Cal un moll"
 colonial_nation.EVTDESC305:0 "Si [Root.Owner.GetCaEl] [Root.Owner.GetName] vol dependre menys [Root.Owner.ColonialParent.GetCaDe] [Root.Owner.ColonialParent.GetName] i avançar cap a l'autosuficiència, ens hem d'assegurar prou sal i subministraments navals. Un ciutadà destacat que viu a [Root.GetCapitalName] ens ha assegurat que, amb una mica d'ajuda, podria construir un nou moll [Root.GetCaAProv] [Root.GetName]. A canvi de la seva inversió, demana 10 anys de subvencions."
 colonial_nation.EVTOPTA305:0 "Sembla una bona oportunitat"
 colonial_nation.EVTOPTB305:0 "No, gràcies"
 colonial_nation.EVTNAME306:0 "Prohibició dels conreus comercials"
 colonial_nation.EVTDESC306:0 "A diferència dels fundadors [Root.Owner.GetCaDe] [Root.Owner.GetName], els nous colons solen ser curts de mires i posen els beneficis per davant de garantir el seu propi futur i el de les seves famílies. No tenen en compte la necessitat de produir aliments per a la colònia i es dediquen directament als conreus comercials, convençuts que els podran vendre i comprar menjar a altres pagesos. Si això continua, a la llarga la colònia patirà fam i desordres. Per evitar-ho, s'ha proposat una llei que obligui els nous pagesos a produir aliments almenys en una part dels seus camps."
 colonial_nation.EVTOPTA306:0 "Sembla que cal una llei"
 colonial_nation.EVTOPTB306:0 "No és cosa nostra"
 colonial_nation.EVTNAME307:0 "Prohibició de plantar tabac"
 colonial_nation.EVTDESC307:0 "Quan vam arribar aquí, els preus del tabac s'enfilaven i els beneficis eren immensos. Ara, a mesura que arriben més pagesos i obren les seves pròpies plantacions, l'oferta de tabac ha crescut ràpidament i ha fet baixar els preus a Europa any rere any. Els plantadors establerts han proposat prohibir la plantació de tabac durant un any perquè els preus tinguin temps de recuperar-se. Evidentment, els pagesos nous s'oposen a la proposta, però hem de fer el que calgui per protegir el nostre mitjà de vida."
 colonial_nation.EVTOPTA307:0 "Fer-la complir"
 colonial_nation.EVTOPTB307:0 "Rebutjar la proposta"
 colonial_nation.EVTNAME310:0 "Conflicte fronterer colonial"
 colonial_nation.EVTDESC310:0 "Colons d'una altra colònia [Root.Owner.ColonialParent.GetCaDe] [Root.Owner.ColonialParent.GetName] han travessat les nostres fronteres! A la recerca de recursos, s'han estès per terres que formen part [Root.GetCaDeProv] [Root.GetName] i han entrat en conflicte amb la població local. Això no es pot tolerar!"
 colonial_nation.EVTOPTA310:0 "Enviar la milícia local a fer-los fora!"
 colonial_nation.EVTOPTB310:0 "Deixar que la situació es resolgui sola"
 colonial_nation.EVTDESC311:0 "A la recerca de noves terres i recursos, colons [Root.GetCaDeProv] [Root.GetName] s'han aventurat a l'altra banda de la frontera, [From.GetCaAProv] [From.GetName], cosa que hi ha provocat conflictes amb la població local. [From.Owner.GetCaElCap] [From.Owner.GetName] hi ha enviat la seva milícia per fer-los fora, però sembla que la milícia ha anat massa lluny i la missió ha degenerat en una incursió de venjança [Root.GetCaAProv] [Root.GetName]. Això no es pot tolerar!"
 colonial_nation.EVTOPTA311:0 "Enviar-hi també la nostra milícia local!"
 colonial_nation.EVTOPTB311:0 "Deixar que la situació es resolgui sola"
 colonial_nation.EVTDESC312:0 "Potser ha estat un error enviar la nostra milícia a expulsar els colons rivals [From.From.GetCaDeProv] [From.From.GetName]. Encoratjades per l'èxit fàcil, les nostres tropes s'han deixat endur i han continuat fins [From.GetCaAProv] [From.GetName], on han saquejat els pobles fronterers. Això ha indignat molt [From.Owner.GetCaEl] [From.Owner.GetName], que al seu torn ha enviat la seva milícia [From.From.GetCaAProv] [From.From.GetName]..."
 colonial_nation.EVTOPTA312:0 "Maleïts siguin!"
 colonial_nation.EVTDESC313:0 "Ai... per on començar? Sembla que colons [From.Owner.GetCaDe] [From.Owner.GetName] s'han aventurat [From.From.GetCaAProv] [From.From.GetName], una província [From.From.Owner.GetCaDe] [From.From.Owner.GetName], a la recerca de noves terres i recursos. [From.From.Owner.GetCaElCap] [From.From.Owner.GetName] hi va enviar la seva milícia per fer-los fora, però es va excedir en el zel i va perseguir els colons fins [From.GetCaAProv] [From.GetName], saquejant i cremant. Després el conflicte es va agreujar quan [From.Owner.GetCaEl] [From.Owner.GetName] va enviar la seva milícia per expulsar la milícia [From.From.Owner.GetCaAdjFS] i fer les seves pròpies incursions [From.From.GetCaAProv] [From.From.GetName]...\n\n[From.From.Owner.Monarch.GetTitle] [From.From.Owner.GetCaDe] [From.From.Owner.GetName], [From.From.Owner.Monarch.GetName], culpa [From.Owner.Monarch.GetTitle] [From.Owner.GetCaDe] [From.Owner.GetName], [From.Owner.Monarch.GetName], i viceversa. Com ho podem resoldre sense quedar malament?"
 colonial_nation.EVTOPTA313:0 "Que s'ho arreglin entre ells"
 colonial_nation.EVTOPTB313:0 "Destituir [From.From.Owner.Monarch.GetTitle] [From.From.Owner.Monarch.GetName]"
 colonial_nation.EVTOPTC313:0 "Destituir [From.Owner.Monarch.GetTitle] [From.Owner.Monarch.GetName]"
 colonial_nation.EVTOPTD313:0 "Resoldre les seves diferències"
 colonial_nation.EVTDESC314:0 "En el recent conflicte a la frontera entre [From.From.From.GetName] i [From.From.GetName], [From.GetCaEl] [From.GetName] s'ha posat del costat [From.From.Owner.GetCaDe] [From.From.Owner.GetName]! [From.Monarch.GetTitle] [From.Monarch.GetName] ha decidit culpar de l'incident [Root.Monarch.GetTitle] [Root.Monarch.GetName] i ha prescindit dels serveis d'[Root.Monarch.GetHerHim]."
 colonial_nation.EVTOPTA314:0 "Qui s'ha cregut que és [From.Monarch.GetSheHe], amb tants aires de «[From.Monarch.GetTitle]»?!"
 colonial_nation.EVTDESC315:0 "En el recent conflicte a la frontera entre [From.From.From.GetName] i [From.From.GetName], [From.GetCaEl] [From.GetName] s'ha posat del nostre costat! [From.Monarch.GetTitle] [From.Monarch.GetName] ha decidit culpar de l'incident [From.From.Owner.Monarch.GetTitle] [From.From.Owner.Monarch.GetName] i ha prescindit dels serveis d'[From.From.Owner.Monarch.GetHerHim]."
 colonial_nation.EVTOPTA315:0 "Ben fet!"
 colonial_nation.EVTDESC316:0 "En el recent conflicte a la frontera entre [From.From.From.GetName] i [From.From.GetName], [From.GetCaEl] [From.GetName] s'ha posat del costat [From.From.From.Owner.GetCaDe] [From.From.From.Owner.GetName]! [From.Monarch.GetTitle] [From.Monarch.GetName] ha decidit culpar de l'incident [Root.Monarch.GetTitle] [Root.Monarch.GetName] i ha prescindit dels serveis d'[Root.Monarch.GetHerHim]."
 colonial_nation.EVTDESC317:0 "En el recent conflicte a la frontera entre [From.From.From.GetName] i [From.From.GetName], [From.GetCaEl] [From.GetName] s'ha posat del nostre costat! [From.Monarch.GetTitle] [From.Monarch.GetName] ha decidit culpar de l'incident [From.From.From.Owner.Monarch.GetTitle] [From.From.From.Owner.Monarch.GetName] i ha prescindit dels serveis d'[From.From.From.Owner.Monarch.GetHerHim]."
 colonial_nation.EVTNAME318:0 "Milícia colonial reforçada"
 colonial_nation.EVTDESC318:0 "L'assemblea ha proposat que reservem recursos considerables per reforçar la nostra milícia. La colònia necessita més protecció contra els atacs indígenes i les incursions d'altres colònies. També ens farà més forts si mai ens trobem en guerra amb [Root.ColonialParent.GetCaEl] [Root.ColonialParent.GetName]."
 colonial_nation.EVTOPTA318:0 "Establir-la"
 colonial_nation.EVTOPTB318:0 "No establir-la"
 colonial_nation.EVTNAME319:0 "Compra de terres"
 colonial_nation.EVTDESC319:0 "Els colons [Root.GetCaDeProv] [Root.GetName] es queixen que encara hi ha indígenes que viuen en algunes parts de la província. Aquestes terres es podrien aprofitar millor si s'hi establissin colons i es conreessin. Suggereixen que les comprem als indígenes de la zona."
 colonial_nation.EVTOPTA319:0 "Bona idea"
 colonial_nation.EVTOPTB319:0 "És massa car"
 colonial_nation.EVTDESC320:0 "Per poder competir amb altres colònies, hem de mantenir el creixement [Root.GetCaDe] [Root.GetName]. Els indígenes d'una província veïna s'han mostrat disposats a vendre'ns les seves terres. Sembla una solució ideal."
 colonial_nation.EVTNAME321:0 "L'últim dels mohicans"
 colonial_nation.EVTDESC321:0 "Un petit grup d'indígenes, pacificats fa temps i ara delmats per la guerra i les malalties, vol viure sota la protecció de la nostra colònia. Tot i que són pocs, encara ens poden ser d'ajuda gràcies al seu coneixement dels costums locals, i estan disposats a ajudar-nos a canvi que protegim el seu poblat [Root.GetCaAProv] [Root.GetName]. Però els seus enemics indígenes no ens veurien amb bons ulls..."
 colonial_nation.EVTOPTA321:0 "Oferir-los protecció"
 colonial_nation.EVTOPTB321:0 "Rebutjar-los"
 colonial_nation.EVTNAME322:0 "Els nois [Root.GetCaDeProv] [Root.GetName]"
 colonial_nation.EVTDESC322:0 "Les notícies d'atacs indígenes contra la nostra gent a la frontera s'han escampat per tota la colònia. Amb l'argument que tots els indígenes són aliats d'alguna manera i que de cap manera no se'n pot refiar ningú, una torba armada i enfurismada s'ha abatut sobre el pacífic romanent dels mohicans que viuen [Root.GetCaAProv] [Root.GetName]. Només en queda un grapat, els últims del seu poble, i la torba, contra la qual ningú no vol declarar, continua en llibertat..."
 colonial_nation.EVTOPTA322:0 "Protegir el romanent a qualsevol preu"
 colonial_nation.EVTOPTB322:0 "No els podem salvar..."
 colonial_nation.EVTNAME323:0 "L'últim a morir"
 colonial_nation.EVTDESC323:0 "Fa anys vam concedir la nostra protecció a l'últim romanent de la tribu dels mohicans. Des d'aleshores, les malalties i la guerra han continuat fent estralls, fins que al final només en va quedar un: l'últim del seu poble. Va ser un aliat fidel, que guiava la nostra gent en la batalla i ajudava els nostres colons, però les lleis de la vida són dures i ara ell també ens ha deixat. Amb ell no mor només un home, sinó tot un poble i una manera de viure."
 colonial_nation.EVTOPTA323:0 "Només ens queda plorar-lo..."
 last_of_the_mahican:0 "L'últim dels mohicans"
 desc_last_of_the_mahican:0 "Els últims romanents de la tribu dels mohicans s'han refugiat a la nostra província."
