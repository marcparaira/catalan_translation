 age_of_discovery:0 "Era dels Descobriments"
 age_of_discovery_desc:1 "En els inicis de l'edat moderna s'estan cartografiant nous continents mentre la societat feudal dona pas lentament als estats centralitzats.\nPer a un estat emprenedor, aquesta era pot veure la fundació d'un imperi mundial."
 age_of_reformation:0 "Era de la Reforma"
 age_of_reformation_desc:1 "D'Orient a Occident, aquesta és l'era de les conviccions religioses, els debats i els moviments de masses. A Europa el protestantisme arrela, mentre el mil·lenarisme s'estén per l'Iran i el sincretisme religiós modela la societat índia."
 age_of_absolutism:0 "Era de l'Absolutisme"
 age_of_absolutism_desc:1 "Ara que els governs han arrabassat a altres grups el poder absolut dels seus països, poden dedicar-se a construir imperis. Aquesta és l'era de l'estat, dels governants i dels seus exèrcits."
 age_of_revolutions:0 "Era de les Revolucions"
 age_of_revolutions_desc:1 "El qüestionament dels drets, de l'autoritat i del mateix món durant la Il·lustració ha portat al rebuig de l'Antic Règim. A mesura que l'absolutisme dona pas a la revolució, potser els regnes hauran de deixar lloc a les repúbliques."
 LEDGER_SCORE_AG:0 "Puntuació per eres"
 RELIGIOUS_CONFLICT_RULES_ON:0 "§YConflictes religiosos§!\n- El controlador papal pot convocar croades.\n- Els governants catòlics poden ser excomunicats.\n- Poden aparèixer centres de la Reforma.\n- La religió afecta la diplomàcia."
 RELIGIOUS_CONFLICT_RULES_OFF:0 "Aquesta era no té conflictes religiosos especials. Els centres de la Reforma han desaparegut, no es convoquen croades i el papa no pot excomunicar."
 ABSOLUTISM_RULES_ON:0 "§YAbsolutisme§!\nEn aquesta era els governs poden esdevenir més absoluts, cosa que dona més control sobre l'estat."
 ABSOLUTISM_RULES_OFF:0 "En eres posteriors, l'absolutisme serà un factor que determinarà quant control té el governant sobre l'estat."
