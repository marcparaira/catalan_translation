 form_union_with_lithuania_desc:0 "La mort del rei Ladislau III, sense descendència, al camp de batalla de Varna va trencar la unió entre Polònia i Hongria i va deixar Polònia en un interregne. El seu germà Casimir, gran duc de Lituània, va ser convidat per la noblesa polonesa a ocupar el tron, però va trobar inacceptables les seves condicions. El 1447, després de tres anys de negociacions, Casimir va ser finalment coronat rei de Polònia en els seus propis termes i va governar tots dos regnes en unió."
