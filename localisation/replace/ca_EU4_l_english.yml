 hannoverian_nation_title:0 "Formar Hannover"
 hannoverian_nation_desc:0 "Ara que controlem les províncies clau d'aquesta regió, els nobles locals no tenen més remei que acceptar el nostre lideratge. Quan s'hi avinguin, el ducat unificat de Hannover es convertirà en la potència capdavantera de la regió."
 westfalian_nation_title:0 "Formar Westfàlia"
 westfalian_nation_desc:0 "Ara que les idees de la Il·lustració s'escampen per Europa, podem optar per adoptar-les nosaltres mateixos a Westfàlia. El nostre futur estat model tindrà idees tan revolucionàries com la igualtat de drets per a tota la població masculina, la llibertat dels serfs i l'emancipació dels jueus, i també afavorirà la lliure empresa amb l'abolició de les prestacions feudals i dels gremis."
 greek_nation_title:0 "Formar Grècia"
 greek_nation_desc:0 "Durant anys, l'Hèl·lade ha estat dividida entre diversos regnes o ocupada per estrangers al gust dels nostres enemics comuns. Unir les terres gregues sota una sola bandera i un sol governant és l'únic camí cap a la grandesa."
