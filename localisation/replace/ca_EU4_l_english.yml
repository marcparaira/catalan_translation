 STATE_IRO:0 "$NAME$ és un §Yestat§!."
 STATE_DRO:2 "Un regne es divideix en diversos territoris: totes les províncies que es posseeixen en una àrea formen un territori. Un territori es pot convertir en un estat de la nació, que és una part integral del regne. Això costarà un cert manteniment segons la distància a la capital, però en reduirà dràsticament l'autonomia mínima.\n\nEl desenvolupament dels estats i dels territoris consumeix capacitat de govern. El desenvolupament dels territoris només compta com un 25% de capacitat de govern. La capacitat de govern es pot augmentar pujant el rang del govern, avançant en tecnologia administrativa, completant el grup d'idees administratives i fent servir el progrés de reforma per ampliar l'administració a la finestra de reformes de govern."
 CONFIRMAKESTATETITLE:0 "Convertir el territori en estat"
 CONFIRMMAKESTATETEXT:2 "Convertir $NAME$ en estat ens costarà $COST|Y$¤ de manteniment cada mes, però augmentarà els nostres ingressos en uns $INC|Y$¤ quan l'autonomia s'hagi reduït a nivells més baixos. També augmentarà els efectius i els mariners que obtenim de l'àrea.\nConvertir $NAME$ en estat consumirà $CAP|Y0$ de la nostra capacitat de govern, que arribarà a un total de $USED_CAP|Y0$.\n\nTotes les províncies que pertanyin a una §Ycompanyia comercial§! se'n §Rtrauran§! automàticament i s'afegiran a l'estat!"
 CONFIRMMAKESTATETEXT_OVER_CAP:1 "Convertir $NAME$ en estat ens costarà $COST|Y$¤ de manteniment cada mes, però augmentarà els nostres ingressos en uns $INC|Y$¤ quan l'autonomia s'hagi reduït a nivells més baixos. També augmentarà els efectius i els mariners que obtenim de l'àrea.\nConvertir $NAME$ en estat consumirà $CAP|Y0$ de la nostra capacitat de govern, que arribarà a un total de $USED_CAP|Y0$.\n§RAixò ens farà superar la nostra capacitat de govern de $MAX_CAP|Y0$ i comportarà penalitzacions!§!\nTotes les províncies que pertanyin a una §Ycompanyia comercial§! se'n §Rtrauran§! automàticament i s'afegiran a l'estat!"
