 mesoamerican:0 "mesoamericana"
 north_american_desc:0 "Amb el grup tecnològic nord-americà, els nivells de tecnologia són un 250% més cars (350%)."
 mesoamerican_desc:0 "Amb el grup tecnològic mesoamericà, els nivells de tecnologia són un 150% més cars (250%)."
 south_american_desc:0 "Amb el grup tecnològic sud-americà, els nivells de tecnologia són un 250% més cars (350%)."
 mesoamerican_spearmen:0 "Llancers mesoamericans"
 mesoamerican_spearmenDESCR:0 "La unitat bàsica dels exèrcits de Mesoamèrica. Normalment eren lleves de pagesos dirigides per oficials aristòcrates i armades amb llança i escut. Aquesta unitat era l'espinada dels exèrcits d'estats com l'Imperi asteca."
 south_american_forest_warfare:0 "Guerrers del bosc sud-americans"
 south_american_forest_warfareDESCR:0 "El guerrer del bosc va continuar millorant a mesura que hi havia noves tecnologies i tàctiques disponibles. Mantenint l'equilibri entre atac i defensa, va continuar millorant en tots dos àmbits."
 incan_slingshots:0 "Foners inques"
 incan_slingshotsDESCR:0 "Els foners inques feien servir les seves mortíferes armes de projectils a una distància relativament curta, on la seva precisió i el seu impacte podien ser letals. L'ús de la fona o huaraca era molt conegut a bona part de Sud-amèrica, ja que sovint els infants passaven hores i hores perfeccionant la tècnica caçant ocells."
 incan_axemen:0 "Destralers inques"
 incan_axemenDESCR:0 "Els destralers inques complementaven les tropes de projectils amb tota mena d'armes, des de petites destrals de mà anomenades champis fins a d'altres amb un mànec tan llarg com el d'una alabarda."
 south_american_reformed_gunpowder_warfare:0 "Mosqueters americans reformats"
 south_american_reformed_gunpowder_warfareDESCR:0 "Amb l'arribada dels europeus a les Amèriques, la població local va conèixer les armes de foc. Els avantatges eren evidents i només era qüestió de temps que apareguessin unitats armades amb mosquets. El mosqueter reformat va ser un intent de combinar la nova tecnologia amb la ferocitat de l'antiga guerra tribal. Aquesta unitat és més forta en l'atac, però les noves armes de foc també li donen pes en la defensa."
 south_american_arquebusier:0 "Arcabusser sud-americà"
 south_american_arquebusierDESCR:0 "L'arcabusser sud-americà treu profit de la lleugeresa de la seva arma i d'una maniobrabilitat més gran. El que perd en xoc ofensiu ho guanya mantenint un foc constant en les accions defensives."
 westernized_incan:0 "Infanteria inca occidentalitzada"
 westernized_incanDESCR:0 "La infanteria inca occidentalitzada va succeir els guerrers de muntanya d'èpoques anteriors. L'entrenament i l'equipament occidentals han millorat aquestes unitats en tots els aspectes."
 reformed_westernized_incan:0 "Infanteria inca occidentalitzada reformada"
 reformed_westernized_incanDESCR:0 "La infanteria inca occidentalitzada reformada feia servir la nova tecnologia de les armes de foc i un nou entrenament per assumir un paper més defensiu."
 incan_guerilla_warfare:0 "Guerrilla inca"
 incan_guerilla_warfareDESCR:0 "La guerrilla inca treia el màxim profit del terreny. Tot i que no fa gaire mal a l'enemic, pot costar molt de temps desgastar aquestes unitats."
