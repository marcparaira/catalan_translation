 form_colonial_assembly_title:0 "Formar una assemblea colonial"
 form_colonial_assembly_desc:0 "Ha arribat l'hora de traslladar el control i la responsabilitat dels impostos i els pressupostos del govern del Vell Món a les colònies. Els membres s'elegiran cada any i tots els ciutadans propietaris en podran ser elegits."
 colonial_assembly:0 "Assemblea colonial"
 desc_colonial_assembly:0 "Bona part del poder legislatiu sobre els impostos i els pressupostos del govern s'ha traslladat a les colònies."
 remains_governor_from:0 "[From.Monarch.GetName] ( [From.Monarch.GetAdm] £adm£ / [From.Monarch.GetDip] £dip£ / [From.Monarch.GetMil] £mil£ ) continua en el càrrec de [From.Monarch.GetTitle]."
 remains_governor:0 "[Root.Monarch.GetName] ( [Root.Monarch.GetAdm] £adm£ / [Root.Monarch.GetDip] £dip£ / [Root.Monarch.GetMil] £mil£ ) continua en el càrrec de [Root.Monarch.GetTitle]."
 elections.EVTNAME702:0 "Relleu de [Root.Monarch.GetTitle] [Root.GetCaA] [Root.GetName]?"
 elections.EVTDESC702:0 "El mandat de [Root.Monarch.GetTitle] [Root.Monarch.GetName] s'ha acabat. Hem de demanar [Root.ColonialParent.GetCaA] [Root.ColonialParent.GetName] que prorrogui el nomenament un altre mandat, o que enviï algú altre per ocupar el càrrec de [Root.Monarch.GetTitle]?"
 elections.EVTOPTA702:0 "Demanar que es mantingui [Root.Monarch.GetName]"
 elections.EVTOPTB702:0 "Demanar que enviïn algú altre com a [Root.Monarch.GetTitle]"
 elections.EVTNAME703:0 "Relleu de [From.Monarch.GetTitle] [From.GetCaA] [From.GetName]?"
 elections.EVTDESC703:0 "El mandat de [From.Monarch.GetTitle] [From.Monarch.GetName] s'ha acabat. Li hem de confiar un altre mandat com a [From.Monarch.GetTitle] [From.GetCaA] [From.GetName], o hem de triar algú altre?\n\nRepresentants [From.GetCaDe] [From.GetName] ens han demanat que mantinguem [From.Monarch.GetName]."
 elections.EVTOPTA703:0 "Mantenir [From.Monarch.GetName]"
 elections.EVTOPTB703:0 "Enviar un candidat buròcrata"
