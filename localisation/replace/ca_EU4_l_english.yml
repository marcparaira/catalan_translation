 arctic_desc:0 "El terreny àrtic representa les zones cobertes de neu i gel properes al pol nord."
 forest_desc:0 "El terreny de bosc representa zones de bosc de coníferes amb una gran densitat d'arbres i sotabosc."
 hills_desc:0 "El terreny de turons representa zones dominades per un paisatge ondulat d'elevació variable, més baix i menys escarpat que les muntanyes. A diferència de l'altiplà, els turons representen zones amb una densitat més alta d'arbres i sotabosc."
 woods_desc:0 "El terreny d'arbreda representa zones de bosc caducifoli amb una gran densitat d'arbres i sotabosc."
 mountain_desc:0 "El terreny de muntanya representa zones ocupades principalment per serralades escarpades i passos estrets, sovint a gran altitud i amb un clima fred."
 desert_mountain_desc:0 "El terreny de muntanya desèrtica representa zones de serralades escarpades i passos estrets envoltades de deserts."
 impassable_mountains_desc:0 "El terreny de muntanyes infranquejables representa zones muntanyoses massa inhòspites o difícils perquè un exèrcit hi pugui maniobrar."
 grasslands_desc:0 "El terreny de prats representa zones agrícoles on predomina la vegetació herbàcia."
 plains_desc:0 "El terreny de planes representa grans extensions de terra plana o ondulada sense arbres."
 jungle_desc:0 "El terreny de jungla representa zones cobertes de vegetació tropical densa, on és difícil que un exèrcit maniobri."
 marsh_desc:0 "El terreny d'aiguamolls representa extensions de terres humides dominades per herbes o arbustos baixos."
 desert_desc:0 "El terreny de desert representa zones desolades i àrides amb poca o cap vegetació, sovint amb un clima molt càlid."
 coastal_desert_desc:0 "El terreny de desert costaner representa zones on el desert es troba amb l'oceà, cosa que dona un clima més suau i menys inhòspit."
 coastline_desc:0 "El terreny de costa representa les estretes zones on es troben la terra i el mar, formades per penya-segats o dunes de sorra."
 farmlands_desc:0 "El terreny de terres de conreu representa zones molt cultivades on l'agricultura i els pobles i viles dominen el paisatge."
 glacier:0 "Glacial"
 glacier_desc:0 "El terreny glacial representa zones amb condicions molt dures i fredes, sovint amb neu permanent i glaceres. Les zones de terreny glacial són molt inhòspites per als assentaments humans i les maniobres militars."
 drylands_desc:0 "Les terres àrides representen grans extensions de terra seca, plana o ondulada i sense arbres."
 steppe_desc:0 "El terreny d'estepa representa grans extensions obertes i contínues cobertes d'herba, aptes per a la pastura però no per a l'agricultura. "
 savannah_desc:0 "El terreny de sabana representa grans zones cobertes d'herba amb força arbres intercalats."
 highlands_desc:0 "El terreny d'altiplà representa zones dominades per un paisatge ondulat d'elevació variable, més baix i menys escarpat que les muntanyes. A diferència dels turons, els altiplans representen zones amb poca densitat d'arbres i sotabosc."
