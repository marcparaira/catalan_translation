 icon_michael:0 "Icona de sant Miquel"
 desc_icon_michael:1 "Sant Miquel, l'Arxiestrateg, és el comandant de les hosts celestials i l'arcàngel que derrotarà Satanàs en la guerra del Cel. Les icones de sant Miquel són habituals a tota la cristiandat ortodoxa, i la majoria de ciutats russes tenen una església dedicada a ell."
 icon_eleusa:0 "Icona de l'Eleüsa"
 desc_icon_eleusa:1 "La icona de l'Eleüsa representa la tendra Mare de Déu amb el Nen Jesús acostat a la seva galta. Expressa l'amor maternal i la preocupació pel propi fill."
 icon_pancreator:0 "Icona del Crist Pantocràtor"
 desc_icon_pancreator:1 "El Crist Pantocràtor representa el Crist totpoderós, benigne però sever. És una de les imatges religioses més populars de la nostra Església i sovint es pot veure pintada a l'interior de la cúpula central de les esglésies."
 icon_nicholas:0 "Icona de sant Nicolau"
 desc_icon_nicholas:1 "Nicolau el Taumaturg, o el portador de regals, és un dels primers sants cristians i apareix en moltes icones com un home gran amb la barba blanca."
 icon_climacus:0 "Icona de sant Joan Clímac"
 desc_icon_climacus:1 "L'autor de «L'escala de l'ascens diví», sant Joan Clímac, ha inspirat generacions de cristians ortodoxos descrivint com acostar-se a Déu a través de l'ascetisme i una vida pietosa."
