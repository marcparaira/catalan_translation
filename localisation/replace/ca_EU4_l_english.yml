 INFANTRY_DESC:0 "Columna vertebral de qualsevol exèrcit, l'humil soldat d'infanteria marxa des de temps immemorials. És la base del vostre exèrcit, la que permet lluitar a la resta d'armes, i el primer a entrar per la bretxa quan s'assalta una fortalesa."
 CAVALRY_DESC:0 "Com que tenir i mantenir un cavall és una despesa considerable, el guerrer a cavall és l'elit de qualsevol exèrcit. La velocitat del cavall dona a aquest soldat més mobilitat al camp de batalla, i només els soldats més disciplinats poden resistir una càrrega de cavalleria."
 ARTILLERY_DESC:0 "L'artilleria consisteix específicament en canons de pólvora que, en la seva forma primitiva, són més eficaços en un setge. L'evolució del canó el convertirà en una arma destructiva al camp de batalla."
 TRANSPORT_DESC:0 "Tothom sap que els soldats no es poden convertir en vaixells per art de màgia: el vaixell de transport està construït especialment per portar exèrcits d'un punt A a un punt B per alta mar."
 GALLEY_DESC:0 "El poc calat de la galera fa que navegui malament en alta mar, però en aigües tancades la galera de rems és el vaixell de guerra per excel·lència."
 LIGHT_SHIP_DESC:0 "Petit, ràpid i maniobrable, el vaixell lleuger destaca en la defensa del comerç. Allà on vagin els vostres vaixells lleugers, els mercaders que onegin la vostra bandera se sentiran segurs."
 HEAVY_SHIP_DESC:0 "Excepte en aigües tancades com la Mediterrània, el vaixell de guerra o vaixell de línia és la principal nau de combat."
 GENERAL_DESC:0 "Tant si s'ha distingit en combat com si ha demostrat dots de comandament o simplement coneix la gent adequada, aquest líder ha demostrat que té el que cal per conduir un dels vostres exèrcits a la batalla."
 ADMIRAL_DESC:0 "Lluny de terra i de qualsevol altra font d'autoritat, aquest comandant és gairebé com un déu per als seus mariners, almenys mentre siguin vius. Conduirà les vostres flotes a la glòria."
 CONQUISTADOR_DESC:0 "Amant de l'aventura, el conqueridor guiarà grups cap a l'inexplorat i conduirà exèrcits allà on pocs gosen aventurar-se."
 EXPLORER_DESC:0 "Navegar pels vasts oceans ja és intimidant en el millor dels casos, però navegar per oceans que ens són desconeguts requereix gent d'una pasta especial. L'explorador és d'aquesta pasta: navegarà on ningú més no gosaria anar."
