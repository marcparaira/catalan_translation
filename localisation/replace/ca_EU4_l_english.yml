 EVTDESC6436:1 "Les fronteres són permeables i canviants, i es desplacen segons la fortuna de l'últim conqueridor que hi passa. Potser els historiadors ens culparan dels fets que han tingut lloc fa poc [From.GetCaAProv] [From.GetName]: «Mentre [From.GetCaElProv] [From.GetName] continuava prosperant sota el govern benèvol [From.Owner.GetCaDe] [From.Owner.GetName], els pagesots de l'altra banda de la frontera per força s'havien de posar gelosos», potser diran. O potser ens seran favorables i declararan que les nostres protestes contra l'ocupació [From.Owner.GetCaAdjFS] de la província estaven ben fonamentades. Sigui com sigui, les tensions [From.GetCaAProv] [From.GetName] ens han donat una reclamació sobre la província."
