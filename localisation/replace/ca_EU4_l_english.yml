 elections.EVTOPTD703:0 "Enviar un candidat militar"
 elections.EVTNAME704:0 "Relleu de [From.Monarch.GetTitle] [From.GetCaA] [From.GetName]?"
 elections.EVTDESC704:0 "El mandat de [From.Monarch.GetTitle] [From.Monarch.GetName] s'ha acabat. Li hem de confiar un altre mandat com a [From.Monarch.GetTitle] [From.GetCaA] [From.GetName], o hem de triar algú altre?\n\nRepresentants [From.GetCaDe] [From.GetName] ens han demanat que enviem un substitut per a [From.Monarch.GetName]."
 elections.EVTOPTA704:0 "Mantenir [From.Monarch.GetName]"
 elections.EVTOPTB704:0 "Enviar un candidat buròcrata"
 elections.EVTOPTC704:0 "Enviar un candidat diplomàtic"
 elections.EVTOPTD704:0 "Enviar un candidat militar"
 elections.EVTNAME705:0 "Continuïtat en el càrrec: [Root.Monarch.GetTitle]"
 elections.EVTDESC705:0 "[From.GetCaElCap] [From.GetName], amb tota la seva saviesa, ha decidit prorrogar el nomenament de [Root.Monarch.GetName] com a [Root.Monarch.GetTitle] per un altre mandat."
 elections.EVTOPTA705:0 "Excel·lent!"
 elections.EVTOPTB705:0 "Maleïts siguin!"
 elections.EVTNAME706:0 "Relleu en el càrrec: [Root.Monarch.GetTitle]"
 elections.EVTDESC706:0 "[From.GetCaElCap] [From.GetName], amb tota la seva saviesa, ha decidit cridar [Root.Monarch.GetName] de tornada i nomenar algú altre com a [Root.Monarch.GetTitle] en el [Root.Monarch.GetHerHis] lloc."
 elections.EVTOPTA706:0 "Excel·lent!"
 elections.EVTOPTB706:0 "Maleïts siguin!"
 elections.EVTNAME707:0 "Relleu de [From.Monarch.GetTitle] [From.GetCaA] [From.GetName]"
 elections.EVTDESC707:0 "Hem decidit substituir [From.Monarch.GetName] com a governador [From.GetCaDe] [From.GetName]. Qui nomenarem en el [From.Monarch.GetHerHis] lloc?"
 elections.EVTOPTB707:0 "Candidat buròcrata"
 elections.EVTOPTC707:0 "Candidat diplomàtic"
 elections.EVTOPTD707:0 "Candidat militar"
 elections.EVTNAME708:0 "Mort en el càrrec: [Root.Monarch.GetTitle]"
 elections.EVTDESC708:0 "La lamentable defunció de [Root.Monarch.GetName] ha obligat a avançar l'elecció per al càrrec de [Root.Monarch.GetTitle]. S'han presentat tres candidats principals..."
 elections.EVTNAME709:0 "Mort en el càrrec: [Root.Monarch.GetTitle]"
 elections.EVTDESC709:0 "Esperem que [Root.ColonialParent.GetCaEl] [Root.ColonialParent.GetName] ens enviï un bon substitut..."
 elections.EVTOPTB709:0 "Preguem"
 elections.EVTNAME710:0 "Mort en el càrrec: [From.Monarch.GetTitle]"
 elections.EVTDESC710:0 "El càrrec de [From.Monarch.GetTitle] [From.GetCaDe] [From.GetName] ha quedat vacant per una mort sobtada. Qui hi hem d'enviar perquè ocupi el lloc que ha deixat [From.Monarch.GetHerHim]?"
 elections.EVTNAME711:0 "Assemblea colonial"
 elections.EVTDESC711:0 "La nostra colònia, [From.GetCaEl] [From.GetName], ha decidit formar la seva pròpia assemblea per prendre el control de la legislació fiscal i dels pressupostos. Asseguren que aquests assumptes es gestionen millor localment, però sembla sospitosament un primer pas cap a la independència..."
 elections.EVTOPTB711:0 "Sospitós, certament..."
 elections.EVTNAME712:0 "Vents de llibertat"
 elections.EVTDESC712:0 "Els vents de llibertat bufen amb força [From.GetCaA] [From.GetName]. L'assemblea elegida localment ha decidit que d'ara endavant triarà ella mateixa qui ocupa el càrrec de [From.Monarch.GetTitle]. Per sort, sembla que això n'ha apaivagat el desig de llibertat. Almenys de moment..."
 elections.EVTOPTB712:0 "Molt preocupant..."
 elections.700.d:0 "Ara que les faccions revoltades han obligat $MONARCH$ a deixar el càrrec, caldrà elegir qui ocuparà el càrrec de [Root.Monarch.GetTitle]. Mentre es compten els vots, es respira una emoció poc habitual. Els tres candidats principals són ben conscients dels fets que han tingut lloc aquests darrers dies..."
 elections.700.limitedterm:0 "Torna a ser temps d'eleccions [Root.GetCaA] [Root.GetName]. Com mana la tradició, [Root.Monarch.GetName] ha d'abdicar perquè un altre candidat pugui governar la [Root.GovernmentName]. S'han presentat aquests tres candidats principals..."
