 maharathan_guerilla_warfare:0 "Telingues"
 rajput_musketeerDESCR:0 "A mesura que avançava el desenvolupament de les armes de foc, l'equipament dels mosqueters indis va guanyar qualitat. Es va donar prioritat a la precisió i al llarg abast, ja que els mogols continuarien fent servir els mosqueters com a tiradors d'elit. Els mogols també van mantenir els mosqueters al servei directe de l'autoritat central (a diferència de la cavalleria, que era en mans dels mansabdars)."
 reformed_mughal_mansabdarDESCR:0 "Els sikhs del Panjab van desenvolupar un estil de combat de cavalleria especial inspirat en els exèrcits perses i afganesos. Se'l coneixia com a «dhai-phat», o atacs de «dos i mig». Un grup de genets s'acostava a l'enemic, disparava els arcabussos de metxa, es retirava i tornava a començar. Quan l'enemic estava prou afeblit, el gruix de la cavalleria carregava amb els sabres. De manera semblant, molts estats del nord de l'Índia van incorporar cada vegada més als seus exèrcits soldats de cavalleria mòbils armats amb mosquets, sovint reclutats entre els nombrosos membres de tribus afganeses de la regió."
 indian_shock_cavalryDESCR:0 "El Dècan occidental, una zona de turons, jungles i molts forts, va resultar força difícil de sotmetre per als grans i feixucs exèrcits mogols. En la seva lluita desesperada per sobreviure, el soldanat d'Ahmednagar va ser pioner en l'ús de la cavalleria lleugera per hostilitzar les forces mogoles. Els genets marathes al servei d'Ahmednagar van tenir tant d'èxit que aviat altres governants també els van contractar."
 bhonsle_infantryDESCR:0 "Molts membres de tribus de les regions de Kanara, Desh i Malnad, com els berads i els mavales, van adoptar molt aviat els mosquets de metxa per a la caça i la guerra. Com que coneixien bé aquestes armes, aquests homes de tribu aviat es van convertir en els principals mosqueters del sud de l'Índia. Els exèrcits marathes, en particular, van dependre d'aquests grups tribals per reclutar-hi infanteria. Sovint es mantenia l'organització tribal de les tropes, i els caps feien d'oficials. Durant els segles XVII i XVIII, els berads i els mavales es van desplegar cada vegada més en els exèrcits maratha, mogol i de Mysore, i acabarien formant el nucli dels futurs regiments d'infanteria d'estil europeu de la zona."
 indian_archersDESCR:0 "Tot i que els elefants eren un element habitual de la majoria d'exèrcits indis, sovint els comandants només els feien servir en petit nombre i com a complement de la cavalleria o la infanteria. Tanmateix, a les regions dominades per la jungla, com Orissa o Bastar, els cavalls són difícils de fer servir amb eficàcia i de mantenir en bon estat de salut. Per això, els exèrcits d'aquestes regions depenien molt més d'unitats d'elefants més grans, que feien servir com a plataformes mòbils per als arquers."
 indian_arquebusierDESCR:0 "Com que en general els exèrcits indis s'interessaven poc pel desenvolupament de les tàctiques d'infanteria, l'arribada de les armes de foc no va tenir al principi un gran impacte. Tot i ser habituals en els exèrcits indis, durant molt de temps no van representar una part considerable de les tropes d'infanteria, i les armes de foc es van continuar fent servir de manera individual en lloc d'adoptar-se per a formacions específiques. En comptes d'equipar les seves pròpies unitats amb les noves armes, al principi els estats indis es van conformar a contractar arcabussers estrangers, sovint turcmans, com a complement dels seus arquers i de la seva artilleria."
 rajput_hill_fightersDESCR:0 "Amb l'arribada de les potències musulmanes, l'Índia va rebre cada vegada més bones muntures de cavalleria estrangeres. L'ús de tàctiques militars musulmanes es va acabar generalitzant fins i tot en els exèrcits d'estats hindús com l'Imperi de Vijayanagara. Al nord-oest, els guerrers rajputs es van adaptar ràpidament a les tàctiques dels soldanats indis, i aviat també va sorgir una nova raça de cavalls rajputs. La cura i la cria d'aquests cavalls marwaris va adquirir un paper molt cerimonial i venerat en les societats rajputs, extremament militaritzades. En el clima del sud de l'Índia, la cria de muntures de cavalleria va resultar més difícil, i els governants del sud es van veure obligats a dependre dels mercaders de l'oceà Índic per proveir la seva cavalleria."
 mughal_mansabdarDESCR:0 "Durant tot el segle XV, la cavalleria va continuar sent l'arma de combat més influent a l'Índia. L'arribada de Babur a principis del segle XVI i el naixement de l'Imperi mogol van accentuar encara més aquesta tendència. Babur es va servir de grans contingents d'arquers a cavall de les estepes de la Transoxiana durant la seva invasió, i els mogols que el van succeir continuarien depenent d'una gran força de cavalleria. Mentre els altres estats del nord de l'Índia intentaven posar-se al nivell de la màquina militar mogola, molts van recórrer cada vegada més a aventurers de l'Àsia central com a oficials de cavalleria. Un d'aquests aventurers afganesos acabaria fundant l'efímer Imperi suri a l'est i al centre de l'Índia."
 tipu_sultan_rocketDESCR:0 "Al llarg del segle XVIII, la infanteria índia va passar a lluitar de manera més coordinada, amb una cadència de foc més alta i un aprofitament molt millor que abans. La incorporació d'innovacions militars com els coets de Mysore i la integració de la cavalleria lleugera índia van permetre als estats indis tenir molt més èxit contra els exèrcits europeus. Mysore, en particular, va trobar un bon equilibri en aquest sentit i, sota Haidar Ali i Tipu Sultan, va passar de ser un regne local a una potència regional del sud de l'Índia."
 indian_footsoldierDESCR:0 "En la història militar índia, la infanteria acostumava a ser barata i fàcil de reemplaçar gràcies a la gran població de l'Índia. La cavalleria, en canvi, era cara i sovint havia estat l'element decisiu als camps de batalla indis, almenys des de l'arribada dels exèrcits musulmans al segle XIII. Potser per això, durant la major part de l'edat moderna les tàctiques d'infanteria no van rebre tanta atenció. El paper de la infanteria era constituir el gruix de l'exèrcit i assetjar els nombrosos forts del subcontinent indi."
 indian_elephantDESCR:0 "A mesura que l'Imperi mogol creixia, es va fer imprescindible una organització central per controlar els seus nombrosos detentors de poder. Sota Akbar es va implantar un sistema de rangs numèrics per a tots els nobles (els mansabdars). Les jagirs, les assignacions i el nombre de soldats de cavalleria que cada noble estava obligat a aportar van passar a dependre d'aquest rang."
 mughal_musketeerDESCR:2 "Amb la invasió de Babur, el subcontinent va veure per primera vegada un ús organitzat de les armes de foc. Tanmateix, a diferència d'Occident, els mosqueters, o toofangchis, que feia servir Babur actuaven com a tiradors d'elit en els seus exèrcits i disparaven individualment contra objectius concrets, tant en batalles campals com en setges. Babur va tenir cura d'entrenar aquestes tropes per obtenir-ne millors resultats i, a diferència de la cavalleria mogola, el reclutament, l'entrenament i l'organització dels mosqueters van quedar sota el seu control directe. Tant si el gran èxit de Babur a Panipat es va deure a les armes de foc com si no, l'ús de mosqueters es va fer cada vegada més habitual en els exèrcits indis després de la seva invasió."
 maharathan_cavalryDESCR:0 "Després de la caiguda del soldanat d'Ahmednagar, els marathes que havien prosperat al seu servei van passar a lluitar per Bijapur i altres potències locals o regionals, delerosos de trobar noves maneres de superar els grans exèrcits mogols que envaïen el Dècan. Amb l'auge de la capacitat militar maratha va arribar l'auge del seu poder polític, i aquests guerrers del Dècan aviat van formar estats propis, que van eclipsar els seus antics patrons musulmans i van resultar una amenaça per als seus enemics jurats mogols. Gràcies a la cavalleria lleugera i a la infanteria, els exèrcits marathes van poder hostilitzar i aïllar forces mogoles molt més grans i menys mòbils, i forjar diversos imperis a costa de l'estat mogol en decadència."
 sikh_rifleDESCR:0 "La contractació d'oficials europeus per entrenar i dirigir regiments indis va canviar de moltes maneres el panorama militar de l'Índia. Els exèrcits que feien servir tàctiques tradicionals, basades en la cavalleria, sovint eren derrotats per forces amb infanteria instruïda armada amb mosquets i artilleria mòbil. Per mantenir l'avantatge va esdevenir essencial organitzar la cavalleria, la infanteria i l'artilleria perquè lluitessin juntes molt més que no s'havia vist mai a l'Índia. Mysore, sota Haidar Ali i Tipu Sultan, va ser un dels estats que més es va prendre a cor aquesta lliçó, i va demostrar que, si es coordinava bé amb les altres armes, la cavalleria lleugera continuava sent una eina molt poderosa per desbaratar les operacions dels enemics a l'Índia."
 south_indian_musketeerDESCR:0 "Vijayanagara i els seus estats successors depenien dels caps locals de les comunitats de l'imperi per a bona part de l'administració. Entre les seves tasques hi havia l'organització de la defensa local i el reclutament i l'ordenació de les tropes."
 sikh_hit_and_runDESCR:0 "La infanteria, menys prestigiosa, solia atreure tercers o quarts fills de famílies rajputs purbies pobres del camp del nord, membres desertors de clans afganesos, pagesos jats i altres grups amb poques perspectives. Com que no es podien permetre cavalls, aquests grups adoptaven les armes de foc com una manera més barata de triomfar al camp de batalla. Tot i que rebien poca instrucció formal, aquests mosqueters purbies autodidactes van acabar formant el nucli d'un exèrcit més modern al nord de l'Índia, ja que l'ús de les armes de foc i, més endavant, de tàctiques d'infanteria europees més modernes els va permetre marcar cada vegada més la diferència als camps de batalla de l'Índia."
 indian_rifleDESCR:0 "El paper que els telingues i els berads tenien al sud acabarien tenint-lo els purbies al nord. Els oficials britànics al servei de la Companyia de les Índies Orientals i els aventurers francesos al servei dels mogols o d'altres governants indis van ser cada vegada més habituals com a comandants de la infanteria índia de mosquet al nord-est. Com a resultat, aviat es podien trobar regiments d'infanteria índia instruïda en tots els exèrcits dels estats del nord i també en bandes de mercenaris. Amb el temps, el reclutament es va organitzar encara més, i aquestes tropes del nord de l'Índia, conegudes com a sipais pel terme mogol que designava un soldat d'infanteria, van quedar estretament associades al domini de la Companyia a l'Índia."
 reformed_mughal_musketeerDESCR:0 "Quan l'Imperi de Vijayanagara es va fragmentar en diversos regnes nayaks després de la derrota de Talikota, els poligars locals es van mantenir com a detentors del poder local responsables del reclutament. En alguns d'aquests estats successors, els poligars van adquirir una posició encara més independent que la que tenien sota Vijayanagara. Juntament amb l'escassetat persistent de cavalls, això va fer que la proporció d'infanteria en els exèrcits del sud fos encara més gran. Les armes de foc també es van continuar estenent tant al sud com al nord durant el segle XVI."
 bhonsle_cavalryDESCR:0 "La cavalleria lleugera maratha va demostrar cada vegada més com n'eren de vulnerables els grans exèrcits mogols de cavalleria pesant si se'ls tallaven els subministraments. Durant la primera meitat del segle XVIII, a mesura que creixia el poder maratha i que la infanteria s'organitzava cada vegada més a l'estil europeu, es va fer necessari tenir regiments de cavalleria més organitzats. A partir de la dècada de 1720, la mida i el nivell d'organització dels exèrcits de cavalleria indis van augmentar per intentar estar a l'altura de l'evolució de les tàctiques d'infanteria i d'artilleria que s'estava produint. Va caldre un temps perquè els generals indis veterans s'adonessin de com els podia fer de vulnerables la seva insistència en la cavalleria davant dels regiments de mosqueters instruïts a l'estil europeu, que van ser cada vegada més habituals durant el segle XVIII."
 maharathan_guerilla_warfareDESCR:0 "A mesura que els francesos s'implicaven cada vegada més en els afers dels estats del sud i l'est de l'Índia, van començar a entrenar tropes índies en tàctiques d'infanteria europees coordinades. Aviat va resultar ser l'inici d'una revolució en la guerra a l'Índia, ja que la infanteria, i no la cavalleria, va passar a ser cada vegada més el factor determinant de les batalles. Sota Dupleix i De Bussy, els soldats telugus van començar a lluitar i a armar-se d'una manera més semblant als exèrcits europeus de l'època. Aquestes tropes eren conegudes com a telingues pel seu lloc d'origen (Telingana), però aviat el terme es va fer servir per a la infanteria uniformada i armada amb mosquets d'altres parts de l'Índia."
