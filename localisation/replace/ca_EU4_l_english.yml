 ikko_ikki_rebels_name:0 "Ikko-ikki ($COUNTRY$)"
 ikko_ikki_rebels_desc:0 "Els ikko-ikki són multituds de pagesos, monjos budistes, sacerdots xintoistes i nobles locals descontents amb el seu monarca."
 ikko_ikki_rebels_army:0 "Exèrcit ikko-ikki"
 ronin_rebels_name:0 "Ronin ($COUNTRY$)"
 ronin_rebels_desc:0 "Els ronin són bandes de samurais sense senyor que s'han lliurat a la vida de mercenaris i bandolers, i que de vegades han participat en revoltes locals."
 ronin_rebels_army:0 "Exèrcit ronin"
 anti_tax_rebels_demand:0 "Rebaixa d'impostos"
 anti_tax_rebels_demand_desc:0 "Els rebels es neguen a pagar impostos! Acceptar-ho reduirà dràsticament els nostres ingressos."
 tribal_rebels_demand:0 "Més autonomia"
 tribal_rebels_demand_desc:0 "Als ulls de les tribus, el nostre domini és feble, i ara volen governar-se per si mateixes."
 cossack_rebels_demand:0 "Més autonomia"
 cossack_rebels_demand_desc:0 "Els cosacs exigeixen ser reconeguts i poder governar-se segons les seves pròpies tradicions."
 particularist_rebels_demand:0 "Més autonomia"
 particularist_rebels_demand_desc:0 "Els particularistes estan cansats de ser governats des d'una capital llunyana, insensible a les necessitats locals. Exigeixen que deixem que les regions es governin per si mateixes."
 nationalist_rebels_demand:0 "Independència: $INDEPENDENCE_COUNTRY$"
 nationalist_rebels_demand_desc:0 "Els separatistes exigeixen la independència d'un nou estat: $INDEPENDENCE_COUNTRY$. Creuen que el seu governant hauria de ser de la seva cultura ($CULTURE$)."
 patriot_rebels_demand:0 "Canviar de bàndol: $DEFECT_COUNTRY$"
 patriot_rebels_demand_desc:0 "Els patriotes detesten la nostra ocupació injusta i anhelen tornar a la seva terra natal: $DEFECT_COUNTRY$"
 colonial_rebels_demand:0 "Independència: $INDEPENDENCE_COUNTRY$"
 colonial_rebels_demand_desc:0 "Els colons estan farts d'enviar a ultramar el te que és fruit del seu treball i exigeixen la independència!"
 colonial_patriot_rebels_demand:0 "Canviar de bàndol: $DEFECT_COUNTRY$"
 colonial_patriot_rebels_demand_desc:0 "Els colons consideren que no tenen representació a canvi dels impostos que paguen i exigeixen que els deixem canviar de bàndol ($DEFECT_COUNTRY$)."
 revolutionary_rebels_demand:0 "Enderrocar el govern"
 revolutionary_rebels_demand_desc:0 "Els revolucionaris detesten el nostre govern actual, opressiu segons ells, i n'exigeixen un de nou: $GOVERNMENT$."
 noble_rebels_demand:0 "Més privilegis"
 noble_rebels_demand_desc:0 "Els nobles exigeixen que tornem a l'antic ordre, quan els cavallers governaven dominis de pagesos submisos. Volen posar fi a aquest país de mercaders i pagesos."
 religious_rebels_demand:0 "Convertir $COUNTRYNAME$"
 religious_rebels_demand_desc:0 "Els rebels religiosos lluiten per la seva religió ($RELIGION$). Exigeixen que en reconeguem la supremacia o, si més no, que deixem d'intentar convertir-los i els deixem practicar el seu culte en pau."
 heretic_rebels_demand:0 "Acceptació: $HERETIC_RELIGION$"
 heretic_rebels_demand_desc:0 "Els rebels heretges ($HERETIC_RELIGION$) exigeixen que els deixem practicar el seu culte en pau. Tanmateix, el papa ens adverteix que això soscavarà el respecte per l'Església catòlica i farà que arrelin i s'estenguin heretgies encara pitjors."
 pretender_rebels_demand:0 "Entronitzar $PRETENDER_MONARCH$"
 pretender_rebels_demand_desc:0 "Els rebels pretendents exigeixen que $PRETENDER_MONARCH$ ocupi el tron i governi $COUNTRY$."
 ronin_rebels_demand:0 "Enderrocar el govern"
 ronin_rebels_demand_desc:0 "Els ronin són samurais sense senyor, romanents de la guerra. Amargats i pobres, s'han aplegat al voltant d'un líder que volen instaurar com a xogun."
 ikko_ikki_rebels_demand:0 "Enderrocar el govern"
 ikko_ikki_rebels_demand_desc:0 "Els ikko-ikki són pagesos descontents amb l'ordre actual al Japó i intentaran enderrocar-lo. Preferirien que els deixessin en pau."
 reactionary_rebels_demand:0 "Aturar l'occidentalització"
 reactionary_rebels_demand_desc:0 "Els reaccionaris exigeixen que s'aturin aquestes idees noves vingudes d'Occident. Volen tornar als bons vells temps."
 lollard_rebels_demand:0 "Tolerància envers els lol·lards"
 lollard_rebels_demand_desc:0 "Els lol·lards exigeixen que els deixem practicar el seu culte en pau. Tanmateix, el papa ens adverteix que això soscavarà el respecte per l'Església catòlica i farà que arrelin i s'estenguin heretgies encara pitjors."
 catholic_rebels_demand:0 "Convertir $COUNTRYNAME$"
 catholic_rebels_demand_desc:0 "Els rebels religiosos lluiten per la seva religió ($RELIGION$). Exigeixen que en reconeguem la supremacia o, si més no, que deixem d'intentar convertir-los i els deixem practicar el seu culte en pau."
