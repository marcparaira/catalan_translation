 castilian_civil_war.1.t:0 "Guerra civil castellana"
 castilian_civil_war.1.d:1 "Durant el darrer segle, la noblesa castellana ha intentat una vegada i una altra interferir en la successió de la corona de Castella, i no ha dubtat a aliar-se amb potències estrangeres. Sembla que es prepara una nova batalla d'aquest tipus i la successió torna a estar en dubte. Alguns nobles destacats qüestionen la legitimitat futura del tron castellà i preferirien un parent del rei alineat amb la Corona d'Aragó. Mentrestant, els partidaris de l'ordre establert fan propostes a la corona portuguesa per assegurar la posició del seu candidat.\nLa situació ha derivat en un conflicte obert, i sembla cada vegada més probable que la facció sense el suport reial intenti posar el seu candidat directament al tron en lloc de deixar-lo a la cua de la successió. Una part de la noblesa encara no s'ha decidit, i alguns han aprofitat l'ocasió per protestar en general contra el que consideren una vulneració dels seus antics drets."
