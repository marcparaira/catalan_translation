 MISSION_SETTINGS_AGGRESSIVENESS_DESC:0 "L'agressivitat influeix en com reacciona la flota davant dels vaixells enemics durant una missió.\nCom més alt és el valor, més forts són els enemics amb què la flota intentarà combatre.\n\n(Aquesta opció no afecta les missions d'exploració, d'evitar enemics ni de «Reparar els vaixells danyats».)"
 MISSION_SETTINGS_AGGRESSIVENESS_DESC_CAUTIOUS:0 "Amb l'opció Prudent, en general la flota intentarà evitar forces enemigues aclaparadores i limitar les pèrdues, i també evitarà el desgast.\n\n§YMissió de caça§!:\nEvita les flotes enemigues fortes i combat si té possibilitats raonables de vèncer.\n\n§YMissió de bloqueig§!:\nEvita els enfrontaments grans mentre bloqueja.\n\n§YMissió d'intercepció§!:\nIntercepta flotes enemigues de mida raonable prop de les vostres costes.\n\n§YEvitar§!, §YExploració§!, §YReparació§!:\nNo hi afecta."
 MISSION_SETTINGS_AGGRESSIVENESS_DESC_BOLD:0 "Amb l'opció Audaç, la flota tindrà el coratge de perseguir l'enemic més lluny que les flotes prudents, i també acceptarà una mica de desgast.\n\n§YMissió de caça§!:\nAccepta cert desgast per perseguir les flotes enemigues.\n\n§YMissió de bloqueig§!:\nBloqueja els ports enemics de manera agressiva.\n\n§YMissió d'intercepció§!:\nPersegueix les flotes enemigues una mica més lluny de les vostres costes que les flotes prudents.\n\n§YEvitar§!, §YExploració§!, §YReparació§!:\nNo hi afecta."
