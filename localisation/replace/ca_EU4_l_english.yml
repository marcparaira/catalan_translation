 CV_DISASTERS_DESC:0 "Un desastre és una sèrie d'esdeveniments negatius que poden afectar el vostre país en temps de turbulències. Quan es compleixen les condicions d'inici d'un desastre, el seu progrés comença a augmentar cada mes a un ritme que depèn d'un altre conjunt de modificadors. Un desastre en curs es pot aturar del tot si es compleixen unes condicions d'aturada, que són diferents de les d'inici. Quan el progrés arriba al 100%, el desastre comença i continua fins que se'n compleixen les condicions de finalització."
