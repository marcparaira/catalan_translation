 castilian_civil_war.2.t:0 "Extensió de la guerra civil"
 castilian_civil_war.2.d:1 "Uns nobles destacats d'una de les nostres províncies s'han unit a la revolta i s'han alçat en armes contra nosaltres."
 castilian_civil_war.3.t:0 "Guerra civil castellana"
 castilian_civil_war.3.d:0 "Un cop més, la corona castellana viu una successió disputada i sembla que el país és a punt d'entrar en guerra civil. Una de les aspirants, neboda de [Root.Monarch.GetName], ens ha demanat ajuda."
 castilian_civil_war.3.a:0 "Donar suport a aquesta pretendent"
 castilian_civil_war.3.b:0 "Que els castellans resolguin els seus propis conflictes."
 castilian_civil_war.4.t:0 "Implicació portuguesa"
 castilian_civil_war.4.d:0 "[From.Monarch.GetName] ha declarat [From.Monarch.GetHerHis] suport a la facció portuguesista del nostre país i ha enviat ajuda militar a través de la frontera."
 castilian_civil_war.4.a:0 "Magnífic!"
 castilian_civil_war.4.b:0 "Això és un ultratge!"
 castilian_civil_war.5.t:0 "Guerra civil castellana"
 castilian_civil_war.5.d:0 "Un cop més, la corona castellana viu una successió disputada i sembla que el país és a punt d'entrar en guerra civil. Un dels candidats ens ha demanat ajuda."
 castilian_civil_war.5.a:0 "Donar suport a aquest pretendent"
 castilian_civil_war.5.b:0 "Que els castellans resolguin els seus propis conflictes."
 castilian_civil_war.6.t:0 "Implicació aragonesa"
 castilian_civil_war.6.d:1 "[From.Monarch.GetName] ha declarat [From.Monarch.GetHerHis] suport a la facció aragonesista del nostre país i ha enviat ajuda militar a través de la frontera."
 castilian_civil_war.6.a:0 "Magnífic!"
 castilian_civil_war.6.b:0 "Això és un ultratge!"
 castilian_civil_war.7.t:0 "Guerra civil castellana"
 castilian_civil_war.7.d:0 "Un cop més, la corona castellana viu una successió disputada i sembla que el país és a punt d'entrar en guerra civil. Un dels candidats ha rebut el suport de la corona aragonesa, la nostra rival a l'altra banda dels Pirineus."
 castilian_civil_war.7.a:0 "Donar suport a l'altre candidat."
 castilian_civil_war.7.b:0 "No implicar-s'hi."
 castilian_civil_war.8.t:0 "Implicació francesa"
 castilian_civil_war.8.d:0 "[From.Monarch.GetName], monarca de França, ha vist com s'ha afeblit el nostre país i, amb ganes d'oposar-se a Aragó, ha decidit donar suport a la facció contrària a la nostra successió."
 castilian_civil_war.8.a:0 "Això és un ultratge!"
 castilian_civil_war.100.t:0 "Fi de la guerra civil castellana"
 castilian_civil_war.100.d:0 "Amb el final de les hostilitats, el Regne de Castella torna a estar en pau internament. Arran del conflicte, l'equilibri entre el poder reial i el de la noblesa ha canviat, i també la nostra relació amb els països veïns."
 castilian_civil_war.100.a:0 "Això ens acostarà a Aragó."
 castilian_civil_war.100.b:0 "Això ens acostarà a Portugal."
 polish_noble_rebels_demand:0 "Retorn de la monarquia electiva"
 polish_noble_rebels_demand_desc:0 "Els nobles exigeixen que tornem als vells costums, quan els cavallers muntats governaven dominis de pagesos sotmesos. Exigeixen que s'acabi aquest país de mercaders i pagesos."
