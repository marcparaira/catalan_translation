 RISE_OF_THE_OTTOMANS_DESC:0 "Els rumors sobre la feblesa otomana van dur el papa Eugeni IV a convocar una croada contra els otomans el 1443. Amb Occident encara immers en la guerra dels Cent Anys, el rei d'Hongria i Polònia, Ladislau III, va fer seva la causa d'expulsar definitivament d'Europa el flagell de la cristiandat. Dirigit pel general Joan Hunyadi, el Cavaller Blanc, l'exèrcit hongarès va obtenir alguns èxits inicials, però finalment va ser derrotat. El soldà Murat II, que havia abdicat, va tornar per ajudar el seu fill i va conduir l'exèrcit otomà a la victòria a la batalla de Varna, on va morir el rei Ladislau. Finalment es va signar la pau, però el camí de l'expansió otomana cap a l'Europa de l'Est havia quedat obert..."
