 ban_fur_trade:0 "Prohibir el comerç de pells"
 desc_ban_fur_trade:0 "Aquesta llei perjudica l'economia local, tant la dels indis com la dels blancs, però ens protegirà de les incursions armades índies."
 construction_wages:0 "Salaris de la construcció"
 desc_construction_wages:0 "Per contenir l'escalada de preus, s'ha establert un salari màxim per a la construcció."
 tax_break_ore:0 "Rebaixa fiscal"
 desc_tax_break_ore:0 "Els propietaris de les mines locals han obtingut una rebaixa fiscal."
 tax_break_wharf:0 "Rebaixa fiscal"
 desc_tax_break_wharf:0 "Els propietaris del moll local han obtingut una rebaixa fiscal."
 banned_tobacco_planting:0 "Prohibició de plantar tabac"
 desc_banned_tobacco_planting:0 "S'ha prohibit plantar tabac durant un any perquè els preus puguin pujar."
 reformed_events.EVTNAME1:0 "Refugiats reformats"
 reformed_events.EVTDESC1:0 "Un dels nostres veïns oprimeix sense pietat la seva minoria de fidels reformats. Aquestes pobres ànimes volen fugir de la persecució i establir-se [Root.GetCaAProv] [Root.GetName], una de les nostres províncies frontereres. Permetre-ho beneficiaria la nostra economia, però enutjaria molt el nostre veí..."
 reformed_events.EVTOPTA1:0 "Deixar-los passar"
 reformed_events.EVTOPTB1:0 "Més val que no"
 reformed_events.EVTNAME2:0 "Els fidels reformats fugen"
 reformed_events.EVTDESC2:0 "Molts heretges reformats [Root.GetCaDeProv] [Root.GetName] han fugit a l'altra banda de la frontera amb l'esperança de trobar refugi [From.GetCaAProv] [From.GetName]. Pel que sembla, tot això s'ha fet amb el consentiment tàcit del govern [From.Owner.GetCaDe] [From.Owner.GetName]."
 reformed_events.EVTOPTA2:0 "Com s'atreveixen!"
 reformed_events.EVTNAME3:0 "Enviament de pastors a l'estranger"
 reformed_events.EVTDESC3:0 "Molts membres de l'Església opinen que, com a nació reformada capdavantera, hauríem d'enviar els nostres pastors a l'estranger per garantir que la veritable Reforma continuï estenent-se."
 reformed_events.EVTOPTA3:0 "Per la glòria de Déu!"
 reformed_events.EVTOPTB3:0 "Mantenir-la dins les nostres fronteres"
 reformed_events.EVTNAME4:0 "Pastors estrangers [Root.GetCaAProv] [Root.GetName]"
 reformed_events.EVTDESC4:0 "Hi ha informes que diuen que han aparegut pastors que prediquen la fe reformada [Root.GetCaAProv] [Root.GetName]. Sembla que vénen [From.GetCaDe] [From.GetName] per encoratjar la població local a resistir i a plantar cara als nostres intents d'eradicar aquesta heretgia."
 reformed_events.EVTOPTA4:0 "Quin ultratge!"
 reformed_events.EVTNAME5:0 "Predestinació"
 reformed_events.EVTDESC5:0 "Els teòlegs reformats creuen que només es poden salvar els qui estan predestinats a la salvació. Però com que és impossible saber qui està predestinat, s'ha estès la idea que potser es pot discernir si una persona ho està observant-ne la manera de viure. Com que es considera que la feina dura, la frugalitat, l'èxit social i la riquesa són conseqüències importants de la predestinació, sembla que això impulsa els fidels de la fe reformada a esforçar-se per assolir-les, i també atreu els qui ja les tenen, com ara els burgesos i els mercaders."
 reformed_events.EVTOPTA5:0 "Fomentar aquestes creences"
 reformed_events.EVTOPTB5:0 "Deixar-ho estar"
 reformed_events.EVTNAME6:0 "Instruments a l'església"
 reformed_events.EVTDESC6:0 "Els teòlegs més destacats opinen que la música no s'hauria de fer servir en els oficis religiosos. Creuen que distreu la gent d'allò que realment importa —el culte i la recerca del coneixement de Déu— i, per tant, són partidaris de prohibir els instruments musicals a les esglésies."
 reformed_events.EVTOPTA6:0 "Decretar una prohibició"
 reformed_events.EVTOPTB6:0 "Ignorar-ne les opinions"
 reformed_events.EVTNAME7:0 "Fúria iconoclasta"
 reformed_events.EVTDESC7:0 "[Root.GetCaElProvCap] [Root.GetName] ha patit esclats de violència religiosa: turbes de fidels reformats destrossen esglésies i destrueixen l'art religiós catòlic. La majoria catòlica [Root.GetCaDeProv] [Root.GetName] exigeix que el govern actuï immediatament."
 reformed_events.EVTOPTA7:0 "Enviar tropes per aturar-ho!"
 reformed_events.EVTOPTB7:0 "Encoratjar-ho!"
