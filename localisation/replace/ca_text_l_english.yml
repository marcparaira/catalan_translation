 high_american_dragoon:0 "Dragó americà"
 ha_xantican_warriorDESCR:0 "La nostra nova «arma de foc» pren el nom de Xantico, deessa del foc i dels volcans. Armats amb xantis, els nostres guerrers són més eficaços que mai."
 ha_reformed_xantican_warriorDESCR:0 "L'experiència amb els xantis ens ha portat a la conclusió que es pot aconseguir un volum de foc més gran amb diverses files de guerrers xantics que disparen les armes i després es fan enrere, de manera que la fila següent pot disparar mentre l'anterior recarrega."
 ha_xiuhtecuhtli_soldierDESCR:0 "Xiuhtecuhtli, senyor dels volcans, dona nom a les nostres armes de foc més grans i potents. Amb més abast i més força d'impacte, és molt més mortífera que el xanti."
 ha_xiuhtecuhtlian_infantryDESCR:0 "Entrenada per aprofitar millor l'abast del xiuhtecuhtli, la infanteria xiuhtecuhtliana domina la guerra a distància."
 ha_xolotiDESCR:0 "S'ha produït una revolució en el disseny de les armes de foc. A diferència dels models antics, que feien servir una metxa encesa per disparar, el xoloti fa servir un percussor mecànic que subjecta un tros d'obsidiana per fer una espurna que dispara l'arma. Més ràpida de recarregar i menys propensa a fallar, no és estrany que aquesta arma prengui el nom de Xólotl, senyor del llamp i de la mort."
 ha_foreign_influenced_infantryDESCR:0 "Tot i que la invenció asteca de les armes de foc va canviar la guerra per sempre, ara moltes nacions de tot el món les fan servir. Si estudiem les tàctiques i els punts forts d'altres nacions i n'incorporem el millor a les nostres forces armades, hauríem de poder superar-les totes."
 ha_reformed_influenced_infantryDESCR:0 "Més contacte i més experiments amb forces armades estrangeres ens han portat a la conclusió que el nostre exèrcit s'ha preocupat massa pel foc ofensiu. L'entrenament futur posarà més èmfasi en la transició ràpida entre formacions obertes, que poden evitar el foc a distància, i formacions denses, que poden entrar en combat cos a cos quan calgui."
 ha_reformed_xolotiDESCR:0 "Les tàctiques del xoloti reformat són una barreja perfecta d'ideals propis i estrangers, més grans que la suma de les parts. Tot i que el foc massiu de xolotis continua sent la seva tàctica preferida, el combat cos a cos tampoc no els fa cap por."
 high_american_horsemenDESCR:0 "L'arribada dels cavalls arran del contacte amb Europa ha comportat una adopció limitada del seu ús a la guerra."
 high_american_rifle_cavalryDESCR:0 "Unes versions més petites i lleugeres del xiuhtecuhtli permeten a aquests genets devastar amb facilitat els adversaris armats per al cos a cos."
 high_american_hussarDESCR:0 "Cavalleria lleugera especialitzada en incursions i en tàctiques d'atac i retirada."
 high_american_swarmDESCR:0 "La cavalleria d'eixam és cavalleria en ordre obert armada amb xolotis lleugers, que fa servir tàctiques de foc d'assetjament per desorganitzar l'enemic abans de carregar. El seu ordre obert la fa menys vulnerable al foc enemic."
 high_american_dragoonDESCR:0 "El dragó americà va armat amb espases i xolotis de mida completa. Tot i que pot combatre cos a cos a cavall, prefereix de molt desmuntar i obrir foc contra l'enemic."
