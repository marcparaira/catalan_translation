 hofgericht_member:0 "Hofgericht"
 desc_hofgericht_member:0 "L'emperador té l'última paraula en els afers judicials, i com a conseqüència anem perdent la nostra tradició jurídica pròpia."
 hofgericht_emperor:0 "Hofgericht"
 desc_hofgericht_emperor:0 "Amb el Hofgericht reafirmat, com a emperador ara marqueu la política jurídica de tot l'imperi. La cort imperial atrau cada cop més legisladors hàbils."
