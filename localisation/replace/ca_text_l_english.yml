 HRE_NUM_MEMBERS:1 "Aquests són els estats membres de l'Imperi."
 HRE_NUM_MEMBERS_DELAYED:1 "És possible que més països s'uneixin al Sacre Imperi Romanogermànic si se senten amenaçats per potències exteriors i tenen una actitud amistosa envers l'emperador. Una autoritat imperial alta pot ajudar a convèncer-los."
