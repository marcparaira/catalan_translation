 BUILDINGSLEDGER_BUILDINGS_REGIMENTAL_CAMP_L:0 "Els campaments regimentals augmenten el nombre total de tropes que una província pot mantenir i abastir, i també redueixen el temps de reclutament. Les províncies amb campament regimental tenen una marca verda."
 BUILDINGSLEDGER_BUILDINGS_SHIPYARD_S:0 "Drassanes"
 BUILDINGSLEDGER_BUILDINGS_SHIPYARD_L:0 "Una drassana augmenta el nombre d'unitats navals que podeu mantenir i redueix el temps de construcció de vaixells. Només podeu construir drassanes en províncies costaneres. Les províncies amb una marca verda ja tenen drassana."
 BUILDINGSLEDGER_BUILDINGS_CONSTABLE_S:0 "Conestables"
