 tribal_succession_crisis:0 "Crisi successòria tribal"
 desc_tribal_succession_crisis:0 "La nostra tribu governa una àrea immensa i era simplement massa gran perquè el nostre cabdill fos pertot arreu. Han sorgit subcabdills poderosos en diverses zones que ara es consideren aspirants al tron."
 recover_abysmal_prestige_title:0 "Recuperar un prestigi pèssim"
 recover_abysmal_prestige_desc:0 "El nostre regne ha caigut tan baix que fins i tot les rates neguen haver-nos visitat mai. Hem d'enaltir el nostre país als ulls del món per poder tornar a anar amb el cap ben alt."
 improve_prestige_title:0 "Millorar el nostre prestigi!"
 improve_prestige_desc:0 "El nostre estat no té gaire prestigi i, per això, països que haurien d'admirar-nos ens miren per sobre l'espatlla. Hem de fer el que calgui per recuperar la posició que ens correspon."
