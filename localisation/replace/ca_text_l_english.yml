 destabilize_rival_title:0 "Desestabilitzar $COUNTRY$"
 destabilize_rival_desc:0 "$COUNTRY$ s'està convertint en un rival perillós: deslliurem els nostres espies perquè desestabilitzin el seu govern. Si tenen menys estabilitat, tindrem més marge de maniobra,"
 EXCOM_NOT_DEFENDER:0 "No podem excomunicar el Defensor de la Fe."
 EXCOM_NOT_PAPACY:0 "No podem fer excomunicar el mateix papa."
 HAVE_LESS_LAND_FORCELIMIT:0 "Tenir un límit de forces terrestres inferior a"
 HAVE_MORE_LAND_FORCELIMIT:0 "Tenir un límit de forces terrestres d'almenys"
 HAVE_LESS_NAVAL_FORCELIMIT:0 "Tenir un límit de forces navals inferior a"
 HAVE_MORE_NAVAL_FORCELIMIT:1 "Tenir un límit de forces navals d'almenys"
 large_tribe_bad_adm:0 "Governant incapaç"
 desc_large_tribe_bad_adm:0 "El governant no és capaç de gestionar els detalls administratius de la nostra tribu"
 large_tribe_bad_dip:0 "Governant incapaç"
 desc_large_tribe_bad_dip:0 "El governant no és capaç de gestionar els detalls diplomàtics de la nostra tribu"
 large_tribe_bad_mil:0 "Governant incapaç"
 desc_large_tribe_bad_mil:0 "El governant no és capaç de gestionar els detalls militars de la nostra tribu"
 REVOKE_EXCOMMUNICATETITLE:0 "Aixecar l'excomunió"
 EXCOMMUNICATEREVOKEDESC:0 "Voleu revocar l'excomunió de $MONARCH$?"
 REVEXCOMMUNICATEDESC:0 "L'excomunió permet a les altres nacions catòliques declarar-los la guerra sense patir la penalització habitual d'estabilitat per tenir la mateixa religió o per no tenir cap casus belli."
 NOT_EXCOMMUNICATED:0 "El seu governant no està excomunicat!"
 vassalize_mission_title:0 "Vassallitzar $COUNTRY$"
 vassalize_mission_desc:0 "Tenim bones relacions i lligams dinàstics estrets amb $COUNTRY$, però és un país molt feble. Hem d'estendre-hi la nostra protecció i fer que ens reconegui com a sobirà."
 GC_NAME:0 "La gran campanya"
 GC_DESC:0 "És l'any 1399 i arreu hi ha agitació. A l'oest continua la guerra dels Cent Anys, i a l'est el conqueridor Tamerlà sembra el terror. L'Imperi Romà d'Orient s'aferra a uns pocs enclavaments. La glòria espera els qui sàpiguen aprofitar l'oportunitat."
 FALL_OF_BYZANS_NAME:0 "La caiguda de Bizanci"
 FALL_OF_BYZANS_DESC:0 "L'Imperi Otomà ha conquerit la «ciutat del desig del món» i ja avança cap a l'interior dels Balcans. A l'oest, la gran Reconquesta arriba al punt culminant, mentre altres nacions es preparen per ocupar el seu lloc a l'escenari de la història."
 revolutionary_empire_ruler_female:0 "Emperadriu"
 increase_spices_trade_title:0 "Augmentar el nostre control de les espècies"
 increase_spices_trade_desc:0 "Ja portem carregaments rics d'espècies, però el nostre poble en vol més. Ara els nostres mercaders d'espècies ens insten a assegurar encara més fonts d'espècies."
 conquer_a_port_title:0 "Accedir al mar: $PROVINCENAME$"
 conquer_a_port_desc:0 "La nostra nació, sense sortida al mar, s'està perdent el comerç i les províncies colonials. Per complir el nostre destí, hem de tenir un port, preferiblement $PROVINCENAME$."
 HAVE_NO_UNITS_IN:0 "$COUNTRY$ NO té unitats en aquesta província: $PROVINCE$."
 HAVE_UNITS_IN:0 "$COUNTRY$ té unitats en aquesta província: $PROVINCE$."
