 schwarze_reiterDESCR:0 "Els genets negres (pel color de l'armadura) eren genets equipats cadascun amb dues pistoles i una espasa, sovint amb una cuirassa de protecció. Molts estats alemanys els van fer servir durant els segles XVI i XVII. Com que les armes de foc eren les seves armes principals, van trencar amb la tradició dels cavallers medievals, segons la qual els genets sempre anaven equipats amb llances. En combat disparaven les pistoles contra la línia enemiga i després intentaven una càrrega i un combat cos a cos per desbandar els soldats enemics."
