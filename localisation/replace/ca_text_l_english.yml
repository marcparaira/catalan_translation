 thalassocracy:0 "Talassocràcia"
 desc_thalassocracy:0 "Talassocràcia: el domini del mar. El nostre és un poble que viu amb el mar, pel mar i per al mar. El nostre imperi s'estén molt més enllà de la nostra pàtria, fins a colònies llunyanes al nostre Ultramar, les nostres Terres d'Ultramar. De costa a costa i més enllà, les nostres banderes onegen en vaixells sobre l'escuma salada. El mar és fred, però n'hem fet la nostra llar. Que ningú no gosi desafiar-nos en el nostre element."
 confirm_thalassocracy_title:0 "Confirmar la talassocràcia"
 confirm_thalassocracy_desc:0 "Si confirmem la nostra talassocràcia, el nostre domini del mar, rebrem bonificacions enormes per a l'armada, que ens portaran a una posició de domini incontestable sobre els oceans."
