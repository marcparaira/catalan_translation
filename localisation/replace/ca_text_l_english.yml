 anti_tax_rebels_title:0 "Camperols"
 anti_tax_rebels_name:0 "Camperols ($COUNTRY$)"
 anti_tax_rebels_desc:0 "Els insurrectes camperols n'estan farts de l'opressió i dels impostos asfixiants. Estan mal equipats i mal entrenats, i sobretot recluten infanteria."
 revolutionary_rebels_title:0 "Revolucionaris"
 revolutionary_rebels_name:0 "Revolucionaris ($COUNTRY$)"
 revolutionary_rebels_desc:0 "Els rebels revolucionaris volen enderrocar el règim, que consideren corrupte i profundament injust. Creuen en la seva causa i els dirigeixen burgesos i oficials militars desenganyats."
 heretic_rebels_title:0 "Heretges"
 heretic_rebels_name:0 "Heretges ($HERETIC$)"
 heretic_rebels_desc:0 "Els rebels heretges defensen una interpretació diferent de la fe i estan disposats a morir per la seva causa. Sovint reuneixen un nucli de soldats entrenats que s'han deixat convèncer per les creences herètiques."
 religious_rebels_title:0 "Religiosos"
 religious_rebels_name:0 "Fanàtics ($RELIGION$)"
 religious_rebels_desc:0 "Els fanàtics religiosos solen revoltar-se a les províncies controlades per nacions d'una altra fe. Volen escampar la seva fe i castigar tots els descreguts."
 nationalist_rebels_title:0 "Separatistes"
 nationalist_rebels_name:0 "Separatistes ($INDEP$)"
 nationalist_rebels_desc:0 "Els rebels separatistes volen la llibertat per al seu poble. Estan ben dirigits i ben equipats, però solen quedar-se a les províncies de la seva pròpia cultura."
 noble_rebels_title:0 "Nobles"
 noble_rebels_name:0 "Nobles rebels ($COUNTRY$)"
 noble_rebels_desc:0 "Els rebels nobles estan descontents amb el seu monarca, normalment a causa de reformes liberals. Despleguen tropes professionals amb una gran proporció de cavalleria."
 colonial_rebels_title:0 "Colonials"
 colonial_rebels_name:0 "Separatistes ($INDEP$)"
 colonial_rebels_desc:0 "Els separatistes colonials estan cansats de tants anys de desigualtat i mal govern, i volen independitzar-se de la llunyana metròpoli."
 patriot_rebels_title:0 "Patriotes"
 patriot_rebels_name:0 "Patriotes ($CULTURE$)"
 patriot_rebels_desc:0 "Els rebels patriotes somien amb unir-se als seus parents culturals sota una bandera lliure. Compte, perquè les províncies que prenguin poden desertar."
 russian_nation_title:0 "Formar la nació russa"
 russian_nation_desc:0 "Gràcies a la conquesta i la diplomàcia, Rússia ha passat de ser un simple assentament a un principat dominant. Després de diverses expedicions cap a l'est, les hordes mongoles finalment han estat sotmeses i sorgeix un estat rus centralitzat, sota la sobirania del tsar. Les influències de l'Europa occidental ens ajuden a modernitzar i reformar la nostra nació, i s'està adoptant un model d'educació occidental."
 netherlands_nation_title:0 "Formar la nació neerlandesa"
 netherlands_nation_desc:0 "Els neerlandesos s'estan convertint en una de les potències navals i colonials més capaces d'Europa. Les lucratives oportunitats comercials, tant locals com d'ultramar, han fet evolucionar ràpidament el país fins a convertir-lo en un dels primers països capitalistes del món."
 spanish_nation_title:0 "Formar la nació espanyola per la força"
 spanish_nation_desc:0 "L'expansió global per les terres acabades de descobrir i la fundació de colònies estan convertint Espanya en una de les nacions més poderoses i riques del nostre temps. Els exploradors espanyols s'endinsen constantment en terres noves i amplien les nostres fronteres. Arriben a la metròpoli quantitats immenses d'or i plata, que omplen les arques del tresor de l'estat."
 english_nation_title:0 "Formar la nació anglesa"
 english_nation_desc:0 "El comerç ha estat durant molt de temps un fonament de la política nacional anglesa. Estenent la nostra influència més enllà de les fronteres i controlant-ne el desenvolupament polític intern, hem aconseguit esdevenir una de les principals potències europees. L'expansió colonial s'està convertint en un factor clau del creixement econòmic de la nostra nació i reforça la nostra posició en els afers mundials."
 french_nation_title:0 "Formar la nació francesa"
 french_nation_desc:0 "Aquest any marcarà l'inici d'un període d'evolució per a la nostra nació. Els vells costums feudals començaran a deixar pas a una nació més moderna i centralitzada. Tot i que passem dificultats econòmiques per culpa de projectes i campanyes militars mal calculats, hem aconseguit convertir-nos en una de les potències més dominants d'Europa."
 italian_nation_title:0 "Formar la nació italiana"
 italian_nation_desc:0 "Com a cor del Renaixement, la nostra nació floreix culturalment. Acabem d'entrar en el que sembla una llarga rebel·lió artística, especialment en els camps de l'arquitectura i la literatura. Tanmateix, l'evolució cultural no ajuda el nostre país a mantenir la pau dins les seves fronteres. Estats estrangers que cerquen poder i guanys territorials ataquen el nostre país contínuament."
 german_nation_title:0 "Formar la nació alemanya"
 german_nation_desc:0 "Malgrat l'absència d'una autoritat central forta, la nostra nació prospera. La Lliga Hanseàtica, formada per centenars de ciutats del nord d'Alemanya, ha contribuït a la prosperitat de la nostra nació. El creixement intel·lectual, juntament amb el comerç marítim i terrestre, també ha ajudat a impulsar el desenvolupament i a convertir el nostre país en un ric centre manufacturer."
 persian_nation_title:0 "Formar la nació persa"
 persian_nation_desc:1 "Les terres de Pèrsia han estat la seu d'imperis poderosos des dels temps de Cir el Gran. És hora que $MONARCH$ recuperi aquella glòria legítima i el títol de xa de l'Iran, ja que s'han conquerit diverses regions veïnes i la possibilitat de fer ressorgir una nació iraniana ja no sembla tan llunyana."
 mughal_nation_title:0 "Formar l'Imperi mogol"
 mughal_nation_desc:1 "$MONARCH$ ha començat a posar els fonaments d'un nou imperi. Tot i ser inferiors en nombre, les seves tropes ben disciplinades han aconseguit diverses victòries decisives contra els soldans de l'Índia. La batalla lliurada a [522.GetCapitalName] va ser la primera gran victòria d'una sèrie d'expansions territorials i, amb el temps, l'imperi dels mogols podria estendre's per la major part de l'altiplà indi."
 irish_nation_title:0 "Formar la nació irlandesa"
 irish_nation_desc:0 "Fa dècades que Anglaterra intenta sotmetre la població irlandesa i prendre el control de l'illa. Unir les terres irlandeses sota una sola bandera potser és la nostra única oportunitat de repel·lir-los."
 british_nation_title:0 "Formar la nació britànica"
 british_nation_desc:0 "Unint el nostre desenvolupament polític intern i estenent la nostra influència més enllà de les fronteres, podrem reforçar la nostra posició en els afers mundials i convertir-nos en una de les principals potències europees: l'Imperi Britànic."
 eastern_westernisation_title:0 "Occidentalitzar-se"
 eastern_westernisation_desc:0 "Després de diversos viatges per l'Europa occidental, $MONARCH$ està més decidit que mai a aplicar àmplies reformes occidentalitzadores per combatre l'endarreriment del nostre país. S'estan portant treballadors qualificats i científics per occidentalitzar la nació i fer-la més moderna. L'exèrcit està sotmès a una àmplia reorganització, i també les tècniques productives i agrícoles."
 muslim_westernisation_title:0 "Occidentalitzar-se"
 muslim_westernisation_desc:0 "$MONARCH$ no només és conegut com un gran conqueridor, sinó també com un gran consolidador i reformador. El seu govern competent ha posat els fonaments de la modernització del nostre país. Admira profundament els avenços d'Occident i, amb l'ajuda de consellers estrangers, ha iniciat una àmplia reforma cultural i militar."
 rotw_westernisation_title:0 "Occidentalitzar-se"
 rotw_westernisation_desc:0 "Exploradors i colons estrangers de tot Europa han colonitzat progressivament una part cada cop més gran del nostre país. Les noves malalties, juntament amb l'esclavització i l'explotació, han delmat una gran part de la nostra població, han esmicolat les nostres icones i valors culturals i hi han imposat els pensaments i les idees occidentals."
 no_mission_title:0 "Cap missió"
 no_mission_desc:0 "Ara mateix no tenim cap missió activa."
 conquer_core_title:0 "Recuperar $PROVINCENAME$"
 conquer_core_desc:0 "Des de temps immemorials, $PROVINCENAME$ pertany per dret a la nostra gran nació. Els nostres espies informen que la població anhela tornar amb nosaltres i que a cada casa s'hi amaguen banderes i armes per si les nostres tropes arriben a alliberar-los dels seus opressors."
 AYD_ADJ2:0 "aydin"
 AQU_ADJ2:0 "aquileià"
 BYZ_ADJ2:0 "bizantí"
 MAJ_ADJ2:0 "majapahit"
 MEI_ADJ2:0 "meissen"
 SUK_ADJ2:0 "sukhothai"
 liberum_veto_title:0 "Instaurar el liberum veto"
 liberum_veto_desc:0 "La nostra noblesa ens ha fet una proposta interessant. Si els atorguéssim el liberum veto, a canvi ens donarien un suport substancial durant la guerra actual. Tot i que l'oferta és molt generosa, alguns dels nostres consellers suggereixen que podria ser només el primer pas. De fet, encara que s'enfadaran si ens hi neguem, segur que aprofitaran qualsevol mostra futura de feblesa per exigir més concessions."
 indian_trade_company_title:0 "Fundar la Companyia de les Índies"
 indian_trade_company_desc:0 "El nostre interès en una Companyia de les Índies Orientals es basa sobretot en les esperances i les ambicions que han despertat els enormes beneficis de les primeres empreses d'altres companyies. Al mateix temps, $MONARCH$ també desitja tenir un paper dominant en el comerç mundial contemporani, un desig que no necessàriament comparteixen de tot cor els mercaders locals del nostre país."
 own_port_province_in_far_east_tooltip:0 "Posseir una província portuària a l'Índia, la Xina, el Japó o les Índies Orientals."
