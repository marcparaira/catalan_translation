 seaban_decision_emperor:1 "Reformar la prohibició marítima"
 seaban_decision_desc:1 "Els mars i els oceans porten problemes: pirateria, contraban i, de vegades, fins i tot usurpadors que s'amaguen darrere les onades i les marees. Però el comerç marítim també porta fortuna i descobriments. Per deixar entrar la riquesa i les noves innovacions al nostre gran regne, hauríem de reformar les normes de la prohibició marítima."
 reform_land_tax_decision_title:2 "Designar zongdus"
 reform_land_tax_decision_emperor:2 "Designar zongdus"
 reform_land_tax_decision_desc:2 "La immensitat del nostre regne és suprema i sense parió, però governar-la és feixuc. Per tant, creem el càrrec de zongdu, un virrei que supervisi més d'una província. Dirigiran els afers provincials com a representants de l'emperador, de manera que els assumptes menys crucials no s'hagin de comunicar a la Ciutat Prohibida."
 military_governors_decision_title:2 "Fundar el Lifan Yuan"
 military_governors_decision_emperor:2 "Fundar el Lifan Yuan"
 military_governors_decision_desc:2 "Per gestionar els nombrosos súbdits i estats menors de les regions perifèriques, dins i fora de la frontera imperial, el Ministeri de Ritus es considera ara insuficient i inadequat. Fundarem una oficina que s'ocupi de tractar amb ells."
 centralizing_top_government_decision_title:2 "Remodelar la burocràcia"
 centralizing_top_government_decision_emperor:2 "Remodelar la burocràcia"
 centralizing_top_government_decision_desc:2 "Reorganitzar el guanzhi, els rangs burocràtics, no és només una ruptura simbòlica amb la dinastia incompetent que ens va precedir: si reajustem les estructures polítiques de l'Imperi, el nostre poder es concentrarà i el nostre règim esdevindrà sòlid com una fortalesa d'or envoltada d'un fossat bullent."
 vassalize_tributaries_decision_title:1 "Elevar la condició dels tributaris"
 vassalize_tributaries_decision_emperor:1 "Elevar la condició dels tributaris"
 vassalize_tributaries_decision_desc:0 "L'Imperi Celestial és sobirà de diversos estats tributaris que reconeixen la nostra superioritat. Mentre que la majoria dels bàrbars continuaran aliens als nostres ideals, altres tributaris s'esforcen per acostar-se a la grandesa del Cel. És deure de l'emperador elevar els qui més ens complauen."
 vassalize_tributaries_decision_tt:0 "L'emperador de la Xina pot fer servir el mandat per elevar un estat tributari a vassall directe."
 vassalize_tributaries_decision_ct:0 "L'emperador de la Xina ja no pot elevar tributaris a vassalls."
