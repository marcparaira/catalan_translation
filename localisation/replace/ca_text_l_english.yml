 REVOLUTIONARY_FRANCE_NAME:0 "La França revolucionària"
 REVOLUTIONARY_FRANCE_DESC:0 "La fugida de Lluís XVI a Varennes va minar la seva credibilitat i va obrir el camí a la proclamació de la República Francesa el 1792. Tement que el fervor revolucionari s'estengués als seus països, els altres monarques europeus van demanar la guerra contra el nou govern revolucionari. Dirigiu la França revolucionària en la seva lluita per imposar-se a una poderosa coalició de potències europees."
 THE_FRENCH_REVOLUTION_NAME:0 "La Revolució Francesa"
 THE_FRENCH_REVOLUTION_DESC:0 "Un dels períodes més importants de la història europea va començar el 14 de juliol amb la presa de la Bastilla. Aquest fet seria el primer d'una sèrie d'intents d'enderrocar la dinastia borbònica i posar fi a la monarquia absoluta que governava França en aquell moment. Dirigiu la lluita contra els rebels revolucionaris mentre França entra en una de les seves fases més convulses."
 mixed_order_infantry:0 "Infanteria d'ordre mixt"
 mixed_order_infantryDESCR:0 "Una unitat d'assalt d'infanteria equipada originalment amb granades i desplegada sobretot en setges. Durant el segle XVIII, els granaders van passar a preferir la baioneta com a arma per davant de les granades."
 napoleonic_lancers:0 "Llancers llatins"
 napoleonic_lancersDESCR:0 "La crème de la crème de l'exèrcit napoleònic. Tot i que les llances els feien menys àgils, aquestes tropes de cavalleria eren adversaris formidables quan carregaven directament contra l'enemic."
 napoleonic_square:0 "Quadre napoleònic"
 napoleonic_squareDESCR:0 "Un cos d'infanteria disposat en una formació rectangular tancada, amb cavalleria i artilleria al seu interior. Aquesta formació era molt adequada contra els atacs de cavalleria, però naturalment no resistia tan bé els atacs d'artilleria."
 open_order_cavalry:0 "Caçador llatí"
 open_order_cavalryDESCR:0 "Unitats de cavalleria muntada especialitzades en escaramusses i famoses per la seva punteria."
 eastern_carabinier:0 "Carrabiner oriental"
 eastern_carabinierDESCR:0 "En essència, un soldat d'infanteria muntat que portava un mosquet curt o un fusell, també anomenat carrabina. La capacitat de desmuntar i lluitar a peu els donava una gran flexibilitat en la batalla."
 eastern_skirmisher:0 "Tirador oriental"
 eastern_skirmisherDESCR:0 "Petites unitats de cavalleria flexibles, sempre en moviment i especialitzades en el combat improvisat, sense dependre de la infanteria i l'artilleria, més lentes."
 eastern_uhlan:0 "Ulà oriental"
 eastern_uhlanDESCR:0 "Una unitat de cavalleria lleugera equipada sovint amb llança, pistola o sabre. L'avantatge tàctic dels ulans era la seva agilitat i velocitat, i diversos exèrcits europeus en feien servir sovint"
 muslim_dragoon:0 "Dragó musulmà"
 muslim_dragoonDESCR:0 "Un soldat muntat que feia servir el cavall com a mitjà de transport però que lluitava a peu."
 muslim_mass_infantry:0 "Infanteria massiva musulmana"
 muslim_mass_infantryDESCR:0 "Un batalló format per almenys un miler de soldats d'infanteria, armats sovint amb mosquets i desplegats en formació de quadre. Mantenint un quadre compacte, aquesta formació podia resistir fins i tot la càrrega de cavalleria més ambiciosa."
 asian_mass_infantry:0 "Infanteria massiva asiàtica"
 asian_mass_infantryDESCR:0 "Un batalló format per almenys un miler de soldats d'infanteria, armats sovint amb mosquets i desplegats en formació de quadre. Mantenint un quadre compacte, aquesta formació podia resistir fins i tot la càrrega de cavalleria més ambiciosa."
 asian_charge_cavalry:0 "Cavalleria de càrrega asiàtica"
 asian_charge_cavalryDESCR:0 "Una unitat de cavalleria que aplicava tàctiques de xoc carregant contra l'enemic a tota velocitat per exercir la màxima força possible."
 flying_battery:0 "Bateria volant"
 flying_batteryDESCR:0 "Una estratègia centrada sobretot en la velocitat i la mobilitat: l'artilleria es desplaçava a un punt del camp de batalla, hi disparava les seves càrregues i de seguida es traslladava al següent punt d'atac, en ràpida successió."
 defensive_flying_battery:0 "Bateria volant defensiva"
 defensive_flying_batteryDESCR:0 "Una estratègia centrada sobretot en la velocitat i la mobilitat: l'artilleria es desplaçava a un punt del camp de batalla, hi disparava les seves càrregues i de seguida es traslladava al següent punt d'atac, en ràpida successió."
