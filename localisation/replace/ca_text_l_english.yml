 HAVE_MORE_TOTAL_CARDINALS_THAN:0 "Total de cardenals d'almenys "
 get_minor_cash_reserve_title:0 "Acumular diners"
 get_minor_cash_reserve_desc:0 "Un príncep savi ha d'observar regles com aquestes, i mai no ha d'estar ociós en temps de pau, sinó augmentar els seus recursos amb diligència, de manera que li siguin útils en l'adversitat, perquè, si la fortuna canvia, el trobi preparat per resistir els seus cops."
