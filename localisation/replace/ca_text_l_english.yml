 philosopher_desc:0 "Conseller dedicat a l'estudi de la naturalesa fonamental del coneixement, la realitat i l'existència."
 natural_scientist_desc:0 "Conseller molt hàbil en l'estudi de la natura i del món físic."
 artist_desc:0 "Persona molt creativa i excepcionalment hàbil en l'escultura, la pintura o la poesia."
 statesman_desc:0 "Polític hàbil, molt eficient en els afers de govern i en les responsabilitats de l'estat."
 treasurer_desc:0 "Conseller responsable de l'administració de la riquesa financera i de les inversions comercials de la nació."
 naval_reformer_desc:0 "Veterà naval d'alt rang que investiga contínuament nous invents i noves tàctiques navals per millorar i ampliar la nostra armada."
 army_reformer_desc:0 "Veterà militar d'alt rang que investiga contínuament nous invents i noves tàctiques per millorar i ampliar el nostre exèrcit."
 trader_desc:0 "Conseller comercial que controla tots els aspectes del comerç de l'estat, des de l'assignació del nombre adequat de mercaders fins a on hi ha les rutes comercials més adients."
 theologian_desc:0 "Persona molt entesa en qüestions espirituals i en l'estudi de temes religiosos."
 spymaster_desc:0 "Els nostres ulls i orelles als països estrangers, que ens ajuda a recollir informació militar i política dels nostres rivals sense que ho sàpiguen."
 colonial_governor_desc:0 "Representant del nostre govern a ultramar, responsable de l'administració de les nostres colònies."
