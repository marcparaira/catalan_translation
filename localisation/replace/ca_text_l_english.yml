 temples_FACTION_DESC:2 "Les Comandàncies són el sistema dels generals i comandants dels exèrcits imperials. Desitjosos de demostrar el seu valor i la seva lleialtat, procuren afavorir la guerra per sobre de la diplomàcia per poder ascendir.\n\n§YGuanyen influència amb l'estabilitat positiva i la tradició militar. En perden amb l'esgotament bèl·lic.§!"
