 counter_reformation:0 "Contrareforma"
 desc_counter_reformation:0 "Hem abraçat la Contrareforma en defensa de la fe catòlica i de Sa Santedat el papa. (Si mai triem les idees nacionals «§YEcumenisme§W» o «§YLiberté, Égalité, Fraternité§W», perdrem aquesta bonificació.)"
 join_the_counter_reformation_title:0 "Abraçar la Contrareforma"
 join_the_counter_reformation_desc:0 "Sa Santedat el papa ha demanat un gran esforç per contrarestar el moviment protestant. Amb l'ajuda del recentment fundat orde dels jesuïtes, extirparem i purgarem aquestes heretgies infames. A més de tenir més missioners, i més eficaços, el protestantisme i la fe reformada tindran més dificultats per estendre's pel nostre regne. (Si mai triem les idees nacionals «§YEcumenisme§W» o «§YLiberté, Égalité, Fraternité§W», perdrem aquesta bonificació.)"
 ENABLED_FOR_LESS_THAN:0 " (religió) activada fa menys de "
 ENABLED_FOR_AT_LEAST:0 " (religió) activada fa almenys "
 halberd_infantry:0 "Infanteria d'alabarders"
 halberd_infantryDESCR:0 "Unitats d'infanteria equipades amb astes amb fulla de destral i punta de pica. Les alabardes es van començar a fer servir habitualment durant els segles XIV i XV i es van desenvolupar principalment per combatre amb més eficàcia les tropes molt cuirassades."
 chevauchee:0 "Chevauchée"
 chevaucheeDESCR:0 "La chevauchée estava formada per petits grups d'unitats de cavalleria lleugera i s'utilitzava principalment per fer incursions i saquejos. La tàctica de la chevauchée es va fer servir amb èxit tant durant la «Reconquesta» com durant la guerra dels Cent Anys."
 bardiche_infantry:0 "Infanteria amb berdix"
 bardiche_infantryDESCR:0 "Unitats d'infanteria equipades amb destrals d'asta llargues, els «berdixos», de mides i formes variades, utilitzades habitualment pels països de l'Europa oriental."
 druzhina_cavalry:0 "Cavalleria druzhina"
 druzhina_cavalryDESCR:0 "Unitats de cavalleria equipades amb destrals de guerra que formaven el nucli de molts exèrcits de l'Europa oriental. En temps de pau, les druzhines solien servir de guàrdia personal o encarregar-se de recaptar tributs."
 muslim_cavalry_archers:0 "Arquers musulmans a cavall"
 muslim_cavalry_archersDESCR:0 "Arquers a cavall lleugers i ràpids, sovint desplegats contra els cavallers, molt més lents i pesants."
 CANT_CAST_ELECTORAL_VOTE:0 "No podem tornar a canviar el vot fins al "
 gain_tradepost_in_china_title:0 "Obtenir una factoria a la Xina"
 gain_tradepost_in_china_desc:0 "Els nostres mercaders necessiten controlar el comerç de porcellana. Ens hem d'assegurar que controlem almenys una província de l'Àsia que produeixi porcellana."
 defeat_rebels_mission_title:0 "Derrotar els rebels"
 defeat_rebels_mission_desc:0 "Els rebels devasten el nostre país i ens hem d'assegurar de tornar a tenir-ne el control total. Elimineu tots els rebels!"
 convert_province_mission_title:0 "Convertir $PROVINCENAME$ (fe: $COUNTRY_RELIGION$)"
 convert_province_mission_desc:0 "$PROVINCENAME$ no segueix l'única fe vertadera. Hi hem d'enviar els nostres missioners per convertir-ne els habitants, o les seves ànimes es perdran per sempre."
 force_convert_mission_title:0 "Convertir $COUNTRY$"
 force_convert_mission_desc:0 "$COUNTRY$ fa massa temps que segueix la fe $COUNTRY_RELIGION$. És la nostra missió sagrada convertir-los a l'única fe vertadera. Per l'espasa!"
 TRIG_IS:0 "és"
 TRIG_ISNOT:0 "no és"
 improve_reputation_mission_title:0 "Reduir la sobreextensió!"
 improve_reputation_mission_desc:0 "Ens hem expandit massa de pressa i hem acumulat una sobreextensió considerable. Ens hem de consolidar i treballar per reduir-la, o haurem d'afrontar conseqüències greus."
 generic_annex_vassal_mission_title:0 "Incorporar [Root.GetName] al nostre país"
 generic_annex_vassal_mission_desc:0 "[Root.GetName] és vassall del nostre país, però hem d'integrar-lo més a la nostra societat. Una annexió diplomàtica seria la millor opció."
 annex_minor_mission_title:0 "Esborrar [Root.GetName] del mapa!"
 annex_minor_mission_desc:0 "Aquest petit estat molest a tocar de les nostres fronteres té l'actitud indignant de creure que ha de ser independent. Cal corregir-ho immediatament. Annexioneu $COUNTRY$ i esborreu-lo del mapa."
 improve_relations_mission_title:0 "Millorar les relacions amb $COUNTRY$"
 improve_relations_mission_desc:0 "Les relacions amb els nostres veïns s'han deteriorat massa; hem de corregir-ho i reparar les nostres relacions."
 get_an_alliance_mission_title:0 "Formar una aliança amb $COUNTRY$"
 get_an_alliance_mission_desc:0 "Hem de formar més aliances, i una aliança amb $COUNTRY$ ens hauria de ser beneficiosa."
