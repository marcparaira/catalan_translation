 amass_wealth_header:0 "Les nostres finances són pobres. Hauríem de"
 amass_wealth_title:0 "Omplir les nostres arques"
 amass_wealth_desc:0 "Els nostres consellers ens han convençut dels avantatges d'una gran reserva d'or. Acumular riquesa ara ens garantirà l'èxit en temps de crisi."
 conquer_core_header:0 "La venjança serà nostra! Hem de"
 reclaim_jerusalem_header:0 "L'Església us ha encomanat una missió sagrada:"
 reclaim_jerusalem_title:0 "Recuperar la Ciutat Santa"
 reclaim_jerusalem_desc:0 "És una ofensa intolerable per a tot bon cristià que la ciutat de Nostre Senyor sigui en mans infidels. Com els valents croats d'antany, hem de reunir una host poderosa i expulsar els infidels de Jerusalem!"
 scottish:0 "escocesa"
 iranian:0 "iraniana"
 east_persian:0 "khorasani"
 construct_grand_fleet_header:0 "El nostre orgull nacional exigeix que"
 construct_grand_fleet_title:0 "Construir una gran flota"
 construct_grand_fleet_desc:0 "Com a potència naval, hem de tenir una flota prou gran per defensar les nostres costes. Necessitem construir més vaixells de línia."
 rule_the_seas_header:0 "El nostre orgull nacional exigeix que"
 rule_the_seas_title:0 "Dominar els mars"
 rule_the_seas_desc:0 "Cap altra nació hauria de tenir una flota més gran que la nostra! Hem d'augmentar la nostra flota fins que siguem qui té més vaixells de línia."
 iberian_peninsula:0 "Península Ibèrica"
 finish_reconquista_title:0 "Acabar la Reconquesta!"
 finish_reconquista_desc:0 "Mentre a Hispània quedi una sola ciutat governada pels infidels, no podem aturar la nostra missió santa! Hem d'alliberar tota la península Ibèrica dels moros!"
 no_truce_with_the_moors_title:0 "Cap treva amb el moro"
 no_truce_with_the_moors_desc:0 "La nostra missió santa és expulsar els moros d'Hispània, i estar en pau amb ells és una ofensa a Déu. Hem de declarar la guerra a Granada immediatament, o serem condemnats com a pecadors."
 spain_must_be_christian_title:0 "Espanya ha de ser cristiana"
 spain_must_be_christian_desc:0 "A Hispània encara hi ha moros que segueixen la fe musulmana. Cal convertir-los o expulsar-los: Déu no acceptarà res menys. Aquests nous conversos contribuiran de bon grat a la nostra Santa Església."
 continue_reconquista_title:0 "Continuar la Reconquesta"
 continue_reconquista_desc:0 "Per protegir Hispània, hem d'establir una presència a l'altra banda del mar, al sud. Unes quantes ciutats cristianes allà haurien de ser una protecció segura per al nostre regne."
 the_carribean:0 "El Carib"
 spain_discover_america_header:0 "Noves possibilitats"
 spain_discover_america_title:0 "Podem arribar a l'Índia per l'oest"
 spain_discover_america_desc:0 "Tot i que hi ha immenses extensions d'oceà, els vents afavoreixen els viatges cap a l'oest. Els nostres navegants creuen que poden arribar a l'Índia si se'ls dona el suport adequat."
 conquer_incas_title:0 "Els inques tenen or!"
 conquer_incas_desc:0 "Per aquí es va al Perú, a ser rics.\nPer allà, a Panamà, a ser pobres.\nTriï cadascú el que més convingui a un bon castellà.\n— Francisco Pizarro"
 conquer_aztecs_title:0 "Cal salvar els asteques!"
 conquer_aztecs_desc:0 "Els nostres sacerdots estan preocupats per la salvació eterna dels asteques: cal portar-los al culte de Nostre Senyor i Salvador. Non nobis, Domine, Domine, non nobis, Domine. Sed nomini, sed nomini, tuo da gloriam."
 construct_shipyard_header:0 "La nostra armada necessita que"
 construct_shipyard_title:0 "Construir una drassana"
 construct_shipyard_desc:0 "A la nostra nació li falta una drassana com cal, on puguem construir les flotes que tant necessitem. Ara ja tenim la tecnologia per construir-ne una, i hauríem de posar aquest coneixement en pràctica."
 RIVALSWITH:0 "Considera $LIST$ rivals naturals."
 IS_ISLAND:0 "és una illa."
 IS_NOT_ISLAND:0 "NO és una illa."
 IS_NOT_EMPTY:1 "$PROVINCE|Y$ és propietat d'una nació."
 IS_EMPTY:1 "$PROVINCE|Y$ es pot colonitzar."
 ACH_ADJ2:0 "aqueu"
 IS_NOT_DOMINANT_RELIGION:0 " no és la religió dominant."
 IS_DOMINANT_RELIGION:0 " és la religió dominant."
 IS_NOT_DOMINANT_CULTURE:0 " no és la cultura dominant."
 IS_DOMINANT_CULTURE:0 " és la cultura dominant."
 cultural_shift_title:0 "Acceptar el canvi cultural"
 cultural_shift_desc:0 "La identitat cultural de l'elit governant està canviant: la nostra herència cultural ($PRIMARY_CULTURE$) va perdent terreny a poc a poc davant la llengua i les tradicions de la capital, $CAPITAL$."
 scandinavian_nation_title:0 "Formar la nació escandinava"
 scandinavian_nation_desc:0 "Durant segles incomptables, els regnes del Nord han estat dividits i atrapats en lluites de poder fratricides. Els intents anteriors d'unió han acabat fracassant, per a satisfacció dels seus veïns europeus. Tot i així, la visió d'una unió duradora continua sent una possibilitat temptadora..."
 imperial_government:0 "Imperi"
 imperial_government_ruler:0 "Emperador"
 imperial_government_ruler_female:0 "Emperadriu"
 ON_MISSION:0 "Té la missió "
 establish_spanish_carribean_title:0 "Establir una presència al Carib"
 establish_spanish_carribean_desc:0 "Els indígenes de les illes d'aquestes Índies són pagans i tenen or: és el nostre deure portar-los la llum de la fe i enriquir la corona."
 discover_spanish_main_title:0 "Descobrir la terra ferma!"
 discover_spanish_main_desc:0 "Els nostres exploradors encara no han trobat les Índies, però creiem que al sud i a l'oest hi ha terres immenses i riques. Les hem de trobar per a la glòria del nostre país."
 establish_spanish_main_title:0 "Establir colònies a la terra ferma!"
 establish_spanish_main_desc:0 "Hem descobert terres riques plenes d'oportunitats noves, i els nostres exploradors han sentit llegendes que diuen que el mític El Dorado es troba en algun lloc d'aquí, així que hem de reclamar aquestes terres."
 the_spanish_main:0 "La Terra Ferma"
 italian_region:0 "Regió italiana"
 the_low_countries:0 "Els Països Baixos"
 spanish_netherlands:0 "Països Baixos espanyols"
 establish_spanish_la_plata_title:0 "Colonitzar el continent del sud"
 establish_spanish_la_plata_desc:0 "Hem descobert la regió del Plata, que té terres riques i un port natural perfecte. Hem de reclamar aquestes terres per a la corona."
 discover_la_plata_title:0 "Descobrir el Plata"
 discover_la_plata_desc:0 "Els nostres navegants han sentit històries de terres riques en algun lloc del sud. Hem de trobar-les abans que ho facin els altres."
 conquer_zapotecs_title:0 "Cal destruir els salvatges zapoteques!"
 conquer_zapotecs_desc:0 "Els zapoteques són una colla de bèsties incivilitzades que practiquen rituals vils com el canibalisme i el sacrifici d'infants: els hem de portar la llum de la civilització i de la Inquisició."
 no_surrender_to_the_dutch_title:0 "Cap concessió als neerlandesos"
 no_surrender_to_the_dutch_desc:0 "Els neerlandesos continuen fent una guerra il·legítima contra els nostres territoris dels Països Baixos. Hem de mantenir-nos ferms davant el seu avenç i conservar els territoris que ens són lleials."
 bring_the_dutch_back_to_catholisism_title:0 "Retornar els neerlandesos a la fe catòlica"
 bring_the_dutch_back_to_catholisism_desc:0 "Els neerlandesos s'aferren a les seves creences herètiques: els hem de retornar al si amorós de l'única Església vertadera. Per l'espasa, si cal."
 spanish_netherlands_should_be_catholic_title:0 "Aturar el protestantisme als Països Baixos"
 spanish_netherlands_should_be_catholic_desc:0 "Ens ha arribat a les orelles que els súbdits de les nostres províncies dels Països Baixos s'han desviat de la nostra santa Església. El nostre inquisidor general creu que s'esperaran que la Inquisició els persuadeixi de tornar a la fe vertadera."
 castille_aragon_relations_header:0 "Els nostres nobles suggereixen"
 castille_aragon_relations_title:0 "Bones relacions amb Aragó"
 castille_aragon_relations_desc:0 "Els nostres veïns de l'est parlen la mateixa llengua i haurien de ser com germans per a nosaltres. La seva família reial hauria de tenir lligams estrets amb la nostra, i hem d'aconseguir bones relacions."
 spanish_portugese_relations_header:0 "Els nostres nobles suggereixen"
 spanish_portugese_relations_title:0 "Bones relacions amb Portugal"
 spanish_portugese_relations_desc:0 "Els nostres veïns de l'oest parlen la mateixa llengua i haurien de ser com germans per a nosaltres. La seva família reial hauria de tenir lligams estrets amb la nostra, i hem d'aconseguir bones relacions."
 mediterranean_christian_fleet_title:0 "Acabar amb el domini naval turc"
 mediterranean_christian_fleet_desc:0 "El turc infidel ha creat una flota enorme, i si ningú no l'atura, la Mediterrània caurà sota el seu domini. Hem d'armar més galeres perquè Espanya pugui complir el paper que Déu li ha assignat com a defensora de la cristiandat."
 no_territory_to_france_title:0 "Aturar els francesos"
 no_territory_to_france_desc:0 "Cap terra espanyola no hauria de ser mai governada des de París. No deposarem les armes fins que haguem recuperat dels francesos totes i cadascuna de les nostres províncies."
 THREATENEDBY:0 "Se sent amenaçat per $LIST$."
 recover_negative_stability_title:0 "Sortir de l'estabilitat negativa"
 recover_negative_stability_desc:0 "La confiança en el nostre govern és baixa i el poble està revoltat. Restablim-la per portar la pau a casa nostra."
 improve_economical_mismanagement_title:0 "Retornar els nostres préstecs"
 improve_economical_mismanagement_desc:0 "Hem viscut per sobre de les nostres possibilitats i hem acumulat deutes enormes. Pel bé de la nació, hauríem de posar les nostres finances sobre una base més sòlida."
 recover_from_warexhaustion_title:0 "Ens hem de recuperar de les guerres"
 recover_from_warexhaustion_desc:0 "Un llarg període de guerra ha deixat la nostra nació exhausta, i el poble anhela la pau. Deixem que la nació gaudeixi dels fruits de la pau."
 buildup_manpower_reserves_title:0 "Les nostres reserves d'efectius s'han de recuperar."
 buildup_manpower_reserves_desc:0 "Els camps són deserts, perquè tots els joves han estat enrolats als nostres exèrcits. Afluixem el reclutament i deixem que el país creixi."
 german_region:0 "Regió alemanya"
 scandinavian_region:0 "Regió escandinava"
 EXCOM_SAME_RULER:0 "No podem excomunicar el nostre propi governant."
 reclaim_mecca_title:0 "Recuperar la Meca dels infidels"
 reclaim_mecca_desc:0 "La nostra ciutat més santa ha estat conquerida per l'infidel. Els qui s'han sotmès a la voluntat d'Al·là clamen per alliberar-la."
 IS_IN_COLONIAL_RANGE:0 "$NAME$ és a l'abast dels colons (§Y$ADJ$§!)."
 IS_NOT_IN_COLONIAL_RANGE:0 "$NAME$ no és a l'abast dels colons (§Y$ADJ$§!)."
 IS_IN_TRADE_RANGE:0 "$NAME$ és a l'abast dels mercaders (§Y$ADJ$§!)."
 IS_NOT_IN_TRADE_RANGE:0 "$NAME$ no és a l'abast dels mercaders (§Y$ADJ$§!)."
 establish_carribean_colony_title:0 "Fundar una colònia al Carib"
 establish_carribean_colony_desc:0 "Les terres del Carib ofereixen grans oportunitats: hi hem d'aconseguir un punt de suport o veurem com les aprofiten altres."
 establish_usa_colony_title:0 "Fundar una colònia a l'est d'Amèrica"
 establish_usa_colony_desc:0 "Els nostres mercaders han fundat una companyia per comerciar amb les riqueses de les Amèriques, i demanen la protecció reial per donar suport a les seves activitats."
 establish_canada_colony_title:0 "Establir una presència al Canadà"
 establish_canada_colony_desc:0 "Les fredes terres septentrionals del Canadà tenen riqueses inexplorades: hi hem de fundar una colònia i quedar-nos-en la part que ens toca."
 eastern_usa:0 "Costa est americana"
 canada:0 "Canadà"
 lousiana:0 "Louisiana"
 conquer_neighbour_title:0 "Conquerir $PROVINCENAME$"
 conquer_neighbour_desc:0 "Hem de conquerir qualsevol terra que suposi una aportació valuosa a la nostra nació, o la gent no ens prendrà seriosament."
 improve_relations_with_rival_title:0 "Reparar les relacions amb $COUNTRY$"
 improve_relations_with_rival_desc:0 "Les nostres accions han empitjorat les relacions amb alguns dels nostres veïns. Hauríem de mirar d'estrènyer els lligams amb $COUNTRY$."
 earn_more_from_trade_header:0 "Els burgesos exigeixen que"
 earn_more_from_trade_title:0 "Hauríem de dependre més dels ingressos comercials"
 earn_more_from_trade_desc:0 "Els nostres mercaders consideren que el nostre país no dona al comerç el suport que caldria. Per això ens exigeixen que augmentem els ingressos que obtenim del comerç."
 discover_mission_title:0 "Descobrir $PROVINCENAME$"
 discover_mission_desc:0 "Han arribat al nostre país rumors sobre les riques terres de $PROVINCENAME$. Els nostres navegants demanen el suport de l'estat per a una expedició que les descobreixi i les reclami per al nostre país. Creiem que deuen ser en aquesta regió: $REGIONNAME$ ($CONTINENTNAME$)."
 royal_marriage_mission_title:0 "Matrimoni reial amb $COUNTRY$"
 royal_marriage_mission_desc:0 "Per enfortir la nostra dinastia, hem d'ampliar els nostres lligams dinàstics. La nostra noblesa creu que ens seria avantatjós establir un matrimoni reial amb $COUNTRY$."
 IS_MISSION_TARGET:0 "és objectiu d'una missió de"
 IS_NOT_MISSION_TARGET:0 "NO és objectiu d'una missió de"
