 expanded_bureaucracy:0 "Burocràcia ampliada"
 desc_expanded_bureaucracy:0 "Diuen que les lleis engendren més lleis, i enlloc no és més cert que als venerables salons de l'administració pública. Els nostres magistrats han ampliat la burocràcia de la capital, i ara en tenim més. Tot i que això ajuda a fer créixer l'administració, no està exempt d'inconvenients. Un cop arrelada, una classe administrativa mai no farà res per abolir-se a si mateixa."
 expand_bureaucracy_title:0 "Ampliar la burocràcia"
 expand_bureaucracy_desc:0 "Diuen que les lleis engendren més lleis, i enlloc no és més cert que als venerables salons de l'administració pública. Amb el nostre focus nacional a la capital, podem demanar als nostres funcionaris que ampliïn la burocràcia nacional."
 CURRENT_EMPEROR:0 "§Y$RULERNAME$§W ocupa el tron imperial"
 formalize_measures_title:0 "Normalitzar les escales, els pesos i les mesures."
 formalize_measures_desc:0 "Heu provat mai de convertir canes en pams i us heu adonat pel camí que us heu deixat una xifra? Mals de cap? Nits sense dormir? S'ha acabat! La nostra burocràcia s'ofereix a normalitzar el sistema de pesos i mesures. A més d'augmentar els nostres ingressos gràcies a transaccions més eficients, aquesta reforma també farà que la població estigui més contenta amb el nostre govern, quan sàpiga que no paga els impostos amb balances trucades."
