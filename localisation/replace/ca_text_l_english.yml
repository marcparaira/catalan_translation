 COUNTRY_HISTORY_BATTLE:0 "La batalla de $NAME$ potser va ser el moment decisiu. $ATTACKER_SIZE$ homes de l'atacant ($ATTACKER$) es van enfrontar a $DEFENDER_SIZE$ del defensor ($DEFENDER$). Els atacants ($ATTACKER$) $ATTACKER_RESULT$ i els defensors ($DEFENDER$) $DEFENDER_RESULT$."
 COUNTRY_HISTORY_BATTLE_1:0 "Un fet important de la guerra va ser la batalla de $NAME$, on les forces atacants ($ATTACKER$), dirigides per $ATTACKING_COMMANDER$, van atacar $DEFENDING_COMMANDER$ i les seves forces ($DEFENDER$). Els $ATTACKER_SIZE$ homes de l'exèrcit atacant ($ATTACKER$) $ATTACKER_RESULT$ i els $DEFENDER_SIZE$ defensors ($DEFENDER$) $DEFENDER_RESULT$."
 COUNTRY_HISTORY_BATTLE_2:0 "La batalla més decisiva de la guerra va ser quan $ATTACKER_SIZE$ homes ($ATTACKER$), dirigits per $ATTACKING_COMMANDER$, $ATTACKER_RESULT$ en atacar els $DEFENDER_SIZE$ homes de l'exèrcit defensor ($DEFENDER$), dirigits per $DEFENDING_COMMANDER$, que $DEFENDER_RESULT$."
 COUNTRY_HISTORY_BATTLE_3:0 "La guerra va quedar pràcticament decidida quan $ATTACKING_COMMANDER$ es va enfrontar a $DEFENDING_COMMANDER$ a la batalla de $NAME$. $ATTACKER_SIZE$ soldats atacants ($ATTACKER$) $ATTACKER_RESULT$ en la lluita contra els $DEFENDER_SIZE$ soldats defensors ($DEFENDER$), que $DEFENDER_RESULT$."
 COUNTRY_HISTORY_BATTLE_4:0 "Els historiadors expliquen com, a la batalla de $NAME$, les forces atacants ($ATTACKER$) es van enfrontar a les defensores ($DEFENDER$): les tropes atacants ($ATTACKER$), dirigides per $ATTACKING_COMMANDER$, $ATTACKER_RESULT$ en la lluita contra els $DEFENDER_SIZE$ homes de l'exèrcit defensor ($DEFENDER$), dirigits per $DEFENDING_COMMANDER$, que $DEFENDER_RESULT$."
 COUNTRY_HISTORY_BATTLE_A_NO_COMMANDER:0 "El que va decidir la guerra va ser la batalla de $NAME$, quan $ATTACKER_SIZE$ homes ($ATTACKER$) es van enfrontar als $DEFENDER_SIZE$ homes de l'exèrcit defensor ($DEFENDER$), dirigits per $DEFENDING_COMMANDER$, que $DEFENDER_RESULT$."
