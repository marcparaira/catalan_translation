 SHOCK_MOD_TIP:0 "És un multiplicador pur que determina quant de dany infligeixen finalment les vostres tropes durant la fase de xoc del combat. Representa els avenços tecnològics en armes i material."
 COMBAT_ABILITY:0 "Capacitat de combat"
 COMBAT_ABILITY_TIP:0 "És un augment fix del dany que infligeixen les vostres unitats en combat."
 CONVERT_RULER_IRO:1 "§YDonar el comandament militar al governant§!\nAixò convertirà el vostre governant en general, i podrà comandar els vostres exèrcits."
 CONVERT_RULER_DRO:0 "Un monarca que porta un exèrcit al combat té moltes més probabilitats de morir, i la seva mort podria tenir efectes negatius, com ara un consell de regència, o fer que el vostre país passi a ser el soci menor d'una unió personal. A més, el vostre país no veurà la mort del seu governant en una batalla com un bon senyal."
 CONVERT_RULER_NOT_POSSIBLE_IRO:1 "El vostre governant ja és un líder."
 CONVERT_RULER_NOT_POSSIBLE_DRO:0 "Ja heu decidit convertir el vostre governant en general. Recordeu que un monarca que porta un exèrcit al combat té moltes més probabilitats de morir, i la seva mort podria tenir efectes negatius, com ara un consell de regència, o fer que el vostre país passi a ser el soci menor d'una unió personal. A més, el vostre país no veurà la mort del seu governant en una batalla com un bon senyal."
 CONVERT_RULER_NOT_POSSIBLE_2_IRO:1 "Al nostre país una governant no pot esdevenir general."
 CONVERT_RULER_NOT_POSSIBLE_2_DRO:1 "El vostre monarca és una dona i no pot sortir al camp de batalla ni comandar els vostres exèrcits, tret que una idea o una política ho permeti."
 CONVERT_RULER_NOT_POSSIBLE_3_IRO:0 "Teniu un consell de regència, de manera que no hi ha cap monarca que pugui esdevenir general al camp de batalla."
 CONVERT_RULER_NOT_POSSIBLE_3_DRO:0 "El vostre monarca encara és menor d'edat i un consell de regència governa la vostra nació. Encara no podeu convertir el vostre governant en general, perquè no té edat per comandar un exèrcit."
 RECRUIT_ADVISOR:0 "Contractar un conseller."
 RECRUIT_NO_IDEA:0 "Necessiteu la idea nacional «§YA la recerca del Nou Món§!» per reclutar exploradors i conqueridors."
 RECRUIT_EXPLORER_DRO:0 "Normalment les unitats navals estan restringides a les zones marítimes ja explorades. Tanmateix, les unitats navals comandades per exploradors poden endinsar-se en el desconegut.\n"
 RECRUIT_CONQUISTADOR_DRO:0 "Normalment les unitats terrestres estan restringides a les províncies terrestres ja explorades. Reclutar un conqueridor us permetrà explorar més zones terrestres i potser afegir-les al vostre imperi.\n"
 RECRUIT_ADMIRAL_DRO:0 "Un almirall pot comandar les vostres unitats navals; la capacitat del vostre almirall depèn de la vostra tradició naval.\n"
 RECRUIT_GENERAL_DRO:0 "Un general pot comandar les vostres unitats terrestres; la capacitat del vostre general depèn de la vostra tradició militar.\n"
