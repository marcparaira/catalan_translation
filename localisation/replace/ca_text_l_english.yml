 build_refinery_title:0 "Construir una refineria: $PROVINCENAME$"
 build_refinery_desc:0 "$PROVINCENAME$ és perfecta per construir-hi una refineria: l'economia de la província en sortiria molt beneficiada."
 build_wharf_title:0 "Construir una manufactura d'equipament naval: $PROVINCENAME$"
 build_wharf_desc:1 "S'han fet grans progressos en les tècniques de producció, però encara no hem adoptat aquests canvis. $PROVINCENAME$ és perfecta per construir-hi una manufactura d'equipament naval: l'economia de la província en sortiria molt beneficiada."
 build_plantations_title:0 "Construir plantacions: $PROVINCENAME$"
 build_plantations_desc:0 "S'han fet grans progressos en les tècniques de producció, però encara no hem adoptat aquests canvis. $PROVINCENAME$ és perfecta per a les plantacions: l'economia de la província en sortiria molt beneficiada si n'hi creéssim."
 build_tradecompany_title:1 "Construir una factoria comercial: $PROVINCENAME$"
 build_tradecompany_desc:1 "S'han fet grans progressos en les tècniques de producció, però encara no hem adoptat aquests canvis. $PROVINCENAME$ és perfecta per a una factoria comercial: l'economia de la província en sortiria molt beneficiada si n'hi construíssim una."
 build_weapons_title:0 "Construir una manufactura d'armes: $PROVINCENAME$"
 build_weapons_desc:1 "S'han fet grans progressos en les tècniques de producció, però encara no hem adoptat aquests canvis. $PROVINCENAME$ és perfecta per construir-hi una manufactura d'armes, i l'economia de la província en sortiria molt beneficiada."
 build_textile_title:0 "Construir una manufactura tèxtil: $PROVINCENAME$"
 build_textile_desc:1 "S'han fet grans progressos en les tècniques de producció, però encara no hem adoptat aquests canvis. $PROVINCENAME$ és perfecta per construir-hi una manufactura tèxtil: l'economia de la província en sortiria molt beneficiada."
 build_marketplace_title:0 "Construir un mercat: $PROVINCENAME$"
 build_marketplace_desc:0 "El comerç mundial està cada cop més interconnectat, però encara no hem adoptat el comerç global com a institució. $PROVINCENAME$ és ideal per construir-hi un mercat, ja que la nostra economia en sortiria molt beneficiada."
 build_trade_depot_title:0 "Construir un dipòsit comercial: $PROVINCENAME$"
 build_trade_depot_desc:0 "El comerç mundial està cada cop més interconnectat, però encara no hem adoptat el comerç global com a institució. $PROVINCENAME$ és ideal per construir-hi un dipòsit comercial, ja que la nostra economia en sortiria molt beneficiada."
 build_stock_exchange_title:0 "Construir una borsa: $PROVINCENAME$"
 build_stock_exchange_desc:0 "El comerç mundial està cada cop més interconnectat, però encara no hem adoptat el comerç global com a institució. $PROVINCENAME$ és ideal per construir-hi una borsa, ja que la nostra economia en sortiria molt beneficiada."
 build_university_title:0 "Construir una universitat: $PROVINCENAME$"
 build_university_desc:0 "La Il·lustració s'estén pel món, però encara no l'hem adoptada. Per fomentar el saber, hauríem de dotar $PROVINCENAME$ d'una universitat."
 construct_army_title:0 "Crear un exèrcit per a la nostra nació"
 construct_army_desc:0 "El nostre exèrcit és una mera closca del que la nostra nació espera. Hem de reclutar més soldats per al nostre exèrcit permanent, o serem presa fàcil dels nostres rivals."
 construct_navy_title:0 "Crear una flota com cal"
 construct_navy_desc:0 "La nostra armada és una mera closca del que la nostra nació espera. Hem de construir més vaixells, o les nostres costes quedaran exposades als pirates i a les invasions enemigues."
 infiltrator_in_the_cardinal_office:0 "Infiltrat"
 desc_infiltrator_in_the_cardinal_office:0 "Segons un dels vostres consellers més pròxims, un espia ha aconseguit infiltrar-se al Sacre Col·legi Cardenalici."
 religious_restriction:0 "Restriccions religioses"
 desc_religious_restriction:0 "S'han pres mesures per restringir la llibertat religiosa."
 prussian_nation_general_title:0 "Reformar-se en Prússia"
 prussian_nation_general_desc:0 "Les terres que antigament va conquerir i germanitzar l'Orde Teutònic sempre necessitaran protecció davant de veïns rapaços. Si l'Orde falla en aquest deure, podem ocupar-ne el lloc i inaugurar una nova era de prosperitat i disciplina prussiana."
 missionary_falls_ill:0 "El missioner cau malalt"
 desc_missionary_falls_ill:0 "El missioner que vam enviar a $PROVINCENAME$ ha caigut malalt. Les obres de la nova església s'han aturat i, sense la seva guia, les possibilitats de convertir la població local són més aviat escasses."
 missionary_failure:0 "Fracàs missioner"
 desc_missionary_failure:0 "Està resultant molt més difícil del previst convertir els habitants de $PROVINCENAME$. Tot i que al principi alguns hi van mostrar un interès clar, la majoria no sembla gaire disposada a abraçar una nova religió."
 religious_tensions:0 "Tensions religioses"
 desc_religious_tensions:0 "Els habitants de $PROVINCENAME$ es neguen a acceptar la predicació dels nostres missioners."
 SHIP_NO_PATROL:0 "Cap flota no ha patrullat per aquí recentment."
 PATROL_COUNTER:0 "Aquesta zona marítima s'ha patrullat recentment, i no esperem pirates com a mínim durant §Y$NUM$§W dia/dies."
 fabricate_claims_desc:0 "La creació de diversos documents falsificats podria donar suport a la nostra legítima pretensió al seu tron. Si té èxit, obtindrem un casus belli temporal."
 imperial_government_vassal:0 "Regne client"
 imperial_government_ruler_vassal:0 "Rei"
 L_LESS_THAN:0 "menys de"
 L_AT_LEAST:0 "com a mínim"
 get_foothold_in_china_title:0 "Entrar a la Xina!"
 get_foothold_in_china_desc:0 "La immensa riquesa del Catai ha atret els vostres mercaders. Us demanen que doneu suport als seus esforços aconseguint un port des d'on comerciar."
 establish_colony_mission_title:0 "Colonitzar: $PROVINCENAME$"
 establish_colony_mission_desc:0 "Hem d'establir una colònia a la província $PROVINCENAME$ per augmentar la glòria i la riquesa de la nostra nació."
 founding_father:0 "Pare fundador"
 desc_founding_father:0 "En aquesta província tenim un radical estrany que predica idees polítiques absurdes, com ara que els colons entenen més de govern local que no pas nosaltres."
 loyalist_stronghold:0 "Bastió lleialista"
 desc_loyalist_stronghold:0 "Aquesta província és plena de tories convençuts, lleials al govern legítim, que cal protegir."
 ANY_CORE_STARTS:0 "Qualsevol país nuclear"
 advancement_of_true_religion_act_title:0 "Aprovar la Llei de Promoció de la Religió"
 advancement_of_true_religion_act_desc:0 "Convertir en delicte que els criats i altres persones semblants llegeixin la nostra santa Bíblia, i reservar aquest dret als clergues i als nobles."
 blasphemy_act_title:0 "Aprovar la Llei de Blasfèmia"
 blasphemy_act_desc:0 "Declarar la blasfèmia delicte de dret comú i, per tant, castigar qualsevol manifestació de menyspreu o burla envers Déu, Jesús o les Sagrades Escriptures, sigui de la forma que sigui."
 act_of_uniformity_title:0 "Aprovar la Llei d'Uniformitat"
 act_of_uniformity_desc:0 "Fer més passos cap a una església unificada imposant l'assistència al culte i fixant l'ordre dels oficis i les pregàries del Llibre de la Pregària Comuna."
 suffragan_bishop_act_title:0 "Aprovar la Llei de Bisbes Sufraganis"
 suffragan_bishop_act_desc:0 "Millorar l'administració autoritzant el nomenament de bisbes sufraganis per a les responsabilitats episcopals."
 conventicle_act_title:0 "Aprovar la Llei de Conventicles"
 conventicle_act_desc:0 "Dissuadir els dissidents prohibint qualsevol assemblea religiosa de més de cinc persones que no hagi aprovat l'església oficial."
 declaration_of_indulgence_title:0 "Aprovar la Declaració d'Indulgència"
 declaration_of_indulgence_desc:0 "Suspendre totes les lleis penals contra els membres de religions diferents de l'església oficial i concedir-los la llibertat de culte públic i el dret d'accedir a càrrecs militars i civils."
 test_act_title:0 "Aprovar la Llei del Test"
 test_act_desc:0 "Excloure de qualsevol càrrec militar o civil tots els qui no siguin membres de l'església oficial, i reservar aquest privilegi als membres que hagin combregat segons els ritus de la nostra església nacional."
 dissolution_of_the_monasteries_title:0 "Aprovar la Llei de Dissolució dels Monestirs"
 dissolution_of_the_monasteries_desc:0 "Augmentar el control i el poder del monarca autoritzant la confiscació de qualsevol propietat eclesiàstica amb uns ingressos anuals inferiors a un cert valor."
 popery_act_title:0 "Aprovar la Llei contra el Papisme"
 popery_act_desc:0 "Prendre mesures per reduir la influència catòlica oferint diners a qualsevol que estigui disposat a declarar contra un sacerdot o bisbe catòlic que hagi estat detingut celebrant oficis religiosos."
 the_advancement_of_true_religion_act:0 "Llei de Promoció de la Religió Vertadera"
 desc_the_advancement_of_true_religion_act:0 "D'ara endavant, només els clergues, els nobles i altres persones respectables poden llegir la nostra santa Bíblia."
 the_blasphemy_act:0 "Llei de Blasfèmia"
 desc_the_blasphemy_act:0 "Hem declarat la blasfèmia delicte de dret comú i, per tant, és delicte mostrar menyspreu o burla envers Déu, Jesús o les Sagrades Escriptures, sigui de la forma que sigui."
 the_act_of_uniformity:0 "Llei d'Uniformitat"
 desc_the_act_of_uniformity:0 "S'han fet més passos cap a una església unificada imposant l'assistència al culte i fixant l'ordre dels oficis i les pregàries del Llibre de la Pregària Comuna."
 the_suffragan_bishop_act:0 "Llei de Bisbes Sufraganis"
 desc_the_suffragan_bishop_act:0 "Hem millorat l'administració autoritzant el nomenament de bisbes sufraganis per a les responsabilitats episcopals."
 the_conventicle_act:0 "Llei de Conventicles"
 desc_the_conventicle_act:0 "Queda prohibida qualsevol assemblea religiosa de més de cinc persones que no hagi aprovat l'església oficial."
 the_declaration_of_indulgence:0 "Declaració d'Indulgència"
 desc_the_declaration_of_indulgence:0 "S'han suspès totes les lleis penals contra els membres de religions diferents de l'església oficial."
 the_test_act:0 "Llei del Test"
 desc_the_test_act:0 "Només els membres de l'església oficial que hagin combregat segons els ritus adequats poden ocupar càrrecs militars o civils."
 the_dissolution_of_the_monasteries:0 "Dissolució dels Monestirs"
 desc_the_dissolution_of_the_monasteries:0 "D'ara endavant, qualsevol propietat eclesiàstica amb uns ingressos anuals inferiors a un cert valor es considera propietat de l'estat."
 the_popery_act:0 "Llei contra el Papisme"
 desc_the_popery_act:0 "S'ofereix una certa suma de diners a qualsevol que estigui disposat a declarar contra un sacerdot o bisbe catòlic que hagi estat detingut celebrant oficis religiosos."
 OPEN_MARKET_LOW_REL_DESC:0 "Hem de tenir unes relacions de com a mínim 50 amb ells."
