 desc_poor_iron:0 "Les nostres mines de ferro produeixen ferro de menys qualitat que de costum, i per això reclutar unitats per a l'exèrcit és cada cop més car."
 epidemic:0 "Epidèmia"
 desc_epidemic:0 "Una epidèmia ha delmat la població local i ha reduït la quantitat disponible per exportar."
 storms:0 "Tempestes"
 desc_storms:0 "Les tempestes han afectat les nostres fàbriques de porcellana. Això en reduirà la quantitat disponible durant uns quants anys."
 harvest_fails:0 "Males collites"
 desc_harvest_fails:0 "La collita s'ha perdut en aquesta zona, i això redueix la producció d'espècies."
 counter_revolution:0 "Contrarevolució"
 desc_counter_revolution:1 "Un govern revolucionari campa lliurement pel continent. La nostra noblesa creu que estem preparats i disposats a fer-li la guerra, però no ho estem. La propaganda revolucionària s'estén per la nostra nació i soscava el nostre govern, mentre les altres potències mundials ens consideren febles. Hem de fer cas del partit de la guerra?"
 vive_la_revolution:0 "Vive la Révolution"
 desc_vive_la_revolution:0 "El nostre govern revolucionari fa la guerra a les potències hostils a la nostra causa. El poble s'aplega entorn de la causa i els nostres exèrcits mostren un élan revolucionari."
 reaction:0 "Reacció"
 desc_reaction:0 "Encapçalem la lluita santa contra els revolucionaris impius. L'Església i l'Estat donen ple suport a la nostra causa, i els altres països admiren la nostra demostració de força."
 PENALTY_SHADOW_KINGDOM:0 "Si decidiu romandre a l'Imperi, patireu penalitzacions de prestigi i més agitació."
 submission_to_emperor:0 "Submissió a l'emperador"
 desc_submission_to_emperor:0 "Molts dels nostres súbdits veuen amb recel i repugnància la nostra decisió d'aferrar-nos al Sacre Imperi Romanogermànic mentre els nostres veïns s'han alliberat de la seva influència."
