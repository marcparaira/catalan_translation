 LEDGER_UNREST:0 "Agitació"
 LEDGER_BORDER_PROVINCE:0 "Província fronterera"
 COMBAT_DISCIPLINE:0 "Disciplina"
 DISCIPLINE:0 "Disciplina"
 LEDGER_LAND_DISCIPLINE:0 "Disciplina terrestre"
 LEDGER_CANT_BUILD_THIS:0 "El vostre nivell tecnològic actual no us permet construir aquest edifici"
 ledger_temple:0 "Cada província del vostre imperi augmenta el cost d'incrementar l'estabilitat. Un temple redueix aquest cost cada mes. Les millors províncies per construir-hi temples són les de valor alt allunyades de les fronteres."
 ledger_workshop:0 "Una província amb un taller rep un augment dels ingressos fiscals. Hi ha altres modificadors que augmenten o redueixen els ingressos fiscals d'una província; la bonificació del taller s'aplica abans que els modificadors addicionals, de manera que és millor construir-los en províncies amb impostos alts."
 ledger_regimental_camp:0 "Els campaments de regiment augmenten tant els efectius d'una província com la velocitat de reclutament de regiments. És millor construir-los en províncies amb molts efectius"
 ledger_shipyard:0 "Les drassanes augmenten el ritme de construcció de vaixells en una província. És millor construir-les en províncies amb un valor fiscal alt o en les províncies on penseu construir molts vaixells."
 ledger_constable:0 "Un agutzil augmenta tant els ingressos fiscals com l'agitació d'una província. El benefici màxim s'obté a la província amb més ingressos fiscals. Els tribunals redueixen l'augment d'agitació que provoca un agutzil, per això és útil construir-los a les províncies que en tenen un. Els agutzils també augmenten la bonificació dels tallers."
 ledger_courthouse:0 "Una província amb un tribunal veu reduïda l'agitació local. Els tribunals són útils a totes les províncies, però sobretot a les de valor fiscal alt, perquè l'augment de l'agitació redueix els ingressos fiscals."
 ledger_tax_assessor:0 "Els assessors fiscals redueixen la inflació a tot el vostre imperi. Encara que no tingueu inflació, val la pena construir-los, perquè més endavant podreu encunyar moneda i reduir després la inflació. És millor construir els assessors fiscals en províncies allunyades dels enemics."
 ledger_customs_house:0 "Una duana augmenta lleugerament els ingressos fiscals totals d'una província. Com que l'augment és tan petit, és millor construir duanes en províncies amb ingressos fiscals alts."
 ledger_fort1:0 "Construir un fort en una província allarga el temps que necessita l'enemic per conquerir-la mitjançant un setge. També dona més temps als vostres exèrcits per reaccionar davant les revoltes."
