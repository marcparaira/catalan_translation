 prussian_nation_desc:0 "L'època dels cavallers croats s'esvaeix ràpidament. Arribarà un moment en què ja no ens convindrà aferrar-nos a les formes d'un orde monàstic. A més, el gran mestre preferiria ser duc... o rei. Si ens reformem en un estat secular, podrem revitalitzar la nostra administració i guanyar-nos el respecte dels nostres veïns."
