 NATIONAL_FOCUS_IS:1 "El focus nacional és $FOCUS|Y$"
 WARTAX_CANT_STOP_TIP:0 "Ja recaptem impostos de guerra fins al "
 more_merchants:0 "Reclutament de mercaders"
 desc_more_merchants:0 "Ara mateix tots els nostres esforços se centren a reclutar més mercaders"
 efficienct_merchants:0 "Eficiència dels mercaders millorada"
 desc_efficienct_merchants:0 "Ara mateix tots els nostres esforços se centren a millorar l'eficiència dels nostres mercaders"
 local_trade_focus:0 "Prioritat al comerç local"
 desc_local_trade_focus:0 "Hem decidit concentrar tots els esforços en el desenvolupament del nostre comerç local"
 global_trade_focus:0 "Prioritat al comerç d'ultramar"
 desc_global_trade_focus:0 "Hem decidit concentrar tots els esforços en el desenvolupament del comerç d'ultramar"
 military_focus:0 "Prioritat militar"
 desc_military_focus:0 "La major part de la recerca es dedica ara a millorar el nostre exèrcit; malauradament, la recerca comercial se'n ressent."
 trade_focus:0 "Prioritat comercial"
 desc_trade_focus:0 "La major part de la recerca es dedica ara a millorar el nostre comerç; malauradament, la recerca militar se'n ressent."
 establish_bank_of_amsterdam_title:0 "Fundar el Banc d'Amsterdam"
 establish_bank_of_amsterdam_desc:0 "La sang del comerç és el valor dels diners, i les monedes no sempre valen el que diuen valer. El Banc d'Amsterdam s'ofereix a emetre lletres bancàries de valor garantit. Potser ens pot ajudar?"
 bank_of_amsterdam:0 "Banc d'Amsterdam"
 desc_bank_of_amsterdam:0 "A l'Europa del Renaixement, la moneda dels estats petits consistia en bona part en monedes de les nacions veïnes. Per posar remei a aquesta situació, el 1609 es va fundar un banc sota la protecció de la ciutat d'Amsterdam. Al principi, aquest banc acceptava monedes estrangeres i locals pel seu valor real i intrínsec, en deduïa una petita comissió d'encunyació i de gestió i abonava la resta als clients en els seus llibres."
 india_trade_co:0 "Companyia de les Índies Orientals"
 desc_india_trade_co:0 "La concessió del monopoli del comerç amb les Índies Orientals ha permès als nostres mercaders negociar amb una sola veu i millorar els nostres acords comercials. També ens assegura que sabem exactament qui porta les mercaderies, de manera que podem recaptar millor els impostos."
 dutch_india_trade_co:0 "Vereenigde Oost-Indische Compagnie"
 desc_dutch_india_trade_co:0 "La VOC va donar als mercaders neerlandesos una sola veu en el comerç amb els lucratius mercats de les Índies Orientals. Això ha millorat la nostra capacitat de negociar concessions comercials i de fundar bases per promoure el nostre comerç."
 found_voc_title:0 "Fundar l'Oost-Indische Compagnie"
 found_voc_desc:0 "Una companyia de mercaders demana als Estats Generals un monopoli de 21 anys per dur a terme activitats colonials a l'Àsia. Aquestes zones són potencialment molt riques, però necessiten el monopoli perquè els riscos són molt alts."
 POLICY_TRIGGER:0 "$SLIDER$ $DIRECTION$ $VALUE$.\n"
 trade_and_production_cutbacks:0 "Retallades en comerç i producció"
 desc_trade_and_production_cutbacks:0 "Hem hagut de retallar les despeses de comerç i producció per mantenir el nostre exèrcit"
 military_cutbacks:0 "Retallades militars"
 desc_military_cutbacks:0 "Hem hagut de retallar les despeses militars per mantenir la producció i el comerç"
 short_term_boost:0 "Impuls a curt termini"
 desc_short_term_boost:0 "S'han apujat considerablement els impostos per millorar l'estat del nostre tresor"
 long_term_boost:0 "Impuls a llarg termini"
 desc_long_term_boost:0 "S'han apujat lleugerament els impostos per millorar l'estat del nostre tresor"
 attrition_mod:0 "Per desgast"
 CANT_FIRE_ADVISOR:0 "Hem contractat aquest conseller fa poc i no el podem acomiadar fins al "
 WCRD_EMPEROR:0 "Formen part de l'Imperi, i nosaltres som l'emperador."
 decreased_military_funding:0 "Finançament militar reduït"
 desc_decreased_military_funding:0 "Ara mateix retallem les despeses militars."
 even_spread_of_investments:0 "Inversió repartida"
 desc_even_spread_of_investments:0 "Malgrat el desacord al parlament, s'ha decidit que tots els àmbits de la tecnologia rebran una mica més de finançament."
 MERCENARY_COST:0 "Cost dels mercenaris"
 financial_arguments:0 "Discussions financeres"
 desc_financial_arguments:0 "El nostre parlament té algunes dificultats per decidir si accepta o rebutja la reforma financera que es va proposar fa un temps"
 emergency_plan:0 "Pla d'emergència"
 desc_emergency_plan:0 "S'han pres algunes mesures per evitar una contrarevolució"
 bothersome_parliament:0 "Parlament problemàtic"
 desc_bothersome_parliament:0 "Sembla que el nostre parlament té dificultats per entendre qui mana al nostre govern."
 desc_golden_fleece:0 "Pretium Laborum Non Vile"
 establish_golden_fleece_title:0 "Instituir l'Orde del Toisó d'Or"
 establish_golden_fleece_desc:0 "El nostre duc ha estat elegit membre de l'Orde anglès de la Lligacama, però ha hagut de declinar-ho per no ofendre el rei de França. Tanmateix, podem crear el nostre propi orde de cavalleria amb unes regles semblants i anomenar-lo Orde del Toisó d'Or."
 create_the_compagnies_ordonnance_title:0 "Crear les Compagnies d'Ordonnance"
 create_the_compagnies_ordonnance_desc:0 "Si establíssim un conjunt de normes que codifiquessin exactament què cal per proporcionar tropes al nostre exèrcit, agilitaríem el reclutament de mercenaris i l'abaratiríem."
 desc_compagnies_ordonnance:0 "La codificació exacta del suport necessari per mantenir 100 cavallers per a l'exèrcit. Aquests blocs de 700 homes serien la base de les futures companyies."
 the_staple_port:0 "El port de l'estapla"
 desc_the_staple_port:0 "Hem concedit a Calais el dret exclusiu d'importar llana anglesa al continent. Això ha augmentat espectacularment els ingressos del port."
 the_theme_system:0 "El sistema de temes"
 desc_the_theme_system:0 "Un sistema administratiu civil i militar que oferia terres a canvi d'un compromís de servei militar. Ens estalvia haver de recórrer a la lleva forçosa i facilita el reclutament."
 desc_vornedskab:0 "Els danesos van introduir el «vornedskap», o servitud, relativament tard en comparació amb la resta d'Europa. Tanmateix, va ser força eficaç i important per configurar l'estat danès."
 adopt_vornedskab_title:0 "Adoptar el vornedskap"
 adopt_vornedskab_desc:0 "El problema de cobrar impostos a la gent és que cal saber on és per fer-ho de manera eficaç. Si decretéssim que cap pagès no pot abandonar el seu lloc de naixement sense permís del senyor de la terra, ens seria més fàcil cobrar-los impostos."
 desc_den_danske_lov:0 "La Danske Lov es va introduir per tenir un conjunt codificat de lleis comú a tot el regne. Això va garantir que la llei fos la mateixa a tot Dinamarca."
 sign_den_danske_lov_title:0 "Signar la «Den Danske Lov»"
 sign_den_danske_lov_desc:0 "Al llarg dels anys s'han anat acumulant diverses lleis i decrets. Per a una administració eficient, seria millor codificar-los en un únic corpus legal perquè tothom conegui els seus drets."
 move_capital_to_delhi_title:0 "Traslladar la capital a Delhi"
 move_capital_to_delhi_desc:0 "Francament, la nostra capital actual no és digna d'un monarca tan gloriós com el nostre. Traslladem la seu del govern a la joia de l'Índia, Delhi, perquè tothom sàpiga com en som, de grans."
 UNIT_DETACH_BLOCKADE:0 "§YSeparar per bloquejar§!"
 UNIT_DETACH_BLOCKADE_NO_RETREAT:0 "No es poden separar vaixells d'una flota en retirada."
 UNIT_DETACH_BLOCKADE_TOO_FEW:0 "Hi ha massa pocs vaixells per separar-ne."
 UNIT_DETACH_BLOCKADE_ONLY_TRANSPORTS:0 "No es pot fer cap destacament quan la flota només té transports."
 UNIT_DETACH_BLOCKADE_NO_MOTHBALL:0 "No es poden separar vaixells d'una flota en reserva."
 UNIT_DETACH_BLOCKADE_IN_PORT:0 "No es poden separar vaixells mentre la flota és a port."
 UNIT_DETACH_BLOCKADE_LOW_CAPACITY:0 "La flota és massa feble per fer un destacament."
 UNIT_DETACH_BLOCKADE_NOT_BLOCKADING:0 "La flota no bloqueja cap port."
