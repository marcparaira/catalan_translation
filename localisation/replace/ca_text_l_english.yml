 COMBAT_WINNERTYPE_THEIR:0 "seu"
 COMBAT_WINNERTYPE_OUR:0 "nostre"
 NO_SHIPS:0 "Sense vaixells"
 WORLD_YEAR:0 "El món l'any $YEAR$ dC"
 NEWWORLD_NAME:0 "Un Nou Món!"
 NEWWORLD_DESC:0 "El 1492, Cristòfor Colom havia convençut Isabel I de Castella que es podia trobar una nova ruta cap a Orient navegant cap a Occident. Estava a punt de descobrir tot un Nou Món. Guieu-lo fins allà i porteu a Castella riqueses fabuloses explorant, conquerint i colonitzant un imperi immens."
 LEAGUE_OF_CAMBRAI_NAME:0 "Guerra de la Lliga de Cambrai"
 LEAGUE_OF_CAMBRAI_DESC:0 "La Guerra de la Lliga Santa (o Guerra de la Lliga de Cambrai) es va lliurar entre el 1508 i el 1516. El papa Juli II volia reforçar la posició dels Estats Pontificis a Itàlia i, per això, volia frenar el poder de Venècia al nord. Per aconseguir-ho, el papa va crear la Lliga de Cambrai, formada per Lluís XII de França, l'emperador Maximilià I de l'Imperi dels Habsburg, Ferran I d'Espanya i ell mateix."
 EIGHTY_YEARS_WAR_NAME:0 "Guerra dels Vuitanta Anys"
 EIGHTY_YEARS_WAR_DESC:0 "La Guerra dels Vuitanta Anys (1568-1648) va ser la revolta dels neerlandesos contra el rei d'Espanya. Al principi, Espanya va aconseguir sufocar la rebel·lió. Tanmateix, el 1572 els rebels van conquerir Den Briel i la rebel·lió va revifar. En els anys següents, les províncies del nord es van independitzar, primer de facto i el 1648 oficialment, com a Províncies Unides dels Països Baixos."
 THIRTY_YEARS_WAR_NAME:0 "Guerra dels Trenta Anys"
 THIRTY_YEARS_WAR_DESC:0 "La Guerra dels Trenta Anys va ser una sèrie de conflictes lliurats entre el 1618 i el 1648, principalment als territoris de l'actual Alemanya. El conflicte va néixer de les friccions religioses entre l'emperador catòlic i els estats protestants del Sacre Imperi Romanogermànic, però més endavant va arribar a implicar la majoria de les grans potències europees."
 SPANISH_SUCCESSION_NAME:0 "Guerra de Successió Espanyola"
 SPANISH_SUCCESSION_DESC:0 "L'últim rei Habsburg d'Espanya, Carles II, va morir el 1701. El rei malaltís havia llegat totes les seves possessions a Felip d'Anjou, nét del rei francès Lluís XIV. Això volia dir una possible superpotència francoespanyola al centre d'Europa, cosa que Àustria, Anglaterra i la República Neerlandesa no volien que passés. Tot estava a punt per a una altra gran guerra europea, que no només es lliuraria al continent europeu, sinó també als mars del món i a l'Amèrica del Nord. Històricament, la guerra va acabar amb el Tractat d'Utrecht el 1714, en què Felip va ser reconegut finalment com a rei d'Espanya després de renunciar als seus drets a la línia successòria francesa."
 QUADRUPLE_ALLIANCE_NAME:0 "Guerra de la Quàdruple Aliança"
 QUADRUPLE_ALLIANCE_DESC:0 "La Guerra de la Quàdruple Aliança va començar com a conseqüència de les pretensions de Felip V a Itàlia. França, la Gran Bretanya i els Països Baixos s'hi van oposar i, com a resultat, van formar una aliança. Més tard, arran de la invasió espanyola de Sardenya, Àustria també es va unir a l'aliança."
 SEVEN_YEARS_WAR_NAME:0 "Guerra dels Set Anys"
 SEVEN_YEARS_WAR_DESC:0 "La Guerra dels Set Anys va ser un dels conflictes més grans de la seva època. Al principi enfrontava principalment Prússia i els Habsburg, però aviat va implicar França i Rússia al costat austríac i la Gran Bretanya al costat prussià."
 USA_NAME:0 "Guerra d'Independència dels Estats Units"
 USA_DESC:0 "També coneguda com a Revolució Americana. La guerra va esclatar el 1775, i un dels motius principals van ser les polítiques econòmiques que la monarquia britànica imposava a les seves colònies d'Amèrica. A mesura que avançava la guerra, les colònies van obtenir el suport d'Espanya i de França, cosa que finalment va tenir un gran impacte en el resultat de la guerra."
