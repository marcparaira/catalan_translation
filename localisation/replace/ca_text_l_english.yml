 DISBAND_UNIT_CONDOTTIERI:0 "No podeu dissoldre els condottieri."
 DISBAND_UNIT_DRO:1 "Dissoldre un exèrcit reduirà els diners que la vostra nació gasta en manteniment.\nSi la unitat té molt poca força, potser us convé dissoldre-la i fer servir la reserva d'efectius per reforçar unitats en zones més importants."
 DISBAND_UNIT_RETURN_MANPOWER:0 "$NUMBER|Y$ dels seus homes tornaran a la nostra reserva d'efectius. Els mercenaris no hi tornaran."
 DISBAND_NAVY_DRO:0 "Dissoldre una flota reduirà els diners que la vostra nació gasta en manteniment.\nSi la unitat té molt poca força, potser us convé dissoldre-la i fer servir la reserva de mariners per reforçar flotes en zones més importants.\nQuan es dissol una flota, els seus mariners tornen a la nostra reserva de mariners."
 NEW_UNIT:1 "§YCrear una unitat nova§!"
 NEW_UNIT_DRO:0 "Crear una unitat nova crearà una unitat buida i us permetrà assignar-hi regiments de la unitat actual."
