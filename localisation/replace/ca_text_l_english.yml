 FE_AI_AGGRESSIVENESS:0 "Dificultat de la IA"
 FE_AI_AGGRESSIVENESS_DESC:0 "La §Ydificultat de la IA§! determina l'habilitat i el comportament de les nacions controlades per la IA"
 FE_AI_AGGRESSIVENESS_DESC2:0 "§YFàcil§!: la IA juga amb un nivell d'habilitat reduït i reacciona amb menys duresa a l'agressivitat i la vulnerabilitat del jugador.\n§YNormal§!: la IA juga amb tota la seva habilitat i tracta igual les nacions del jugador i les de la IA.\n§YDifícil:§! la IA juga amb tota la seva habilitat i reacciona amb més duresa a l'agressivitat i la vulnerabilitat del jugador."
