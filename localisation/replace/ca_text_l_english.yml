 MOTHBALL_TITLE:1 "§YPosar en reserva§!"
 MOTHBALL_DESC:1 "Només es poden posar en reserva els vaixells que són a port.\nLes flotes en reserva seran inútils i es comportaran com si el control del manteniment de l'armada fos a zero.\nLa força dels vaixells en reserva tendirà al 25% amb el temps. No es reparen ni es mouen, i costen menys cada mes.\nEls mariners que ja no calguin tornaran a la nostra reserva de mariners."
