 unite_japan_title:0 "Unificar el Japó!"
 unite_japan_desc:0 "Ha arribat l'hora d'unificar el Japó per la força! S'ha acabat el temps de la diplomàcia, i cal conquerir tots aquests senyors daimyo enfrontats."
 united_japan_title:0 "El Japó està unificat"
 united_japan_desc:0 "Les faccions enfrontades del Japó per fi s'han unit sota un emperador fort."
 united_japan_daimyo_title:0 "El Japó està unificat"
 united_japan_daimyo_desc:0 "Les faccions enfrontades del Japó per fi s'han unit sota un emperador fort."
 restless_kami_title:0 "Els kami inquiets"
 restless_kami_desc:0 "Daimyo, els kami del nostre han natal s'han inquietat per la manca d'estabilitat del nostre regne i per la nostra insistència a mantenir el focus nacional lluny de la capital. Traslladeu el focus nacional a la capital i els esperits ens tornaran a mirar amb bons ulls."
 strengthen_the_bushido_title:0 "El codi bushido"
 strengthen_the_bushido_desc:0 "La conducta dels nostres guerrers sempre s'ha de guiar per una sòlida filosofia de virtut i bon comportament. Lleialtat, honor i obediència: aquest és el camí del bushido. Enfortiu la nostra tradició militar, i el nostre regne serà respectat a tot el Japó."
 support_the_kabuki_title:0 "El teatre kabuki"
 support_the_kabuki_desc:0 "Un nou estil d'espectacle dramàtic basat en la dansa s'estén pel país i cada dia és més popular. Doneu suport a la tradició dramatúrgica del kabuki i la nostra família serà coneguda com a mecenes de les arts."
 the_red_seal_ships_title:0 "Els vaixells del segell vermell"
 the_red_seal_ships_desc:0 "Alguns dels nostres mercaders han començat a comerciar a més distància fent servir un nou tipus de vaixells mercants armats. Enfortir la nostra pròpia classe mercantil podria ser una oportunitat per aprendre valuoses lliçons marítimes."
 strengthen_the_shinobi_title:0 "Enfortir els shinobi"
 strengthen_the_shinobi_desc:0 "Els shinobi són una casta d'espies, assassins i guerrers vestits de fosc que actuen per tot el Japó. Si creem un cercle propi de shinobi ben finançat, podrem protegir la família, el clan i el han."
 the_divine_wind_title:0 "El vent diví"
 the_divine_wind_desc:0 "Han passat molts anys des que el vent diví va allunyar del Japó un exèrcit invasor mongol i va salvar la pàtria de la invasió estrangera. Potser en el futur hauríem d'estar més ben preparats?"
