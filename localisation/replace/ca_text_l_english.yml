 sought_after_bachelor:0 "Partit cobejat"
 desc_sought_after_bachelor:0 "Les corts del món consideren el nostre monarca un partit atractiu per casar-s'hi."
 a_woman_scorned:0 "Una dona menyspreada"
 desc_a_woman_scorned:0 "L'infern no coneix una fúria com la d'una dona menyspreada. La reina no està gens contenta amb vós i, per una estranya coincidència, han començat a circular per les corts estrangeres uns rumors força estranys i desagradables sobre la vostra persona."
 GUARANTNEWDESC:0 "Voleu proclamar una garantia per al país $COUNTRY$? Se'ns cridarà a la guerra contra qualsevol país que l'ataqui."
 GUARANTDESC:0 "Si en garantim la independència, se'ns cridarà a la guerra contra qualsevol país que l'ataqui."
 WARNNEWDESC:0 "Voleu enviar una advertència al país $COUNTRY$? Se'ns cridarà a la guerra si ataca algun dels nostres països veïns."
 WARNDESC:0 "Si li enviem una advertència, se'ns cridarà a la guerra si ataca algun dels nostres veïns."
 SUPPLY_CORE:0 "Nucli:"
 UNIT_ENABLE_PATROL_NEW:0 "§YComençar a patrullar§!"
 UNIT_DISABLE_PATROL_NEW:0 "§YDeixar de patrullar§!"
 endorse_renaissance_philosophy_title:0 "Donar suport a la filosofia renaixentista"
 endorse_renaissance_philosophy_desc:0 "Tu, sense cap límit ni cap frontera, pots triar per tu mateix els límits i les fronteres de la teva naturalesa. T'hem situat al centre del món perquè puguis contemplar-ne tota la resta.\n\n--Pico della Mirandola, «Discurs sobre la dignitat de l'home»"
 blooming_renaissance:0 "Renaixement florent"
 desc_blooming_renaissance:0 "El Renaixement floreix al país $COUNTRY$! A tots els racons de tots els carrers de totes les ciutats, els nostres ciutadans abandonen els seus foscos tuguris medievals i surten als mons assolellats de la dignitat humana i la responsabilitat cívica."
 support_baroque_music_title:0 "Donar suport a la música barroca"
 support_baroque_music_desc:0 "Només el Totpoderós sap quant talent artístic s'ha malbaratat per massa pocs diners, massa poc menjar i massa poc amor. Ajudeu amb el vostre mecenatge els compositors que passen penúries al país $COUNTRY$, i ells us ajudaran a canvi."
 the_sound_of_music:0 "Música barroca"
 desc_the_sound_of_music:0 "Per difícils i durs que siguin els temps, els nostres súbdits sempre trobaran consol i conhort en la música que ha començat a ressonar fins i tot als carrerons més foscos del nostre regne. De Bach a Händel, tot el país ($COUNTRY$) vibra amb el so de la música!"
 way_of_tea:0 "La cerimònia del te"
 desc_way_of_tea:0 "A l'escalfor de mil cases de te, el nostre poble troba repòs i esbarjo, servits amb un toc diví i tasses de te fumejants."
 develop_way_of_tea_title:0 "La cerimònia del te"
 develop_way_of_tea_desc:0 "Tot i que al Japó es conreava te almenys des del segle IX, l'estètica més refinada del chanoyu, el camí del te, no es va desenvolupar plenament fins a principis del segle XV. Entre la cerimònia religiosa i la tradició cultural, el camí del te podria esdevenir una part essencial del nostre patrimoni cultural."
 develop_diwani_script_title:0 "Escriptura diwani"
 develop_diwani_script_desc:0 "L'escriptura diwani, un estil cursiu de cal·ligrafia àrab sorgit a l'Imperi otomà als segles XV i XVI, rep el nom del seu ús previst en els decrets reials emesos pel diwan otomà, el consell de l'estat otomà. Enfortim el nostre govern proclamant els nostres edictes, i la paraula de Déu, amb les harmonies de la cal·ligrafia."
 diwani_script:0 "L'escriptura diwani"
 desc_diwani_script:0 "Tots els nostres edictes i decrets s'emeten amb una cal·ligrafia elaborada, i el poble ens respecta per això"
 support_dutch_masters_title:0 "Edat d'or de la pintura neerlandesa"
 support_dutch_masters_desc:0 "La República Neerlandesa, calvinista i independent des de feia poc, i amb forts corrents de fons de pensament i filosofia humanistes, havia preparat a finals del segle XVI el terreny filosòfic per trencar amb les tradicions i els ideals artístics establerts de la vella Europa catòlica. Aprofitant la riquesa que arriba gràcies al comerç creixent a través d'Amsterdam, podríem ajudar a inaugurar una edat d'or de la pintura neerlandesa"
 dutch_masters:0 "L'edat d'or de la pintura neerlandesa"
 desc_dutch_masters:0 "Financem els mestres neerlandesos de la pintura a Holanda"
 charter_guild_of_st_luke_title:0 "Fundar un gremi de Sant Lluc"
 charter_guild_of_st_luke_desc:0 "Sant Lluc, patró dels artistes, sovint donava nom als gremis d'artistes de l'Europa occidental, el més famós dels quals és potser el d'Anvers. Fundar un gremi aquí, al país $COUNTRY$, pot ser una mica car, però el benefici cultural serà ben visible per a tothom. Desenvolupar la burocràcia del gremi també enfortirà la nostra tradició burocràtica pròpia."
 guild_of_st_luke:0 "El gremi de Sant Lluc"
 desc_guild_of_st_luke:0 "El patró dels artistes estén la mà sobre el nostre país. Els artistes del gremi de Sant Lluc produeixen obres mestres sense parar que enforteixen la nostra tradició cultural!"
 hold_the_last_jousting_tournament_title:0 "L'últim torneig de justes"
 hold_the_last_jousting_tournament_desc:0 "Ho notem en el vent. Aviat la nostra elit eqüestre no serà res més que un somni recordat, i la tradició cavalleresca s'extingirà davant l'embat de la modernitat. El món canvia, però ara, per última vegada: que cavalquin els cavallers del país $COUNTRY$!"
 the_last_joust:0 "L'últim torneig de justes"
 desc_the_last_joust:0 "Tot i que els cavallers encara formaran part del nostre exèrcit durant un temps, les tradicions cavalleresques que han mantingut tant de temps s'estan extingint."
 NOCLAIMLESSER:0 "No podeu reclamar trons com a soci menor d'una unió personal."
 florentine_school:0 "Suport a l'escola florentina"
 desc_florentine_school:1 "L'escola florentina va ser una escola d'art italiana, famosa sobretot pel seu estil naturalista i pels seus murals, que va sorgir de l'obra d'artistes com Donatello, Miquel Àngel i Brunelleschi. [Root.GetCaElCap] [Root.GetName] dona suport a aquests artistes, i el món ho sap."
 support_florentine_school_title:0 "Donar suport a l'escola florentina"
 support_florentine_school_desc:0 "Gràcies a la nostra relativa notorietat, estem en condicions de donar suport als artistes italians de l'escola florentina. Ser vistos com a mecenes de l'art internacional ajudarà sens dubte els nostres esforços propagandístics."
 court_byzantine_refugees_title:0 "Refugiats romans d'Orient"
 court_byzantine_refugees_desc:0 "Senyor, Bizanci ha caigut en mans dels sarraïns. L'últim bastió de l'Imperi Romà, la ciutat de Constantí, és ara en mans turques. Mentre la cristiandat es refà del xoc, els refugiats romans d'Orient acudeixen en massa a les ciutats i les corts d'Europa, i porten amb ells antics manuscrits de saber clàssic, tractats d'Aristòtil, Plató i Galè, i un coneixement profund del llatí i del grec. Convidar aquests refugiats al país $COUNTRY$ podria donar un impuls enorme als nostres esforços en els camps de la cultura i la ciència."
 byzantine_influx:0 "Arribada de romans d'Orient"
 desc_byzantine_influx:0 "El nostre país ha fet arribar a tota Europa una proclama: els fills perduts de la ciutat de Constantí estan convidats a buscar refugi i una nova vida a les nostres ciutats. Porten amb ells un coneixement de la civilització clàssica que ajuda la nostra recerca."
 commission_epic_to_monarch_title:0 "Epopeia nacional"
 commission_epic_to_monarch_desc:0 "Els nostres súbdits han començat a explicar contes i llegendes sobre $RANDOM_OLD_MONARCH$. La llegenda diu que, en l'hora més fosca del país ($COUNTRY$), tornarà a la nostra nació i la deslliurarà del mal. Sigui quina sigui la veritat d'aquesta afirmació, podríem aprofitar-la per a la nostra propaganda."
 epic_to_monarch:0 "Epopeia nacional"
 desc_epic_to_monarch:0 "Hi ha una epopeia escrita en homenatge a un dels nostres antics reis, que n'explica la vida i la llegenda."
 enlightenment_movement:0 "Liberté, Egalité, Fraternité"
 desc_enlightenment_movement:0 "Com una torxa poderosa que porta la llum de la raó fins als racons més foscos del vell i del nou món, la Il·lustració s'escampa arreu del món. Amb la ciència, la raó i una fe inquebrantable en el potencial de la humanitat com a armes, promet marcir les velles corones i creus i alliberar l'home. Com a esperit il·lustrat, [Root.Monarch.GetName], és clar, hi dona suport."
 support_enlightenment_movement_title:0 "Liberté, Egalité, Fraternité"
 support_enlightenment_movement_desc:0 "Com una torxa poderosa que porta la llum de la raó fins als racons més foscos del vell i del nou món, la Il·lustració s'escampa arreu del món. Donar suport a aquest moviment portarà sens dubte avenços en la ciència i la filosofia, però les idees del moviment sobre la llibertat humana i els drets inalienables de l'home poden despertar un cert fervor rebel al nostre país."
 commedia_dellarte:0 "Commedia dell'arte"
 desc_commedia_dellarte:0 "Nascuda originalment a Itàlia i França, la «commedia dell'arte» va ser una forma popular de teatre a Europa entre els segles XVI i XVIII. Tot i que els seus orígens es remunten a les convencions teatrals gregues i romanes, la commedia dell'arte va ser una innovació original, recordada sobretot pels seus personatges tipus com ara «Arlequí» i «Pantalone»."
 support_commedia_dellarte_title:0 "Representacions de commedia dell'arte"
 support_commedia_dellarte_desc:0 "Escolteu, escolteu! Deixeu anar Pantalone, Arlequí i tots els altres personatges tipus de la tradicional commedia dell'arte sobre la vostra població desprevinguda, i mireu com es diverteix amb les seves facècies i entremaliadures. Una bona comèdia pot fer oblidar a qualsevol, durant una estona, que la seva vida quotidiana s'esgota treballant sota el jou de governants tirànics. A més, és divertit!"
 military_modernization_muslim_title:0 "Modernització militar"
 military_modernization_muslim_desc:0 "Hem aconseguit posar la nostra vida cultural a l'altura dels nostres poderosos veïns. Vestim com ells, practiquem els seus costums i alguns de nosaltres fins i tot parlen les seves llengües. Tanmateix, encara queda el veritable repte: l'exèrcit."
 military_modernization_eastern_title:0 "Modernització militar"
 military_modernization_eastern_desc:0 "Hem aconseguit posar la nostra vida cultural a l'altura dels nostres poderosos veïns. Vestim com ells, practiquem els seus costums i alguns de nosaltres fins i tot parlen les seves llengües. Tanmateix, encara queda el veritable repte: l'exèrcit."
 military_modernization_western_title:0 "Modernització militar"
 military_modernization_western_desc:0 "Hem aconseguit posar la nostra vida cultural a l'altura dels nostres poderosos veïns. Vestim com ells, practiquem els seus costums i alguns de nosaltres fins i tot parlen les seves llengües. Tanmateix, encara queda el veritable repte: l'exèrcit."
 action_and_reaction:0 "Acció i reacció"
 desc_action_and_reaction:0 "A tota acció s'oposa una reacció igual i contrària. Hem reformat dràsticament una de les institucions més fonamentals del país, i ara hi ha interessos poderosos dins del nostre regne que conspiren per desfer aquests canvis. Mantingueu la posició i aguanteu la tempesta."
 tribal_rebels_title:0 "Rebels tribals"
 tribal_rebels_name:0 "Tribus ($COUNTRY$)"
 tribal_rebels_desc:0 "Els rebels tribals volen establir el seu propi govern en lloc del nostre, perquè ens veuen febles."
 tribal_rebels_army:0 "Exèrcit tribal"
 cossack_rebels_title:0 "Rebels cosacs"
 cossack_rebels_name:0 "Cosacs ($COUNTRY$)"
 cossack_rebels_desc:0 "Els rebels cosacs volen establir el seu propi domini sobre l'estepa."
 cossack_rebels_army:0 "Host"
 particularist_rebels_title:0 "Particularistes"
 particularist_rebels_name:0 "Particularistes ($COUNTRY$)"
 particularist_rebels_desc:0 "Els particularistes s'oposen violentament a qualsevol intent de centralització del govern. Exigeixen autonomia, però no pas la independència."
 particularist_rebels_army:0 "Exèrcit particularista"
 rome_reborn:0 "Roma renascuda"
 desc_rome_reborn:0 "Com un fènix de les cendres, l'Imperi Romà s'entronitza sobre el món. Per primera vegada des de Carlemany, hi ha un emperador indiscutible i absolut del Sacre Imperi Romanogermànic. Les mil banderes de l'Alemanya dividida han deixat d'onejar davant l'única bandera de Roma renascuda. Ave Caesar!"
 build_lubeck_krantor_title:0 "El Krantor de Lübeck"
 build_lubeck_krantor_desc:0 "Amb la riquesa que entra a raig a Lübeck, les instal·lacions portuàries comencen a quedar-se petites. Tot i que costaria gairebé els ingressos de tot un any, un Krantor (una grua portuària enorme) podria millorar molt el nostre potencial comercial."
 krantor_crane:1 "El Krantor"
 desc_krantor_crane:1 "Hem aixecat una grua portuària enorme aquí, a [Root.GetCapitalName], que ens ajuda a carregar i descarregar els vaixells."
 commission_adler_von_lubeck_title:0 "L'«Adler von Lübeck»"
 commission_adler_von_lubeck_desc:0 "Arran de la guerra que es lliura a la regió, els nostres mestres d'aixa han presentat els plans d'un nou vaixell de guerra: l'«Adler von Lübeck». El vaixell és enorme, amb més portes de canó que cap altre vaixell a flotació del món occidental. Construir-lo seria car, però la nostra armada no tindria rival al Bàltic durant força temps."
 adler_von_lubeck:0 "L'«Adler von Lübeck»"
 desc_adler_von_lubeck:0 "L'«Adler von Lübeck» sura sobre l'escuma salada, i el nostre poder naval no té rival des del Kattegat fins al golf de Bòtnia."
 CORE_FRACTION_IS_LESS_THAN:0 "La proporció de províncies nuclears és inferior a "
 CORE_FRACTION_IS_AT_LEAST:0 "La proporció de províncies nuclears és com a mínim "
 over_extension:0 "Sobreextensió"
 over_extension_val:0 "Sobreextensió: $VAL|%0$"
 desc_over_extension:0 "La nostra gloriosa nació ha crescut tan de pressa que a la nostra administració li costa mantenir-ho tot sota control. Hem d'alentir el ritme i consolidar el nostre domini sobre tots aquests territoris nous, descentralitzar o fins i tot alliberar alguns països com a vassalls."
 support_south_german_organ_tradition_title:0 "La tradició organística del sud d'Alemanya"
 support_south_german_organ_tradition_desc:0 "La tradició organística del sud d'Alemanya va ser una escola de compositors alemanys per a orgue, l'obra dels quals s'inspirava en gran part en tradicions italianes anteriors, que els alemanys havien après estudiant amb mestres italians. Coneguda pels seus preludis improvisats, les seves xacones i les seves passacaglies, la música dels organistes del sud d'Alemanya és una cosa a la qual podríem plantejar-nos donar suport."
 south_german_organ_tradition:0 "La tradició organística del sud d'Alemanya"
 desc_south_german_organ_tradition:0 "De Pachelbel a Johann Kaspar Kerll, la música dels orgues del sud d'Alemanya ressona arreu del país ($COUNTRY$)"
 HAVE_A_NAVY_SMALLER_THAN:1 "Mida total de l'armada inferior al §Y$PERC$%§W del límit de forces"
 HAVE_A_NAVY_LARGER_THAN:1 "Mida total de l'armada d'almenys el §Y$PERC$%§W del límit de forces"
 HAVE_A_ARMY_SMALLER_THAN:1 "Mida total de l'exèrcit inferior al §Y$PERC$%§W del límit de forces"
 HAVE_A_ARMY_LARGER_THAN:1 "Mida total de l'exèrcit d'almenys el §Y$PERC$%§W del límit de forces"
 EMBARGOSUBJECT:0 "Sou una nació súbdita i no podeu imposar embargaments."
 EMBARGOOVERLORD:0 "No podeu imposar embargaments a les nacions súbdites."
 tut_1c_30:0 "La pestanya de cultura"
 tut_1c_31:0 "A la part superior de la pantalla es mostra quanta tradició cultural, naval i militar té el vostre país. A sota hi ha botons per a cada tipus de conseller. Gastant tradició podeu reclutar els consellers que necessiteu, que després estaran disponibles per contractar a la vista de la cort. L'habilitat del nou conseller depèn de quanta tradició tingueu."
 tut_1c_32:0 "A sota hi ha diverses decisions culturals que podeu fer servir per augmentar la vostra tradició cultural; algunes també tenen altres efectes."
 tut_1c_33:0 "La pestanya de missions i decisions"
 tut_1c_34:0 "A la part superior d'aquesta pestanya teniu informació sobre la vostra missió actual. No cal que completeu la missió, però si ho feu el vostre país obtindrà algunes bonificacions. A la part inferior teniu diverses decisions de país que podeu prendre per obtenir determinats beneficis."
