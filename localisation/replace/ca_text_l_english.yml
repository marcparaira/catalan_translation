 fortification_expert:0 "Enginyer militar"
 ambassador:0 "Ambaixador"
 inquisitor:0 "Inquisidor"
 grand_captain:0 "Gran capità"
 sheriff_desc:0 "Originàriament, el «shire reeve» s'encarregava que els serfs treballessin com calia per al seu senyor. El xèrif és el responsable de recaptar els impostos, i un bon xèrif aportarà uns ingressos molt més alts."
 high_judge_desc:0 "El jutge suprem és un magistrat veterà molt versat en dret. Gràcies a la seva capacitat per garantir que les lleis s'apliquin de manera coherent i justa, la gent està més satisfeta"
 alderman_desc:0 "El regidor és un administrador molt treballador que va començar en el govern local. La seva posició elevada permet que el govern de les zones locals funcioni amb més eficàcia, cosa que fa augmentar la producció."
 colonel_desc:0 "El coronel era un comandant superior dels capitans mercenaris. La seva experiència ens permet reclutar mercenaris més barats."
 collector_desc:0 "El recaptador va començar la seva carrera cobrant drets de duana en un port. Ha anat pujant a poc a poc en l'escalafó de l'administració, i ara fa servir la seva experiència per garantir que recaptem més ingressos de les nostres colònies d'ultramar."
 master_of_mint_desc:0 "El mestre de la seca garanteix que la moneda s'encunyi segons els estàndards correctes. Quan una gran figura dirigeix una seca local, la gent té més confiança en el valor dels diners."
 banker_desc:0 "El banquer és un home expert en el món misteriós de les finances. Gràcies als seus contactes, pot aconseguir els préstecs més barats per ajudar a finançar el govern."
 lord_proprietor_desc:0 "El senyor propietari és al capdavant d'una companyia amb carta reial responsable de colonitzar el Nou Món. La seva habilitat anima més gent a emigrar a les nostres colònies a la recerca d'una nova vida i de fortuna."
 pioneer_desc:0 "El pioner és un especialista a posar en marxa noves empreses colonials, tot i que mai no sembla ser qui acaba traient-ne profit. Tanmateix, la seva habilitat ajuda a establir noves colònies."
 grand_admiral_desc:0 "Els homes sempre lluiten millor quan senten que se'ls dirigeix com cal. El gran almirall exerceix un lideratge des del capdamunt que es filtra per tota l'armada."
 naval_organiser_desc:0 "Tot i que és poc probable veure'l al castell de popa guiant els seus homes en gestes audaces, els capitans de la nostra flota aprecien la feina discreta que fa aquest home: vetlla perquè l'administració de terra funcioni sense entrebancs i perquè els nostres vaixells tinguin el manteniment i el suport adequats."
 navigator_desc:0 "Mariner que ha fet moltes travessies llargues, el navegant sap què cal perquè un vaixell passi llargs mesos a la mar."
 rear_admiral_desc:0 "Tradicionalment, el tercer al comandament de la flota, que comandava el vaixell de la cua de la columna. El contraalmirall sap què cal per ser un gran comandant i pot triar homes que destacaran al comandament de flotes."
 privateer_desc:0 "El corsari és un home que ha atacat una vegada i una altra el comerç enemic en benefici propi i de la corona. Sap exactament què cal per fer agenollar l'enemic."
 sergeant_major_general_desc:0 "Tradicionalment, el comandant no noble de més rang de l'exèrcit, el sergent major general és un veterà curtit amb bon ull per als comandants. Amb els seus savis consells podem identificar aviat els oficials prometedors."
 army_organiser_desc:0 "Dirigir un exèrcit modern no és cap feina fàcil. En els bons vells temps n'hi havia prou de reunir els nobles i els seus seguicis i sortir a lluitar. Avui dia cal organitzar les coses, i un home que en sap val el seu pes en or."
 commandant_desc:1 "Mestre de la instrucció, el comandant s'ha proposat amb zel que les nostres tropes estiguin ben entrenades. A jutjar pel nombre de queixes de la tropa, els resultats no podrien ser millors."
 quartermaster_desc:0 "Mantenir les nostres tropes proveïdes de munició, de menjar i, sobretot, de carn de canó fresca és una feina important. Alegreu-vos sempre si teniu un bon intendent a la vostra administració."
 recruitmaster_desc:0 "Trobar cossos per omplir els uniformes de vegades és una feina difícil. El mestre de reclutament coneix tots els trucs i s'assegurarà que ningú que hagi de servir no se n'escapi."
 fortification_expert_desc:0 "La defensa de les fortificacions s'està convertint en una ciència per si mateixa, tot i que els experts afirmen que és més aviat un art. Per treure fins a l'últim avantatge de les fortificacions, cal actualitzar constantment els procediments defensius."
 ambassador_desc:0 "Els ambaixadors són homes que han viatjat molt, que coneixen bé els secrets de les corts estrangeres i que ens poden donar avantatge en les negociacions importants."
 inquisitor_desc:1 "Amb l'experiència adquirida a arrencar d'arrel els qui no segueixen l'ortodòxia de la fe, l'inquisidor té talent per detectar els qui tenen un comportament estrany al govern."
 grand_captain_desc:0 "Els homes sempre lluiten millor quan senten que se'ls dirigeix com cal. El gran capità exerceix un lideratge des del capdamunt que es filtra per tot l'exèrcit."
 sheikh_ul_islam_title:0 "Instituir el càrrec de xeic al-islam"
 sheikh_ul_islam_desc:0 "Instituir un nou càrrec, ocupat per persones amb un coneixement profund del Llibre de Déu, per garantir que l'acció de govern s'ajusti a la llei islàmica."
 the_sheikh_ul_islam:0 "Xeic al-islam"
 desc_the_sheikh_ul_islam:0 "S'ha instituït un nou càrrec per garantir que l'acció de govern s'ajusti a la llei islàmica."
 the_khalifah_title:0 "Adoptar el títol de califa"
 the_khalifah_desc:0 "Concedir el títol de califa al soldà per demostrar la seva importància no només com a líder polític, sinó també com a líder espiritual."
 khalifah:0 "Califa"
 desc_khalifah:0 "S'ha concedit el títol de califa al soldà per demostrar la seva importància no només com a líder polític, sinó també com a líder espiritual."
 denouncement_of_sect_practices_title:0 "Denúncia de les pràctiques sectàries"
 denouncement_of_sect_practices_desc:0 "Condemnar qualsevol forma de pràctica sectària i declarar heretges tots els qui la practiquin."
 sect_practices:0 "Denúncia de les pràctiques sectàries"
 desc_sect_practices:0 "Qualsevol forma de pràctica sectària es considera un comportament herètic."
 monastic_education_title:0 "Educació monàstica"
 monastic_education_desc:0 "Millorar l'alfabetització i el càlcul promovent un sistema d'educació monàstica a tot el país."
 monastic_education_system:0 "Educació monàstica"
 desc_monastic_education_system:0 "S'ha posat més èmfasi a establir un sistema d'educació monàstica per millorar l'alfabetització i el càlcul."
 anti_christian_edict_title:0 "Edicte anticristià"
 anti_christian_edict_desc:0 "Prevenir qualsevol possible soscavament de l'autoritat que pugui causar el cristianisme promulgant un edicte que expulsi tots els missioners cristians i exigeixi a tots els conversos que renunciïn a la seva nova fe."
 the_anti_christian_edict:0 "Edicte anticristià"
 desc_the_anti_christian_edict:0 "S'ha promulgat un edicte per expulsar tots els missioners cristians."
 islamic_centre_of_scholarly_title:0 "Centre islàmic del saber"
 islamic_centre_of_scholarly_desc:0 "Dirigir tots els esforços a crear un centre islàmic d'erudició i de culte promovent els estudis acadèmics de l'islam i donant suport a la creació de biblioteques locals."
 islamic_scholarly_centre:0 "Centre islàmic del saber"
 desc_islamic_scholarly_centre:0 "Tots els nostres esforços es dirigeixen a la creació d'un centre islàmic d'erudició i de culte."
 superintendents_title:0 "Superintendents"
 superintendents_desc:0 "Crear un nou càrrec, ocupat per un superintendent, de caràcter semblant al d'un bisbe; però, en lloc de ser nomenat per l'arquebisbe, el superintendent el nomenarà el monarca i, per tant, serà més probable que sigui lleial a la corona."
 superintendent_office:0 "Superintendents"
 desc_superintendent_office:0 "Hem creat un nou càrrec de superintendent, de caràcter semblant al dels bisbes; però, en lloc de ser nomenat per l'arquebisbe, el superintendent el nomena el monarca i, per tant, és més probable que sigui lleial a la corona."
 TOFARAWAYTOCOLONISE:0 "Aquesta província és a més de $MAX$ de la nostra província nuclear amb port no bloquejada més pròxima."
 religious_migration:0 "Migració religiosa"
 desc_religious_migration:0 "Una minoria religiosa ha fugit de la nostra pàtria per crear una colònia al Nou Món. Són devots de la seva pròpia religió i no escoltarien cap missioner."
 improved_fortifications:0 "Fortificacions millorades"
 desc_improved_fortifications:0 "Les fortificacions locals s'han millorat molt i ofereixen una gran defensa contra qualsevol setge."
 jizya_tax_title:0 "Introduir la jizya"
 jizya_tax_desc:0 "Introduir un impost per capita, la «jizya», per als súbdits no musulmans, que es recaptarà segons les propietats que tinguin."
