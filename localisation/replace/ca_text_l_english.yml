 establish_gaituguiliu_decision_desc:1 "Els cabdills indígenes de les prefectures remotes, també coneguts com a tusi, són governants hereditaris de les minories locals. De tant en tant poden semblar útils pels seus lligams amb la població local, però sovint han demostrat ser un risc per a l'estabilitat regional a llarg termini. Si els substituïm a poc a poc per funcionaris ordinaris nomenats pel govern central, serà més fàcil mantenir la tranquil·litat a escala regional."
