 subjugate_burgundy_title:0 "L'herència borgonyona"
 subjugate_burgundy_desc:0 "Borgonya es troba a la frontera entre l'Imperi i França. El destí d'aquest ducat té una importància vital per a nosaltres. Hem d'assegurar-nos que la casa d'Habsburg hi tingui veu si passés el pitjor."
 no_ottomans_in_eastern_balkans_title:0 "Fer retrocedir el turc"
 no_ottomans_in_eastern_balkans_desc:0 "El control turc sobre els Balcans orientals és una amenaça massa gran per a Àustria per tolerar-lo. Per a la nostra seguretat, hem de prendre el control d'una part d'aquestes terres."
 no_ottomans_in_western_balkans_title:0 "Assegurar la frontera militar "
 no_ottomans_in_western_balkans_desc:0 "Amb el temible turc encara ben atrinxerat als Balcans occidentals, l'hem de fer retrocedir per assegurar la frontera militar."
 austria_spain_relations_title:0 "La relació amb Espanya"
 austria_spain_relations_desc:0 "La posició perifèrica d'Espanya a Europa la converteix en un soci atractiu per a Àustria davant les amenaces de França. Hem d'assegurar-nos que mantenim bones relacions amb Espanya i consolidar-les amb un matrimoni."
 austria_burgundy_relations_title:0 "Protegir la frontera imperial"
 austria_burgundy_relations_desc:0 "Les terres franceses són riques i populoses, i qui les controli és una amenaça per a l'Imperi. Hem d'ajudar a defensar la frontera imperial enfortint la nostra relació amb Borgonya."
 austria_bavaria_relations_title:0 "Protegir les terres ancestrals "
 austria_bavaria_relations_desc:0 "Al nord de les terres ancestrals de la dinastia dels Habsburg hi ha l'amenaça potencial del ducat de Baviera. Hem d'enfortir les relacions amb ells perquè no esdevinguin un enemic."
 no_territory_to_the_ottomans_title:0 "Cap terra austríaca per al turc "
 no_territory_to_the_ottomans_desc:0 "És imprescindible per a la nostra seguretat i el nostre prestigi que el turc no tingui cap terra que formi part d'Àustria. Hem de lluitar fins que totes les terres siguin nostres."
 hegemony_over_north_italy_title:0 "Les nostres reclamacions sobre el nord d'Itàlia "
 hegemony_over_north_italy_desc:0 "Tenim reclamacions sòlides sobre terres de la Llombardia. La majestat de la nostra dinastia exigeix que les fem valer."
 annex_bohemia_title:0 "La fi de Bohèmia "
 annex_bohemia_desc:0 "El Regne de Bohèmia ha acceptat la sobirania de la família Habsburg, però els consellers adverteixen que això no és prou per a la seguretat del nostre regne. Hem de posar Bohèmia completament sota el nostre control."
 annex_hungary_title:0 "Protegir els hongaresos"
 annex_hungary_desc:0 "El Regne d'Hongria ha acceptat la nostra sobirania, però, amb la situació actual als Balcans, creiem que Hongria encara és massa vulnerable. Hem de convèncer la noblesa hongaresa que només amb la unió amb Àustria serem prou forts per vèncer."
 protect_belgium_from_the_french_title:0 "Defensar els Països Baixos."
 protect_belgium_from_the_french_desc:0 "Les nostres possessions als Països Baixos estan amenaçades pels francesos. Hem d'assegurar la nostra posició i expulsar-los dels Països Baixos."
 protect_hungary_from_the_ottomans_title:0 "Protegir Hongria dels otomans."
 protect_hungary_from_the_ottomans_desc:0 "És el nostre deure assegurar-nos que les províncies d'Hongria no caiguin sota el jou otomà!"
 protect_italy_from_the_french_title:0 "Mantenir els francesos fora d'Itàlia."
 protect_italy_from_the_french_desc:0 "El nord d'Itàlia és una de les rutes més òbvies per a una invasió d'Àustria des de l'oest. La seguretat de la monarquia exigeix que no hi hagi pau mentre una sola província estigui sota control francès."
 protect_italy_from_the_french_republic_title:0 "Protegir Itàlia de les forces revolucionàries."
 protect_italy_from_the_french_republic_desc:0 "Les hordes immundes de la França revolucionària amenacen d'engolir el nord d'Itàlia. És el nostre deure sagrat evitar-ho. No podem permetre que cap província del nord d'Itàlia continuï en mans dels revolucionaris i del seu règim jacobí."
 RULER_IS_MALE:0 "El governant és un home"
 RULER_IS_FEMALE:0 "El governant és una dona"
