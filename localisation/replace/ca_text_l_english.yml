 demi_culverin:0 "Mitja colobrina"
 demi_culverinDESCR:0 "La mitja colobrina era una versió més petita de la colobrina, desenvolupada a finals del segle XVI. Era més mòbil i se'n lloaven la precisió i l'eficàcia."
 chambered_cannon:0 "Canó de recambra"
 chambered_cannonDESCR:0 "El segle XVI no només va veure millores en la maniobrabilitat de l'artilleria, sinó també intents d'estandarditzar la mida i el pes de les peces d'artilleria."
 howitzer:0 "Obús"
 howitzerDESCR:0 "Els obusos moderns es van desenvolupar a partir de l'artilleria houfnice hussita com una arma de trajectòria mitjana, a mig camí entre el canó i el morter, amb els avantatges del tir directe i del tir indirecte."
