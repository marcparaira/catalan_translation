 HOSTILE_RELATIONLEDGER_EMBARGO_LEFT_L:0 "Aquests són els països que ara mateix tenim vetats als nostres nodes comercials. No hi poden enviar més mercaders i els que ja hi tenen no obtenen ingressos. A més, cap de les nostres províncies que aporten ingressos comercials a nodes que no són nostres no proporcionarà ingressos a aquests països. En general, els països no veuen amb bons ulls les nacions que veten els seus mercaders. Un embargament comercial és un acte hostil, i els països que vetem tindran automàticament un casus belli contra nosaltres."
 HOSTILE_RELATIONLEDGER_EMBARGO_RIGHT_L:0 "Aquests són els països que ens veten als seus nodes comercials. No podem enviar més mercaders als seus nodes. A més, cap de les seves províncies que aporten ingressos comercials a un node que no és seu no ens proporcionarà ingressos. Considerem que un embargament comercial és un acte hostil i tenim un casus belli contra qualsevol país que gosi imposar-nos un embargament."
