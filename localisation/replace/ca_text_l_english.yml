 central_america:0 "Amèrica Central"
 the_baltics:0 "Els països bàltics"
 revoke_restraint_of_appeals_title:0 "Revocar la restricció d'apel·lacions"
 revoke_restraint_of_appeals_desc:0 "Revoca la llei aprovada anteriorment que donava al rei l'autoritat legal suprema en tots els assumptes religiosos i restitueix aquests drets al papa."
 colonial_expansion_title:0 "Expansió colonial"
 colonial_expansion_desc:0 "Promou l'expansió colonial amb un programa de reassentament."
 agricultural_cultivation_title:0 "Conreu agrícola"
 agricultural_cultivation_desc:0 "Maximitza la producció de les collites passant de les petites explotacions a la creació de grans plantacions."
 navigation_act_title:0 "Aprovar la Llei de Navegació"
 navigation_act_desc:0 "Imposa restriccions a l'ús de vaixells estrangers per al comerç i promou l'ús de vaixells nacionals."
 importation_act_title:0 "Aprovar la Llei d'Importació"
 revocation_of_restraint_of_appeals:0 "Revocació de la restricció d'apel·lacions"
 desc_revocation_of_restraint_of_appeals:0 "El papa ha recuperat la seva posició d'autoritat legal suprema en tots els assumptes religiosos."
 FE_NUM_PLAYERS:0 "Nombre de jugadors: $NUM$"
 house_of_trade_title:0 "Establir una Casa de Contractació"
 house_of_trade_desc:0 "Redueix al mínim la corrupció i el contraban establint un organisme governamental que controlarà tot el comerç colonial i la colonització pel que fa als impostos, les rutes comercials i el dret mercantil."
 mining_act_title:0 "Aprovar la Llei de Mines"
 mining_act_desc:0 "Augmenta l'eficiència permetent que les empreses privades s'ocupin de tots els aspectes de la mineria sense cap intervenció governamental, excepte, és clar, pel que fa als impostos."
 enlist_privateers_title:0 "Allistar corsaris"
 enlist_privateers_desc:0 "Encarrega a corsaris que pertorbin el comerç estranger permetent-los anar més enllà de les nostres fronteres a la recerca de vaixells enemics o de vaixells d'altres nacions considerades poc fiables."
 naval_convoy_system_title:0 "Establir un sistema de combois navals"
 naval_convoy_system_desc:0 "Adopta un sistema de combois per als vaixells que porten or i altres béns exòtics de les nostres colònies per evitar que pirates i corsaris pertorbin el nostre comerç."
 colonial_restrictions_title:0 "Restriccions colonials"
 colonial_restrictions_desc:0 "Augmenta el control sobre les vostres colònies imposant normes estrictes pel que fa al comerç i la producció."
 anti_piracy_act_title:0 "Aprovar la Llei contra la Pirateria"
 anti_piracy_act_desc:0 "Augmenta severament les penes per pirateria per fer front als problemes creixents que causa."
 land_recruiting_act_title:0 "Aprovar la Llei de Reclutament"
 land_recruiting_act_desc:0 "Una llei de reclutament obligaria els homes aptes sense mitjans de subsistència a allistar-se i, així, augmentaria considerablement el nombre de regiments."
