 iqta_reform_title:0 "Reformar el govern"
 iqta_reform_desc:0 "Ara mateix, el nostre govern administra la terra mitjançant concessions, amb el sistema de l'iqta. Canviar-ho ens permetria adoptar una administració més centralitzada."
 egyptian_nation_title:0 "Formar Egipte"
 egyptian_nation_desc:0 "Fundar la nació egípcia, aprofitant la rica història del delta del Nil per establir un estat modern a la regió."
 bukharan_nation_title:0 "Formar Bukharà"
 bukharan_nation_desc:0 "Deixar l'estepa salvatge per les antigues ciutats sedentàries de la Ruta de la Seda a la Transoxiana ens permetrà establir-nos en terres els mateixos noms de les quals evoquen riqueses fabuloses, però si avancem tan al sud cap a terres sedentàries, els nostres cosins salvatges del nord ja no acceptaran la nostra autoritat."
 arab_nation_title:0 "Formar Aràbia"
 arab_nation_desc:0 "Durant centenars d'anys els àrabs han estat dividits, però recordem quan el profeta Mahoma, la pau sigui amb ell, ens va organitzar a tots en una sola umma, una comunitat de creients que transcendia la filiació tribal. Avui hem superat la desunió i hem recuperat la unitat que va triomfar en temps del Profeta i va unir Aràbia!"
 tibetan_nation_title:0 "Formar la nació tibetana"
 tibetan_nation_desc:0 "L'altiplà del Tibet va estar unit en altre temps sota un imperi que s'estenia més enllà. Si tornem a unir el poble tibetà, podrem reviure aquest llegat."
