 EXPENSECOLONIAL:0 "Colònies, manteniment"
 COLONIAL_MAINT_IRO:4 "Tenim §Y$NUM_COLONIES$§! $COLONIES_EACH$§, i un manteniment de $MAINTENANCE|%$, cosa que fa que el creixement base de pobladors del nostre país sigui de $GROWTH$ per any.\n"
 COLONIAL_MAINT_SETTLEMENT_GROWTH:0 "$NUM|Y$ colons fomenten el creixement de l'assentament.\n"
