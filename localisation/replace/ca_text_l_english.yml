 improve_key_defensive_position_small_title:0 "Millorar les defenses a $PROVINCENAME$"
 improve_key_defensive_position_small_desc:0 "A $PROVINCENAME$, la població tem que les seves defenses siguin insuficients davant d'una possible invasió. Implora que se'n millorin les fortificacions."
 improve_key_defensive_position_medium_title:0 "Construir una fortalesa a $PROVINCENAME$"
 improve_key_defensive_position_medium_desc:0 "La província fronterera ($PROVINCENAME$) podria convertir-se en un camp de batalla clau en una guerra futura. Els nostres generals creuen que una gran millora de les fortificacions és vital perquè estiguem preparats."
 improve_key_defensive_position_hard_title:0 "Fer una fortalesa inexpugnable a $PROVINCENAME$!"
 improve_key_defensive_position_hard_desc:0 "La fortalesa de la província ($PROVINCENAME$) va ser en un temps la meravella de l'època, però avui dia sembla clarament obsoleta. Hauríem de donar prioritat a la modernització d'aquesta fortalesa."
 get_control_of_naval_supplies_title:0 "Producció nacional de subministraments navals"
 get_control_of_naval_supplies_desc:0 "Si volem mantenir la nostra flota, hem de tenir un accés segur als subministraments navals. Fer-ho de cap altra manera seria posar en perill la seguretat del nostre país."
 liquor_act_title:0 "Aprovar la Llei de Licors"
 liquor_act_desc:0 "Introdueix regulacions sobre la venda de ginebra imposant taxes de llicència a tots els venedors de ginebra i els prohibeix vendre a mercaders sense llicència."
 joint_stock_companies_act_title:0 "Aprovar la Llei de Societats Anònimes"
 joint_stock_companies_act_desc:0 "Impedeix que les petites companyies sense privilegi reial competeixin amb la Companyia de les Índies prohibint les societats anònimes no autoritzades."
 merchant_shipping_act_title:0 "Aprovar la Llei de la Marina Mercant"
 merchant_shipping_act_desc:0 "Imposa un límit a la responsabilitat dels armadors respecte a les mercaderies malmeses o perdudes a causa de robatoris, malversacions o incendis."
 witchcraft_act_title:0 "Aprovar la Llei de Bruixeria"
 witchcraft_act_desc:0 "A partir d'ara, la pràctica de la bruixeria, la fetilleria o l'encantament en qualsevol forma s'ha de considerar un delicte greu segons el dret comú."
 education_act_title:0 "Aprovar la Llei d'Educació"
 education_act_desc:0 "Millora l'administració de justícia adoptant el principi d'educació obligatòria per als qui han de governar el nostre sistema jurídic."
 abolish_slavery_act_title:0 "Aprovar la Llei d'Abolició de l'Esclavitud"
 abolish_slavery_act_desc:0 "Aprova una llei que prohibeix l'esclavitud i il·legalitza el comerç d'esclaus a tota la nació."
 judiciary_act_title:0 "Aprovar la Llei Judicial"
 judiciary_act_desc:0 "Estableix un sistema judicial nacional que serà responsable de l'administració i la interpretació de la llei en nom del sobirà o de l'estat."
 combination_act_title:0 "Aprovar la Llei d'Associacions"
 combination_act_desc:0 "Pren totes les mesures possibles per impedir les vagues prohibint la formació d'associacions il·legals, gremis i sindicats."
