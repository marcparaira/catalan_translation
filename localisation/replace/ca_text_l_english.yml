 PEACE_WILL_NOT_ACCEPT:0 "No acceptarien aquesta oferta."
 NO_WAR_ON_OTHER_VASSALS:0 "No podeu declarar la guerra al súbdit d'un altre país."
 reconquer_breda_title:0 "Capturar Breda"
 reconquer_breda_desc:0 "La fortalesa de Breda és com un punyal que apunta al cor dels Països Baixos. Mentre estigui sota domini espanyol, mai no estarem segurs: l'hem de recuperar."
 the_netherlands_discover_the_carribean_title:0 "Descobrir el Carib"
 the_netherlands_discover_the_carribean_desc:0 "Ens han arribat rumors meravellosos sobre la riquesa de les Índies Occidentals. Perquè el poble neerlandès prosperi, les hem de trobar i reclamar-hi la nostra part."
 dutch_colony_in_the_carribean_title:0 "Colonitzar el Carib "
 dutch_colony_in_the_carribean_desc:0 "Les illes del Carib ofereixen oportunitats d'enriquir-se als cavallers que tinguin la voluntat d'adquirir-les i la mà d'obra per explotar-les. I nosaltres tenim exactament aquesta mena de cavallers."
 the_netherlands_discover_north_america_title:0 "Descobrir l'Amèrica del Nord"
 the_netherlands_discover_north_america_desc:0 "Hem sentit parlar de terres immenses a la part nord d'una regió anomenada les Amèriques. Hem d'anar-hi i comprovar si aquests rumors són certs."
 dutch_colony_in_north_america_title:0 "Colonitzar l'Amèrica del Nord"
 dutch_colony_in_north_america_desc:0 "Les immenses terres verges de les Amèriques són pràcticament buides. És el nostre deure poblar-les en nom de Déu i per a la glòria d'Holanda."
 dutch_colony_in_south_africa_title:0 "Colonitzar Sud-àfrica "
 dutch_colony_in_south_africa_desc:0 "Han arribat a la nostra capital històries sobre la gran quantitat d'or que es pot trobar al sud de l'Àfrica. Perquè els Països Baixos siguin forts, hem d'establir una base a Sud-àfrica i veure si podem aprofitar-la per obtenir la nostra part. "
 dutch_colony_in_indonesia_title:0 "Colonitzar les Índies Orientals "
 dutch_colony_in_indonesia_desc:0 "Les Índies Orientals són el centre de la producció mundial d'espècies, i hi ha grans riqueses per a la nació que ampliï el comerç d'espècies. Les espècies han de fluir!"
 dutch_colony_in_brazil_title:0 "Colonitzar la Guaiana "
 dutch_colony_in_brazil_desc:0 "Les terres de la Guaiana són dures i implacables, però, gràcies a la nostra superioritat i amb la voluntat de Déu, podem domar aquestes terres per a la glòria dels Països Baixos."
 the_netherlands_discover_australia_title:0 "Descobrir Austràlia "
 the_netherlands_discover_australia_desc:0 "Hem sentit parlar d'un continent immens al sud de les Índies Orientals. Els nostres navegants demanen el suport del govern per anar a descobrir aquestes terres i reclamar-les per a Holanda."
 dutch_control_of_taiwan_title:0 "Controlar Formosa"
 dutch_control_of_taiwan_desc:0 "L'illa de Formosa ocupa una posició estratègica important per al comerç amb la Xina. Ens beneficiaria molt poder-ne adquirir la possessió."
 embrace_the_reformation_title:0 "Adoptar els ensenyaments de Calví "
 embrace_the_reformation_desc:0 "La força creixent de l'Església reformada neerlandesa, basada en els ensenyaments de Calví, és evident. L'hauríem de convertir en l'Església oficial."
 take_malacca_from_portugal_title:0 "Prendre Malaca a Portugal "
 take_malacca_from_portugal_desc:0 "Malaca és la porta d'entrada a les Índies Orientals. Qui la controla controla el comerç d'espècies. L'hem de prendre als portuguesos."
 take_ceylon_from_portugal_title:0 "Alliberar Ceilan "
 take_ceylon_from_portugal_desc:0 "L'illa de Ceilan és al centre de la ruta comercial de l'oceà Índic. Perquè el comerç pugui fluir lliurement fins a Amsterdam, l'hem d'alliberar de Portugal."
 establish_trade_in_indonesian_cot_title:0 "Establir comerç a les Índies Orientals "
 establish_trade_in_indonesian_cot_desc:0 "Els nostres mercaders creuen que s'estan perdent les oportunitats del comerç d'espècies de les Índies Orientals. La VOC demana el suport del govern per establir el comerç neerlandès a la regió."
 conquer_ireland_title:0 "Conquerir Irlanda "
 conquer_ireland_desc:1 "Coneguda històricament com «els enemics irlandesos de Sa Majestat», la població gaèlica d'Irlanda fa molt de temps que és fora del domini anglès. És hora de sotmetre-la."
 conquer_scotland_title:0 "Conquerir Escòcia "
 conquer_scotland_desc:0 "Eduard I, Scottorum Malleus, va veure la saviesa d'assegurar el nostre regne sotmetent els escocesos. Hem de fer el mateix."
 vassalize_scotland_title:0 "Vassallitzar Escòcia "
 vassalize_scotland_desc:0 "El Regne d'Escòcia és un problema perenne: la seva tendència a aliar-se amb França i a causar problemes a la frontera nord comença a ser molesta. Hem d'aconseguir que els senyors escocesos segueixin una línia més favorable a Anglaterra."
 england_discovers_north_america_title:0 "Descobrir la costa est d'Amèrica "
 england_discovers_north_america_desc:0 "Ens han arribat rumors que els nostres pescadors, que naveguen mar endins a la recerca de bacallà, han albirat terra. Hem de veure quines terres noves podem trobar."
 england_discovers_the_carribean_title:0 "Descobrir el Carib "
 england_discovers_the_carribean_desc:0 "Es parla molt d'illes riques a les Índies Occidentals. El Parlament pressiona la corona perquè financi una expedició per comprovar la veracitat d'aquests rumors."
 conquer_indian_coastal_province_title:0 "Fer-se un lloc en el comerç de l'Índia "
 conquer_indian_coastal_province_desc:0 "Els honorables cavallers de la Companyia de Mercaders de Londres que Comercien amb les Índies Orientals han demanat el suport de la corona. Si s'adquirissin terres que servissin de base per a les activitats comercials de la companyia, la corona en podria obtenir ingressos útils."
 english_colony_in_australia_title:0 "Problemes penitenciaris"
 english_colony_in_australia_desc:0 "Les nostres presons estan plenes a vessar de criminals de tota mena. Per fer-hi lloc, podríem tornar a deixar anar aquests individus perillosos. Si almenys hi hagués algun altre lloc on posar-los..."
 establish_trade_in_american_cot_title:1 "Comerç americà"
 establish_trade_in_american_cot_desc:0 "La Companyia de la Badia de Hudson pressiona amb força el Parlament perquè doni suport a l'establiment del comerç a les Amèriques. Hauríem de finançar aquesta empresa. "
 monopolize_british_cot_title:0 "Els nostres diners se'n van a l'estranger"
 occupy_paris_title:0 "Ocupar París "
 occupy_paris_desc:0 "Continuem els nostres esforços per fer valer la nostra pretensió legítima al tron francès. Als ulls de la resta de la cristiandat, la nostra posició sortiria reforçada si poguéssim prendre el control de París."
 conquer_normandie_and_caux_title:0 "Recuperar Normandia "
 conquer_normandie_and_caux_desc:0 "Felip II de França va prendre a traïció Normandia al seu legítim propietari, el bon rei Joan. Hem de recuperar el ducat en nom de la justícia."
 conquer_aquitaine_title:0 "Conquerir Aquitània "
 conquer_aquitaine_desc:0 "Les riques terres d'Aquitània van ser en altre temps la joia de la corona de les terres del rei d'Anglaterra. És el nostre deure fer que ho tornin a ser."
 HAVE_LESS_TOTAL_PORTS_THAN:0 "Tenir menys ports en total que "
 HAVE_MORE_TOTAL_PORTS_THAN:0 "Tenir més ports en total que "
 HAS_NO_PORTS:0 "$COUNTRY$ no té cap port."
 WE_HAVE_NO_PORTS:0 "No tenim cap port."
 ARMIES_IN:0 "Exèrcits a"
 ANY_ELECTOR_STARTS:0 "Qualsevol elector del SIRG"
 THE_CAPITAL_IS:0 "La capital és "
 THE_CAPITAL_IS_NOT:0 "La capital no és "
 restore_byzantine_empire_title:0 "Restaurar l'Imperi Romà d'Orient"
 restore_byzantine_empire_desc:0 "El gloriós Imperi Romà d'Orient ha desaparegut, però mentre hi hagi grecs a Constantinoble, hi ha esperança que ressorgeixi. Podem ocupar-ne el lloc en esperit, però no en podem prendre el nom si no demostrem que en som dignes..."
 annex_orleans_title:0 "Annexionar Orleans"
 annex_orleans_desc:0 "El duc d'Orleans fa massa temps que segueix una política semiindependent. Tan a prop de París, hauríem d'anar amb compte i integrar els seus dominis al cor de França."
 annex_provence_title:0 "Annexionar Provença"
 annex_provence_desc:0 "El duc de Provença fa massa temps que segueix una política semiindependent. És hora d'estrènyer-li les regnes."
 annex_auvergne_title:0 "Annexionar Alvèrnia"
 annex_auvergne_desc:0 "El ducat d'Alvèrnia ocupa una posició estratègica al centre de França. L'hem d'incorporar plenament al regne francès."
 annex_bourbonnais_title:0 "Annexionar el Borbonès"
 annex_bourbonnais_desc:0 "El ducat del Borbonès ocupa una posició estratègica al centre de França. L'hem d'incorporar plenament al regne francès."
 louvre_expansion_title:0 "Reconstrucció del Louvre "
 louvre_expansion_desc:0 "La fortalesa del Louvre ja no és necessària per defensar París. Per engrandir la nostra glòria, l'hauríem de convertir en la Grande Galerie "
 annex_alsace_title:0 "Annexionar Alsàcia"
 annex_alsace_desc:0 "La fortalesa d'Estrasburg defensa un dels principals passos de l'alt Rin. Per ajudar a defensar França, hem d'avançar la nostra frontera fins al Rin i assegurar-nos que som nosaltres, i ningú més, qui controla aquesta fortalesa."
 french_colony_in_the_carribean_title:0 "Establir bases al Carib"
 french_colony_in_the_carribean_desc:0 "La Compagnie des Îles de l'Amérique demana suport financer per establir bases comercials a les illes del Carib. Pot França rebutjar una petició així?"
 defend_france_against_england_title:0 "Cal expulsar Anglaterra de França "
 defend_france_against_england_desc:0 "Massa temps fa que les belles terres de França estan contaminades per la presència dels rosbifs. L'honneur de França exigeix que el nostre sòl en quedi lliure."
 recover_aquitaine_title:0 "Recuperar Aquitània"
 recover_aquitaine_desc:0 "La nostra llarga guerra amb Anglaterra ha permès al rei d'Anglaterra establir-se a Aquitània, independent de França. Hem de recuperar aquestes províncies que han estat separades de França."
 conquer_milan_title:0 "Conquerir Milà"
 conquer_milan_desc:0 "Per assegurar que la nostra posició al nord d'Itàlia estigui protegida, hem d'ampliar les nostres possessions fins a incloure Milà."
 annex_genoa_title:0 "Annexionar Gènova"
 annex_genoa_desc:0 "El port de Gènova i el seu rerepaís són massa a prop de la costa mediterrània francesa: els hauríem d'incorporar al nostre regne per protegir la nostra costa mediterrània."
 establish_national_guard_title:0 "Crear la Guàrdia Nacional"
 establish_national_guard_desc:0 "Ens preocupa cada cop més l'amenaça de desordres civils als voltants de París. Hauríem de crear la Garde nationale perquè es puguin organitzar tropes ràpidament per sufocar qualsevol desordre."
 france_the_united_states_relations_title:0 "Millorar les relacions amb els EUA"
 france_the_united_states_relations_desc:0 "La jove república dels Estats Units és l'aliat perfecte que França busca a l'hemisferi occidental. Millorem-hi les relacions."
 annex_lorraine_title:0 "Annexionar Lorena "
 annex_lorraine_desc:0 "El ducat de Lorena és massa important estratègicament per deixar als ducs cap marge en la seva política. França ha de tenir el control total del ducat."
 defend_the_netherlands_title:0 "La frontera natural "
 defend_the_netherlands_desc:0 "El control espanyol dels Països Baixos continua sent una amenaça estratègica per a França. Hem de portar la nostra frontera fins a la seva posició natural, al Rin, per garantir que França estigui ben defensada."
 anglo_portuguese_relations_title:0 "Relacions anglo-portugueses "
 anglo_portuguese_relations_desc:0 "Les bones relacions amb Anglaterra han estat al cor de la política portuguesa des del 1373. Seria assenyat enfortir aquests lligams."
 castilian_portuguese_relations_title:0 "Relacions amb Castella "
 castilian_portuguese_relations_desc:0 "La relació amb el nostre veí, Castella, sempre ha estat important per a nosaltres. Creiem que ara és el moment de fer nous esforços per enfortir els lligams entre nosaltres i Castella."
 spanish_portuguese_relations_title:0 "La qüestió espanyola "
 spanish_portuguese_relations_desc:0 "La formació d'Espanya ha canviat radicalment l'equilibri de poder a la península Ibèrica. Perquè Portugal prosperi, ens hem d'assegurar que estem en bons termes amb el nostre gran veí. "
 portugal_discovers_the_azores_title:0 "Descobrir les Açores! "
 portugal_discovers_the_azores_desc:0 "Hem sentit rumors d'unes illes a l'Atlàntic occidental que podrien servir de base per a futures exploracions. Enviem-hi vaixells per investigar-ho."
 portugal_discovers_madeira_title:0 "Descobrir Madeira"
 portugal_discovers_madeira_desc:0 "Un mariner nàufrag ha portat notícies d'un arxipèlag als mars del sud de Portugal. Enviem vaixells al sud per investigar-ho."
 portugal_discovers_the_west_african_coast_title:0 "Hem d'anar més al sud "
 portugal_discovers_the_west_african_coast_desc:0 "Els nostres exploradors creuen que l'Àfrica s'estén només una mica més al sud, i que aviat podrem vorejar-la i trobar el regne del Preste Joan. Quan haguem assegurat una aliança amb aquest regne, podrem escombrar els moros de Terra Santa."
 portuguese_colony_in_west_africa_title:0 "Necessitem bases "
 portuguese_colony_in_west_africa_desc:0 "Sembla que l'Àfrica s'estén més al sud del que crèiem al principi. Si volem vorejar l'Àfrica, hem de tenir bases on els nostres vaixells es puguin reabastir."
 conquer_tangiers_title:0 "Conquerir Tànger"
 conquer_tangiers_desc:0 "El nostre deure envers la cristiandat és clar: hem de conquerir Tànger per defensar la cristiandat de l'infidel."
 conquer_ceuta_title:0 "Conquerir Ceuta"
 conquer_ceuta_desc:0 "El nostre deure envers la cristiandat és clar: hem de conquerir Ceuta per defensar la cristiandat de l'infidel."
 portugal_discovers_south_america_title:0 "Anar cap a l'oest"
 portugal_discovers_south_america_desc:0 "Els vents i els corrents afavoreixen l'expansió cap a l'oest. Els nostres exploradors creuen que just darrere l'horitzó hi ha terres riques."
 portuguese_brazil_title:0 "Brasil portuguès "
 portuguese_brazil_desc:0 "Hem descobert les riques terres del Brasil. La terra ja s'ha dividit en Capitanias Hereditárias, i els capitans demanen el suport de la corona per començar la seva tasca."
 brazil_belongs_to_portugal_title:0 "El Brasil és portuguès"
 brazil_belongs_to_portugal_desc:0 "Els castellans han pres terres que el mateix Sant Pare va concedir a Portugal. Hem de prendre el que és nostre per dret."
 brazil_to_portugal_title:0 "El Brasil és portuguès"
 brazil_to_portugal_desc:0 "Els espanyols han pres terres que el mateix Sant Pare va concedir a Portugal. Hem de prendre el que és nostre per dret."
 portugal_discovers_india_title:0 "Avançar fins a l'Índia "
 portugal_discovers_india_desc:0 "Tot i que no trobem cap rastre del regne del Preste Joan, podem assestar un cop als moros arrabassant-los el comerç d'espècies. Hem de trobar les Índies per fer la nostra part en la defensa de la cristiandat."
 portuguese_control_of_indian_province_title:0 "Establir una base a l'Índia"
 portuguese_control_of_indian_province_desc:0 "Per aprofitar al màxim les oportunitats comercials de l'Índia acabada de descobrir, seria assenyat apoderar-nos com a mínim d'un port i el seu rerepaís perquè ens serveixin de base."
 portugal_discovers_indonesia_title:0 "Descobrir les illes de les Espècies "
 portugal_discovers_indonesia_desc:0 "Hem sentit històries que diuen que les illes de les Espècies són en algun lloc cap a l'est. Ja hi ha homes intrèpids disposats a navegar-hi; només necessiten una mica de suport de la corona."
 portuguese_colony_in_indonesia_title:0 "Establir una presència a les illes de les Espècies "
 portuguese_colony_in_indonesia_desc:0 "Les illes de les Espècies són més grans i pròsperes del que mai havíem imaginat. Perquè Portugal compleixi el seu destí, hi ha d'establir bases."
 establish_trade_in_indonesian_cot_por_title:0 "Fer-se un lloc en el comerç d'espècies."
 establish_trade_in_indonesian_cot_por_desc:0 "La Casa da Índia ha demanat l'ajuda del govern per establir una presència portuguesa en el comerç d'espècies. Aquest comerç lucratiu ajuda els governants musulmans a pagar els exèrcits que amenacen la cristiandat. És el nostre deure cristià desviar una part d'aquest comerç cap a Portugal."
 portugal_discovers_the_far_east_title:0 "Endavant cap al Catai"
 portugal_discovers_the_far_east_desc:0 "Des del retorn de Marco Polo hem sentit parlar de la riquesa meravellosa del Catai. Hem d'esbrinar exactament on és."
 fund_the_taj_mahal_title:0 "Finançar el Taj Mahal"
 fund_the_taj_mahal_desc:0 "El nostre gran emperador vol una tomba èpica per a la seva estimada esposa. Hem d'omplir el tresor i tenir a mà un gran artista per fer realitat els seus desitjos."
 vassalize_golcanda_title:0 "Vassallitzar Golconda"
 vassalize_golcanda_desc:0 "Golconda és l'única font de diamants del món. La majestat de l'emperador conqueridor exigeix que el padshah ghazi en rebi la part que li correspon."
 vassalize_gondwana_title:0 "Vassallitzar Gondwana"
 vassalize_gondwana_desc:0 "L'altiplà de Gondwana no és gaire atractiu per conquerir-lo. Tot i així, els seus governants haurien de reconèixer el domini del gran emperador mogol."
 defend_the_mughal_borders_title:0 "Defensar la frontera"
 defend_the_mughal_borders_desc:0 "No podem permetre que els perses s'estableixin a l'Afganistan. Hem de defensar aquestes províncies a qualsevol preu."
 mughal_break_the_persian_border_title:0 "Trencar l'Imperi persa"
 mughal_break_the_persian_border_desc:0 "Per assegurar d'una vegada per totes la nostra frontera occidental, hem de seguir les passes del llegendari Tamerlà. Hem d'escombrar tot el que trobem i reconquerir aquestes terres."
 conquer_khandesh_title:0 "Conquerir Khandesh"
 conquer_khandesh_desc:0 "No podem permetre que l'estat de Khandesh continuï sent independent. L'hem de conquerir amb urgència."
 annex_berar_title:0 "Annexionar Berar"
 annex_berar_desc:0 "Berar controla algunes de les rutes comercials terrestres més importants. Hauríem de posar aquesta zona sota el nostre control."
 vassalize_orissa_title:0 "Vassallitzar Orissa"
 vassalize_orissa_desc:0 "Els nostres veïns d'Orissa són massa independents per al nostre gust. Ens hem d'assegurar que lliguin més la seva política a la nostra."
 defeat_england_title:0 "Derrotar Anglaterra"
 defeat_england_desc:0 "Els anglesos han vingut a substituir l'emperador. La seva influència ja es nota arreu de l'Índia. Els hem d'expulsar d'una vegada per totes."
 defend_timurid_lands_title:0 "Defensar les terres timúrides"
 defend_timurid_lands_desc:0 "L'arribista dinastia xaibànida afirma ser la veritable descendent de Genguis Khan. Hem de demostrar al món que no és cert: no hem de cedir ni un pam de terra."
 defend_timurid_lands_against_persia_title:0 "Aturar l'avenç safàvida"
 defend_timurid_lands_against_persia_desc:0 "Els heretges safàvides xiïtes volen ampliar encara més el seu control a costa de l'Imperi Timúrida. Hem de demostrar que som hereus dignes de Tamerlà i aturar-los."
 timurid_break_the_persian_border_title:0 "Les passes de Tamerlà"
 timurid_break_the_persian_border_desc:0 "La conquesta de les terres perses per Tamerlà va ajudar a establir la nostra dinastia. Ara hem de tornar a avançar per garantir que la nostra dinastia continuï segura."
 conquer_sivas_title:0 "Conquerir Sivas"
 conquer_sivas_desc:0 "Els arribistes soldans de Rum es neguen a reconèixer la nostra superioritat. Hem de conduir la gran horda cap a l'oest, a l'Àsia Menor, i mostrar-los qui mana."
 annex_the_jalayrids_title:0 "Conquerir els jalayírides"
 annex_the_jalayrids_desc:0 "El soldà jalayírida torna a negar-se a reconèixer la superioritat del regne timúrida. Els hem de tornar a conquerir i assegurar-nos que no es tornin a aixecar mai més."
 vassalize_the_akkoyunlu_title:0 "Vassallitzar els Ak Koyunlu"
 vassalize_the_akkoyunlu_desc:0 "El gran kan Tamerlà va concedir generosament terres als turcs del Xai Blanc com a recompensa pel seu servei fidel. Però han demostrat ser deslleials i han de ser castigats."
 vassalize_the_qara_qoyunlu_title:0 "Vassallitzar els Qara Koyunlu"
 vassalize_the_qara_qoyunlu_desc:0 "Els turcs del Xai Negre van ser conquerits per Tamerlà, i el seu kan va fugir a la cort dels soldans mamelucs d'Egipte. Ara ha tornat i ha intentat crear-se un kanat independent. Cal castigar aquest arribista."
 vassalize_georgia_title:0 "Vassallitzar Geòrgia"
 vassalize_georgia_desc:0 "A dir veritat, les tropes ja s'avorreixen d'haver de saquejar i espoliar una vegada i una altra els infidels de Geòrgia: ja no hi queda res per saquejar. Obliguem el rei georgià a inclinar-se davant el gran soldà i busquem nous llocs per saquejar."
 subjugate_tver_title:0 "Conquesta de Tver"
 subjugate_tver_desc:0 "Ens ha arribat la notícia que els prínceps de Tver han estat conspirant contra la santa mare Rússia i l'ortodòxia. Sembla que estan disposats a vendre Rússia als catòlics o als musulmans, i no sabem què és pitjor. Conquerim les seves terres i assegurem-nos que quedin d'una vegada per totes sota el control d'un estat rus responsable."
 annex_yaroslavl_title:0 "Annexionar Iaroslavl"
 annex_yaroslavl_desc:0 "Perquè la mare Rússia no torni a caure mai sota el jou tàtar, hem d'unir els principats russos. Iaroslavl és massa fràgil per sostenir-se sol: Moscòvia l'ha de defensar."
 annex_ryazan_title:0 "Annexionar Riazan"
 annex_ryazan_desc:0 "Sembla que el gran príncep de Riazan té una relació molt estreta amb alguns dels kans del sud. No podem permetre que això continuï."
 russia_discovers_eastern_siberia_title:0 "Descobrir la Sibèria Oriental"
 russia_discovers_eastern_siberia_desc:0 "Els nostres exploradors han descobert terres riques en pells i fins i tot una mica d'or a les immenses terres ermes de Sibèria. Corren rumors de terres encara més riques més a l'est, i els nostres exploradors cosacs demanen ajuda perquè tot plegat pertanyi a la mare Rússia."
 access_to_the_baltic_sea_title:0 "Finestra a Occident"
 access_to_the_baltic_sea_desc:0 "Temem que Rússia s'està quedant enrere respecte als altres estats d'Europa, i no podem continuar endarrerits. Rússia ha d'adquirir una costa al Bàltic que ens serveixi de finestra a Occident."
 russian_colony_in_east_siberia_title:0 "Colonitzar la Sibèria Oriental"
 russian_colony_in_east_siberia_desc:0 "Els nostres exploradors han obert les immenses terres verges de la Sibèria Oriental. Hi hem d'establir forts per assegurar-ne el control."
 russia_discovers_western_siberia_title:0 "Rússia reclama la Sibèria Occidental "
 russia_discovers_western_siberia_desc:0 "A l'oest hi ha les terres de Sibèria, i els nostres aventurers cosacs es moren de ganes de reclamar-les. Financem-los i recordem al món que tot pertany a la mare Rússia."
 russian_colony_in_west_siberia_title:0 "Establir forts a la Sibèria Occidental"
 russian_colony_in_west_siberia_desc:0 "Hem començat a expulsar els tàtars de Sibèria. Per reforçar el nostre domini en aquestes regions, hi hem d'establir forts perquè passin a control rus."
 annex_the_qasim_khanate_title:0 "Annexionar el Kanat de Qasim"
 annex_the_qasim_khanate_desc:0 "Fins ara ens ha convingut permetre que el Kanat de Qasim continuï existint. Però ara aquestes terres han de tornar a la mare Rússia."
 defend_russia_against_the_mongols_title:0 "Defensar els russos dels tàtars."
 defend_russia_against_the_mongols_desc:0 "El flagell tàtar amenaça la santa mare Rússia. Hem d'assegurar-nos que cap rus autèntic no visqui sota el jou tàtar."
 cross_the_mongol_border_title:0 "Reclamar les estepes"
 cross_the_mongol_border_desc:0 "Hem de portar la lluita als tàtars de l'Horda d'Or. Hem de plantar l'estendard de Rússia al cor de les seves estepes, perquè tot pertany a la mare Rússia."
 annex_novgorod_title:0 "Annexionar Nóvgorod"
 annex_novgorod_desc:0 "Els boiars de Nóvgorod han acceptat el lideratge del gran príncep de Moscòvia, però encara conserven certes idees d'independència. Els hem de posar fermament sota el control de Moscòvia."
 russia_partitions_poland_title:0 "Conquerir la Polònia oriental"
 russia_partitions_poland_desc:0 "Els exèrcits polonesos controlen bona part de les terres russes. L'estat polonès és feble i incapaç de governar els orgullosos pobles rutè i bielorús, i altres països també se n'han adonat. Ja és hora d'actuar abans que els nostres rivals es reparteixin Polònia."
 russia_partitions_lithuania_title:0 "Derrotar Lituània"
 russia_partitions_lithuania_desc:0 "Els exèrcits lituans controlen bona part de les terres russes. L'estat lituà és feble i incapaç de governar els orgullosos pobles rutè i bielorús, i altres països també se n'han adonat. Ja és hora d'actuar."
 CANCEL_MISSION:0 "Cancel·lar la missió"
 CANNOT_CANCEL_MISSION_IRO:0 "No podem cancel·lar aquesta missió fins al dia §Y$DATE$§W."
 CANCEL_MISSION_IRO:0 "Podem cancel·lar aquesta missió, però ens costarà §R$PRESTIGE$§W de prestigi i no en podrem cancel·lar cap altra durant els cinc anys següents."
 conquer_finland_title:0 "Conquerir Finlàndia"
 conquer_finland_desc:0 "Suècia continua sent un perill per a les terres de la santa mare Rússia. Per protegir Rússia d'una vegada per totes, hem de conquerir Finlàndia perquè faci d'estat tampó."
 subjugate_crimea_title:0 "Sotmetre Crimea"
 subjugate_crimea_desc:0 "Fa massa temps que deixem que els tàtars de Crimea campin per les estepes: és hora que la Tercera Roma els ensenyi qui mana."
 subjugate_kazan_title:0 "Sotmetre Kazan"
 subjugate_kazan_desc:0 "La ciutat de Kazan és situada a les rutes comercials clau del riu Volga. Perquè Rússia prosperi, ha de pertànyer a la mare Rússia."
 subjugate_the_siberian_khanate_title:0 "Sotmetre el Kanat de Sibèria"
 subjugate_the_siberian_khanate_desc:0 "Els nostres aventurers cosacs informen que el Kanat de Sibèria és feble i està dividit. Si el gran tsar dona l'ordre d'atacar, s'asseguraran que totes les seves terres pertanyin a la mare Rússia."
 subjugate_astrakhan_title:0 "Sotmetre Astracan"
 subjugate_astrakhan_desc:0 "La ciutat d'Astracan és a la vora de la mar Càspia. Controlar aquesta ciutat vol dir que la mare Rússia controlarà el comerç de la zona."
 control_medina_title:0 "Protegir Medina"
 control_medina_desc:0 "Medina és la segona ciutat més santa de l'islam i el lloc on es troba la tomba del mateix Profeta, i cal protegir-la. Només el gran soldà otomà és capaç de fer-ho."
 control_mecca_title:0 "Defensar el pelegrinatge"
 control_mecca_desc:0 "El sant pelegrinatge a la Meca és un dels deures sagrats que pot complir un musulmà. Les caravanes de pelegrins pateixen l'amenaça constant dels nòmades locals, i hem de prendre el control de la zona per garantir-ne la protecció."
 vassalize_candar_title:0 "Vassallitzar Candar"
 vassalize_candar_desc:0 "El Llamp va ser el primer soldà que va intentar posar els beis d'Anatòlia sota control otomà. Per la guerra o per l'astúcia, el bei de Candar ha de reconèixer la nostra superioritat."
 annex_candar_title:0 "Annexionar Candar"
 annex_candar_desc:0 "Tot i que el bei de Candar ha decidit assenyadament reconèixer la superioritat del soldà, encara hi ha qui adverteix que podria resultar deslleial. Posem les seves terres sota el nostre control."
 vassalize_karaman_title:0 "Vassallitzar Karaman"
 vassalize_karaman_desc:0 "El bei de Karaman té la gosadia d'afirmar que és com a mínim igual al soldà otomà, pel matrimoni de la seva família amb la filla de Murat I. Hem de mostrar a aquest arribista qui és més important."
 annex_karaman_title:0 "Annexionar Karaman"
 annex_karaman_desc:0 "Ara que hem sotmès el beilicat de Karaman i li hem fet reconèixer el soldà com a sobirà, és el moment d'acabar amb les seves pretensions d'una vegada per totes. Hem d'absorbir el beilicat dins de l'Imperi pròpiament dit."
 vassalize_dulkadir_title:0 "Vassallitzar Dulkadir"
 vassalize_dulkadir_desc:0 "Dulkadir es troba a la frontera entre l'Àsia Menor i Síria. La seva situació estratègica fa que el soldà otomà no pugui ignorar aquest estat, altrament menor. L'hem de fer entrar en la nostra òrbita."
 retake_smyrna_title:0 "Conquerir Esmirna"
 retake_smyrna_desc:0 "El beilicat d'Aydin ha decidit temeràriament alliberar-se del control del soldà. Els hem de mostrar la nostra força i conquerir-los."
 muslim_asia_minor_title:0 "Convertir l'infidel"
 muslim_asia_minor_desc:0 "Les terres d'Anatòlia són al cor mateix de l'Imperi, d'on el soldà treu la major part dels seus recursos. Després de l'aclaparadora derrota que Tamerlà va infligir a les nostres forces fa unes quantes dècades, molts dels beilicats locals han recuperat la força i la independència. Hem de consolidar el nostre domini sobre l'Àsia Menor i recuperar el que vam perdre."
 vassalize_the_mameluks_title:0 "Fer caure els mamelucs"
 vassalize_the_mameluks_desc:0 "Egipte havia estat la llar dels fatimites xiïtes, i creiem que encara avui l'heretgia xiïta té suport oficial a Egipte. Hem de fer que el soldà mameluc s'agenolli davant nostre perquè puguem assegurar-nos que segueix el camí vertader."
 annex_egypt_title:0 "Annexionar Egipte"
 annex_egypt_desc:0 "El soldà mameluc continua sent un adversari perillós i podria estar contaminat per l'heretgia xiïta. Hem de fer servir tots els mitjans necessaris per acabar amb la seva independència."
 take_kaffa_title:0 "Conquerir Caffa"
 take_kaffa_desc:0 "Fa molt de temps que els pirates cristians fan servir la fortalesa de Caffa per saquejar la mar Negra. Per evitar-ho, hem de controlar aquesta ciutat."
 control_halland_title:0 "Controlar Halland"
 control_halland_desc:0 "El control danès de Halland és un problema greu per al Regne de Suècia. La seva situació és una amenaça per als vaixells suecs que intenten sortir del Bàltic i pot servir de base perquè els exèrcits danesos devastin el sud de Suècia. Aquesta situació no es pot tolerar."
 control_estonia_title:0 "Controlar Estònia"
 control_estonia_desc:0 "La nostra llarga costa fa que la seguretat del nostre regne depengui molt del control de la mar Bàltica. Els ports estonians han de passar a control suec."
 control_latvia_title:0 "Conquerir Livònia"
 control_latvia_desc:0 "Livònia i la seva ciutat portuària clau, Riga, són vitals per controlar el comerç del Bàltic. Necessitem aquestes terres per a la nostra seguretat."
 control_gotland_title:0 "Conquerir Gotland"
 control_gotland_desc:0 "Gotland ocupa una situació estratègica clau al centre de la mar Bàltica. Perquè Suècia continuï sent una gran potència, ha de passar a control suec."
 annex_norway_swe_title:0 "Defensar Noruega"
 annex_norway_swe_desc:0 "Per sort, vam poder posar Noruega sota la nostra protecció, però els senyors locals no coordinen bé la seva defensa amb Suècia. Cal actuar."
 no_territory_to_denmark_title:0 "Cap terra per a Dinamarca"
 no_territory_to_denmark_desc:0 "El covard rei danès s'ha apoderat de terres que per dret són nostres. No hem de descansar fins que Suècia torni a estar sencera."
 reconquer_finland_title:0 "Recuperar Finlàndia"
 reconquer_finland_desc:0 "Tot i que Ivan va poder conquerir Finlàndia amb tàctiques covardes, tornarem a derrotar l'os temut. Ara tenim l'oportunitat d'alliberar tota Finlàndia i retornar-la a un govern civilitzat."
 swedish_colony_in_north_america_title:0 "Suècia al Nou Món"
 swedish_colony_in_north_america_desc:0 "S'han escampat notícies de descobriments a l'Amèrica del Nord. Suècia no es pot perdre els avantatges que aporten les colònies."
 fortify_the_eastern_border_title:0 "Fortificar la frontera oriental"
 fortify_the_eastern_border_desc:0 "Ara que l'avenç de Rússia ha arribat a les fronteres de Finlàndia, hem d'invertir a millorar-hi les fortificacions."
 colonize_lapland_title:0 "Portar la civilització als lapons"
 colonize_lapland_desc:0 "Els lapons del nord de Suècia són tristament endarrerits, ja que no són ni suecs ni cristians. És el nostre deure fer-los totes dues coses."
 control_jylland_title:0 "Portar la guerra a la riba sud."
 control_jylland_desc:0 "Estem en guerra amb Dinamarca, i per guanyar-la hem de portar la lluita al seu territori. Fem marxar els nostres exèrcits a l'altra banda del Bàltic i prenguem el control de Jutlàndia."
 colonize_iceland_title:0 "Colonitzar Islàndia"
 colonize_iceland_desc:0 "Les grans colònies víkings d'Islàndia han viscut temps difícils i ara són deshabitades. Recuperarem l'esperit pioner dels nostres avantpassats i les tornarem a establir."
 retake_scania_title:0 "Recuperar Escània"
 retake_scania_desc:0 "Escània sempre ha format part del Regne de Dinamarca, però el pretensiós rei de Suècia l'ha reclamada per a si. Hem d'alliberar els danesos autèntics del jou suec."
 retake_halland_title:0 "Recuperar Halland"
 retake_halland_desc:0 "La conquesta sueca de Halland ha deixat els suecs massa a prop de Copenhaguen. Els hem de fer fora i recuperar el que és nostre per dret."
 denmark_slesvig_holstein_relations_title:0 "Millorar les relacions amb Holstein"
 denmark_slesvig_holstein_relations_desc:0 "La política danesa sempre s'ha preocupat pel destí del ducat imperial de Holstein. Hem de millorar les nostres relacions amb ells."
 denmark_oldenburg_relations_title:0 "Millorar les relacions amb Oldenburg"
 denmark_oldenburg_relations_desc:0 "La casa reial danesa té des de fa temps uns vincles estrets amb els governants d'Oldenburg. Fa massa temps que s'ajorna una millora de les relacions."
 vassalize_norway_title:0 "Protegir Noruega"
 vassalize_norway_desc:0 "Amb el final de la Unió de Kalmar, Noruega ha quedat feble i indefensa. Com a vertaders monarques de Noruega, és el nostre deure posar-la sota protecció danesa."
 annex_norway_title:0 "L'herència de Kalmar"
 annex_norway_desc:0 "La Unió de Kalmar va fer del rei danès l'únic rei legítim de Noruega. Tot i que la unió s'ha trencat, hem esperat l'oportunitat de restituir el rei danès al lloc que li correspon per dret. L'oportunitat ha arribat."
 defend_denmark_title:0 "Defensar Dinamarca"
 defend_denmark_desc:0 "Des del final de la Unió de Kalmar, la província rebel de Suècia continua negant al rei danès el lloc que li correspon per dret. Amb guerres injustificades contra el seu sobirà legítim, han capturat territori danès. La corona danesa no pot cedir-los cap part de Dinamarca."
 danish_controlled_cot_title:0 "Comerç danès"
 convert_ezochi_to_shintoism_title:0 "Mostrar-los el camí del xintoisme"
 convert_ezochi_to_shintoism_desc:0 "Ens dol que els pobles de Kamikawa persisteixin en les seves tradicions infidels; els nostres sacerdots demanen humilment suport per mostrar-los el camí. Això donarà simetria i perfecció a la terra del sol naixent, com la perfecció d'una flor de cirerer quan cau."
 conquer_southern_korea_title:0 "Conquerir Corea"
 conquer_southern_korea_desc:0 "Els pretensiosos governants de Corea afirmen que, pel seu mandat del Cel, són de fet superiors a l'emperador japonès. Hem d'emprendre una invasió i prendre'n la part sud, per poder castigar aquesta arrogància en el futur."
 monopolize_japanese_cot_desc:0 "Fa massa temps que els gaijin tenen massa control sobre el nostre comerç. El Fill del Cel creu que faríem bé de prendre el control del nostre propi comerç."
 annex_the_mongol_khanate_title:0 "Destruir els falsos emperadors"
 annex_the_mongol_khanate_desc:0 "La bàrbara horda mongol afirma ser la vertadera dinastia Yuan, emperadors de la Xina, però l'Imperi del Mig només pot tenir un emperador. Hem de destruir aquests usurpadors d'una vegada per totes."
 ming_oirat_relations_title:0 "Relacions amb els oirats"
 ming_oirat_relations_desc:0 "L'horda oirat continua saquejant les nostres fronteres occidentals i de vegades fins i tot malmet la mateixa Gran Muralla. Hauríem de millorar les relacions amb ells per animar-los a fer les seves incursions en altres llocs."
 vassalize_tibet_title:0 "Recuperar el Tibet"
 vassalize_tibet_desc:0 "Els emperadors Yuan van fer que els governants del Tibet s'inclinessin davant l'Imperi del Mig, i és hora que ho tornin a fer."
 annex_tibet_title:0 "Incorporar el Tibet"
 annex_tibet_desc:0 "L'administració tibetana no segueix els principis confucians adequats i, per tant, és innecessàriament caòtica. Hem de portar l'ordre a aquestes terres incorporant-les a la Xina."
 colonize_taiwan_title:0 "Colonitzar Taiwan"
 colonize_taiwan_desc:0 "L'illa de Taiwan és escassament poblada per salvatges incivilitzats; hauríem d'obrir aquestes terres a l'assentament xinès."
 colonize_deren_title:0 "Avançar fins al riu Negre"
 colonize_deren_desc:0 "El sagrat riu Negre, que segons diuen alguns pobles incivilitzats anomenen riu Amur, és una frontera adequada per a nosaltres. Hauríem de fundar assentaments per fer avançar la nostra frontera."
 china_discovers_india_title:0 "Descobrir l'Índia"
 china_discovers_india_desc:0 "Tot i que la majoria sembla satisfeta amb l'explicació que les nostres sedes se'n van a terres bàrbares, alguns dels nostres eunucs més curiosos en volen saber més. Demanen suport per enviar una expedició a aquest lloc anomenat Índia."
 conquer_danzig_title:0 "Recuperar Danzig"
 conquer_danzig_desc:0 "Al Tractat de Kalisz vam acordar que l'àrea al voltant de Danzig la tindria l'Orde Teutònic sota la corona polonesa. Darrerament han estat negligents en els seus deures, així que hem de recuperar el que és nostre per dret."
 poland_mazovia_relations_title:0 "Relacions amb Masòvia"
 poland_mazovia_relations_desc:0 "La decisió del rei Boleslau III de dividir Polònia entre els seus fills va iniciar un llarg període de fragmentació del Regne de Polònia. Tot i que Polònia ara està en bona part reunificada, el ducat de Masòvia continua sent independent; hauríem de millorar les relacions amb ells."
 vassalize_mazovia_title:0 "Vassallitzar Masòvia"
 vassalize_mazovia_desc:0 "El ducat de Masòvia ha de tornar al si de Polònia. És essencial que el duc torni a reconèixer la sobirania de la corona polonesa."
 annex_mazovia_title:0 "Reincorporar Masòvia"
 annex_mazovia_desc:0 "Hem de retornar Polònia a la seva antiga glòria. El ducat de Masòvia ha de tornar a formar part de ple dret de Polònia."
 conquer_smolensk_title:0 "Conquerir Smolensk"
 conquer_smolensk_desc:0 "La gran fortalesa de Smolensk és la porta de Lituània. Per protegir la Confederació hem de tenir aquesta fortalesa."
 retake_podolia_title:0 "Fer retrocedir el turc"
 retake_podolia_desc:0 "El turc ha avançat cap a les parts meridionals de la Confederació. No ho podem permetre i l'hem de fer retrocedir."
 poland_lithuania_relations_title:0 "Relacions polonolituanes"
 poland_lithuania_relations_desc:0 "Des de la mort de l'últim Piast reial, Casimir el Gran, la política de Polònia ha estat buscar vincles dinàstics sòlids amb Lituània. Darrerament s'han deixat afeblir; els hem de renovar."
 annex_lithuania_title:0 "Fundar la Confederació"
 annex_lithuania_desc:0 "Polònia i Lituània mantenen vincles estrets des de fa molts anys. Ara la noblesa reclama la Unió de Lublin per reunir les dues nacions en una sola Confederació."
 retake_minsk_title:0 "Recuperar Minsk"
 retake_minsk_desc:0 "Els russos han pres Minsk, i no podem permetre que aquesta fortalesa resti en les seves mans. Cal reconquerir-la."
 fortify_the_southern_border_title:0 "Fortificar la frontera sud"
 fortify_the_southern_border_desc:0 "Els Habsburg són amenaçadorament a prop de la nostra frontera sud. Hi hem de millorar les fortificacions per protegir Polònia."
 defend_polands_western_border_title:0 "Defensar la frontera occidental"
 defend_polands_western_border_desc:0 "Ni un pam de sòl polonès no ha de pertànyer als vils prussians!"
 defend_polands_northern_border_title:0 "Defensar la frontera septentrional"
 defend_polands_northern_border_desc:0 "Ni un pam de sòl polonès no ha de pertànyer als vils russos."
 vassalize_navarra_title:0 "Vassallitzar Navarra"
 vassalize_navarra_desc:0 "Tant el Regne de Castella com el de França miren amb enveja les terres de Navarra. Seria desastrós per a l'Aragó que aquestes terres caiguessin en mans de qualsevol dels dos, així que hem d'avançar-nos."
 conquer_sardinia_title:0 "El nostre dret a Sardenya"
 conquer_sardinia_desc:0 "El Sant Pare va concedir el Regne de Sardenya a Jaume el Just el 1297. No hem oblidat mai aquest generós regal i és hora de reclamar el que és nostre."
 diplo_annex_sicily_title:0 "Annexionar Sicília"
 diplo_annex_sicily_desc:0 "Des que Pere el Gran va expulsar el duc d'Anjou de Sicília, per a nosaltres el regne és una part legítima de l'Aragó. És hora de reafirmar aquests drets."
 diplo_annex_naples_title:0 "Annexionar Nàpols"
 diplo_annex_naples_desc:0 "Tot i que el rei de Nàpols ha acceptat assenyadament la nostra sobirania, la seva independència continuada ja no és desitjable."
 conquer_naples_title:0 "Conquerir Nàpols"
 conquer_naples_desc:0 "Imprudentment, el rei de Nàpols continua insistint que és el vertader rei de Sicília. Això és inacceptable per a nosaltres, així que cal conquerir Nàpols."
 defend_kaffa_title:0 "Defensar Caffa"
 defend_kaffa_desc:0 "Estem en guerra amb els turcs otomans i ens hem d'assegurar de no perdre les nostres bases a la mar Negra. Cal defensar Caffa."
 retake_kaffa_title:0 "Recuperar les possessions de Crimea"
 retake_kaffa_desc:0 "La pèrdua de Caffa no és més que un revés temporal. Continuem considerant nostra aquesta província i, per tant, l'hem de reconquerir."
 conquer_hainaut_title:0 "Conquerir Hainaut"
 conquer_hainaut_desc:0 "Des del matrimoni entre la filla de Felip l'Ardit, Margarida de Borgonya, i Guillem d'Hainaut, tenim un gran interès en aquelles terres. Ara és el moment adequat per prendre-les."
 conquer_brabant_title:0 "Conquerir Brabant"
 conquer_brabant_desc:0 "El duc de Brabant disputa a Borgonya el domini dels Països Baixos. La seva pretensió de ser el successor del duc de la Baixa Lorena és força arrogant i li hem de donar una lliçó."
 conquer_luxemburg_title:0 "Conquerir Luxemburg"
 conquer_luxemburg_desc:0 "El ducat de Luxemburg serà una bona addició a les terres borgonyones, ja que reduirà la distància entre les nostres províncies de Borgonya i les nostres possessions als Països Baixos."
 conquer_liege_title:0 "Conquerir Lieja"
 conquer_liege_desc:0 "El bisbat de Lieja l'hauria de controlar realment el duc més poderós de la zona, és a dir, nosaltres. Un cop en siguem els senyors, estem segurs que els nuclis de la regió es decantaran cap a nosaltres."
 vassalize_lorraine_title:0 "Vassallitzar Lorena"
 vassalize_lorraine_desc:0 "El ducat de Lorena és just entre les dues meitats del regne borgonyó. Ens hem d'assegurar de tenir lliure accés a aquestes terres i que no caiguin en mans de ningú més (com el rei de França)."
 reach_the_mississippi_title:0 "El vell riu"
 reach_the_mississippi_desc:0 "El riu Mississipí és l'artèria per on flueix tot el comerç de l'interior d'Amèrica del Nord. Si volem mantenir la nostra independència, hem de tenir accés a aquest riu."
 the_united_states_france_relations_title:0 "Relacions amb França"
 the_united_states_france_relations_desc:0 "Els Estats Units necessiten amics per créixer i prosperar, i creiem que la millor opció és una relació sòlida amb França. Millorem les relacions amb ells."
 the_united_states_rev_france_relations_title:0 "Germans d'armes"
 the_united_states_rev_france_relations_desc:0 "França per fi ha enderrocat la seva monarquia corrupta i ha instituït una república de principis encertats. Amb la nostra visió comuna del món, hauríem de ser amics."
 tobacco_factory_title:0 "Fàbrica de tabac"
 tobacco_factory_desc:0 "Perquè la nostra jove república prosperi, hem d'expandir el comerç, perquè és la sang vital de tota nació."
 connect_brandenburg_and_prussia_title:0 "Connectar Brandenburg i Prússia"
 connect_brandenburg_and_prussia_desc:0 "Per protegir millor el nostre vassall de Prússia, hem d'estar en una posició més favorable per fer-ho. Hem de tenir un corredor de terra que ens hi connecti."
 connect_the_prussian_lands_title:0 "Expansió prussiana"
 connect_the_prussian_lands_desc:0 "Un cop units Brandenburg i Prússia, ara tenim el problema de com defensar les dues meitats del nostre regne. Perquè el regne sigui una unitat més defensable, hem de conquerir tota Prússia i no només les parts que ara controlem."
 conquer_swedish_pomerania_title:0 "Conquerir la Pomerània sueca"
 conquer_swedish_pomerania_desc:0 "Per dret, Pomerània havia de passar a formar part de Brandenburg, però els suecs van insistir a quedar-se'n una part. Hem de fer valer els nostres drets i expulsar Suècia de les terres que són legítimament nostres."
 conquer_hinterpommern_title:0 "La successió de Pomerània"
 conquer_hinterpommern_desc:0 "Tenim drets de successió al ducat de Pomerània. Tot i que no és assenyat intentar obtenir tota Pomerània ara mateix, hauríem d'assegurar-nos que ningú no oblidi el nostre dret prenent-ne una part."
 brandenburg_prussia_relations_title:0 "Relacions amb Prússia"
 brandenburg_prussia_relations_desc:0 "La defensa de la nostra frontera oriental es pot reforçar amb els aliats adequats. Per la seva situació i els nostres vincles culturals, reforçar les relacions amb l'estat de Prússia és un pas lògic."
 prussia_brandenburg_relations_title:0 "Relacions amb Brandenburg"
 prussia_brandenburg_relations_desc:0 "La nostra proximitat a estats poderosos fa que necessitem amics. Brandenburg, per la seva situació i els nostres estrets vincles culturals, és el candidat perfecte."
 vassalize_prussia_title:0 "Vassallitzar Prússia"
 vassalize_prussia_desc:0 "Prússia sembla feble i vulnerable, però els nostres vincles històrics fan que hi haguem de fer alguna cosa. Esdevinguem sobirans de Prússia per poder protegir-la."
 annex_prussia_title:0 "Annexionar Prússia"
 annex_prussia_desc:0 "Ara és el moment adequat per incorporar Prússia plenament als dominis de Brandenburg."
 brandenburg_breaks_free_from_poland_title:0 "Alliberar-se de Polònia"
 brandenburg_breaks_free_from_poland_desc:0 "No és digne de l'elector de Brandenburg acceptar la sobirania polonesa. Aquesta situació s'ha d'acabar."
 prussia_breaks_free_from_poland_title:0 "Alliberar-se de Polònia"
 prussia_breaks_free_from_poland_desc:0 "Perquè la Prússia ducal prosperi, ens hem d'alliberar de les cadenes que ens ha imposat el rei polonès."
 prussia_partitions_poland_title:0 "Conquesta de la Gran Polònia"
 prussia_partitions_poland_desc:0 "Polònia és feble i Rússia vol continuar dominant-la; perquè acceptem aquesta situació, ens han de compensar amb terres poloneses."
 conquer_ratibor_title:0 "Conquerir Ratibor"
 conquer_ratibor_desc:0 "Tenim reclamacions sobre Silèsia, que hem d'aconseguir que la família de nacions europees reconegui. Per aconseguir-ho, ens hem d'assegurar Ratibor."
 subjugate_westphalia_title:0 "Sotmetre Westfàlia"
 subjugate_westphalia_desc:0 "S'ha creat el Regne de Westfàlia, que inclou diverses petites àrees que es consideraven parts legítimes de Prússia. Amb aquestes terres com a pretext, podem adquirir tota Westfàlia."
 conquer_ferrara_title:0 "Recuperar Ferrara"
 conquer_ferrara_desc:0 "Pel seu suport lleial durant la nostra lluita amb els emperadors, vam concedir a la casa d'Este el ducat de Ferrara com a feu papal. Tanmateix, ara és hora de recuperar aquestes terres!"
 conquer_ancona_title:0 "Incorporació d'Ancona"
 conquer_ancona_desc:0 "Durant les guerres ruïnoses entre el papat i l'emperador, Ancona es va convertir en un baluard del partit imperial gibel·lí. Tot i que tècnicament és un feu papal, des d'aleshores ha estat pràcticament independent; ara, però, podem centrar la nostra atenció a recuperar-la per als Estats Pontificis."
 annex_avignon_title:0 "Acabar amb el Cisma d'Occident"
 annex_avignon_desc:0 "Durant el Gran Cisma, l'antipapa recolzat pel partit francès es va instal·lar a Avinyó. Si governem Avinyó, la nostra pretensió de ser l'únic líder vertader de l'única fe vertadera no es posarà en dubte."
 catholic_italy_title:0 "Combatre l'heretgia"
 catholic_italy_desc:0 "Una promesa de salconduit no obliga quan es fa a un heretge; l'emperador hauria d'haver intentat cremar Luter quan en va tenir l'oportunitat. Ara les seves doctrines herètiques s'han estès per Itàlia, i cal eradicar-les."
 academy_in_rome_title:0 "Príncep renaixentista"
 academy_in_rome_desc:0 "Per ser un vertader príncep del Renaixement, hem de convertir Roma en un refugi per als millors artistes. Per a això, hauríem de patrocinar una Acadèmia de Belles Arts."
 conquer_orkney_title:0 "Reclamar les Òrcades"
 conquer_orkney_desc:0 "Les Òrcades, per la seva situació, tenen una importància estratègica per a la corona escocesa. Ara tenim un motiu legítim per reclamar aquestes terres i les hem de prendre."
 scotland_france_relations_title:0 "La Vella Aliança"
 scotland_france_relations_desc:0 "Mentre existeixi Anglaterra, Escòcia estarà amenaçada; fa temps que mantenim una mena d'aliança amb França per protegir-nos-en. És hora de renovar la Vella Aliança."
 scottish_war_against_england_title:0 "Honorar la Vella Aliança"
 scottish_war_against_england_desc:0 "França torna a estar en guerra amb el nostre enemic ancestral, els anglesos. Hem de tornar a portar la lluita a Anglaterra."
 scottish_control_title:0 "Fer avançar la frontera"
 scottish_control_desc:0 "Per protegir Escòcia hem de fer avançar la frontera cap al sud i prendre Northumberland perquè faci de zona d'amortiment."
 scottish_defense_title:0 "Defensar la nació"
 scottish_defense_desc:0 "No podem cedir ni un pam de terres escoceses a l'enemic anglès. Hem de lluitar fins que Anglaterra se n'adoni."
 bavaria_austria_relations_title:0 "Amistat amb els Habsburg"
 bavaria_austria_relations_desc:0 "Les famílies Wittelsbach i Habsburg competeixen entre si per la influència al sud-oest d'Alemanya. Tanmateix, tindríem més llibertat d'acció si mantinguéssim bones relacions amb els Habsburg."
 hungary_austria_relations_title:0 "Relacions amb Àustria"
 hungary_austria_relations_desc:0 "Les relacions amb el nostre veí del nord de vegades han estat una mica difícils. Tanmateix, per tenir les mans lliures als Balcans, hauríem de millorar la nostra relació amb Àustria."
 hungary_transylvania_relations_title:0 "Relacions amb Transsilvània"
 hungary_transylvania_relations_desc:0 "Transsilvània se suposa que és vassalla d'Hongria. Tanmateix, amb la nostra relació actual és més probable que sigui la nostra enemiga; reparem les relacions amb ells."
 vassalize_transylvania_hun_title:0 "Fer tornar Transsilvània al si d'Hongria"
 vassalize_transylvania_hun_desc:0 "Transsilvània ha oblidat que se suposa que forma part d'Hongria. El senyor de Transsilvània ha d'agenollar-se davant la corona hongaresa."
 conquer_the_banat_title:0 "Conquerir el Banat"
 conquer_the_banat_desc:0 "El Banat és just a la ruta d'avançada més probable de qualsevol força turca que vulgui envair Hongria. Aquesta província ha de ser la nostra primera línia de defensa."
 retake_croatia_title:0 "Alliberar Croàcia"
 retake_croatia_desc:0 "Els turcs han arribat fins a la província històrica de Croàcia. Els hem de fer retrocedir."
 lithuania_poland_relations_title:0 "Relacions amb Polònia"
 lithuania_poland_relations_desc:0 "El 1386 el gran duc Jogaila va decidir abraçar el catolicisme, i també va alinear Lituània amb Polònia. Hem de redescobrir aquests vincles històrics i enfortir la nostra amistat amb Polònia."
 conquer_samogitia_title:0 "Recuperar Samogítia"
 conquer_samogitia_desc:0 "Les terres de Samogítia són una part històrica de Lituània que ens van arrabassar cruelment els cavallers teutònics. Hem de restituir aquesta província al gran ducat."
 retake_chernigov_title:0 "Recuperar Txernígov"
 retake_chernigov_desc:0 "La pretensió de Moscòvia de ser l'única hereva vertadera de la Rus de Kíev és força insolent. Hem de tornar a avançar més enllà del Dnièper i recuperar Txernígov per a Lituània."
 retake_smolensk_title:0 "Alliberar Smolensk"
 retake_smolensk_desc:0 "La fortalesa de Smolensk és la porta de Lituània, i sense ella les hordes russes poden avançar cap a l'oest a voluntat. Hem de recuperar aquesta fortalesa amb prioritat."
 subjugate_aquileia_title:0 "Sotmetre Aquileia"
 subjugate_aquileia_desc:0 "El Patriarcat d'Aquileia va ser un dels estats més poderosos de la península Itàlica. Ara els seus dies de glòria s'han acabat i Venècia l'hauria de substituir."
 conquer_friuli_title:0 "Conquerir el Friül"
 conquer_friuli_desc:0 "La ciutat de Venècia, per la seva situació, està força protegida dels atacs. Tanmateix, per no quedar a la mercè del canviant panorama polític italià, hem d'ampliar les nostres possessions a terra ferma."
 conquer_brescia_title:0 "Avançar per la vall del Po"
 conquer_brescia_desc:0 "La fortalesa de Brescia és la ciutat més important de la Llombardia oriental. Per protegir les possessions venecianes dels rics estats llombards, hem de controlar aquesta regió."
 conquer_verona_title:0 "Expandir-se per la «Terra Ferma»"
 conquer_verona_desc:0 "Hem d'expandir les nostres possessions a la Itàlia continental, i on, us preguntareu? Doncs a la bella Verona, on situem la nostra escena."
 conquer_istria_title:0 "Defensar el comerç venecià"
 conquer_istria_desc:0 "L'Adriàtic és l'artèria per on flueix tot el comerç venecià. Per defensar-lo hem d'establir una cadena de bases al llarg de la costa des d'on pugui operar la nostra flota."
 defend_crete_title:0 "Defensar Creta"
 defend_crete_desc:0 "El turc torna a avançar per la Mediterrània, i la nostra base a Creta ens permet hostilitzar-ne el comerç a l'Egeu. Ens hem d'assegurar que Creta continuï en les nostres mans."
 retake_crete_title:0 "Recuperar Creta"
 retake_crete_desc:0 "L'illa de Creta era una baula clau en la cadena de bases que tenim per defensar Venècia de l'Orient. Hem de recuperar aquesta illa perquè la república estigui realment segura."
 bohemia_silesia_relations_title:0 "Relació amb Silèsia"
 bohemia_silesia_relations_desc:0 "El 1327 els ducs de Silèsia van acceptar Joan el Cec com a sobirà. Tanmateix, no veiem gaires signes d'amistat, així que hem de millorar les nostres relacions."
 diplo_annex_silesia_title:0 "Incorporar Silèsia"
 diplo_annex_silesia_desc:0 "El 1335 el rei polonès Casimir III va acceptar que Bohèmia governava legítimament Silèsia. Hem acceptat un alt grau d'independència dels nostres ducs silesians, però ara la situació exigeix que Silèsia passi a formar part de ple dret de Bohèmia."
 bohemia_hungary_relations_title:0 "Relacions amb Hongria"
 bohemia_hungary_relations_desc:0 "Des que Venceslau III, l'últim rei premíslida de Bohèmia, va ser aclamat també rei d'Hongria, els destins dels dos regnes han estat entrellaçats. És hora d'enfortir els nostres vincles amb ells."
 defend_bohemia_against_hungary_title:0 "Ni un pam per als hongaresos"
 defend_bohemia_against_hungary_desc:0 "Ens hem d'assegurar que Hongria no posseeixi cap pam de sòl bohemi."
 bohemia_austria_relations_title:0 "Relacions amb els Habsburg"
 bohemia_austria_relations_desc:0 "Els Habsburg d'Àustria de vegades han estat uns veïns interessants. Vegem si podem millorar les relacions amb ells."
 improved_relations_with_electors_title:0 "Millorar les relacions amb l'elector ($COUNTRY$)"
 improved_relations_with_electors_desc:0 "El sistema electiu del Sacre Imperi Romanogermànic de vegades és un veritable problema. Darrerament hem notat que no som tan populars com podríem ser per a l'elector §Y$COUNTRY$§W. Per assegurar que la nostra dinastia continuï tenint la dignitat imperial, hem d'enfortir els nostres vincles."
 become_emperor_title:0 "Esdevenir emperador"
 become_emperor_desc:0 "Hem estat beneïts amb la dignitat electoral entre els prínceps de l'Imperi. Tanmateix, si poguéssim millorar les relacions amb els altres electors, el tron imperial podria estar al nostre abast."
 naval_recruiting_act_title:0 "Aprovar la Llei de Reclutament Naval"
 naval_recruiting_act_desc:0 "Una armada forta depèn de mariners resistents i capaços. Una llei de reclutament obligaria els homes aptes sense mitjans de subsistència a allistar-se al servei naval i, així, augmentaria el nombre de mariners disponibles."
 militia_act_title:0 "Aprovar la Llei de la Milícia"
 militia_act_desc:0 "Declara el rei, i només el rei, comandant suprem de les forces militars. L'únic dret sobre la milícia, en tots els aspectes, ja sigui donar-li ordres o disposar-ne, és en mans del rei."
 statute_of_monopolies_title:0 "Declarar l'Estatut de Monopolis"
 statute_of_monopolies_desc:0 "Fomenta el creixement econòmic promovent el lliure comerç i la lliure circulació de béns entre nacions comercials, i condemna els monopolis i les restriccions governamentals."
 licensing_of_the_press_act_title:0 "Aprovar la Llei de Llicències d'Impremta"
 licensing_of_the_press_act_desc:0 "Amb l'adopció de normes i regulacions estrictes sobre la impressió i les impremtes, no només serà possible reduir al mínim la quantitat de textos traïdors i injuriosos de la nostra societat, sinó també tenir un control més gran sobre les masses."
 tenures_abolition_act_title:0 "Aprovar la Llei d'Abolició de les Tinences"
 tenures_abolition_act_desc:0 "Fixa una quantitat de compensació per al monarca i suprimeix els diversos tipus de tinences militars i agrícoles degudes a la corona."
 court_of_wards_and_liveries_title:0 "Aprovar la Llei del Tribunal de Tuteles i Investidures"
 court_of_wards_and_liveries_desc:0 "Estableix un tribunal de tuteles i investidures que serà responsable de l'administració de la recaptació d'impostos i dels tributs feudals. El tribunal també s'ocuparà de tots els assumptes relacionats amb la tutela i la investidura."
 dissolution_act_title:0 "Aprovar la Llei de Dissolució"
 dissolution_act_desc:0 "Impedeix que els reis exerceixin un control absolut sobre els seus regnes sense el consentiment del Parlament, en fer obligatori que es convoquin els membres del Parlament almenys un cop cada tres anys."
 statue_in_restraint_of_appeals_title:0 "Declarar l'Estatut de Restricció d'Apel·lacions"
 statue_in_restraint_of_appeals_desc:0 "Rebaixa oficialment el papa i eleva el rei a autoritat legal suprema en tots els assumptes religiosos."
