 feudal_monarchy_desc:0 "Forma de govern en què el poder es reparteix entre el monarca i els nobles, i en què es presten serveis laborals o militars a canvi de terres."
 tribal_democracy_legacy:0 "Democràcia tribal"
 feudal_monarchy_legacy_desc:0 "Forma de govern en què el poder es reparteix entre el monarca i els nobles, i en què es presten serveis laborals o militars a canvi de terres."
 merchant_republic_desc:1 "Forma de govern en què la nació es governa com una república, però amb una forta dependència del comerç i dels negocis.\nSi una república mercantil té més de 20 províncies en §Yestats§!, patirà una penalització a la §Ytradició republicana§!."
 despotic_monarchy_desc:0 "És un dels tipus de govern més antics coneguts per la humanitat: el país el governa un sol individu amb un poder indefinit."
 noble_republic_desc:0 "Sistema polític en què el país el governen els nobles, que tenen drets i beneficis considerables."
 administrative_monarchy_desc:0 "Forma de govern en què l'estat es governa com una monarquia que depèn en gran mesura d'una organització estricta dels afers polítics i de la burocràcia."
 administrative_republic_desc:0 "Forma de govern en què l'estat es governa com una república que depèn en gran mesura d'una organització estricta dels afers polítics i de la burocràcia."
 oligarchic_republic_desc:0 "Forma de govern en què unes quantes famílies patrícies tenen el poder i elegeixen els governants d'entre els seus membres."
 peasants_republic_desc:0 "Forma de govern en què les comunitats camperoles tenen el poder i elegeixen els governants d'entre els seus líders."
 peasants_republic_legacy:0 "República camperola"
 peasants_republic_legacy_desc:0 "Forma de govern en què les comunitats camperoles tenen el poder i elegeixen els governants d'entre els seus líders."
 absolute_monarchy_desc:0 "Forma de govern en què el monarca governa el país amb un poder absolut, sense haver de sotmetre's a cap llei ni reglament."
 prussian_monarchy_legacy_desc:1 "Forma de govern sota un monarca que es podria descriure millor com un exèrcit amb un estat que no pas com un estat amb un exèrcit."
 prussian_monarchy_desc:1 "Forma de govern sota un monarca que es podria descriure millor com un exèrcit amb un estat que no pas com un estat amb un exèrcit."
 prussian_monarchy_base_desc:0 "Forma de govern sota un monarca que es podria descriure millor com un exèrcit amb un estat que no pas com un estat amb un exèrcit."
 republican_dictatorship_desc:0 "Forma de govern en què uns representants elegits exerceixen un poder absolut sobre l'estat."
 constitutional_monarchy_desc:0 "Forma de govern en què el monarca ha de respectar una constitució determinada."
 enlightened_despotism_desc:0 "En essència, un sistema polític en què una nació la governa un governant absolut que abraça les idees de la Il·lustració."
 constitutional_republic_desc:0 "Sistema polític en què l'estat el governen representants elegits pel poble, que han de seguir un conjunt determinat de lleis i reglaments."
 bureaucratic_despotism_desc:0 "Forma de govern en què una nació la controlen funcionaris de l'estat preocupats sobretot per la correcció dels procediments."
 theocratic_government_desc:0 "Forma de govern en què la nació la governa el clergat en nom de Déu."
 monastic_order_government_desc:0 "Forma de govern en què la nació la governen els membres d'un orde monàstic en nom de Déu."
 papal_government_desc:0 "Estructura política en què la nació la governa un líder espiritual, el papa, el càrrec més alt de l'Església catòlica romana."
 tribal_despotism_desc:0 "Sistema polític en què una tribu la controla un governant individual amb un poder il·limitat i la capacitat de fer qualsevol cosa sense conseqüències ni represàlies, i que sovint governa per mitjà de la por."
 tribal_despotism_legacy:0 "Despotisme tribal"
 tribal_despotism_legacy_desc:0 "Sistema polític en què una tribu la controla un governant individual amb un poder il·limitat i la capacitat de fer qualsevol cosa sense conseqüències ni represàlies, i que sovint governa per mitjà de la por."
 tribal_kingdom_legacy:0 "Regne tribal"
 tribal_kingdom_legacy_desc:0 "Sistema polític en què una gran societat tribal ha format un regne amb un sol governant fort que governa per mitjà de la llei."
 tribal_kingdom_desc:0 "Sistema polític en què una gran societat tribal ha format un regne amb un sol governant fort que governa per mitjà de la llei."
 tribal_federation_legacy:0 "Federació tribal"
 tribal_federation_legacy_desc:0 "Forma de govern en què una confederació de tribus governa amb un cert grau d'autonomia interna, però sota una autoritat central a escala nacional."
 tribal_federation_desc:0 "Forma de govern en què una confederació de tribus governa amb un cert grau d'autonomia interna, però sota una autoritat central a escala nacional."
 tribal_democracy_legacy_desc:0 "Forma de govern en què tots els membres de la tribu poden fer sentir la seva veu i influir en la manera com s'ha de governar la tribu."
 tribal_democracy_desc:0 "Forma de govern en què tots els membres de la tribu poden fer sentir la seva veu i influir en la manera com s'ha de governar la tribu."
 tsardom_legacy:0 "Tsarat"
 tsardom_legacy_desc:0 "Aquest estat és el defensor del llegat imperial romà i de l'Església ortodoxa. Com a tsar de totes les Rússies, el nostre governant és el veritable sobirà dels pobles eslaus orientals."
 tsardom_desc:0 "Aquest estat és el defensor del llegat imperial romà i de l'Església ortodoxa. Com a tsar de totes les Rússies, el nostre governant és el veritable sobirà dels pobles eslaus orientals."
 principality_desc:0 "El sistema de govern d'aquest estat ha evolucionat en els anys posteriors a la caiguda de Kíev i sota la pressió de les constants incursions de les expedicions tributàries tàtares. La família governant pot exercir un gran poder, però la successió per antiguitat i els apanatges principescos poden provocar llargs conflictes interns."
 principality_legacy:0 "Principat"
 principality_legacy_desc:0 "El sistema de govern d'aquest estat ha evolucionat en els anys posteriors a la caiguda de Kíev i sota la pressió de les constants incursions de les expedicions tributàries tàtares. La família governant pot exercir un gran poder, però la successió per antiguitat i els apanatges principescos poden provocar llargs conflictes interns."
