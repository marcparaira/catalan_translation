 noreligion:0 "sense religió"
 noreligion_religion_desc:0 "Aquesta àrea no té població i, per tant, tampoc no té religió."
 animism_religion_desc:1 "L'animisme és la creença que el món és habitat per un gran nombre d'éssers espirituals sobrenaturals, sense cap separació entre el món terrenal i l'espiritual. Els esperits poden habitar qualsevol cosa, des de les muntanyes fins als llamps, segons on visquin els fidels.\nAl joc, la religió animista serveix d'etiqueta per a un ampli ventall de creences, des de l'Amèrica del Sud fins a l'Àfrica o Indonèsia."
 norse_pagan_reformed_religion_desc:0 "La religió nòrdica és el sistema de creences tradicional i politeista dels pobles escandinaus.\nEl 1444 la religió nòrdica ja feia temps que havia desaparegut i no existeix en cap província ni en cap país."
 jewish_religion_desc:1 "El judaisme, la religió abrahàmica més antiga del joc, es basa en la Torà i en les tradicions i escriptures del poble jueu, que es remunten a més de 3000 anys enrere.\nA l'inici del joc, la fe jueva és minoritària a gairebé tot el món i només és present a dues províncies, Semien i Dembiya, a Etiòpia."
 zoroastrian_religion_desc:1 "La religió zoroastriana és la fe tradicional dels pobles iranians i de l'antic Imperi persa. Els zoroastrians són monoteistes i segueixen els ensenyaments del profeta Zoroastre.\nA l'inici del joc, el zoroastrisme fa segles que decau arran de la conquesta islàmica de l'Iran i, a banda d'una concentració al voltant de la província de Yazd, només hi ha minories zoroastrianes a l'Índia i a Pèrsia que no estan representades al joc."
 ibadi_religion_desc:0 "Els seus fidels afirmen que l'ibadisme és més antic que l'islam sunnita i que el xiïta, però de cap manera no és tan popular. Els ibadites posen l'accent en una adhesió estricta a una interpretació de l'islam i de la xaria que consideren més antiga i més ortodoxa.\nAl joc, els ibadites només són majoritaris a Oman i al voltant de l'oasi del Mzab, al nord d'Àfrica."
 sikhism_religion_desc:0 "El sikhisme és la fe fundada pel guru Nanak cap al tombant del segle XVI al Panjab. És una religió monoteista que va néixer en una zona on es barregen l'islam i l'hinduisme, però que en molts aspectes no s'assembla a cap dels dos.\nAl joc, cap província ni cap país no comença amb la religió sikh, però probablement apareixerà unes quantes dècades després de l'inici."
 buddhism_religion_desc:1 "Com totes les branques budistes, el theravada prové dels ensenyaments de Gautama Buda, al segle V aC. Els seguidors del budisme theravada es basen en el cànon pali com a guia religiosa i jurídica, i posen l'accent en els deures monàstics i en l'assoliment de la condició d'arhat, o il·luminació.\nAl joc, el budisme theravada es practica sobretot a Sri Lanka i al sud-est asiàtic."
 vajrayana_religion_desc:1 "També conegut com a budisme tàntric o fins i tot lamaisme, el vajrayana és una branca del budisme en què l'objectiu dels fidels és esdevenir un bodhisattva mitjançant les tècniques tàntriques. Es creu que la il·luminació no es pot assolir només amb l'estudi solitari, sinó que l'ha d'ensenyar un mestre.\nAl joc, el budisme vajrayana es practica sobretot al Tibet i, en certa mesura, a les estepes del nord d'Àsia."
 mahayana_religion_desc:1 "El mahayana és la branca més practicada del budisme. L'objectiu dels seus fidels és assolir la il·luminació i, possiblement, fins i tot la budeïtat.\nAl joc, només Dai Viet comença amb el budisme mahayana, perquè molts països on era dominant figuren com a confucianistes."
 catholic_religion_desc:1 "El catolicisme és el nom d'una tradició cristiana amb arrels en l'antic ritu llatí que reconeix el papa com a cap de la cristiandat.\nEl 1444 el catolicisme és l'Església cristiana dominant a l'oest i el nord d'Europa, però és probable que el protestantisme i la religió reformada la fragmentin durant la Reforma."
 confucianism_religion_desc:1 "El confucianisme és el nom de les filosofies del filòsof Confuci, del segle V aC, que posen l'accent en el perfeccionament personal i en la importància del bon govern.\nAl joc, la Xina i Corea comencen com a països confucianistes, i també té una certa presència entre els estats jurchens de Manxúria."
 hinduism_religion_desc:1 "L'hinduisme és el nom que rep un ampli ventall de tradicions índies politeistes amb un panteó comú.\nL'hinduisme, una de les religions més antigues del joc, és present sobretot a l'Índia i en parts del sud-est asiàtic, on ha anat perdent terreny davant del budisme i l'islam."
 orthodox_religion_desc:1 "La tradició cristiana ortodoxa té les arrels en el ritu grec i es considera més propera als ideals cristians originals que el catolicisme. Les esglésies ortodoxes rebutgen la figura del papa i es divideixen en diverses esglésies presidides per patriarques.\nAl joc, bona part de l'Europa oriental és de religió ortodoxa."
 protestant_religion_desc:1 "El protestantisme abraça un ampli ventall de tradicions religioses que comencen amb els ensenyaments de Martí Luter durant la Reforma. S'oposen a moltes de les convencions que amb el temps s'havien desenvolupat a l'Església catòlica i a la idea mateixa del papa.\nAl joc, el protestantisme abraça sobretot els països inspirats en els ensenyaments de Luter que han creat esglésies d'estat."
 reformed_religion_desc:0 "La religió reformada abraça un ampli ventall de tradicions religioses inspirades per homes com Joan Calví o John Knox. En general, apareix més tard que les religions classificades com a protestants; la religió reformada també rebutja l'autoritat papal i vol tornar a les normes de les Escriptures però, a diferència dels protestants, adopta algunes idees considerades més radicals, com la predestinació i la iconoclàstia, i no crea esglésies d'estat."
 shamanism_religion_desc:1 "El fetitxisme abraça un ampli ventall de religions indígenes africanes. Aquestes religions sovint inclouen la veneració dels avantpassats, l'ús de la màgia i la medicina tradicional.\nAl joc, la major part d'Àfrica figura com a fetitxista."
 shiite_religion_desc:1 "Els musulmans xiïtes sostenen que el successor legítim del profeta Mahoma com a califa i imam va ser el seu cosí i gendre Alí. Els xiïtes creuen que després d'Alí han vingut diversos imams i encara esperen l'arribada del seu successor final.\nAl joc, l'islam xiïta és present a l'Iran, al Iemen i, com a religió minoritària, en alguns soldanats indis."
 shinto_religion_desc:1 "El xintoisme és l'antiga religió ètnica del Japó, que al llarg dels segles ha arribat a conviure amb el confucianisme i el budisme a les illes japoneses.\nAl joc, tot el Japó comença com a xintoista per representar la barreja especial de budisme, xintoisme i altres tradicions del poble japonès."
 sunni_religion_desc:1 "L'islam sunnita sosté que el successor legítim del profeta Mahoma va ser el seu sogre Abu Bakr.\nCom a religió de la majoria dels musulmans del món, l'islam sunnita és present des del Marroc fins a Indonèsia i és una de les religions més esteses del joc."
 totemism_religion_desc:1 "La creença totemista ensenya que cada individu té un parentiu espiritual amb un animal, el tòtem. Els qui comparteixen un animal totèmic formen clans i es consideren família els uns als altres.\nAl joc, el totemisme és la religió d'estat de tots els estats indígenes nord-americans i és present a la major part del continent nord-americà."
 coptic_religion_desc:1 "El cristianisme copte és una branca de la cristiandat que segueix el ritu alexandrí i que obeeix el patriarca d'Alexandria.\nAmb la caiguda d'Egipte en mans dels musulmans fa centenars d'anys, el patriarca està sota el control d'un estat no cristià, i la religió copta només sobreviu com a fe majoritària a Etiòpia i Núbia."
 tengri_pagan_reformed_religion_desc:1 "Tengri és la divinitat principal d'una de les religions xamàniques turquesques o mongoles més antigues.\nAl joc, aquesta religió engloba una gran varietat de xamanismes siberians i manxús practicats pels estats que comencen al nord d'Àsia."
 inti_religion_desc:0 "La religió inti engloba un ampli ventall de fes andines dispars amb molts trets comuns. Inti és el nom del déu del sol que l'Imperi inca va promoure per sobre de totes les altres huaques locals.\nAl joc, la major part dels Andes comença amb la religió inti."
 nahuatl_religion_desc:1 "La religió nahuatl és un conjunt de tradicions politeistes mesoamericanes. Tot i que el panteó i molts conceptes són força semblants als de la religió maia, els nahues o asteques donen molta més importància a la necessitat dels sacrificis humans per sobreviure a cada nou cicle còsmic.\nAl joc, la major part de la zona al voltant de l'actual centre de Mèxic comença amb la religió nahuatl."
 mesoamerican_religion_religion_desc:1 "La religió maia engloba un conjunt de tradicions politeistes mesoamericanes heretades de les antigues civilitzacions maies. Tot i que els noms són diferents, el panteó i moltes tradicions són força semblants als de la religió nahuatl.\nAl joc, la península del Yucatán i les antigues terres de la Lliga de Mayapán comencen amb la religió maia."
 chinaware:0 "Porcellana"
 chinawareDESC:0 "La «porcellana» representa diversos béns exòtics com ara la porcellana i les catifes. Aquests luxes de gran valor, que generalment provenen d'Orient, assoleixen preus elevats al mercat."
 cloth:0 "Teixits"
 clothDESC:0 "Els teixits representen les diverses teles i peces de roba fetes de llana i de lli. Més endavant, el cotó, importat de l'Índia i de les Amèriques, es va convertir en una matèria primera important per als teixits."
 coffee:0 "Cafè"
 coffeeDESC:0 "El cafè es va descobrir al nord-est d'Etiòpia, i el primer conreu de cafè es va fer al sud d'Aràbia. Des de l'Orient Mitjà, el cafè es va estendre a Itàlia al segle XVII i després es va introduir a la resta d'Europa. El cafè va ser més acceptat després que el papa Climent VIII el declarés beguda cristiana el 1600, malgrat les peticions de prohibir la «beguda musulmana»."
 copper:0 "Coure"
 copperDESC:0 "El coure també inclou altres metalls no fèrrics com el plom i l'estany. El coure era el component principal del bronze i va ser essencial en la primera producció de canons."
 cotton:0 "Cotó"
 cottonDESC:0 "El cotó és originari de l'Àsia central, però no es va fer servir gaire a Europa fins que es va introduir a les colònies americanes i es va utilitzar com a complement o substitut barat però bo de la llana en la indústria tèxtil de finals del segle XVIII"
 fish:0 "Peix"
 fishDESC:0 "El peix era un dels aliments més bàsics de la població europea en aquesta època, ja que per a la gran majoria la carn era més que un luxe. Els pescadors també constituïen la principal reserva de reclutament de les marines mercants i militars de la majoria de nacions."
 fur:0 "Pells"
 furDESC:0 "Les pells eren un dels elements bàsics de la roba d'alta qualitat i d'abric. Al principi, les pells de tota mena d'animals arribaven de Rússia, però cada cop més arribaven de l'Amèrica del Nord, on els castors serien la presa preferida almenys fins a mitjan segle XVIII."
 gold:0 "Or"
 goldDESC:0 "L'or i la plata eren la base de totes les monedes oficials d'Europa. Les grans mines d'or i plata de l'Amèrica Central i del Sud posarien fi a la gran crisi de metalls preciosos que havia afectat Europa el segle anterior. Tanmateix, un ús imprudent d'aquesta gran riquesa podia comportar inflació i ruïna."
 grain:0 "Gra"
 grainDESC:0 "El gra representa els aliments vegetals que eren la base de la dieta de persones i animals. La seva manca sempre provocava revoltes i aldarulls. Més endavant, els altres cereals i aliments vegetals es complementarien amb tomàquets, blat de moro i fins i tot patates d'Amèrica, que oferien més varietat tant en l'alimentació com en la producció agrícola."
 iron:0 "Ferro"
 ironDESC:0 "El ferro no representa només el ferro, sinó també altres metalls fèrrics i la producció d'aliatges com l'acer. El ferro era la base de la indústria metal·lúrgica i es feia servir àmpliament en la producció d'armes i altres equipaments militars."
 ivory:0 "Ivori"
 ivoryDESC:0 "L'ivori era una de les principals exportacions d'Àfrica, a banda dels esclaus. Els europeus el cobejaven per fer-lo servir en tota mena de béns manufacturats, com coberts, regals, petites obres d'art, mobles, etc."
 naval_supplies:0 "Subministraments navals"
 naval_suppliesDESC:0 "Els subministraments navals representen tot allò que cal per construir vaixells, des de la fusta bàsica fins al quitrà, les cordes, el lli, les veles i molts altres materials. Al principi, el Bàltic n'era el principal proveïdor, fins que l'Amèrica del Nord es va convertir en una font alternativa a principis del segle XVIII. L'expansió colonial a Amèrica es va fer en part per assegurar-se el subministrament d'aquests béns vitals."
 salt:0 "Sal"
 saltDESC:0 "La sal és essencial per a la vida humana. A més, era el mitjà més habitual per conservar els aliments durant els llargs mesos d'hivern. Podia ser mineral, extreta de les mines de l'Europa central, o natural, obtinguda per evaporació a les salines de les costes assolellades."
 slaves:0 "Esclaus"
 slavesDESC:0 "Els esclaus eren una mercaderia des de l'antiguitat, però la demanda va créixer bruscament a finals del segle XVI, quan els esclaus van esdevenir una de les fonts de mà d'obra més barates per a les plantacions europees a les Amèriques."
 spices:0 "Espècies"
 spicesDESC:0 "Les espècies es coneixien a Europa des de l'antiguitat, sobretot pel seu valor medicinal i per la seva capacitat de millorar el gust del menjar. El pebre, el gingebre, la nou moscada, el bitxo, la canyella, etc. venien en part de l'Àfrica oriental, però sobretot de l'Índia, la Xina i les illes de les Espècies (l'actual Indonèsia), i es comerciaven a Alexandria o en altres terminals de les grans rutes de caravanes. El desig europeu d'un subministrament més barat i més directe va ser la motivació principal dels primers viatges de descoberta per mar cap a l'est de Portugal."
 sugar:0 "Sucre"
 sugarDESC:0 "El sucre no només es feia servir per endolcir, sinó també per conservar els aliments. La canya de sucre era l'única manera coneguda d'obtenir sucre en aquella època i al principi es conreava en algunes illes mediterrànies. Però el sistema de plantacions americà, que exigia molta mà d'obra, especialment a les illes del Carib, aviat va traslladar les principals fonts de producció a ultramar."
 tea:0 "Te"
 teaDESC:0 "El te era una beguda de luxe important a la Xina, l'Índia i el sud-est asiàtic. Sovint es feia servir en rituals religiosos o socials. Els anglesos van popularitzar el te a Europa. Tot i que mai no es va considerar una beguda tan noble com el cafè, va generar grans beneficis pel simple fet que l'oferta mundial era escassa."
 tobacco:0 "Tabac"
 tobaccoDESC:0 "El tabac era desconegut a Europa fins que es va portar d'Amèrica a finals del segle XVI. Ràpidament es va posar de moda entre les classes altes que se'l podien permetre i va assegurar el creixement econòmic ràpid i rendible de les colònies britàniques de l'Amèrica del Nord, així com del Brasil portuguès. Ningú no sabia què hi posaven, però simplement no podien deixar de fumar-ne."
 wine:0 "Vi"
 wineDESC:0 "El vi es produïa des de temps immemorials a les regions del sud d'Europa. Continuava sent un element essencial de la dieta quotidiana, excepte potser al món musulmà. El vi no es considerava un producte de luxe, però probablement era un alleujament benvingut per a centenars de persones en una dieta altrament monòtona."
 wool:0 "Llana"
 woolDESC:0 "La llana provenia sobretot d'ovelles que pasturaven a les terres més marginals, no aptes per a altres formes d'agricultura. Abans de l'ús del cotó, era la principal matèria primera de la roba."
 cocoa:0 "Cacau"
 cocoaDESC:0 "Els asteques, els inques i els governants indígenes feien servir el cacau com a estimulant des de l'alta edat mitjana. Es va popularitzar a Europa a principis del segle XVI, quan els espanyols el van importar de les seves colònies americanes. El cacau es va convertir en un luxe a l'abast dels rics."
 tropical_wood:0 "Fusta tropical"
 tropical_woodDESC:0 "Les fustes tropicals, que s'usaven per a tot, des de peces d'escacs fins a mobles d'alta qualitat, sempre s'han considerat una mercaderia cara i exclusiva. Tot i que molts d'aquests tipus de fusta eren nous per al mercat europeu, la demanda aviat va créixer i el tràfic de caoba, teca, banús i altres fustes rares aviat es va convertir en un gran negoci."
 dyes:0 "Tints"
 dyesDESC:0 "Des que es teixeixen teles hi ha hagut mercat per als tints fins. A la baixa edat mitjana, els tints cars com l'indi valien una fortuna per la gran distància de la seva font, a l'Índia.\nA mesura que el món s'obria, els tints es van fer més fàcils d'aconseguir, tant per la possibilitat de produir-los a Amèrica com per l'accés més fàcil al mercat indi. Tot i així, els tints continuaven sent escassos i, a principis del segle XIX, quan les plantacions de tints de l'Índia van caure en mans europees, es va desencadenar una autèntica febre de l'or."
 silk:0 "Seda"
 silkDESC:0 "La més fina de totes les teles d'Orient era la seda produïda a l'Índia, la Xina i l'Àsia oriental. Tot i ser menys emblemàtics que les espècies, els beneficis de la seda i dels teixits fins de cotó aviat superarien amb escreix els del comerç d'espècies per a les companyies europees de les Índies Orientals.\nA causa de la demanda creixent, a l'Europa mercantilista també es va intentar produir aquest material localment, amb graus d'èxit molt diversos."
 incense:0 "Encens"
 incenseDESC:0 "Escampar fum i fragàncies cremant materials ha estat habitual en les pràctiques cerimonials durant segles. L'olíban, la fusta d'àloe, el sàndal, la mirra i altres béns adequats per a aquest ús només es troben en pocs llocs, i la seva difusió va ser part integral de la formació de xarxes comercials com la Ruta de la Seda o l'encertadament anomenada Ruta de l'Encens. "
 livestock:0 "Bestiar"
 livestockDESC:0 "Des dels inicis de la història, la cura dels animals domèstics ha estat una de les principals ocupacions de la humanitat. El bestiar inclou de tot, des de les vaques i els cavalls de les riques zones agrícoles fins als ramats dels pastors de les grans planes i dels deserts del món."
 glass:0 "Vidre"
 glassDESC:1 "El vidre s'ha valorat durant segles com a material útil per a l'art, l'arquitectura o simplement per fer recipients d'ús quotidià. Amb el temps, a mesura que les tècniques de fabricació del vidre milloraven, el vidre també esdevindria crucial per a l'òptica com a camp científic, i les lents de vidre s'utilitzarien per fabricar ulleres, telescopis i una gran quantitat d'altres instruments amb aplicacions molt diverses, des de la navegació marítima fins a les ciències naturals."
 paper:0 "Paper"
 paperDESC:0 "El paper és imprescindible per a tota mena de comptabilitat avançada, d'administració i de difusió del coneixement. El procés per produir-lo es va idear originalment a la Xina i després, a poc a poc, va arribar a tots els racons del Vell Món. Molt superior a altres materials d'escriptura com el pergamí, la producció de paper a gran escala requereix un conjunt d'habilitats i equipaments especialitzats, i això el converteix en una mercaderia escassa i cobejada."
 gems:0 "Pedres precioses"
 gemsDESC:0 "Des dels temps més antics, pedres com els robins, els safirs, els diamants, les maragdes, el jade o les perles s'han fet servir en joieria i en la indumentària cerimonial. Durant segles, l'única font de diamants del món van ser les llegendàries mines de Golconda. Tot i que no totes les pedres precioses són igual de rares, totes són mercaderies molt cobejades."
 coal:0 "Carbó"
 coalDESC:0 "El carbó té una llarga història com a font de combustible, però no és fins a la invenció i la difusió de la màquina de vapor pràctica que la demanda es dispara. A mesura que la Revolució Industrial s'estenia per Europa, l'ús i l'exportació o importació de carbó es convertiria en un gran negoci i en una part integral de l'economia moderna."
