 horse_artillery_unitDESCR:0 "Un altre avenç en el desenvolupament de l'artilleria va ser la generalització, durant els segles XVII i XVIII, dels canons mòbils, que es podien transportar i reubicar fàcilment al camp de batalla i permetien tàctiques de combat més eficaces."
 licorne:0 "Licorne"
 licorneDESCR:0 "La licorne era un híbrid entre l'obús i el canó desenvolupat per Rússia al segle XVIII. Tenia un canó més llarg que l'obús, cosa que donava als projectils més abast gràcies a una trajectòria més plana."
 grand_battery:0 "Gran bateria"
 grand_batteryDESCR:0 "Durant el segle XVIII es van anar concentrant cada vegada més peces d'artilleria al camp de batalla, però va ser durant les guerres napoleòniques que això va arribar a un nivell totalment nou, amb bateries de canons dignes d'aquest nom."
