 time_of_troubles:0 "Període Tumultuós"
 time_of_troubles_desc:0 "Un període de problemes socials i econòmics alhora: la nostra nació lluita contra la fam i la guerra, i també contra l'oposició a l'Església i a l'aristocràcia."
 revolution:0 "Revolució"
 desc_revolution:0 "Dècades d'opressió feudal, dificultats econòmiques i intolerància religiosa han passat factura a la nostra nació, i el desig de llibertat de la població és una amenaça greu per a la nostra monarquia."
 peasant_war:0 "La Guerra dels Camperols"
 desc_peasant_war:0 "Les demandes de reformes econòmiques, religioses i polítiques de la pagesia no s'han atès, i han esclatat revoltes violentes arreu de la nostra nació."
 religious_intolerance:0 "Intolerància religiosa"
 desc_religious_intolerance:0 "Les lluites religioses, unes més violentes que d'altres, eren molt habituals en aquesta època, i les revoltes esclataven regularment."
 religious_tolerance:0 "Tolerància religiosa"
 desc_religious_tolerance:0 "En una època plagada de lluites religioses, els esforços per mediar entre els diversos grups religiosos eren cada vegada més difícils."
 decreased_morale:0 "Moral reduïda"
 desc_decreased_morale:0 "La tensió mental de la guerra, la deixadesa financera i la inestabilitat política han acabat obligant el govern a revisar les despeses militars."
 domestic_improvements:0 "Millores internes"
 desc_domestic_improvements:0 "La tensió mental de la guerra, la deixadesa financera i la inestabilitat política han acabat obligant el govern a centrar-se en els problemes interns."
 enforce_serfdom:0 "Imposar la servitud"
 desc_enforce_serfdom:0 "Els esforços creixents per controlar la situació legal i econòmica dels pagesos estan minant les forces del poble, i entre les classes baixes de la societat es cova l'agitació."
 restrict_serfdom:0 "Restringir la servitud"
 desc_restrict_serfdom:0 "S'estan estudiant plans per millorar les condicions dels serfs i, finalment, abolir la servitud."
 disarmament:0 "Desarmament"
 desc_disarmament:0 "La tensió mental de la guerra, la deixadesa financera i la inestabilitat política han acabat obligant el govern a revisar les despeses militars."
 support_monarch:0 "Donar suport al monarca"
 desc_support_monarch:0 "Tot i els intents d'assassinat i les tendències revolucionàries que infecten la nostra nació, el nostre monarca ha rebut últimament un suport sorprenent."
 oppose_monarch:0 "Oposar-se al monarca"
 desc_oppose_monarch:0 "La indecisió i la mala administració del nostre monarca han fet que el poble en qüestioni el dret a governar i que es multipliquin les conspiracions."
 alleviate_population:0 "Alleujar la població"
 desc_alleviate_population:0 "Les males collites generalitzades han deixat la nostra gent amb molt poc o res per menjar, però s'han pres mesures per alleujar-ne el patiment."
 starvation:0 "Fam"
 desc_starvation:0 "Les males collites generalitzades han deixat la nostra gent amb molt poc o res per menjar, però no tenim recursos per ajudar-los."
 suppress_free_thinkers:0 "Reprimir els lliurepensadors"
 desc_suppress_free_thinkers:0 "Per evitar més inestabilitat, hem de silenciar els debats dels nostres filòsofs sobre la reforma social."
 bureaucratic_expansion:0 "Expansió burocràtica"
 desc_bureaucratic_expansion:0 "Tot i les acusacions de corrupció dins del nostre govern, s'estan fent plans per ampliar encara més la burocràcia."
 bureaucratic_reduction:0 "Reducció burocràtica"
 desc_bureaucratic_reduction:0 "S'han posat en marxa intents de reduir el nostre govern, inflat i corrupte."
 fight_inflation:0 "Combatre la inflació"
 desc_fight_inflation:0 "Per posar ordre en la nostra economia mal gestionada i evitar una crisi econòmica, s'han dedicat tots els recursos a enfortir la nostra moneda."
 mint_money:0 "Encunyar moneda"
 desc_mint_money:0 "La guerra, les males collites generalitzades i la nostra economia mal gestionada ens han portat a les portes de la fallida. La nostra moneda perd valor ràpidament i el poder adquisitiu és cada vegada més limitat."
 financial_disaster:0 "Desastre financer"
 desc_financial_disaster:0 "Tot i que la nostra planificació financera necessita urgentment una revisió, hem decidit no retallar les despeses de guerra."
 support_troops:0 "Ajudar les tropes"
 desc_support_troops:0 "La recerca militar i l'arribada de la pólvora han deixat més o menys obsoletes les nostres antigues forces armades. Hem decidit donar-los una mica d'ajuda econòmica, ja que encara ens poden ser útils."
 obsolete_forces:0 "Forces obsoletes"
 desc_obsolete_forces:0 "La recerca militar i l'arribada de la pólvora han deixat més o menys obsoletes les nostres antigues forces armades. Hem decidit que cal una reforma."
 peasant_negotiation:0 "Negociació amb els rebels"
 desc_peasant_negotiation:0 "La Guerra dels Camperols va començar com una sèrie d'alçaments petits, però aviat es va estendre més enllà de les fronteres provincials. Ara intentem negociar-hi perquè es pugui restablir l'ordre."
 isolate_rebels:0 "Aïllar els rebels"
 desc_isolate_rebels:0 "La Guerra dels Camperols va començar com una sèrie d'alçaments petits, però aviat es va estendre més enllà de les fronteres provincials. La nostra única esperança és aïllar-los i aixafar-los."
 suppress_minority:0 "Reprimir la minoria"
 desc_suppress_minority:0 "El conflicte cultural creixent de la nostra nació ha arribat al punt d'ebullició. Hem decidit reprimir els rebels d'una vegada per totes."
 rebel_negotiation:0 "Negociació amb els rebels"
 desc_rebel_negotiation:0 "El conflicte cultural creixent de la nostra nació ha arribat al punt d'ebullició. Hem decidit començar negociacions diplomàtiques per resoldre-ho d'una vegada per totes."
 army_reform:0 "Reforma de l'exèrcit"
 desc_army_reform:0 "El nostre exèrcit està sotmès a una revisió a fons. S'ha introduït la instrucció regular i, tot i que els oficials encara surten de la noblesa, ara els pagesos i els habitants de les ciutats són reclutats per a la tropa."
 naval_reform:0 "Reforma naval"
 desc_naval_reform:0 "La nostra armada està sotmesa a una revisió a fons. Això ajudarà a enfortir la moral de les tropes i a augmentar-ne l'eficiència."
 military_reform:0 "Reforma militar"
 desc_military_reform:0 "L'estructura militar de la nostra nació, tant naval com terrestre, està sotmesa a una revisió a fons. S'ha introduït la instrucció regular i, tot i que els oficials encara surten de la noblesa, ara els pagesos i els habitants de les ciutats són reclutats per a la tropa."
 western_influences:0 "Influències occidentals"
 desc_western_influences:0 "Amb l'ajuda de consellers estrangers, hem aconseguit començar una àmplia reforma cultural i militar per igualar millor el progrés d'Occident."
 resist_western_influences:0 "Resistir les influències occidentals"
 desc_resist_western_influences:0 "Uns consellers estrangers han proposat reformes culturals i militars per occidentalitzar el nostre país, però no hi veiem cap benefici."
 diplomatic_negotiation:0 "Negociació diplomàtica"
 desc_diplomatic_negotiation:0 "S'han reunit molts representants influents de diverses colònies afectades per les nostres polítiques nacionals, i temem que, si les negociacions diplomàtiques no van bé, posin totes les colònies en contra nostra."
 trade_investment:0 "Inversió comercial"
 desc_trade_investment:0 "El comerç amb els indígenes ha resultat molt rendible i l'economia de la colònia ha assolit nous màxims, cosa que ens permet invertir més en el comerç."
 disregard_natives:0 "Desatendre els indígenes"
 desc_disregard_natives:0 "El maltractament dels pobles indígenes, juntament amb malalties fins aleshores desconegudes, ha delmat ràpidament la població, però no hi podem fer res."
 aid_natives:0 "Ajudar els indígenes"
 desc_aid_natives:0 "El maltractament dels pobles indígenes, juntament amb malalties fins aleshores desconegudes, ha delmat ràpidament la població, però hem fet un esforç per alleujar-ne el patiment."
 expand_colonial_territory:0 "Ampliar el territori colonial"
 desc_expand_colonial_territory:0 "La pressió política i econòmica a la metròpoli ha provocat un augment sobtat de la gent que busca una vida millor en terres riques i inexplorades. Això requereix més terres i ens obliga a ampliar les nostres fronteres."
 restrict_colonial_expansion:0 "Restringir l'expansió colonial"
 desc_restrict_colonial_expansion:0 "La pressió política i econòmica a la metròpoli ha provocat un augment sobtat de la gent que busca una vida millor en terres riques i inexplorades, cosa que requereix més terres, però ara mateix no tenim els recursos necessaris."
 export_restrictions:0 "Restriccions a l'exportació"
 desc_export_restrictions:0 "Els colons han prohibit els béns importats per protegir la seva economia local. Per contrarestar-ho, restringim les nostres exportacions a les colònies"
 military_reinforcement:0 "Reforç militar"
 desc_military_reinforcement:0 "Els colons han prohibit els béns importats per protegir la seva economia local. Reforcem el nostre exèrcit per resoldre el problema."
 convert_heretics:0 "Convertir els heretges"
 desc_convert_heretics:0 "Malgrat els intents rigorosos d'eradicar l'heretgia, la població d'algunes províncies està molt lligada a la seva fe i es resisteix a la conversió, però s'han pres les mesures adequades per resoldre la situació."
 military_funding:0 "Finançament militar"
 desc_military_funding:0 "La política dels últims anys no ha tingut els efectes desitjats i, en lloc de restablir l'ordre i unir la nació, les accions del govern han agitat encara més la població. Això no ens deixa cap altra opció que fer servir la força militar."
 military_funding2:0 "Finançament militar"
 desc_military_funding2:0 "Hem aconseguit augmentar la producció agrícola, cosa que permet un creixement de la població i dels homes que podem reclutar per a les nostres tropes."
 disorder:0 "Desordre"
 desc_disorder:0 "La incapacitat del govern per fer front a la crisi nacional ha permès que esclatin noves insurreccions que desestabilitzen la nostra nació."
 cut_military_investments:0 "Retallar les inversions militars"
 desc_cut_military_investments:0 "Amb el descobriment de continents fins ara desconeguts i l'establiment de noves rutes comercials, neix una nova era marítima. La nostra importància com a nació comercial disminueix, cosa que ens obliga a regular les despeses militars."
 cut_trade_investments:0 "Retallar les inversions en producció"
 desc_cut_trade_investments:0 "Amb el descobriment de continents fins ara desconeguts i l'establiment de noves rutes comercials, neix una nova era marítima. La nostra importància com a nació comercial disminueix, cosa que ens obliga a regular les despeses en producció."
 cut_government_investments:0 "Retallar les inversions del govern"
 desc_cut_government_investments:0 "Amb el descobriment de continents fins ara desconeguts i l'establiment de noves rutes comercials, neix una nova era marítima. La nostra importància com a nació comercial disminueix, cosa que ens obliga a regular les despeses governamentals."
 debt_funding_plan:0 "Pla de finançament del deute"
 desc_debt_funding_plan:0 "Administrar un imperi tan gran requereix una planificació econòmica extensa i el nomenament essencial d'un bon tresorer. Amb la seva ajuda, hem implantat un pla de finançament del deute nacional del país."
 tax_reform:0 "Reforma fiscal"
 desc_tax_reform:0 "Administrar un imperi tan gran requeria una planificació econòmica extensa, de manera que el nomenament d'un bon tresorer era essencial. El tresorer ha introduït diverses reformes econòmiques, entre les quals un sistema fiscal més equitatiu."
 naval_improvements:0 "Millores navals"
 desc_naval_improvements:0 "Gràcies a la immensa riquesa que arriba de les nostres colònies d'Amèrica, podem invertir més en una força naval poderosa."
 naval_disarmament:0 "Desarmament naval"
 desc_naval_disarmament:0 "Tot i la immensa riquesa que ens arriba de les nostres colònies americanes, no hem estat capaços de crear una força naval poderosa. S'ha decidit abandonar la idea de la supremacia naval."
 tax_reduction:0 "Reducció d'impostos"
 desc_tax_reduction:0 "Els impostos alts, juntament amb les diferències culturals i religioses, sovint causaven descontentament entre els ciutadans. En els casos més extrems, això provocava rebel·lions que de vegades tenien efectes dràstics i duradors."
 church_functions:0 "Cessament de les funcions de l'Església"
 desc_church_functions:0 "Sovint es concedia a famílies nobles el control de terres de l'Església, i en molts estats es feien nomenaments a canvi de contribucions en metàl·lic als esforços de la corona. Naturalment, així la corona perdia el control d'alguns ingressos."
 reduced_taxes_off:0 "Ingressos fiscals reduïts"
 desc_reduced_taxes_off:0 "Sovint es concedia a famílies nobles el control de terres de l'Església, i en molts estats es feien nomenaments a canvi de contribucions en metàl·lic als esforços de la corona. Naturalment, així la corona perdia el control d'alguns ingressos."
 obscurantism:0 "Obscurantisme"
 desc_obscurantism:0 "Com a resposta típica a problemes de tota mena, l'obscurantisme va ser un comportament freqüent a la majoria de nacions, almenys fins que va arribar l'era de la Il·lustració a les nacions occidentals més avançades del continent europeu."
 exceptional_year:0 "Any excepcional"
 desc_exceptional_year:0 "De tant en tant, un entorn excel·lent per als negocis i unes bones collites podien ser una benedicció per a la base fiscal de la nació i generar més ingressos per al regne."
 monetary_benefits:0 "Beneficis econòmics"
 desc_monetary_benefits:0 "La pressió demogràfica, econòmica i política a la metròpoli va provocar augments sobtats de la gent que buscava una vida millor en terres riques i inexplorades. Els homes de negocis també buscaven cada vegada més aventura i riquesa en el comerç d'ultramar."
 plague:0 "Pesta"
 desc_plague:0 "Les epidèmies de l'edat moderna eren molt més mortíferes que les guerres o fins i tot la fam. Malalties com la verola o la grip, que amb la medicina moderna són relativament inofensives, causaven estralls cada vegada que es declaraven, sobretot entre els infants."
 trade_disaster:0 "Desastre comercial"
 desc_trade_disaster:0 "Les companyies comercials sovint es fundaven sobre accions molt especulatives. Quan fallaven, es podien perdre grans fortunes, cosa que també feia minvar la confiança en el govern."
 medical_evolution:0 "Progrés mèdic"
 desc_medical_evolution:0 "Al segle XVI, els estats van començar a augmentar el nombre de metges i a regular i supervisar-ne la formació a les universitats."
 trade_income_increase:0 "Augment dels ingressos comercials"
 desc_trade_income_increase:0 "Sovint les corones concedien a les companyies comercials el dret exclusiu de comerciar mercaderies en una regió. Aquests monopolis es concedien a canvi d'un pagament únic i d'uns ingressos continus procedents dels comerciants."
 trade_income_loss:0 "Pèrdua d'ingressos comercials"
 desc_trade_income_loss:0 "En aquesta època el comerç estava molt regulat, però tot i així els mercats no eren fixos. De vegades els mercaders intentaven entrar en mercats nous o vendre mercaderies noves, però normalment exigien aranzels nous o més alts per frenar els competidors."
 tax_income_loss:0 "Pèrdua d'ingressos fiscals"
 desc_tax_income_loss:0 "Els reis havien de mantenir a ratlla els seus nobles indòcils de moltes maneres. Una de les més habituals eren els diners en efectiu. Els nobles exigien pensions més altes a canvi de renunciar a certs drets en favor del rei."
 tax_income_boost:0 "Augment dels ingressos fiscals"
 desc_tax_income_boost:0 "Quan la corona no podia o no volia pagar en efectiu als nobles, els concedia el privilegi de cobrar ingressos especials dels quals podien treure un bon profit."
 scientific_evolution:0 "Progrés científic"
 desc_scientific_evolution:0 "La reputació del nostre conseller científic ha arribat molt més enllà de les nostres fronteres; el nostre govern destaca de veritat en l'àmbit científic."
 land_investment:0 "Inversió terrestre"
 desc_land_investment:0 "La reputació del nostre conseller militar ha arribat molt més enllà de les nostres fronteres. El nostre exèrcit destaca de veritat en l'àmbit militar."
 naval_investment:0 "Inversió naval"
 desc_naval_investment:0 "La reputació del nostre conseller naval ha arribat molt més enllà de les nostres fronteres. La nostra nació destaca de veritat en l'àmbit militar."
 trading_investment:0 "Inversió comercial"
 desc_trading_investment:0 "La reputació del nostre tresorer ha arribat molt més enllà de les nostres fronteres. La nostra nació destaca de veritat en l'àmbit del comerç."
 government_investment:0 "Inversió governamental"
 desc_government_investment:0 "La reputació del nostre estadista ha arribat molt més enllà de les nostres fronteres. El nostre govern té molta sort de comptar-hi."
 reduced_stability_cost:0 "Cost d'estabilitat reduït"
 desc_reduced_stability_cost:0 "La reputació d'un dels nostres artistes ha arribat molt més enllà de les nostres fronteres. La nostra nació destaca de veritat en l'àmbit artístic."
 trade_company:0 "Companyia comercial"
 trade_company_benefits:0 "Beneficis de la companyia comercial"
 desc_trade_company_benefits:0 "El desig del nostre monarca de tenir un paper dominant en el comerç mundial contemporani ens ha portat a fundar la nostra primera Companyia de les Índies Orientals."
 reform_tensions:0 "Tensions per la reforma"
 desc_reform_tensions:0 "Finalment s'ha rebutjat, després d'un llarg debat, que el nostre país hagi de fer una reforma àmplia. S'ha conclòs que una reestructuració així seria massa dura."
 colonial_tensions:0 "Tensions colonials"
 desc_colonial_tensions:0 "S'han reunit molts representants influents de diverses colònies afectades per les nostres polítiques nacionals, i temem que facin causa comuna i posin totes les colònies en contra nostra."
 hanseatic_league:0 "Lliga Hanseàtica"
 desc_hanseatic_league:0 "La Lliga Hanseàtica es va fundar el 1241 i era una associació mercantil de ciutats comercials de la regió del Bàltic. En el seu moment de més prosperitat, la lliga aplegava més de cent ciutats."
 hanseatic_league_declines:0 "Decadència de la Lliga Hanseàtica"
 desc_hanseatic_league_declines:0 "Els canvis polítics i la manca d'organització interna van acabar fent caure la Lliga Hanseàtica. Es van trencar acords diplomàtics i es va tancar el comerç a molts dels estats de l'associació."
 morale_boost:0 "Impuls a la moral"
 desc_morale_boost:0 "La guerra civil que s'ha apoderat de la nostra nació està minant la moral de les nostres tropes. S'han pres mesures econòmiques per aturar-ho."
 deserters:0 "Desertors"
 desc_deserters:0 "La guerra civil que s'ha apoderat de la nostra nació està minant la moral de les nostres tropes, però no tenim recursos econòmics per aturar-ho."
 battle_preparations:0 "Preparatius per a la batalla"
 desc_battle_preparations:0 "S'estan fent preparatius per a una batalla final que posi fi a la guerra civil que fa massa temps que assola el nostre país."
 sound_toll:0 "Peatge de l'estret"
 desc_sound_toll:0 "Eric de Pomerània va instaurar el 1429 el peatge de l'Øresund. Aquest mateix peatge ens permet cobrar un dret de pas a tots els vaixells de càrrega estrangers que travessen el nostre estret."
 bosphorous_sound_toll:0 "Peatge del Bòsfor"
 desc_bosphorous_sound_toll:0 "Ara mateix controlem el comerç de la mar Negra. Tots els vaixells de càrrega estrangers que travessen l'estret del Bòsfor estan obligats a pagar un peatge."
 east_indian_trade_route:0 "Ruta comercial de les Índies Orientals"
 desc_east_indian_trade_route:0 "Els nostres exploradors han aconseguit fer la volta al cap de Bona Esperança i obrir una nova ruta comercial. Aquest descobriment obre el camí a oportunitats comercials molt lucratives."
 non_catholic_rome:0 "La conquesta de Roma"
 desc_non_catholic_rome:1 "L'antiga ciutat de Roma, seu del cap de l'Església catòlica, és un bon objectiu de conquesta."
 catholic_rome:0 "L'ocupació de Roma"
 desc_catholic_rome:1 "Ocupar Roma essent catòlics no pot fer res més que provocar una indignació general."
 papal_subjugation:0 "Sotmetiment del papat"
 desc_papal_subjugation:0 "Hem sotmès les terres dels Estats Pontificis. Això perjudica la nostra posició als ulls dels altres catòlics."
 IS_HRE_EMPEROR:0 "§Y$RULERNAME$§W, governant del país §Y$NAME$§W, és l'emperador del Sacre Imperi."
 HRE_ELECTOR:0 "§Y$NAME$§W és un elector del Sacre Imperi Romanogermànic. Si l'emperador actual morís, ara mateix donaria suport al governant del país §Y$VOTE$§W com a emperador."
