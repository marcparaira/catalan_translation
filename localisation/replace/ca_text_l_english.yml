 confirm_thalassocracy_d_tt:0 "§Y[Root.GetName]§! té el poder comercial més gran a §Y[1448.GetName]§!, §Y[4346.GetName]§!, §Y[1334.GetName]§!, §Y[504.GetName]§! i §Y[1340.GetName]§!."
 confirm_thalassocracy_e_tt:0 "§Y[Root.GetName]§! té el poder comercial més gran a §Y[1343.GetName]§!, §Y[1365.GetName]§!, §Y[1361.GetName]§!, §Y[1357.GetName]§! i §Y[1397.GetName]§!."
 boom_economy:0 "Economia en auge"
 desc_boom_economy:0 "La nostra copa vessa! L'economia viu un auge!"
 restore_currency_title:0 "Restaurar la moneda"
 restore_currency_desc:0 "La solidesa de la nostra moneda era l'enveja del món, però la nostra despesa inflacionària n'ha fet caure el valor en picat, i els mercaders estrangers ja no l'accepten tan de bon grat com abans. $MONARCHTITLE$, us ho implorem: restaureu la moneda."
 implement_gold_standard_title:0 "Implantar el patró or"
 implement_gold_standard_desc:0 "Que les altres nacions devaluïn les seves monedes tant com vulguin: la nostra estarà lligada al valor perdurable de l'or pur i serà reconeguda arreu del món com un mitjà de canvi de confiança. Aneu amb compte, però, de no trair la confiança establerta."
 gold_standard:0 "Patró or"
 desc_gold_standard:0 "Com que la nostra moneda està lligada al valor perdurable de l'or, patim menys inflació."
 separation_of_powers:0 "Separació de poders"
 desc_separation_of_powers:0 "Hem establert una separació de poders constitucional limitada, que amplia la independència del poder legislatiu respecte de la corona. El poble gaudeix de les seves noves llibertats i la nostra administració s'ha tornat més eficient"
 formalize_separation_of_powers_title:0 "Formalitzar la separació de poders"
 formalize_separation_of_powers_desc:0 "Si promulguem una reforma constitucional limitada (que defineixi i delimiti els càrrecs i les branques del govern, i les relacions entre ells), podrem augmentar la nostra eficiència administrativa, així com l'aprovació popular del nostre govern, que, és clar, continua sent d'ordenació divina."
 cult_of_reason:0 "Culte a la Raó"
 desc_cult_of_reason:0 "Déu és mort. Déu continua mort. I l'hem mort nosaltres. Com ens consolarem, nosaltres, els assassins de tots els assassins? El més sagrat i el més poderós que el món havia posseït fins ara s'ha dessagnat sota els nostres ganivets."
 go_cult_of_reason_title:0 "Culte a la Raó"
 go_cult_of_reason_desc:0 "Els antics déus i els seus falsos ídols cauen arreu del món civilitzat. El poble del país $COUNTRY$, sotmès tant de temps per les cadenes de la ignorància, es desperta a un món nou i feliç! Déu és mort, i tot està permès."
