 enact_ottoman_tolerance_title:0 "Promulgar la tolerància otomana"
 enact_ottoman_tolerance_desc:0 "Tenim un gran nombre de no musulmans al nostre regne. Si els concedíssim més autonomia en els seus afers, estarien més disposats a sotmetre's al nostre govern. Tanmateix, això farà l'administració una mica més difícil."
 desc_ottoman_tolerance:0 "Hem emprès una política de més tolerància envers els no musulmans del regne. Mentre paguin els seus impostos, poden resar com vulguin."
 make_constantinople_capital_title:0 "Fer de Constantinoble la capital"
 make_constantinople_capital_desc:0 "La gloriosa ciutat que hem conquerit fa poc serà una capital esplèndida per a la nostra nació. Constantinoble és la ciutat més gran de la terra, i el nostre govern la faria molt més forta."
 LOCAL_TARIFF_MODIFIER:0 "Aranzels locals"
 GLOBAL_TARIFF_MODIFIER:0 "Aranzels globals"
 tarnish_reputation:0 "Tacar la reputació"
 tarnish_reputation_desc:0 "Es reuneix en secret amb emissaris estrangers a la capital per aconseguir que la glòria i la reputació d'aquest país es vegin amb menys bons ulls."
