 end_bosphorous_sound_toll_desc:0 "El comerç amb les nostres colònies de la mar Negra s'està reduint a un degoteig, mentre els nostres mercaders paguen uns impostos gairebé mortals quan travessen el Bòsfor. D'una manera o altra, hem de convèncer qui controli el Bòsfor que faci concessions a Gènova."
