 school_establishment_act_title:0 "Aprovar la Llei de Creació d'Escoles"
 school_establishment_act_desc:0 "Promou l'educació amb la creació d'escoles finançades amb fons públics i supervisades per l'Església."
 close_foreign_trade_title:0 "Tancar el comerç exterior"
 close_foreign_trade_desc:0 "Redueix al mínim les influències occidentals restringint el nombre de factories que poden operar els comerciants estrangers i promou normes més estrictes per al comerç exterior i l'activitat missionera en general."
 chinese_nation_title:0 "Reformar l'administració xinesa"
 chinese_nation_desc:0 "Hem modernitzat la nació i només la nostra administració continua fermament ancorada en el passat. És hora d'acabar amb l'era de la política de faccions i construir una Xina més forta."
 benign_neglect_title:0 "Negligència benigna"
 benign_neglect_desc:0 "Millora les relacions colonials concedint a les vostres colònies un cert grau d'autogovern."
 the_school_establishment_act:0 "La Llei de Creació d'Escoles"
 desc_the_school_establishment_act:0 "Es promou l'educació amb la creació d'escoles finançades amb fons públics i supervisades per l'Església."
 condemn_western_influences:0 "Condemnar les influències occidentals"
 desc_condemn_western_influences:0 "S'han adoptat normes estrictes pel que fa al comerç exterior i a l'activitat missionera."
