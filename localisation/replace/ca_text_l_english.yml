 adal_guerilla_warfareDESCR:0 "Grups més petits de guerrers dels turons de l'Àfrica oriental que fan servir tàctiques de guerrilla per fustigar l'enemic."
 adal_gunpowder_warfareDESCR:0 "Guerrers africans de l'est armats amb mosquets i amb unes tàctiques defensives força bones."
 african_clubmenDESCR:0 "Guerrers nadius tradicionals armats amb maces, l'origen de tots els guerrers."
 african_hill_warfareDESCR:0 "Guerrers dels turons amb unes habilitats defensives força bones, adaptats al clima dels turons africans."
 african_spearmenDESCR:0 "Guerrers tribals que fan servir la llança com a arma principal i escuts de fusta per defensar-se."
 african_western_franchise_warfareDESCR:0 "Guerrers africans plenament adaptats a la guerra a l'occidental."
 afsharid_reformedDESCR:0 "Cavalleria de camells armada amb mosquets durant el regnat de Nader Xah, considerat per alguns un dels caps militars més capaços de Pèrsia."
 afsharid_reformed_infantryDESCR:0 "Tropes d'infanteria armades amb mosquets durant el regnat de Nader Xah, considerat per alguns un dels caps militars més capaços de Pèrsia."
 algonkin_tomahawk_chargeDESCR:0 "Aquests guerrers eren una altra millora del guerrer bàsic de les planes. Tot i que no eren tan eficaços en el combat de xoc com el guerrer de les planes reformat, la seva mortífera pluja de projectils donava a aquestes unitats una potència d'atac addicional."
 ali_bey_reformed_infantryDESCR:0 "Tropes de cavalleria al servei del general mameluc Ali Bey, que va restablir l'estat mameluc el 1770."
 american_western_franchise_warfareDESCR:0 "Aquestes tropes ataquen amb el màxim ímpetu i sense fer cas de les seves pròpies baixes. Poden ser temibles a l'ofensiva, però una tàctica més defensiva les pot castigar."
 anglofrench_lineDESCR:0 "Les tàctiques d'infanteria de línia intentaven trobar un equilibri entre l'atac i la defensa, sense especialitzar-se en cap dels dos. Tanmateix, aquesta infanteria era més forta en foc i en xoc. El seu objectiu era fer servir les descàrregues de mosquet per desorganitzar l'enemic abans que pogués carregar, sobretot si es tractava principalment d'una força d'acció de xoc."
 archipelago_frigateDESCR:0 "Embarcació de dos pals armada amb canons, per a aigües poc profundes, que es va començar a fer servir a mitjan segle XVIII."
 asian_arquebusierDESCR:0 "L'adopció de les armes de foc va ser força lenta en algunes zones d'Àsia, però l'arc va anar cedint terreny a poc a poc. L'arcabús es va introduir durant el segle XVI i va permetre a les unitats d'infanteria una cadència de foc molt més alta, tot i que amb menys precisió."
 asian_musketeerDESCR:0 "Exèrcits asiàtics equipats amb mosquets més lleugers i manejables, que substitueixen l'antic arcabús."
 austrian_grenzerDESCR:0 "Després de la conquesta d'Hongria i Croàcia al segle XVIII, Àustria va formar un nou tipus d'unitat anomenat grenzer (que vol dir «guardes fronterers») per defensar les fronteres de les terres recentment conquerides contra els otomans. Els homes es reclutaven entre la població local i rebien terres a canvi del servei militar. Els regiments de grenzer es consideraven infanteria lleugera. Lluitaven sobretot en tasques d'escaramussa, però també podien fer d'infanteria de línia."
 austrian_hussarDESCR:0 "Durant molt de temps, a l'Europa occidental la cavalleria va ser la reina del camp de batalla. Els cavallers amb armadura pesant feien càrregues de cavalleria mortíferes. A l'est, però, adversaris com els turcs otomans, procedents d'una tradició estepària, tenien una cavalleria més lleugera, més adequada per a l'escaramussa. Aquestes unitats van demostrar el seu valor a la batalla d'Adrianòpolis, quan l'última gran croada (amb la flor i nata de la noblesa llatina) va ser aniquilada per la cavalleria lleugera i els genísers otomans. Per contrarestar-ho, l'exèrcit hongarès tenia unes quantes unitats anomenades hússars, una cavalleria més lleugera i més adequada per lluitar contra els seus adversaris otomans. Tanmateix, les primeres unitats que van arribar a Occident no van ser els hússars hongaresos lleugers, sinó els hússars alats polonesos, més pesants, que eren una barreja de cavalleria convencional i de cavalleria lleugera d'incursió."
 austrian_jaegerDESCR:0 "A l'Alemanya del segle XVIII va néixer un nou tipus d'infanteria lleugera, els jäger («caçadors»). Els jäger es feien servir per a la recerca i l'escaramussa. Al principi es reclutaven entre caçadors, guardes de caça i guardes forestals. La majoria eren excel·lents tiradors i, per això, sovint es feien servir de franctiradors que podien causar moltes baixes entre els oficials enemics. Més endavant, jäger va passar a ser un nom genèric per a tota mena d'infanteria lleugera. Altres nacions sovint contractaven tropes jäger com a mercenaris, com ara la Gran Bretanya, que les va fer servir durant la Revolució Americana."
 austrian_tercioDESCR:0 "El terç, o quadre espanyol, era una formació mixta de piquers i mosqueters desenvolupada pel general espanyol Gonzalo Fernández de Córdoba. La victòria dels exèrcits espanyols a Pavia (1525) li va donar el domini dels camps de batalla europeus durant 100 anys. Els primers terços tenien entre un 50 i un 70% de piquers. Tanmateix, el terç encara evolucionava, i a través de l'experimentació es va descobrir que es podia reduir el nombre de piquers necessaris. Aquests terços tardans podien tenir tan sols un 25% de piquers, cosa que augmentava enormement la potència de foc de la formació."
 austrian_white_coatDESCR:0 "Va néixer a la frontera militar dels Habsburg, lluitant contra els exèrcits otomans basats en la cavalleria. Les casaques blanques estaven entrenades i equipades sobretot per resistir les càrregues de cavalleria. No eren tan eficaces contra la infanteria equipada amb mosquets ni a l'ofensiva, però continuaven sent útils contra exèrcits forts basats en la cavalleria."
 aztec_gunpowder_warfareDESCR:0 "L'arribada de les armes de pólvora al Nou Món de la mà dels europeus no va canviar les tàctiques generals de la guerra americana, sinó només la tecnologia emprada. El mosqueter dels turons va continuar sent una unitat principalment defensiva, però les seves tàctiques minaven més la moral enemiga que les del guerrer de muntanya."
 aztec_hill_warfareDESCR:0 "El resistent guerrer dels turons no va ser immune als canvis tecnològics. Amb noves armes i tàctiques, aquests soldats van començar a evolucionar d'una unitat ofensiva a una unitat que donava més valor a la defensa. Tanmateix, la seva principal via cap a la victòria era colpejar la moral de l'enemic."
 aztec_tribal_warfareDESCR:0 "L'Imperi Asteca es va fundar a l'altiplà de Mèxic. La dinàmica de la cultura asteca exigia conquestes militars constants, i les unitats militars van començar a evolucionar cap a unitats d'atac especialitzades, que també donaven molta importància a la capacitat de resistència en combat."
 bantu_gunpowder_warfareDESCR:0 "Guerrers africans del sud armats amb mosquets i amb unes tàctiques ofensives força bones."
 bantu_plains_warfareDESCR:0 "Guerrers de les planes amb bones habilitats ofensives, adaptats al clima de les planes africanes."
 bantu_tribal_warfareDESCR:0 "Un guerrer tribal tradicional de l'Àfrica austral, armat amb una llança i un escut característic, que excel·lia en les estratègies ofensives."
 barqueDESCR:0 "La bricbarca era un petit veler que inicialment es feia servir per al comerç. Adaptar-les per a la guerra va proporcionar una alternativa més petita i més ràpida a les grans carraques."
 british_squareDESCR:0 "Durant la guerra de Successió d'Àustria, Àustria s'enfrontava a una derrota greu. Silèsia ja havia caigut en mans de Prússia i la desfeta total no era lluny. Per ajudar a capgirar el curs de la batalla, es van portar unitats irregulars de la frontera militar als principals camps de batalla per donar suport als atabalats exèrcits imperials. L'orde obert de la infanteria va ser revolucionari als camps de batalla europeus. Tanmateix, hi havia qui rebutjava del tot el concepte de l'escaramussador i optava per rígides tàctiques lineals. Se'ls va batejar com a infanteria en quadre per la formació que adoptaven per defensar-se de la cavalleria. Eren unitats amb una disciplina rigorosa, entrenades per disparar els mosquets a un ritme elevat i per seccions: en lloc de fer una única descàrrega i recarregar durant el combat, aquestes unitats sempre tenien una secció disparant. Aquest foc continu i mortífer podia trencar qualsevol assalt. Tanmateix, les rígides tàctiques lineals feien que aquestes unitats fossin menys mòbils i més defensives."
 british_hussarDESCR:0 "A mesura que la cavalleria s'especialitzava, l'hússar va començar a evolucionar. La unitat d'hússars es va assemblar menys a l'hússar polonès que havia entrat primer a la guerra europea i més a l'original hongarès. Aquestes tropes lleugeres i mòbils eren capaces de localitzar l'enemic, fustigar-lo, arrasar les seves posicions d'artilleria i, un cop derrotat, perseguir-lo."
 british_redcoatDESCR:0 "La casaca vermella té l'origen en l'exèrcit britànic, on la petita mida de l'exèrcit feia que fos important administrar bé els recursos. Entrenades i instruïdes per resistir el foc enemic, aquestes tropes confiaven en la pura capacitat de resistència per continuar lluitant."
 chambered_demi_cannonDESCR:0 "El segle XVI no només va veure millores en la maniobrabilitat de l'artilleria, sinó també intents d'estandarditzar la mida i el pes de les peces d'artilleria."
 defensive_chambered_demi_cannonDESCR:0 "El segle XVI no només va veure millores en la maniobrabilitat de l'artilleria, sinó també intents d'estandarditzar la mida i el pes de les peces d'artilleria."
 chinese_dragoonDESCR:0 "En essència, un soldat d'infanteria que només feia servir el cavall per desplaçar-se. No era estrany utilitzar aquestes tropes en missions d'exploració."
 chinese_footsoldierDESCR:0 "Soldats d'infanteria tradicionals de rang baix, amb armadura lleugera i armats amb una llança o una espasa."
 chinese_longspearDESCR:0 "Tropes d'infanteria equipades amb llances llargues, especialment eficaces contra les càrregues de cavalleria."
 chinese_steppeDESCR:0 "Arquers a cavall armats amb arcs compostos, famosos per la seva precisió i el seu abast. De vegades també portaven llances, que els permetien carregar contra l'enemic quan els arcs ja havien fet la seva feina."
 early_carrackDESCR:0 "La carraca primerenca va ser el primer vaixell europeu capaç de navegar mar endins per l'oceà Atlàntic. El disseny d'aquest vaixell de la baixa edat mitjana combinava trets dels vaixells llargs germànics i dels mercants àrabs. Era menys maniobrable que la caravel·la, però gràcies a la seva mida més gran podia carregar provisions per a llargs viatges, mercaderies per comerciar i canons per defensar-se."
 carrackDESCR:0 "El disseny de la carraca, un vaixell de la baixa edat mitjana, combinava trets dels vaixells llargs germànics i dels mercants àrabs. Era menys maniobrable que la caravel·la, però gràcies a la seva mida més gran podia carregar provisions per a llargs viatges, mercaderies per comerciar i canons per defensar-se. Algunes carraques, com l'anglesa «Henri Grâce à Dieu», pesaven més de mil tones, tenien grans castells de proa i de popa i es podien considerar els vaixells de guerra més grans de la seva època."
 caravelDESCR:0 "La caravel·la era un vaixell petit i molt maniobrable que podia navegar amb gran precisió en llargs viatges d'exploració. Tot i que els dissenys variaven, una caravel·la tenia una vela de proa, una vela major quadrada i una vela llatina a la mitjana. La seva mida reduïda limitava el nombre de canons a bord, però també permetia a aquest vaixell lleuger explorar aigües costaneres poc profundes i estuaris. Vasco da Gama, Cabot, Colom i Magalhães van fer servir caravel·les en els seus viatges de finals del segle XV i principis del XVI."
 chebeckDESCR:0 "Un petit vaixell de dos o tres pals, molt utilitzat a la Mediterrània a partir del segle XVI."
 coehorn_mortarDESCR:0 "Inventat per l'enginyer neerlandès baró Van Coehoorn durant el segle XVII. Un morter més petit amb el canó fix en un angle de 45 graus. L'única manera de canviar l'abast del tret era moure la peça o fer servir càrregues de pes diferent."
 defensive_coehorn_mortarDESCR:0 "Inventat per l'enginyer neerlandès baró Van Coehoorn durant el segle XVII. Un morter més petit amb el canó fix en un angle de 45 graus. L'única manera de canviar l'abast del tret era moure la peça o fer servir càrregues de pes diferent."
 cogDESCR:0 "Un vaixell mercant d'un sol pal originari del nord d'Europa."
 creek_arquebusierDESCR:0 "L'arcabusser creek descendia del guerrer del tomahawk, tot i que posava més èmfasi en el xoc i la cohesió que l'arcabusser amerindi. Aquestes unitats encara tenien un caràcter ofensiu, però les seves tàctiques no eren tan devastadores per a la moral enemiga com les de l'arcabusser amerindi i el mosqueter ofensiu."
 culverinDESCR:0 "Canons de canó força llarg desenvolupats durant els segles XVI i XVII. Eren famosos per la seva capacitat de tir a llarga distància, però alhora no eren gaire precisos a l'hora d'encertar l'objectiu."
 durrani_dragoonDESCR:0 "Tropes de cavalleria lleugera formades principalment per mercenaris afganesos sota el govern d'Ahmad Shah Abdali, més tard anomenat Durrani."
 durrani_rifled_musketeerDESCR:0 "Unitats d'infanteria afganeses al servei d'Ahmad Shah Abdali, pare de la dinastia durrani, a mitjan segle XVIII."
 durrani_swivelDESCR:0 "Unitats de cavalleria que portaven a l'esquena canons giratoris molt portàtils, cosa que permetia a les tropes disparar per sobre de la seva pròpia infanteria."
 dutch_mauricianDESCR:0 "Al segle XVI, el mosquet (una arma de foc portàtil) es va generalitzar, però era molt lent de recarregar. Els estrategs militars solien desplegar els mosqueters en formacions per maximitzar la potència de foc. Així, els mosquets es disposaven en línies (de dotze, vuit o sis files de fondària). Quan la primera fila disparava, es retirava a la rereguarda per recarregar, i aleshores disparava la fila següent. Això maximitzava la potència de foc dels mosquets del segle XVI i compensava el desavantatge de la seva lenta recàrrega. Va ser Maurici de Nassau qui va introduir aquestes formacions de mosqueters i les va ensenyar a les tropes neerlandeses durant la guerra dels Vuitanta Anys. La seva aportació a l'estratègia i la tàctica militars va fer de l'exèrcit neerlandès el més modern d'Europa."
 early_frigateDESCR:0 "Amb l'augment del comerç d'ultramar, calia un vaixell d'escorta ràpid que garantís viatges segurs. Les primeres fragates es van desenvolupar amb aquesta finalitat. Eren vaixells de guerra més petits i lleugers, amb una sola coberta de canons, i oferien protecció contra la pirateria en aigües perilloses."
 east_asian_spearmenDESCR:0 "Soldats d'infanteria de rang baix armats amb llances de fusta."
 eastern_bowDESCR:0 "Arquers a cavall que constituïen la força militar principal dels exèrcits orientals."
 eastern_knightsDESCR:0 "Com els seus homòlegs d'Occident, els cavallers orientals representaven el súmmum de la tecnologia militar. Es reclutaven entre la noblesa que es podia permetre mantenir cavalls i estaven molt ben entrenats. En aquesta època, la càrrega de cavalleria va decidir moltes batalles."
 eastern_medieval_infantryDESCR:0 "Reclutada entre els serfs i altres comunitats camperoles, aquesta infanteria mal armada i mal entrenada no serà gaire útil en combat. Però per què malbaratar la noblesa en perillosos assalts contra fortaleses?"
 eastern_militiaDESCR:0 "Reclutada entre els serfs i altres comunitats camperoles, aquesta infanteria mal armada i mal entrenada no serà gaire útil en combat. Però per què malbaratar la noblesa en perillosos assalts contra fortaleses?"
 eastindiamanDESCR:0 "Vaixell mercant de la Companyia de les Índies Orientals."
 east_mongolian_steppeDESCR:0 "Arquers a cavall equipats amb arcs compostos, que destacaven per la seva gran velocitat i potència."
 ethiopian_guerilla_warfareDESCR:0 "Grups més petits de guerrers de muntanya del nord d'Àfrica que feien servir tàctiques de guerrilla per fustigar l'enemic."
 ethiopian_gunpowder_warfareDESCR:0 "Guerrers africans del nord armats amb mosquets i amb unes tàctiques defensives superiors."
 ethiopian_mountain_warfareDESCR:0 "Guerrers de muntanya amb bones habilitats defensives, adaptats al clima de les muntanyes africanes."
 fluteDESCR:0 "Vaixell de càrrega desenvolupat als Països Baixos al segle XVI, construït per maximitzar l'espai de càrrega i l'eficiència de la tripulació. Es va convertir en un dels vaixells més utilitzats als segles XVI i XVII. El model estàndard no anava armat, però si calia es podia armar amb canons i fer servir com a vaixell auxiliar."
 french_carabinierDESCR:0 "Els carrabiners van aparèixer al segle XVI i eren un tipus de cavalleria pesant que tenia molt en comú amb els cuirassers. També portaven armadura protectora, tot i que una mica menys que un cuirasser. La principal diferència entre tots dos era l'armament. L'arma principal dels carrabiners era la carrabina, de vegades també anomenada arcabús, una arma de foc curta de pany de roda. A més de la carrabina, també anaven armats amb pistoles i una espasa."
 french_caracolleDESCR:0 "A finals del segle XVI i principis del XVII, la formació de combat més habitual de la cavalleria de l'Europa occidental era el caracol, que es podia fer servir de dues maneres. Amb el primer mètode, la primera fila de la formació de cavalleria carregava frontalment contra l'enemic, i els genets disparaven les armes a una distància de 30 a 50 passes. Després giraven, tornaven a la rereguarda de la formació i passaven a ser l'última fila. La fila següent carregava de la mateixa manera, disparava contra l'enemic i tornava a la rereguarda. Amb aquesta formació, la primera fila sempre carregava mentre les altres carregaven les armes i esperaven el seu torn. L'altre mètode consistia a carregar en filera, disparar quan els enemics quedaven a la dreta i continuar en un moviment circular, recarregant tota l'estona i tornant a reformar les línies en un atac continu."
 french_cuirassierDESCR:0 "Els cuirassers eren un tipus de cavalleria pesant que va sorgir a finals del segle XV. Aquesta cavalleria anava armada del cap fins als genolls. El cos estava protegit per un plastró, la cuirassa, de la qual van prendre el nom. El plastró estava pensat per resistir no només el tret d'una pistola, sinó també la bala d'un mosquet. Anaven armats amb pistoles de pany de roda, llances i espases. Els cuirassers es feien servir sobretot com a cavalleria de xoc i van estar en ús durant gairebé tot el període que abasta aquest joc."
 french_bluecoatDESCR:0 "Amb l'origen en els exèrcits francesos de Lluís XIV, la infanteria de casaca blava mostra un ímpetu especial en l'atac. Perfecta per als comandants convençuts que l'ofensiva sempre s'imposarà a la defensiva."
 french_dragoonDESCR:0 "Al segle XVII es va crear un nou tipus de cavalleria anomenada dragons. Els dragons eren bàsicament infanteria que es desplaçava a cavall. El nom de dragó prové de l'arma que portaven, un tipus de mosquet curt o carrabina anomenat dragon. Tots els països europeus van fer servir àmpliament els dragons, sobretot perquè eren més barats que la cavalleria normal."
 french_impulseDESCR:0 "Durant la guerra de Successió d'Àustria, Àustria s'enfrontava a una derrota greu. Silèsia ja havia caigut en mans de Prússia i la desfeta total no era lluny. Per ajudar a capgirar el curs de la batalla, es van portar unitats irregulars de la frontera militar als principals camps de batalla per donar suport als atabalats exèrcits imperials. L'ús de la infanteria en orde obert va ser revolucionari als camps de batalla europeus. La solució més extrema va ser la unitat de guerra d'impuls. Aquestes unitats desplegaven un núvol d'escaramussadors el tret constant dels quals desorganitzava i desmoralitzava l'enemic abans que la càrrega massiva de la infanteria en columna li donés el cop de gràcia."
 frigateDESCR:0 "Amb el pas del temps, la fragata va evolucionar. Es va fer més gran i més ben armada, de vegades amb dues cobertes de canons. La combinació de velocitat i potència de foc de la fragata li permetia escapar de qualsevol vaixell amb més canons i superar en potència de foc qualsevol vaixell més ràpid. La flota construïda per la Commonwealth d'Anglaterra als anys 1650 estava formada gairebé exclusivament per fragates."
 gaelic_free_shooterDESCR:0 "L'aparició d'armes de foc millors va obligar els mercenaris gaèlics a canviar de tàctica. Aquests guerrers resistents esperaven la primera descàrrega de l'enemic i després llançaven la seva càrrega irresistible."
 gaelic_galloglaighDESCR:0 "Els galloglaigh eren bandes de mercenaris de les Hèbrides que combinaven amb gran eficàcia els estils de guerra gaèlic i nòrdic tradicionals. Com molts guerrers gaèlics abans que ells, els galloglaigh feien servir la destral de batalla a dues mans, però també anaven ben protegits a l'estil nòrdic, amb cota de malla i casc. Van aparèixer a Irlanda a mitjan segle XIII i aviat es van convertir en guerrers molt cobejats al servei dels grans caps irlandesos, fins ben entrat el segle XVI. Els galloglaigh lluitaven al costat dels seus servidors en el que s'anomenava un «spar», format pel guerrer, el seu kern (un escuder gaèlic armat amb pica o javelina) i el seu mosso (armat amb un arc curt o un feix de dards). Aquests spars s'agrupaven en bandes de guerra, o corrughadh, que podien superar el centenar de membres. Els anglesos temien els galloglaigh perquè, tot i que no podien rivalitzar amb un exèrcit medieval pesant en camp obert, eren una força mortífera en enfrontaments petits i de curta distància. Per això els senyors irlandesos sovint els feien servir com a tropes de xoc en emboscades. Aquests guerrers de les Hèbrides també van triomfar en camp obert, sobretot a Bannockburn el 1314."
 gaelic_mercenaryDESCR:0 "A mesura que les armes de pólvora i les tècniques d'instrucció s'estenien per Europa, els mètodes de guerra tradicionals escocesos i irlandesos van començar a quedar obsolets: s'acabava el temps de les bandes de guerra i dels galloglaigh. Tanmateix, els mercenaris escocesos i irlandesos encara eren temuts com a combatents, sobretot pels exèrcits anglesos invasors. Els qui es van adaptar a les noves tècniques eren molt valorats per la seva bravesa i el seu coratge, especialment els redshanks d'Escòcia i els buanadha (homes allotjats) d'Irlanda. Després del segle XVI, també es podien trobar molts mercenaris escocesos i irlandesos en exèrcits de tot Europa, sobretot durant la guerra dels Trenta Anys."
 galleassDESCR:0 "La galiassa era una adaptació de la gran galera mercant per contrarestar l'ús creixent dels navilis de guerra. Més gran que la galera, la galiassa tenia uns 32 parells de rems, cadascun manejat per fins a cinc homes. Com a resposta a l'armament i als costats més alts dels navilis de guerra, la galiassa tenia castells de proa i de popa i cobertes de canons per sobre dels remers. Aquest pes addicional feia que també haguessin de dependre més de les veles, i eren més lentes i menys maniobrables que les galeres. Com la galera, la galiassa va deixar de fer-se servir habitualment amb l'arribada de navilis de guerra oceànics més avançats, però va continuar sent útil en aigües poc profundes fins al segle XVIII."
 galleonDESCR:0 "Un gran veler, normalment de tres pals, dissenyat originalment com a vaixell de guerra però que més endavant es va fer servir sobretot per al comerç."
 galleyDESCR:0 "Amb arrels en els vaixells de l'antiguitat, la galera va continuar sent l'opció preferida per a la guerra naval a la Mediterrània fins al segle XVI. La galera es propulsava principalment amb rems, normalment uns 25 parells manejats per fins a tres homes cadascun. Això feia que depengués menys del vent que els velers, i la seva maniobrabilitat la convertia en un adversari temible. Finalment, la galera va deixar de fer-se servir habitualment amb l'arribada de navilis de guerra oceànics més avançats, però va continuar sent útil en aigües poc profundes fins al segle XVIII."
 germanized_pikeDESCR:0 "Quan els gots van derrotar els romans a la batalla d'Adrianòpolis, es va anunciar una nova era en la guerra europea. La cavalleria es va convertir en la força dominant al camp de batalla i la infanteria va quedar relegada a fer de base perquè la cavalleria hi maniobrés al voltant. Les victòries angleses a la guerra dels Cent Anys, tot i que amb exèrcits d'infanteria, es basaven en tàctiques defensives. Tanmateix, els piquers suïssos de finals del segle XV van tornar a donar a la infanteria un paper ofensiu. Els països de l'Europa de l'Est ho van notar ràpidament i van convidar mercenaris alemanys perquè els ensenyessin aquestes noves tàctiques."
 han_bannerDESCR:0 "Tropes d'infanteria Ming armades amb mosquets que es van incorporar al sistema de banderes creat originalment pels manxús durant el segle XVII."
 heavy_frigateDESCR:0 "Vaixells de dues cobertes que normalment portaven uns 40 canons."
 houfniceDESCR:0 "Es creu que els obusos moderns deuen el nom a l'artilleria houfnice desenvolupada pels hussites al segle XV. Aquests canons de canó curt es muntaven en carros i es feien servir al camp de batalla per disparar bales i metralla en suport de la infanteria."
 huron_arquebusierDESCR:0 "El guerrer del tomahawk ja posava molt èmfasi en les tàctiques de foc abans de l'arribada de la pólvora. Aprofitant els avantatges d'aquestes armes, l'arcabusser amerindi posava molt èmfasi en el foc ofensiu i la cohesió en combat. No era tan eficaç en l'acció de xoc com el mosqueter ofensiu."
 inca_mountain_warfareDESCR:0 "A mesura que apareixien noves armes i tàctiques, els resistents guerrers de muntanya van començar a millorar. Aquests guerrers encara donaven prioritat a la defensa i confiaven la victòria a la seva capacitat de resistència. Les millores en l'armadura i l'entrenament feien que vèncer aquestes unitats fos una tasca difícil."
 irish_chargeDESCR:0 "Els descendents directes dels mercenaris gaèlics d'èpoques anteriors. Aquestes unitats ho apostaven tot a les càrregues d'infanteria per matar i atemorir els enemics. La seva càrrega podia ser més devastadora que la de la cavalleria de l'època, cosa que les feia temibles en l'atac."
 iroquois_rifle_scoutDESCR:0 "L'explorador amb fusell és una unitat especialitzada a fustigar l'enemic. Potser no aguanta tant en combat com una unitat més disciplinada, però aquests guerrers són tiradors excel·lents i la seva destresa amb el fusell pot causar danys greus a l'enemic."
 italian_condottaDESCR:0 "Condotta és la paraula italiana per a «contracte», i es feia servir per designar les unitats de mercenaris que lluitaven sobretot a Itàlia per a les diverses ciutats estat. Els caps d'un regiment de condotta s'anomenaven condottieri. Els més famosos van ser sir John Hawkwood, Francesco Sforza i Bartolomeo Colleoni. Les condotte no eren gaire lleials als qui les contractaven i sovint canviaven de bàndol per una paga més alta. Quan les condotte lluitaven entre si, també pactaven no fer-se gaire mal, i la guerra a Itàlia sovint esdevenia una mena de teatre. Els regiments de condotta estaven formats per cavallers amb armadura, infanteria pesant i lleugera i ballesters. Les condotte tenien el monopoli de la guerra a Itàlia, cosa que feia que encara fessin servir armes i tàctiques antigues quan els altres exèrcits europeus ja havien adoptat una infanteria de mosqueters i piquers."
 japanese_archerDESCR:0 "Els arquers eren la força més important de les batalles asiàtiques d'aquesta època. Els arcs normalment eren de bambú, però en general més llargs que els europeus."
 japanese_footsoldierDESCR:0 "Els soldats d'infanteria eren els guerrers de rang més baix de la jerarquia de l'època. Eren plebeus i nobles de classe baixa, i constituïen el gruix de l'exèrcit del governant. Al principi, els soldats d'infanteria eren només mercenaris i aventurers que cobraven amb el botí, però més endavant es van convertir en una part essencial de l'exèrcit del senyor local. A mesura que les batalles i les guerres es feien més complexes i els exèrcits més grans, se'ls va entrenar a fons perquè poguessin mantenir la posició davant l'avanç de les forces enemigues. Els soldats d'infanteria anaven armats sobretot amb llances, però alguns portaven espases o katanes i d'altres manejaven màquines de guerra, a més de dur arcs diversos. En general portaven una armadura lleugera, feta de peces de cuir cosides entre si o d'una barreja de cuir i ferro o coure. Això els feia més àgils al camp de batalla, però de vegades vulnerables davant dels adversaris. En períodes posteriors, els soldats d'infanteria també van rebre armes de foc."
 japanese_samuraiDESCR:0 "Els samurais eren els nobles de l'època al Japó. «Samurai» volia dir «servir». Tenien una bona educació i un entrenament extraordinari en el combat. Combinaven la lluita amb les arts i la literatura com a passatemps. Els samurais es regien per un codi anomenat bushido, que vol dir «camí del guerrer». Si el seu senyor moria o perdia una guerra, el codi bushido els exigia cometre seppuku (suïcidi ritual). S'esperava que els samurais fessin el mateix i seguissin el seu senyor a l'altra vida. El samurai era un adversari temut al camp de batalla, perquè estava molt entrenat en les arts del combat. Podia manejar la katana amb gran destresa o fer servir el yumi (arc llarg japonès), tant a cavall com a peu."
 large_cast_bronze_mortarDESCR:0 "Els canons més grans de l'època eren tan enormes que calien centenars d'homes i de bous per moure'ls. Tenien un poder destructiu immens, però només podien disparar unes quantes vegades al dia per la dificultat de carregar i apuntar aquestes bèsties."
 large_cast_iron_bombardDESCR:0 "Una versió més gran de la bombarda estàndard. Aquesta peça d'artilleria de setge europea primerenca es va dissenyar per llançar objectes pesants contra les defenses enemigues. Un exemple notable de gran bombarda és la Mons Meg, que Felip III de Borgonya va enviar com a regal al rei Jaume II d'Escòcia el 1453. Tot i que eren armes devastadores, les bombardes més grans trigaven molt a refredar-se després de cada tret, de manera que eren poc útils al camp de batalla i es reservaven sobretot per als setges."
 leather_cannonDESCR:0 "El canó de cuir el van fer servir per primer cop els exèrcits del rei Gustau II Adolf de Suècia durant la tercera guerra polonesosueca. L'artilleria europea d'aquella època era massa gran i pesant per moure's pel camp de batalla i només es feia servir de debò en els setges. L'aparició d'un canó més lleuger i mòbil va permetre als suecs maniobrar la seva artilleria per respondre als moviments de l'enemic i els va donar un clar avantatge tàctic sobre els seus rivals. Malauradament, el canó de cuir dels suecs tenia un punt feble que el feia molt poc pràctic. Format per un tub estret de coure recobert de corretges de cuir i corda, el seu embolcall feia que el canó s'escalfés perillosament quan es feia servir de manera continuada. Tot i així, el canó de cuir va marcar l'inici del desenvolupament de l'artilleria de campanya lleugera i del concepte de portar una gran potència de foc fins a l'enemic."
 defensive_leather_cannonDESCR:0 "El canó de cuir el van fer servir per primer cop els exèrcits del rei Gustau II Adolf de Suècia durant la tercera guerra polonesosueca. L'artilleria europea d'aquella època era massa gran i pesant per moure's pel camp de batalla i només es feia servir de debò en els setges. L'aparició d'un canó més lleuger i mòbil va permetre als suecs maniobrar la seva artilleria per respondre als moviments de l'enemic i els va donar un clar avantatge tàctic sobre els seus rivals. Malauradament, el canó de cuir dels suecs tenia un punt feble que el feia molt poc pràctic. Format per un tub estret de coure recobert de corretges de cuir i corda, el seu embolcall feia que el canó s'escalfés perillosament quan es feia servir de manera continuada. Tot i així, el canó de cuir va marcar l'inici del desenvolupament de l'artilleria de campanya lleugera i del concepte de portar una gran potència de foc fins a l'enemic."
 mali_tribal_warfareDESCR:0 "Un guerrer tribal tradicional del nord d'Àfrica, armat amb una llança i un escut característic, que excel·lia una mica més en les estratègies defensives."
 mamluk_archerDESCR:0 "Guerrers esclaus no musulmans, capturats de petits i entrenats per lluitar per als seus amos islàmics, constituïen una part essencial del sistema militar del món islàmic. El tir amb arc no només formava part del seu entrenament militar, sinó que també ocupava bona part del seu lleure, cosa que en feia unitats d'arquers excel·lents."
 mamluk_cavalry_chargeDESCR:0 "Guerrers esclaus no musulmans, capturats de petits i entrenats per lluitar per als seus amos islàmics, constituïen una part essencial del sistema militar del món islàmic. Més endavant, quan es van convertir a la fe islàmica, les tàctiques de cavalleria i l'equitació van passar a ser una part fonamental del seu entrenament."
 mamluk_duelDESCR:0 "Infanteria especialitzada en el combat singular, amb l'espasa com a arma principal."
 mamluk_musket_chargeDESCR:0 "Malgrat la resistència inicial, al segle XVIII els mosquets es van acabar incorporant a la càrrega de cavalleria tradicional."
 manchu_bannerDESCR:0 "Unitat de cavalleria lleugera del sistema militar de les banderes, desenvolupat pels manxús a principis del segle XVII. El sistema estava pensat per organitzar tota la població, civils i soldats, en divisions militars."
 maya_forest_warfareDESCR:0 "El guerrer de la selva va continuar millorant a mesura que apareixien noves tecnologies i tàctiques. Mantenint l'equilibri entre atac i defensa, va seguir millorant en tots dos àmbits."
 maya_guerilla_warfareDESCR:0 "Aquestes unitats no aguanten tant en combat com les altres unitats de guerrilla, però ho compensen amb una eficàcia més gran en l'ofensiva. Sacrifiquen capacitat de resistència a canvi de poder infligir més danys a l'enemic."
 maya_gunpowder_warfareDESCR:0 "El mosqueter de la selva es va mantenir fidel a les tàctiques que li havien servit abans de la pólvora. L'equilibri entre atac i defensa es va mantenir, però ara les armes de pólvora introduïdes pels europeus els feien encara més mortífers."
 maya_tribal_warfareDESCR:0 "Els boscos i les selves de l'Amèrica Central eren la llar de la civilització maia. El terreny no era tan obert com més al nord, cosa que donava més avantatges al defensor. Aquí van sorgir unitats militars aptes tant per a l'atac com per a la defensa, tot i que no s'especialitzaven en cap dels dos."
 merchantmanDESCR:0 "Un gran vaixell de càrrega que es feia servir per transportar mercaderies."
 mexican_guerilla_warfareDESCR:0 "La guerrilla centreamericana s'especialitza en atacs per minar la moral enemiga. Tot i que causa més baixes que la guerrilla sud-americana, també és una mica més fàcil de desgastar."
 mongol_bowDESCR:0 "Tropes d'infanteria lleugera que normalment s'utilitzaven a la primera fase d'una batalla. La seva funció era fer ploure fletxes sobre les tropes adversàries per rebaixar-ne la moral abans de l'atac de la força principal."
 mongolian_bowDESCR:0 "Unitats de cavalleria especialitzades en tècniques d'emboscada. Esperaven amagades els enemics, els atacaven per sorpresa i després es retiraven ràpidament abans que l'enemic tingués temps de reagrupar-se."
 mongol_steppeDESCR:0 "Arquers a cavall equipats amb arcs compostos, que destacaven per la seva gran velocitat i potència."
 mongol_swarmDESCR:0 "Arquers a cavall especialitzats en atacs en eixam, en què l'objectiu era aclaparar els enemics atacant-los en massa."
 steppe_riders:0 "Genets de l'estepa"
 steppe_ridersDESCR:0 "A les vastes extensions de l'estepa, la cavalleria va continuar sent l'arma dominant durant molt més temps que en altres regions. Com que això es devia sobretot a l'extrema mobilitat que permetia aquell terreny, les tropes muntades van continuar anant armades de manera força lleugera fins i tot després de l'arribada de les armes de pólvora. Abans de l'aparició d'armes de foc més lleugeres, els arcs, les espases i les llances lleugeres van continuar sent les armes preferides de la cavalleria de l'estepa, de Crimea a Manxúria."
 steppe_lancers:0 "Llancers de l'estepa"
 steppe_lancersDESCR:0 "Les tàctiques tradicionals de l'estepa, amb arquers i llancers a cavall, van continuar dominant els camps de batalla, i les incursions en terres sedentàries aportaven tant armes més modernes com els coneixements per fer-les servir."
 steppe_mounted_raiders:0 "Saquejadors muntats de l'estepa"
 steppe_mounted_raidersDESCR:0 "Amb el pas del temps, tant les armes de foc com les tàctiques per fer-les servir van millorar. Tot i que no superarien les armes tradicionals dels genets de l'estepa, aviat les armes de foc van passar a formar part de la guerra a cavall de l'estepa. A mesura que els canons es feien més lleugers i petits, alguns també es podien transportar a cavall i fer servir a les fronteres sempre canviants de les planes."
 steppe_cavalry:0 "Cavalleria de l'estepa"
 steppe_cavalryDESCR:0 "La cavalleria de l'estepa va continuar excel·lint en les incursions, les escaramusses i el reconeixement, i molts països sedentaris de la frontera de l'estepa van acabar fent servir cosacs, tàtars i altres genets de l'estepa per a aquestes tasques. Els costums lliures de l'estepa es van mantenir en molts aspectes en aquestes unitats, però la seva existència va contribuir en certa mesura a un canvi d'organització i a una evolució cap a una estructura d'exèrcit més moderna."
 steppe_uhlans:0 "Ulans de l'estepa"
 steppe_uhlansDESCR:0 "Amb el temps, els exèrcits de l'estepa van dependre menys del saqueig i el pillatge per cobrir les despeses d'operació i més de la paga d'un comandament centralitzat. Les seves tàctiques encara es basaven en la mobilitat i en armes lleugeres com les pistoles i les llances, i en terreny obert encara podien ser força mortífers per a una força sedentària desprevinguda. Però en lloc de dominar el camp de batalla pel seu compte, ara sovint feien de complement d'altres tipus de tropes, com els hússars o fins i tot la infanteria."
 steppe_raiders:0 "Saquejadors de l'estepa"
 steppe_raidersDESCR:0 "Tot i que van aparèixer aviat, les armes de foc van trigar a marcar diferències a les estepes per la naturalesa mòbil de la guerra. La cavalleria va continuar sent l'arma dominant dels exèrcits de l'estepa durant tota l'edat moderna primerenca, fins que les armes de foc es van fer més lleugeres i precises. Els ganivets i les espases van continuar sent durant molt de temps les armes preferides de la infanteria de l'estepa en el combat cos a cos."
 steppe_footmen:0 "Infants de l'estepa"
 steppe_footmenDESCR:0 "La naturalesa mòbil de la guerra a l'estepa significava que la infanteria sempre estaria en desavantatge davant la cavalleria pel que fa a la mobilitat, i en els grans paisatges oberts això feia que moltes tàctiques d'infanteria sedentàries fossin molt menys viables a les planes. Per contrarestar-ho, la infanteria de l'estepa sovint formava fortins de carros durant la batalla, que li donaven una mobilitat protegida al camp de batalla. Protegida pels fortins de carros, la infanteria podia fer servir armes de foc i arcs sense deixar d'estar a resguard dels atacs de la cavalleria."
 steppe_musketeers:0 "Mosqueters de l'estepa"
 steppe_musketeersDESCR:0 "Per ser eficaç a l'estepa, la infanteria va continuar creant fortins mòbils al camp de batalla, des d'on podia fer servir contra l'enemic mosquets i canons més lleugers sense el risc que les càrregues de la lleugera cavalleria de l'estepa li trenquessin les formacions. Els soldats armats lleugerament també feien incursions més endins en terres enemigues amb barques pels grans rius de les planes."
 steppe_infantry:0 "Infanteria de l'estepa"
 steppe_infantryDESCR:0 "Amb canons i armes de foc cada cop més lleugers i precisos, els fortins de carros de l'estepa es podien fer servir de manera més ofensiva. Tot el fortí es desplaçava alhora fins a posicions defensives des d'on podia descarregar una pluja de foc de mosquet i de canó. A mesura que avançava la batalla, la cavalleria sortia de dins del fortí contra l'enemic en fugida. Els canons que es feien servir eren de calibre tan petit que es podien portar a cavall amb la host quan es desplaçava per l'estepa."
 steppe_rifles:0 "Fusellers de l'estepa"
 steppe_riflesDESCR:0 "Tot i que els fonaments de la guerra a l'estepa no van canviar, l'evolució general de la guerra va acabar comportant diversos canvis en els exèrcits de les hosts. A mesura que les potències sedentàries feien retrocedir les fronteres de l'estepa lliure, fortificant zones abans nòmades i creant els seus propis regiments de cosacs, tàtars i similars, els mateixos països de l'estepa sovint van acabar dominats pels seus veïns i van adoptar-ne les millors armes i les idees més organitzades."
 reformed_steppe_rifles:0 "Fusellers de l'estepa reformats"
 reformed_steppe_riflesDESCR:0 "A finals del segle XVIII, els exèrcits de l'estepa havien passat en molts aspectes per transicions semblants a les dels exèrcits d'occident. Tot i que la guerra va continuar sent més mòbil que a les regions sedentàries, l'equipament i l'organització van evolucionar cap al model dels exèrcits permanents. Tanmateix, la mobilitat i les tàctiques antigues, com les incursions i els atacs per sorpresa amb barques, es van continuar fent servir regularment fins al segle XIX."
 muscovite_caracolleDESCR:0 "En descobrir que una infanteria en formació compacta podia resistir l'acció de xoc de la cavalleria, i que les armes de pólvora causaven un tribut terrible a l'atacant, calien noves tàctiques de cavalleria. Una de les primeres va ser el caracol (o espiral), en què la cavalleria feia servir el foc per desorganitzar les formacions d'infanteria abans d'intentar una càrrega. Desenvolupat a Occident al segle XVI, aviat es va estendre cap a l'est."
 muscovite_cossackDESCR:0 "La cavalleria cosaca va evolucionar progressivament amb el pas del temps. En lloc de ser una força de cavalleria de xoc com els nous hússars més pesants, es va especialitzar en les escaramusses i feia servir pistoles per desorganitzar l'enemic."
 muscovite_musketeerDESCR:0 "Amb l'ús a gran escala de les armes de pólvora als camps de batalla de l'Europa de l'Est, es van començar a desenvolupar noves unitats per aprofitar-les. Amb l'origen en els strelsí de Moscòvia, aquestes unitats van evolucionar cap a unitats armades amb mosquets que posaven l'accent en l'atac més que en la defensa."
 muscovite_soldatyDESCR:0 "L'arribada del terç a la guerra de l'Europa de l'Est va topar amb els qui consideraven el terç massa defensiu i creien que la infanteria s'havia de fer servir de manera més ofensiva. La infanteria soldaty va ocupar aquest paper."
 native_indian_archerDESCR:0 "Els pobles caçadors-recol·lectors van aprendre aviat a valorar un home que tingués bona punteria amb l'arc. En temps de pau, podia marcar la diferència entre morir de fam o sobreviure; en temps de guerra, entre la derrota o la victòria."
 native_indian_mountain_warfareDESCR:0 "Alguns dels guerrers més durs dels amerindis eren els pobles de muntanya. Sovint empesos a les muntanyes per enemics més forts, havien de ser durs per sobreviure."
 native_clubmenDESCR:0 "El guerrer indígena amb maça és l'origen de tots els guerrers: agafeu una cosa dura i pegueu a l'adversari."
 native_indian_tribal_warfareDESCR:0 "Quan els indígenes es van agrupar en tribus, que sovint protegien zones concretes, sovint va sorgir un estat de guerra endèmica. El camí de la guerra era una manera de demostrar la pròpia vàlua i sovint un ritu de pas per als joves."
 niger_kongolese_forest_warfareDESCR:0 "Guerrers de la selva amb unes habilitats ofensives i defensives força bones, adaptats al clima de les selves africanes."
 niger_kongolese_guerilla_warfareDESCR:0 "Grups més petits de guerrers de la selva de l'Àfrica central que feien servir tàctiques de guerrilla per fustigar l'enemic."
 niger_kongolese_gunpowder_warfareDESCR:0 "Guerrers africans de l'oest armats amb mosquets i amb unes tàctiques defensives i ofensives força bones."
 niger_kongolese_tribal_warfareDESCR:0 "Un guerrer tribal tradicional de l'Àfrica central, armat amb una llança i un escut característic. Un combatent equilibrat, bo tant en les estratègies ofensives com en les defensives."
 ottoman_azabDESCR:0 "Els azabs eren o bé unitats d'infanteria lleugera que actuaven com a arquers, o bé soldats d'infanteria equipats amb espasa i escut i especialitzats en el combat cos a cos."
 ottoman_janissaryDESCR:0 "Unitats d'infanteria formades originalment per esclaus i presoners de guerra, que constituïen el gruix de la guàrdia personal i els protectors del soldà."
 ottoman_lancerDESCR:0 "El soldà otomà Selim III va començar el seu regnat amb una reforma militar a fons. Una unitat de cavalleria més occidentalitzada, armada amb llança, va substituir la cavalleria existent."
 ottoman_new_modelDESCR:0 "El soldà otomà Selim III va començar el seu regnat amb una reforma militar a fons. Es va dissenyar un nou tipus de tropa d'infanteria occidentalitzada per substituir els genísers, que durant tant de temps havien estat la força més important de l'exèrcit otomà."
 ottoman_nizami_cedidDESCR:0 "Una infanteria musulmana reformada, influïda per les escoles i les tàctiques de l'Europa occidental. Aquests guerrers van adoptar uniformes i armes europeus i també van aplicar estratègies militars occidentals en el seu entrenament."
 ottoman_musellemDESCR:0 "Unitat de cavalleria lleugera formada sovint per mercenaris estrangers."
 ottoman_reformed_janissaryDESCR:0 "A finals del segle XVII, els genísers, juntament amb els sipahis, constituïen el gruix de les unitats militars del món musulmà occidental."
 ottoman_reformed_spahiDESCR:0 "A finals del segle XVII, els genísers, juntament amb els sipahis, constituïen el gruix de les unitats militars del món musulmà occidental."
 ottoman_sekbanDESCR:0 "Unitat d'infanteria provincial formada per camperols convertits en soldats."
 ottoman_spahiDESCR:0 "Una unitat de cavalleria musulmana d'elit força semblant als cavallers d'Europa."
 ottoman_timariotDESCR:0 "Una unitat de cavalleria al servei directe del soldà. El timariota rebia un tros de terra a canvi dels seus serveis, però també estava obligat a aportar el seu propi equipament i els seus propis servents en temps de guerra."
 ottoman_toprakli_dragoonDESCR:0 "Una unitat de cavalleria provincial equipada amb sabre o carrabina i coneguda per la seva destresa a cavall."
 ottoman_toprakli_hit_and_runDESCR:0 "Una unitat de cavalleria lleugera coneguda per la seva mobilitat i rapidesa. Normalment era la primera divisió que atacava l'exèrcit enemic, amb una tàctica d'atac i retirada."
 ottoman_yayaDESCR:0 "Una infanteria musulmana d'arquers també coneguda com a piyade. Les tropes yaya eren formades sobretot per mercenaris, sempre estaven en alerta i per això sovint cobraven molt bé pels seus serveis militars."
 pedreroDESCR:0 "Canons relativament lleugers en comparació amb les colobrines, que feien servir bales de pedra com a munició perquè pesaven menys que les de ferro."
 persian_cavalry_chargeDESCR:0 "Tropes de cavalleria equipades amb espases d'una mà de fulla estreta i molt corbada. Més eficaces en càrregues contra tropes d'infanteria o de cavalleria sense armadura."
 persian_footsoldierDESCR:0 "Soldat d'infanteria de rang baix, normalment armat amb una espasa."
 persian_rifleDESCR:0 "Durant l'època qajar, l'exèrcit persa va passar per àmplies reformes occidentalitzadores. Amb l'ajuda de consellers estrangers, les tropes es van entrenar en les estratègies i tecnologies militars occidentals."
 persian_shamshirDESCR:0 "Infanteria equipada amb espases d'una mà de fulla estreta i molt corbada. Més eficaç contra infanteria o cavalleria sense armadura."
 peruvian_guerilla_warfareDESCR:0 "La guerrilla sud-americana és un adversari dur. Tot i que no causa gaires danys a l'enemic, pot costar molt de temps desgastar aquestes unitats."
 polish_hussarDESCR:0 "L'hússar original era una unitat de cavalleria lleugera pensada sobretot per a les escaramusses. Tanmateix, el camp de batalla exigia unitats més pesants i més ben protegides. Així, l'hússar va evolucionar fins a donar lloc als famosos hússars alats."
 polish_musketeerDESCR:0 "Amb la difusió creixent de les armes de pólvora, aviat es va plantejar què havia de fer al camp de batalla la infanteria armada amb mosquets. A Polònia va sorgir una escola de pensament segons la qual els mosqueters s'havien de fer servir com a arma defensiva en suport de la cavalleria."
 polish_tercioDESCR:0 "Tot i que el terç va arribar a dominar els camps de batalla europeus, inicialment era massa lent per ser útil als camps de batalla més oberts i dominats per la cavalleria de l'Europa de l'Est. Tanmateix, a mesura que el terç va reduir el component de piquers i va guanyar potència de foc, es va fer més útil als camps de batalla orientals."
 polish_winged_hussarDESCR:0 "A l'edat mitjana, els cavallers muntats havien dominat el camp de batalla, però després els van substituir els mosqueters i els piquers. Al segle XVII, les forces de cavalleria encara es feien servir per l'efecte sorpresa a les batalles, però sovint tenien poques possibilitats contra piquers disciplinats. Per això a l'Europa occidental la cavalleria es feia servir poc. A l'Europa de l'Est, amb les seves vastes estepes, la cavalleria va continuar sent molt important, i els hússars alats hi van tenir un paper clau. Els polonesos van desenvolupar un sabre corbat excel·lent (el «palasz»), seleccionaven els cavalls especialment per la seva velocitat i resistència i portaven llances de sis metres capaces de travessar l'armadura d'un piquer. Els hússars alats es van convertir en una cavalleria fortament cuirassada que va guanyar innombrables combats contra enemics molt diversos. Van tenir un paper clau en el llegendari aixecament del setge turc de Viena per part de Joan Sobieski el 1683. Joan Sobieski va llançar quatre grups de cavalleria d'hússars en una càrrega furiosa que va trencar la línia de batalla turca i va dispersar els turcs en plena confusió. Aquesta victòria dels hússars alats polonesos va fer que Joan Sobieski fos aclamat com el «salvador de Viena»."
 prussian_uhlanDESCR:0 "Els primers ulans es van crear a principis del segle XVIII. Es feien servir sobretot per a tasques de reconeixement per a la cavalleria pesant, i també en escaramusses. Més endavant, al segle XVIII, es van convertir en una part essencial de l'estructura militar gràcies a l'armadura lleugera, que els feia ràpids i àgils al camp de batalla, i al seu gran poder de xoc contra els enemics, que en alguns casos va capgirar el curs de les batalles. Els ulans eren una bona alternativa als grans exèrcits d'infanteria, perquè no només colpejaven fort sinó que també eren més rendibles. Això permetia a països més petits i amb menys efectius plantar cara de manera eficaç, ja que els exèrcits a peu també eren més lents que els seus equivalents a cavall."
 prussian_drillDESCR:0 "Els soldats instruïts eren soldats entrenats a fons perquè sabessin exactament què havien de fer en una situació de combat. També era menys probable que trenquessin files mentre lluitaven contra l'enemic. Un exemple en són els soldats instruïts prussians, que eren dels soldats més ben entrenats i equipats del món de l'època. Eren molt disciplinats i estaven preparats per a gairebé qualsevol situació. Tenien tan bona reputació que les colònies americanes van demanar instructors prussians perquè entrenessin els colons i poguessin lluitar contra els britànics."
 pueblo_ambushDESCR:0 "Al terreny accidentat dels peus de les Muntanyes Rocalloses, es van començar a desenvolupar noves tàctiques basades en l'emboscada. Aquestes unitats no tenien la capacitat de resistència de la infanteria de muntanya, però sí que minaven la moral de l'enemic amb les seves tàctiques d'emboscada."
 qizilbash_cavalry_unitDESCR:0 "Unitats de cavalleria, armades amb llança, espasa o arc, fàcils de reconèixer pel seu tocat de ratlles vermelles i daurades, que portaven per expressar la seva devoció a la branca duodecimana de l'islam xiïta."
 reformed_asian_cavalryDESCR:0 "Cavalleria asiàtica occidentalitzada i més adaptada a les tàctiques i les estratègies occidentals."
 reformed_asian_musketeerDESCR:0 "Infanteria asiàtica occidentalitzada, equipada amb mosquets i més adaptada a les tàctiques i les estratègies occidentals."
 reformed_manchu_rifleDESCR:0 "Un exèrcit desenvolupat sota la dinastia Qing després de la conquesta manxú de la Xina. Aquest exèrcit constituïa el gruix de les operacions militars i estava format sobretot per soldats xinesos han."
 royal_mortarDESCR:0 "Durant el segle XVIII, l'ús de l'artilleria al camp de batalla es va estendre. Ara les tropes podien moure les peces de campanya amb molta més facilitat i rapidesa."
 defensive_royal_mortarDESCR:0 "Durant el segle XVIII, l'ús de l'artilleria al camp de batalla es va estendre. Ara les tropes podien moure les peces de campanya amb molta més facilitat i rapidesa."
 russian_cossackDESCR:0 "Els cosacs van continuar sent una part essencial dels exèrcits de l'Europa de l'Est. Tot i que no eren tan disciplinades ni tan eficaces en la càrrega com la cavalleria pesant, aquestes unitats lleugeres s'especialitzaven en les incursions i els trets a distància per desorganitzar els adversaris."
 russian_cuirassierDESCR:0 "El cuirasser pren el nom de la cuirassa, un plastró que portaven les unitats de cavalleria més pesants. Armades amb una espasa pesant en lloc d'un sabre lleuger, aquestes unitats són temibles quan carreguen. Normalment amb el suport d'unitats de cavalleria equipades amb carrabines que els donen més contundència, aquestes unitats aporten poder de xoc a qualsevol exèrcit."
 russian_massDESCR:0 "Les tàctiques d'infanteria en massa van trencar amb les tàctiques lineals que havien dominat durant tant de temps. Aquestes unitats es poden resumir amb dues màximes del famós general rus Suvórov: «entrenament dur, combat fàcil» i «la bala és ximple, la baioneta és valenta». Era una infanteria de xoc molt ben instruïda que preferia la càrrega en massa al foc de mosquet."
 russian_green_coatDESCR:0 "A mesura que s'importaven més idees de l'Europa occidental, el soldat d'infanteria oriental es va assemblar molt més al seu homòleg occidental. La infanteria de casaca verda tenia l'origen a Rússia, i els seus mètodes d'entrenament i el seu equipament occidentals donaven a les unitats més capacitat de resistència en combat que mai. També va representar el pas de les tàctiques defensives petrines a una unitat més ofensiva."
 russian_lancerDESCR:0 "Els hússars de l'Europa de l'Est feia temps que anaven equipats amb una llança, a més d'altre equipament. La llança era una arma poderosa en l'atac, perquè permetia al genet arribar a l'enemic abans que l'enemic pogués arribar a ell; però un cop l'enemic aconseguia superar la llança, el llancer era vulnerable. La cavalleria equipada amb llances era molt forta en l'atac però feble en defensa."
 russian_petrineDESCR:0 "La infanteria petrina té les arrels en la derrota dels exèrcits russos a la batalla de Narva durant la Gran Guerra del Nord. L'exèrcit havia estat desfet de manera decisiva per l'exèrcit suec, més ben entrenat però inferior en nombre, i necessitava noves tàctiques si volia triomfar. Entrenada amb una disciplina de ferro, la infanteria petrina excel·lia en la defensa. Les seves tàctiques es basaven a desgastar la capacitat de lluita de l'enemic amb la pura capacitat de resistència."
 saxon_infantryDESCR:0 "August el Fort, elector de Saxònia, no només era famós per haver engendrat més bastards que cap altre monarca europeu: també era rei de Polònia. Durant el seu regnat va introduir a l'exèrcit polonès tàctiques d'infanteria més ofensives, i les unitats es van conèixer com a infanteria saxona."
 scottish_highlanderDESCR:0 "Les divisions d'infanteria de les Terres Altes, una força tan reconeixible en molts dels exèrcits actuals de la Commonwealth, tenen les arrels en el sistema de clans semifeudal del nord i l'oest d'Escòcia. Els highlanders escocesos eren membres de clans amb armadura lleugera, sovint equipats amb la tradicional espasa escocesa de guarda de cistella, la claymore, i amb ganivets petits anomenats dirks. Més endavant, els soldats highlanders també portaven pistoles. Eren temuts per la ferocitat del seu atac, sobretot la famosa càrrega highlander, amb què destrossaven les línies enemigues. Després de les revoltes jacobites, els highlanders escocesos es van anar integrant a l'exèrcit britànic. Les primeres tropes highlanders d'aquest tipus van ser la Black Watch, o 42è Regiment d'Infanteria Highlander, que va lluitar amb valentia a Fontenoy durant la guerra de Successió d'Àustria. Posteriorment, els regiments highlanders es van convertir en una força de combat temuda, coneguda sobretot per la seva bravesa i per negar-se a rendir-se."
 shaybaniDESCR:0 "Una unitat de cavalleria que sovint recorria a tàctiques militars indirectes, fustigant i fent incursions contra els enemics."
 slavic_stradiotiDESCR:0 "Els estradiots van sorgir a les zones albaneses i gregues dels Balcans. Amb poca armadura o cap, anaven armats amb sabres, llances i maces. Aquesta cavalleria lleugera era excel·lent per a la cobertura, el reconeixement i les incursions contra enemics desorganitzats o en fugida. Amb la caiguda de Bizanci, molts es van refugiar a occident, i alguns creuen que la cavalleria d'estradiots venecians de finals del segle XV va introduir a occident les tàctiques modernes de cavalleria lleugera."
 small_cast_iron_bombardDESCR:0 "Una forma primerenca d'artilleria europea que es feia servir tant en setges com en defensa. La bombarda era un canó senzill capaç de llançar projectils contra les defenses enemigues. El projectil preferit sovint era una bola de metall o una pedra grossa, pensada per danyar les fortificacions més que el personal enemic. Fins i tot les bombardes més petites eren pesants i difícils de moure ràpidament durant la batalla, cosa que en limitava l'ús contra formacions d'infanteria i cavalleria."
 songhai_tribal_warfareDESCR:0 "Un guerrer tribal tradicional de l'Àfrica occidental, armat amb una llança i un escut característic, que excel·lia en les estratègies defensives."
 south_american_gunpowder_warfareDESCR:0 "Amb l'arribada dels europeus a Amèrica, la població local va conèixer les armes de pólvora. Els avantatges es van fer evidents i només era qüestió de temps que apareguessin unitats amb mosquets. El mosqueter defensiu descendia dels guerrers de muntanya i seguia un model d'organització i uns objectius semblants, però ara armat amb un mosquet. Aquesta unitat és més forta en la defensa, però les noves armes de pólvora li donen més contundència en l'atac."
 south_american_spearmenDESCR:0 "La unitat bàsica dels exèrcits de l'Amèrica del Sud. Normalment eren lleves camperoles dirigides per oficials aristòcrates i armades amb llança i escut. Aquesta unitat era la columna vertebral dels exèrcits d'estats com l'Imperi Inca."
 south_american_warfareDESCR:0 "Les altes muntanyes dels Andes creaven un entorn molt més favorable a la defensa que a l'atac. Hi va haver una evolució gradual en què la infanteria es va començar a especialitzar en la defensa i la capacitat de resistència més que en l'atac."
 spanish_tercioDESCR:0 "La infanteria de terç la va desenvolupar principalment el brillant general Gonzalo Fernández de Córdoba (el Gran Capità) durant les guerres d'Itàlia. Era una formació d'infanteria mixta de piquers i mosqueters. Gràcies a aquesta combinació d'armes, la formació gaudia alhora de la solidesa de la infanteria pesant i de la potència de foc a llarga distància dels mosqueters, cosa que en feia una formació ideal tant per defensar com per atacar. Les formacions de terços, amb els seus soldats professionals disciplinats i valents, van ser famoses als camps de batalla europeus per ser gairebé invencibles en combat durant els segles XVI i XVII. El seu domini dels camps de batalla europeus es va acabar definitivament amb la derrota espanyola davant dels francesos a la batalla de Rocroi el 1643. A partir d'aleshores s'imposaria un nou sistema de combat, promogut per Gustau Adolf."
 swedish_arme_blancheDESCR:0 "Mentre que la cavalleria d'hússars representava l'equilibri entre el foc i el xoc, i la cavalleria de dragons confiava sobretot en els mosquets, la cavalleria d'arma blanca confiava sobretot en l'acer fred. Les càrregues audaces d'aquestes unitats podien desfer les formacions enemigues."
 swedish_carolineDESCR:0 "Les reformes militars del rei suec Carles XI van crear una nova força d'infanteria especialitzada en l'atac. Unes devastadores descàrregues de mosquet eren el preludi d'una càrrega en massa."
 swedish_gallopDESCR:0 "La cavalleria de caracol armada amb pistoles va arribar a dominar les tàctiques de cavalleria europees a l'Europa de l'Est, tot i que encara es feia servir la tradicional cavalleria de xoc dels hússars. Els exèrcits entrenats a la manera de l'Europa occidental sovint sortien perdent en el combat contra aquestes unitats. Arran del vessament de sang de les guerres poloneses, l'exèrcit suec va desenvolupar un tipus d'unitat diferent: la cavalleria de galop sueca. Tot i que encara anaven armats amb pistoles com els del caracol, no les disparaven abans de l'acció de xoc, sinó com a part de la mateixa càrrega. Els resultats van ser devastadors durant la guerra dels Trenta Anys i van obligar la cavalleria de caracol imperial a adaptar-se molt de pressa."
 swedish_gustavianDESCR:0 "A principis del segle XVII, el mosquet encara trigava molt a carregar-se i el foc de mosquet s'havia de concentrar en descàrregues per ser destructiu, ja que les armes eren molt imprecises i fallaven sovint. Un temps de recàrrega tan lent feia que la unitat fos molt vulnerable si totes les armes disparaven alhora. Des de l'època de Maurici de Nassau, aquest problema s'havia superat disposant la unitat en línies (de dotze, vuit o sis files de fondària). Quan la primera fila disparava, es retirava a la rereguarda per recarregar, i aleshores disparava la fila següent. Gustau Adolf, el gran rei suec, va millorar notablement aquesta tàctica d'infanteria mauriciana. Va entrenar tan bé les seves tropes que va poder reduir el nombre de files a només tres (una agenollada, la segona ajupida i la tercera dreta) i tot i així mantenir un foc continu."
 swiss_landsknechtenDESCR:0 "Els lansquenets eren un tipus d'infanteria creat a principis del segle XVI al Sacre Imperi Romanogermànic. Anaven armats sobretot amb una llança llarga o una pica. Es considera que Georg von Frundsberg en va ser el creador. Els lansquenets lluitaven sobretot en una formació quadrada anomenada quadre de piques. També eren famosos per la roba elaborada que portaven al camp de batalla."
 swivel_cannonDESCR:0 "Un canó molt maniobrable i portàtil. El canó giratori era força petit i estava pensat sobretot per al combat a curta distància."
 defensive_swivel_cannonDESCR:0 "Un canó molt maniobrable i portàtil. El canó giratori era força petit i estava pensat sobretot per al combat a curta distància."
 tartar_cossackDESCR:0 "El cosac va continuar evolucionant com a unitat. L'ús de noves armes i tàctiques va donar a les unitats més capacitat de resistència en el combat de foc i més poder de xoc."
 threedeckerDESCR:0 "Un gran vaixell de línia equipat amb tres cobertes de canons, que normalment portava més de 100 canons."
 tofongchis_musketeerDESCR:0 "Malgrat les reticències inicials, els mosquets es van anar acceptant cada cop més a finals del segle XVI. L'avantatge de les armes de foc s'havia fet innegable i els mosquets van anar entrant a poc a poc a les forces d'infanteria musulmanes."
 topchis_artilleryDESCR:0 "Unitat de cavalleria musulmana armada amb un mosquet de metxa."
 twodeckerDESCR:0 "Un vaixell de línia de dues cobertes, normalment equipat amb 60 a 90 canons."
 wargalleonDESCR:0 "El galió de guerra era un gran galió equipat per a la guerra. Era més gran i més ben armat que els galions normals i servia d'escorta protectora de les flotes de galions. Les flotes d'Índies espanyoles estaven formades per galions i galions de guerra."
 westernized_adalDESCR:0 "Guerrers de l'Àfrica oriental, una mica influïts per les tàctiques militars defensives occidentals."
 westernized_aztecDESCR:0 "Amb l'arribada dels mètodes d'entrenament occidentals i de nou equipament, el guerrer dels turons es va convertir en un combatent molt més eficaç. Els nous mètodes d'entrenament van donar a la unitat molta més cohesió en combat, mentre que el nou equipament en va millorar les capacitats tant en l'atac com en la defensa. Tanmateix, el guerrer dels turons va continuar sent una unitat principalment defensiva."
 westernized_bantuDESCR:0 "Guerrers de l'Àfrica austral influïts per les tàctiques i estratègies militars ofensives occidentals."
 westernized_ethiopianDESCR:0 "Guerrers del nord d'Àfrica influïts per les tàctiques i estratègies militars defensives occidentals."
 westernized_mayanDESCR:0 "A mesura que s'estenien les idees militars occidentals, ni tan sols el guerrer de la selva americà va ser immune al canvi. Les noves tècniques d'entrenament van millorar la capacitat d'aquesta unitat per resistir el foc en combat."
 westernized_niger_kongoleseDESCR:0 "Guerrers de l'Àfrica central influïts per les tàctiques militars defensives i ofensives occidentals."
 westernized_south_americanDESCR:0 "La infanteria sud-americana occidentalitzada va succeir els guerrers de muntanya d'èpoques anteriors. L'entrenament i l'equipament occidentals han millorat aquestes unitats en tots els aspectes, però continuen tenint un enfocament defensiu."
 westernized_zapotecDESCR:0 "Les noves tàctiques militars d'Europa s'estenien lentament per Amèrica. Els nous mètodes d'entrenament van reforçar la cohesió del guerrer de les planes, mentre que el nou equipament va augmentar l'eficàcia de la unitat en tots els àmbits del combat."
 western_longbowDESCR:0 "L'arc llarg era una arma de projectils que feia servir sobretot la infanteria d'Anglaterra i Gal·les entre els segles XIV i XVI. Era una arma molt precisa, de llarg abast i prou potent per travessar la cota de malla. Els anglesos la van fer servir amb gran èxit a la guerra dels Cent Anys contra França, sobretot a les batalles de Crécy i Azincourt. Amb el desenvolupament de la pólvora, l'arc llarg va quedar obsolet. No perquè fos menys potent que els primers mosquets, sinó perquè per ser un bon arquer amb arc llarg calia entrenar durant molts anys, mentre que ensenyar a fer servir armes de foc era molt més fàcil."
 western_medieval_infantryDESCR:0 "El soldat bàsic dels exèrcits de l'Europa occidental. Solien ser lleves camperoles amb poca o cap formació i un equipament molt pobre. Tanmateix, desplegades en massa podien ser devastadores."
 western_medieval_knightsDESCR:0 "El cavaller medieval va néixer als regnes francs, on els guerrers a cavall rebien concessions de terres a canvi del seu servei militar. Aquest concepte d'una poderosa elit guerrera es va estendre per l'Europa occidental i es va convertir en una part fonamental del sistema feudal, en què els cavallers formaven part de la petita noblesa. Amb l'aparició de la sella envolvent i els estreps, els cavallers van passar a portar més armadura i a poder carregar contra la infanteria enemiga amb una força mortífera. També se sabia que lluitaven a peu amb armes pesants de cos a cos quan les circumstàncies ho exigien."
 western_men_at_armsDESCR:0 "L'home d'armes era un soldat professional dels exèrcits de l'Europa occidental de la baixa edat mitjana. Els cavallers i les famílies nobles contractaven uns quants homes d'armes per formar el seu seguici. Solien anar més ben armats i protegits que el soldat d'infanteria feudal corrent. Durant la guerra dels Cent Anys, els homes d'armes eren els soldats que lluitaven a cavall o amb armament pesant, però que no tenien una posició social prou alta per ser considerats cavallers. Els més ben equipats i entrenats es coneixien com a sergents d'armes."
 zapotec_gunpowder_warfareDESCR:0 "Ni tan sols el guerrer de les planes, que posava l'accent en la bravesa a l'atac, podia ignorar els avantatges del mosquet arribat d'Europa. Els nous mosqueters ofensius continuaven posant l'accent en l'atac, però les armes de pólvora els donaven més potència de foc."
 zapotec_plains_warfareDESCR:0 "El guerrer de les planes era la unitat ofensiva per excel·lència a Amèrica, però ni tan sols ell va ser immune al progrés. Les noves armes i tàctiques van permetre a les unitats millorar la seva capacitat ofensiva, mentre que els nous mètodes d'entrenament van ajudar aquests guerrers a mantenir la moral en combat."
 zapotec_tribal_warfareDESCR:0 "El territori de l'imperi zapoteca creava unes condicions molt adequades per a la guerra ofensiva. Aquí es van desenvolupar unitats militars especialitzades en l'atac que feien servir tàctiques pensades per minar la moral dels adversaris."
 zaporoghian_cossackDESCR:0 "La comunitat cosaca es va formar originalment a la frontera de l'estepa entre Moscòvia i Polònia, d'una banda, i els tàtars, de l'altra. En aquest entorn salvatge d'incursions constants, s'hi van desenvolupar comunitats militars de genets. Aviat van ser molt sol·licitats com a genets resistents, encara que indisciplinats."
 zulu_chest_and_hornsDESCR:0 "Una estratègia militar africana desenvolupada pel cap Shaka durant el segle XVIII. Els guerrers envoltaven l'enemic situant grups més petits de guerrers als flancs esquerre i dret, que representaven les banyes d'un búfal, mentre que un grup més gran se situava al mig i representava el pit."
