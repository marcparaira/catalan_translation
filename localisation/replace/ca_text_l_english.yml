 couronian_nation_desc:0 "La croada del Nord s'ha acabat fa temps. La nostra identitat de croats aviat no ens aportarà res de res i potser, algun dia, acabarà sent una càrrega... Si secularitzem l'estat i el reformem en un ducat dirigit per l'antic gran mestre i els seus cavallers (ara el duc i els seus vassalls), podrem treure l'estat de la decadència i millorar la nostra situació diplomàtica."
