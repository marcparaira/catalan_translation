 ALWAYS_TRUE:0 "Sempre"
 infiltrate_administration:0 "Infiltrar-se en l'administració"
 infiltrate_administration_desc:0 "Infiltra espies a la burocràcia enemiga per esbrinar què fa (elimina la boira de guerra)."
 REMOVE_FOW:0 "Elimina la boira de guerra de $COUNTRY$ durant $MONTHS$ mesos."
 RENAME_PROV_EFF:0 "$OLD$ passa a anomenar-se §Y$NEW$§W.\n"
 make_st_petersburg_capital_title:0 "Fer de Sant Petersburg la capital"
 make_st_petersburg_capital_desc:0 "Com a estat més orientat cap a l'oest, Rússia ha de tenir la capital a l'oest, i Sant Petersburg serà el nostre far gloriós!"
 establish_siberian_frontier_title:0 "Cap a l'est, a Sibèria!"
 establish_siberian_frontier_desc:0 "Sibèria és immensa i encara no l'hem cartografiada del tot. Podríem patrocinar algú valent perquè encapçali una expedició més endins d'aquestes vastes riqueses, i potser fins i tot fundi una ciutat nova."
 establish_russian_patriarchate_title:0 "Establir el Patriarcat Rus"
 establish_russian_patriarchate_desc:0 "Constantinoble ja no és el baluard i la defensa de la cristiandat. Hem de recollir-ne el testimoni i establir una tercera Roma."
 russian_patriarchate:0 "Patriarcat Rus"
 desc_russian_patriarchate:0 "El Patriarcat Rus dona força i fe al nostre poble. Permetrà a la nació superar dificultats més grans que qualsevol altre estat."
 IS_NOT_CAPITAL:0 " no és la província capital"
 IS_CAPITAL:0 " és la província capital"
 total_occupation:0 "Províncies pròpies ocupades"
 total_blockaded:0 "Ports propis bloquejats"
 WAR_EXHUASTION_LABEL:0 "Esgotament bèl·lic"
 WE_MODIFIED_BY:0 "Es modifica cada mes per "
 christian_mecca:0 "La conquesta de la Meca"
 desc_christian_mecca:0 "Hem conquerit la ciutat santa de la Meca, el lloc sagrat de l'islam, en nom de Crist."
 jerusalem_held:0 "La conquesta de Jerusalem"
 desc_jerusalem_held:0 "Controlem la ciutat santa de Jerusalem, sagrada per a musulmans, jueus i cristians."
 mahayana_louyang:0 "Conquesta de Luoyang"
 desc_mahayana_louyang:0 "Controlem el Temple del Cavall Blanc de Luoyang, el temple budista més antic de la Xina i un dels llocs sants més importants del budisme mahayana fora de l'Índia."
 coptic_alexandria:0 "Conquesta d'Alexandria"
 desc_coptic_alexandria:0 "Controlem Alexandria, seu del papa copte i la comunitat cristiana més gran de l'Orient."
 vajrayana_lhasa:0 "Conquesta de Lhasa"
 desc_vajrayana_lhasa:0 "Controlem els llocs sants del Tibet, on hi ha alguns dels monestirs més antics i importants del budisme vajrayana."
 theravada_kotte:0 "Conquesta dels temples de Lanka"
 desc_theravada_kotte:0 "Controlem els llocs sants de Lanka, on hi ha alguns dels monestirs més antics i venerats del budisme theravada i on es troba la dent sagrada de Buda."
 hindu_varanasi:0 "La conquesta de Varanasi"
 desc_hindu_varanasi:0 "Controlem la ciutat santa de Varanasi, la ciutat més sagrada de l'hinduisme."
 buddhist_bodh_gaya:0 "La conquesta de Bodh Gaya"
 desc_buddhist_bodh_gaya:0 "Controlem Bodh Gaya, sagrat per a tots els budistes."
 mayan_chichen_itza:0 "La conquesta de Chichén Itzá"
 desc_mayan_chichen_itza:0 "Amb la reforma de la religió maia i la restauració del pelegrinatge a Chichén Itzá, hem arribat a controlar un lloc sagrat per a tots els qui segueixen la nostra religió."
 inti_lima:0 "Conquesta de Pachacamac"
 desc_inti_lima:0 "Controlem l'oracle de Pachacamac, sagrat per a tots els qui segueixen la fe inti."
 nahuatl_cholula:0 "Conquesta de Cholula"
 desc_nahuatl_cholula:0 "Controlem els temples de Cholula, sagrats per a tots els qui segueixen la fe nàhuatl."
 sikh_amritsar:0 "La conquesta d'Amritsar"
 desc_sikh_amritsar:0 "Controlem la ciutat santa d'Amritsar, sagrada per als sikhs de tot el món."
 rely_on_polish_hussars_title:0 "Confiar en els hússars polonesos"
 rely_on_polish_hussars_desc:0 "Les vastes extensions de les estepes fan que la cavalleria sembli el tipus d'unitat més lògic al voltant del qual construir el nostre exèrcit. Hem vist l'eficàcia dels mercenaris hongaresos com a hússars i creiem que la Confederació es beneficiaria de tenir unitats pròpies d'un tipus semblant."
 polish_hussars:0 "Confiança en els hússars polonesos"
 desc_polish_hussars:0 "Hem decidit afavorir la cavalleria en els nostres exèrcits, i això ha abaratit molt el reclutament d'unitats de cavalleria."
 move_capital_to_warsawa_title:0 "Traslladar la capital a Varsòvia"
 move_capital_to_warsawa_desc:0 "Amb la incorporació del ducat de Masòvia, Varsòvia s'ha convertit en la seu del Sejm. Potser seria assenyat traslladar-hi la seu del govern reial per poder treballar millor amb la noblesa? "
 desc_venetian_arsenal:0 "L'immens Arsenale Novissimo és una meravella digna de veure, un dels complexos de construcció naval més grans de la Mediterrània. Permet construir galeres molt més barates del que seria possible altrament."
 expand_venetian_arsenal_title:0 "Ampliar l'Arsenal de Venècia"
 expand_venetian_arsenal_desc:0 "L'Arsenal de Venècia existeix des del segle XII i fins i tot Dante el fa servir a l'Infern per descriure l'infern: «Com a l'arsenal dels venecians bull tot l'hivern la pega enganxosa per adobar-ne les naus malmeses i esparracades.» Tanmateix, ens preguntem si no és ara el moment d'ampliar l'arsenal."
 move_the_court_to_versailles_title:0 "Traslladar la cort a Versalles"
 move_the_court_to_versailles_desc:0 "Les terres al voltant del petit poble de Versalles fa temps que són un excel·lent terreny de caça, i el petit pavelló de caça s'ha anat ampliant fins a convertir-se en un castell d'aspecte grandiós. No seria escaient fer-ne ara la seu del govern francès?"
 enact_edict_de_nantes_title:0 "Promulgar l'Edicte de Nantes"
 enact_edict_de_nantes_desc:0 "El regne estava tan dividit per innombrables faccions i sectes que el més legítim de tots els partits era el menys nombrós. Déu ens ha donat forces per resistir aquesta tempesta, i per fi hem superat les onades i hem arribat al nostre port segur: la pau per al nostre estat."
 revoke_edict_de_nantes_title:0 "Revocar l'Edicte de Nantes"
 revoke_edict_de_nantes_desc:0 "Hem determinat que no podem fer res millor que revocar completament l'esmentat Edicte de Nantes, amb els articles especials concedits com a continuació, així com tot el que s'ha fet des d'aleshores en favor de l'esmentada religió"
 edict_de_nantes:0 "Edicte de Nantes"
 desc_edict_de_nantes:0 "Amb 92 articles, 56 articles secrets i dues cartes patents, l'Edicte de Nantes era un acord global per als problemes religiosos que turmentaven França, encara que als ulls de molts no era més que una solució temporal del problema."
 say_the_state_is_me_title:0 "«L'État c'est moi»"
 say_the_state_is_me_desc:0 "Si el dret a governar se'ns ha concedit per la gràcia de Déu, i només de Déu, no hem de permetre que altres homes, inferiors, limitin els drets que Déu ens ha donat."
 the_state_is_me:0 "L'État c'est moi"
 desc_the_state_is_me:1 "Tot i que alguns consideren apòcrifa aquesta cita atribuïda a Lluís XIV, en certa manera resumeix la naturalesa de la monarquia absoluta. El monarca no ha d'estar limitat per la tradició, els privilegis locals o la noblesa. Al contrari, com a primer entre iguals, ha de ser l'únic timoner de la nau de l'estat."
 MODIFIER_DIPLO_SKILL:0 "Reputació diplomàtica"
 establish_habsburg_dominance_title:0 "Establir el domini dels Habsburg"
 establish_habsburg_dominance_desc:0 "Bella gerant alii, tu felix Austria nube"
 desc_habsburg_dominance:0 "La dinastia dels Habsburg per fi s'ha consolidat com la dinastia més prestigiosa d'Europa. Quan els nostres diplomàtics truquen a la porta, la gent escolta."
 WARE_EFFECTS:1 "L'§Yesgotament bèl·lic§! té els efectes següents:\n"
 devshirme_system_title:0 "Ampliar el sistema del devshirme"
 devshirme_system_desc:0 "Allistant homes joves de les terres conquerides recentment, hem augmentat considerablement l'eficiència del nostre procés de reclutament. Continuem ampliant i perfeccionant aquest sistema a mesura que el nostre estat creix."
 janissary_event_tooltip_devs:0 "L'esdeveniment §YEls genísers§! tindrà lloc d'aquí a §Y12 anys§!"
 provincial_system_title:0 "Adoptar el sistema de govern provincial"
 provincial_system_desc:0 "Nomenar governadors provincials, o «beis», sens dubte pot millorar l'administració dels impostos i altres afers, però, amb menys control directe sobre les nostres províncies, també és possible que governadors ambiciosos passin la major part del temps enredats en intrigues i baralles internes."
 provincial_taxation_system_title:0 "Introduir el sistema d'impostos provincials"
 provincial_taxation_system_desc:0 "Si establim un sistema permanent d'impostos provincials, podrem optimitzar considerablement els guanys per al tresor."
 LEDGER_TARIFFS:0 "Aranzels"
 the_devshirme_system:0 "Sistema del devshirme"
 desc_the_devshirme_system:1 "Des de finals del segle XIV fins a mitjan segle XVII, la dinastia otomana va adquirir esclaus per a la seva casa mitjançant la pràctica del devshirme. Infants no musulmans escollits amb cura, normalment cristians dels Balcans rurals d'entre 12 i 14 anys, eren enviats a viure amb famílies turques per aprendre el turc i les normes de l'islam abans de ser portats a la capital imperial. La majoria s'incorporaven als genísers, un exèrcit permanent d'infanteria entrenat amb una disciplina estricta, mentre que els qui mostraven una capacitat especial de lideratge i intel·lectual eren admesos directament a la casa del soldà com a patges, on eren educats i, si tenien èxit, podien ascendir als rangs més alts de l'elit politicomilitar otomana. Com que la seva subsistència depenia del governant, aquests esclaus, coneguts com a kul, mostraven una lleialtat intensa i van ser crucials perquè la dinastia otomana establís un control centralitzat sobre l'imperi."
 the_provincial_system:0 "Sistema de govern provincial"
 desc_the_provincial_system:0 "Amb el nomenament de governadors provincials hem millorat l'administració dels impostos i altres afers, però també hem fet més probable que governadors ambiciosos passin la major part del temps enredats en intrigues i baralles internes."
 promote_national_merchants_title:0 "Promoure els mercaders nacionals"
 promote_national_merchants_desc:0 "Concentra tots els esforços a promoure els mercaders nacionals per augmentar-ne l'eficiència i la competitivitat a canvi d'algunes reduccions d'impostos."
 national_merchants:0 "Mercaders nacionals"
 desc_national_merchants:0 "Concentrant tots els esforços a promoure els mercaders nacionals, n'hem augmentat tant l'eficiència com la competitivitat; malauradament, com a conseqüència, els nostres ingressos fiscals se'n ressenten."
 CURRENT_POSITION:0 "Posició actual"
 reparations_of_the_great_wall_title:0 "Reparació de la Gran Muralla"
 reparations_of_the_great_wall_desc:0 "Algunes parts de la Gran Muralla necessiten urgentment una reparació a fons. En el seu estat actual, no ofereix prou protecció a les nostres províncies del nord."
 great_wall_reparations:0 "Reparacions de la Gran Muralla"
 desc_great_wall_reparations:0 "Algunes parts de la Gran Muralla s'han reparat a fons per protegir les nostres fronteres del nord."
 assimilate_province_title:0 "Assimilar la província"
 assimilate_province_desc:0 "Encoratja els ciutadans d'aquesta província a adoptar la cultura principal del nostre estat i els seus costums."
 FOW_IS_NOT_LIFTED:0 "La boira de guerra no s'ha eliminat"
 FOW_IS_LIFTED:0 "La boira de guerra s'ha eliminat"
 HAVE_GLOBAL_FLAG:0 "Tenir l'indicador global "
 HAVE_NOT_GLOBAL_FLAG:0 "NO tenir l'indicador global "
 middle_east:0 "L'Orient Mitjà"
 central_asia:0 "Àsia Central"
 MODIFIER_ADDED:2 "$WHERE$ rep «$WHAT|Y$» $TIME$, amb els efectes següents:\n$EFFECT$\n\n"
 MODIFIER_ADDED_TIME_FOREVER:0 "fins al final de la partida"
 MODIFIER_ADDED_TIME_DURATION:0 "durant $DURATION|Y$"
 MODIFIER_ADDED_TIME_DATE:0 "fins al $DATE|Y$"
 promote_printing_industry_title:0 "Promoure la indústria de la impremta"
 promote_printing_industry_desc:0 "Tot i que la impremta no es va inventar aquí, la gent ja n'està veient el potencial. Encara que els més conservadors, com l'Església, creuen que la impremta és una eina de Satanàs, altres pensen que Venècia en sortirà beneficiada si li donem suport."
 desc_printing_industry:0 "La capacitat de produir en massa la paraula escrita és, en certa manera, una arma de doble tall. Ha fomentat la innovació i el progrés tecnològic, però també dona a la gent idees estranyes que no sempre són útils."
 enact_stato_da_mar_title:0 "Promulgar l'«Stato da Mar»"
 enact_stato_da_mar_desc:0 "Venècia mira en dues direccions: tenim els nostres interessos polítics al nord d'Itàlia i els nostres interessos comercials a la Mediterrània. Per assegurar que els nostres interessos comercials estiguin protegits, hauríem de dividir la nostra administració en dues i que l'Stato da Mar gestioni els interessos comercials."
 desc_stato_da_mar:0 "L'Stato da Mar és el terme oficial per a les possessions venecianes fora d'Itàlia. L'organització administrativa d'aquestes terres està totalment orientada al control del mar i al comerç, i els mercaders en noten els beneficis."
 allow_fuggers_title:0 "Permetre el control financer dels Fugger."
 allow_fuggers_desc:0 "La fundació del banc dels Mèdici el 1397 va situar aquesta influent família al centre de la banca europea; tanmateix, uns préstecs imprudents han posat el banc en dificultats i noves famílies riques n'ocupen el lloc. La família Fugger, una rica família tèxtil de Suàbia, ens ha ofert els seus serveis."
 desc_fugger_banks:0 "A canvi de certes concessions feudals, la família Fugger ens ha ofert els seus serveis. Ens permet reunir diners molt més de pressa i més barat que els nostres rivals."
 establish_hofkriegsrat_title:0 "Establir el Hofkriegsrat"
 establish_hofkriegsrat_desc:0 "El Hofkriegsrat el va establir Ferran I el 1556, i era responsable del reclutament, del subministrament de municions i aliments a les tropes i del manteniment de les fortaleses."
 desc_hofkriegsrat:0 "El Hofkriegsrat el va establir Ferran I el 1556, i era responsable del reclutament, del subministrament de municions i aliments a les tropes i del manteniment de les fortaleses."
 desc_spanish_inquisition:0 "Ningú no s'ho esperava"
 establish_spanish_inquisition_title:0 "Establir la Inquisició espanyola"
 establish_spanish_inquisition_desc:0 "Un país que resa unit es manté unit. El Regne d'Espanya és un conjunt de diversos estats amb el monarca com a única força unificadora. Hem de garantir l'ortodòxia religiosa si volem mantenir unit el país."
 commission_gold_fleet_title:0 "Encarregar la flota de l'or."
 commission_gold_fleet_desc:0 "El Nou Món ofereix grans oportunitats a qui les sàpiga aprofitar, i les oportunitats més importants són les que pertanyen a la corona. Un sistema regular de combois per al transport de mercaderies no només seria més fàcil de defensar, sinó també de gravar amb impostos."
 desc_gold_fleet:0 "Tot i que és més famosa pel transport d'or i plata del Nou Món, la flota del tresor era de fet un sistema de combois que transportava una gran varietat de mercaderies del Nou Món."
 establish_afonsine_ordinances_title:0 "Establir les Ordenacions Afonsines"
 establish_afonsine_ordinances_desc:0 "En qualsevol estat construït durant l'època feudal, la noblesa terratinent té un gran poder i els seus interessos no sempre són els nostres. Si de debò volem seguir el camí de l'expansió naval, hem de retallar els seus privilegis."
 desc_afonsine_ordinances:0 "En termes senzills, consistien a substituir la noblesa per funcionaris reials a l'hora d'administrar justícia. Però, en un nivell més profund, eren una expressió de la importància de la corona (i l'autoritat central) davant dels nobles (i els interessos locals)."
 remember_the_navigator_title:0 "Recordar el Navegant"
 remember_the_navigator_desc:0 "Enric el Navegant (nascut el 1394) va ser el tercer fill de Joan I de Portugal. Sabent que mai no seria rei, va dedicar la vida a fomentar l'exploració i l'art de navegar portuguesos. Va deixar a Portugal un gran llegat."
 desc_legacy_of_the_navigator:0 "Els esforços del príncep Enric el Navegant per promoure l'art de navegar i l'exploració a Portugal encara es noten avui dia."
 the_societas_jesu:0 "La Societas Jesu"
 desc_the_societas_jesu:0 "Els jesuïtes són les tropes de xoc de la renovació catòlica. Formats especialment en tècniques per convertir la gent al catolicisme, són una força poderosa per convèncer infidels i heretges de veure la llum."
 institute_the_societas_jesu_title:0 "Instituir la Societas Jesu"
 institute_the_societas_jesu_desc:0 "Sa Santedat ha aprovat un nou orde missioner anomenat Companyia de Jesús. Tanmateix, sense el suport reial no prosperarà. Donem suport als jesuïtes? "
 use_highland_charge_title:0 "Fer servir la càrrega de les Terres Altes"
 use_highland_charge_desc:0 "Des dels temps de William Wallace, les tropes de les Terres Altes han carregat amb una valentia devastadora. Tanmateix, l'ús creixent d'armes de projectils fa més perillosa la càrrega en massa; hauríem de fer servir una càrrega en ordre molt més obert i deixar que l'home de les Terres Altes mostri al món que val almenys per deu de les Terres Baixes, probablement més."
 highland_charge:0 "Càrrega de les Terres Altes"
 desc_highland_charge:0 "Una càrrega en ordre obert d'infanteria de les Terres Altes, ferotge però no gaire disciplinada. Ben executada, alguns la consideraven imparable."
 establish_british_merchant_navy_title:0 "Establir la marina mercant britànica"
 establish_british_merchant_navy_desc:0 "Com a nació insular, sempre dependrem del mar per al comerç. Per tant, hem de promoure la marina mercant per garantir que el nostre comerç prosperi."
 acknowledge_britanna_rules_the_waves_title:0 "Cantar «Britània regna sobre les ones»"
 acknowledge_britanna_rules_the_waves_desc:0 "Regna, Britània!\nBritània regna sobre les ones.\nEls britans mai, mai, mai no seran esclaus."
 establish_the_wooden_wall_title:0 "Fer de la flota la nostra muralla de fusta"
 establish_the_wooden_wall_desc:0 "Si volem defensar la nostra illa, hem de tenir una flota. Fem de la flota la nostra muralla de fusta."
 NOCOLLANDLOCKED:0 "Aquesta província no té accés al mar i no és adjacent a cap de les nostres províncies plenament desenvolupades."
 WARTAX_TIP_DELAYED:0 "Els impostos de guerra duraran §Y$DURATION$§! anys."
 WARTAX_STOP_TIP:0 "Podem deixar de cobrar impostos de guerra."
 STOP_WARTAXES:0 "Aturar els impostos de guerra"
 form_kingdom_of_prussia_title:0 "Formar el Regne de Prússia"
 form_kingdom_of_prussia_desc:0 "Només hi ha un rei a l'Imperi, el rei de Bohèmia. Alhora, les nostres terres de Prússia no són una part històrica de l'Imperi; proclamem-nos reis a Prússia per reflectir que el nostre rang és més alt que el dels altres electors."
 bg_decision_taken:0 "$MONARCHNAME$ $ADJECTIVE2$ $WHICH$."
 bg_dec_tak_1_1:0 "va optar assenyadament per"
 bg_dec_tak_1_2:0 "va decidir"
 bg_dec_tak_1_3:0 "va seguir el consell de la cort i va decidir"
 bg_dec_tak_1_4:0 "va decidir amb saviesa"
 bg_dec_tak_1_5:0 "va decidir, contra el seu bon criteri,"
 FE_LUCK:0 "Nacions afortunades"
 LUCK_HISTORICAL:0 "Històriques"
 LUCK_RANDOM:0 "Aleatòries"
 LUCK_NONE:0 "Cap"
 desc_indelningsverket:0 "El sistema d'assignació suec dividia la pagesia en grups de deu per al reclutament. Aquest sistema facilitava trobar gent per servir a l'exèrcit i organitzar-la en unitats."
 create_indelningsverket_title:0 "Crear l'«Indelningsverket»"
 create_indelningsverket_desc:0 "Per reclutar millor homes per a la guerra, el sistema de reclutament es reorganitzarà de manera que cada districte sigui responsable de proporcionar un home a l'exèrcit en temps de guerra. Així sabrem exactament d'on treure homes per a l'exèrcit, i el reclutament serà més fàcil."
 institute_the_absolutism_title:0 "Instituir l'absolutisme"
 institute_the_absolutism_desc:0 "Hem de donar una base filosòfica al nostre govern. Si promovem la doctrina de l'absolutisme, els nobles ens donaran més suport."
 use_finnish_cavalry_title:0 "Fer servir la cavalleria finlandesa"
 use_finnish_cavalry_desc:0 "Finlàndia és un lloc força pobre i endarrerit, i el servei a l'exèrcit suec dona a la gent excel·lents oportunitats de prosperar econòmicament gràcies al saqueig. Això ens permet reclutar una cavalleria excel·lent i temuda que els nostres enemics asseguren que és invulnerable gràcies a la bruixeria, tot i que no n'estem segurs del tot."
 finnish_cavalry:0 "Hakkapeliitta"
 desc_finnish_cavalry:0 "A horribile Haccapaelitorum agmine libera nos, Domine'"
 use_swedish_steel_title:0 "Utilitzar l'acer suec"
 use_swedish_steel_desc:0 "Mentre altres exèrcits disparen descàrregues imprecises contra els seus enemics, nosaltres hi marxarem en files disciplinades, farem una sola descàrrega a curta distància i després els farem tastar l'acer fred."
 desc_swedish_steel:0 "Bet Kind, bet Kind, morgen kommt der Schwede'"
 DIPLO_SKILL_IMPACT:0 "Quan es negocia diplomàticament amb altres països, això també es modifica en §Y$VALUE$§W, a causa de..."
 PREVIOUS_MISSION_WASNT:0 "La darrera missió no va ser "
