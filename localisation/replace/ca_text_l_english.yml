 tut_1b_39:0 "A la dreta de la vista de província, al costat de les monedes, hi ha la producció econòmica de la província. A sota hi ha el recurs principal de la província i la seva producció. Tots els recursos produïts s'envien a un node comercial, on qualsevol nació pot enviar mercaders per competir per una part dels beneficis. Si feu clic al botó del node comercial, anireu a la subvista del node comercial."
 tut_miss_19_task:0 "Enviar un mercader al node comercial que inclou $province$"
 tut_miss_19_hint:0 "Per enviar un mercader a un node comercial, feu clic a una província que enviï la seva producció a aquell node i després feu clic al botó per accedir a la vista del node comercial. Els mercaders s'envien fent clic al botó d'enviar amb la icona d'un mercader."
 tut_miss_22_hint:0 "Per obtenir el monopoli d'un node comercial, heu de tenir sis mercaders al node."
 MODIFIER_LOCAL_COT_GRAVITY:0 "Atractiu del node comercial local"
 MODIFIER_GLOBAL_COT_GRAVITY:0 "Atractiu nacional dels nodes comercials"
 plutocratic_administration_desc:0 "En els països que depenen econòmicament del comerç, augmenta la probabilitat que els mercaders exigeixin reconeixement i poder polítics. Amb la capital del nostre país situada en un node comercial lucratiu i amb una classe mercantil ben establerta, podem formar una lliga comercial per promoure millor els interessos econòmics de la nostra nació."
 plutocratic_administration_rep_desc:0 "En els països que depenen econòmicament del comerç, augmenta la probabilitat que els mercaders exigeixin reconeixement i poder polítics. Amb la capital del nostre país situada en un node comercial lucratiu i amb una classe mercantil ben establerta, podem formar una lliga comercial per promoure millor els interessos econòmics de la nostra nació."
 oligarchic_administration_desc:0 "L'aristocràcia del nostre país ha assolit una posició de domini polític i econòmic absolut. Davant les exigències de les principals famílies aristocràtiques de privilegis cada cop més grans, ara podem reformar el nostre govern i convertir-lo en una república oligàrquica."
 theocratic_administration:0 "Adoptar una administració teocràtica"
 theocratic_administration_desc:0 "És hora de deixar el govern del nostre estat en mans dels qui coneixen de veritat la voluntat divina! El clergat del nostre estat ha assolit una posició de domini polític tan gran que ara exigeix que se li cedeixi formalment el poder polític."
